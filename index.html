const Agenda = ({orders,compromissos,setCompromissos,publicacoes,setPublicacoes,ideias,setIdeias}) => {
  const hoje=new Date();
  const [anoVis,setAnoVis]=useState(hoje.getFullYear());
  const [mesVis,setMesVis]=useState(hoje.getMonth());
  const [diaSel,setDiaSel]=useState(null);
  const [tab,setTab]=useState("calendario");
  const [modal,setModal]=useState(null);
  const [sugestoesModal,setSugestoesModal]=useState(false);
  const [form,setForm]=useState({desc:"",data:"",hora:"",prioridade:"Normal",status:"Pendente",tipo:"Compromisso"});
  const [formPub,setFormPub]=useState({data:"",tipo:"",status:"Pendente",obs:""});
  const [formIdeia,setFormIdeia]=useState({titulo:"",desc:"",categoria:"Artesanato",utilizada:false});
  const CATS_IDEIA=["Artesanato","Obra","Empreendedorismo","Clientes","Marketing","Vendas","Propósito","Reflexão","Fé","Produtos","Livro","Criatividade"];

  const diasNoMes=new Date(anoVis,mesVis+1,0).getDate();
  const primeiroDia=new Date(anoVis,mesVis,1).getDay();
  const mesesNomes=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  const diasSem=["D","S","T","Q","Q","S","S"];

  const getDiaStr=(d)=>`${anoVis}-${String(mesVis+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  const compDia=(d)=>compromissos.filter(c=>c.data===getDiaStr(d));
  const pubDia=(d)=>publicacoes.filter(p=>p.data===getDiaStr(d));
  const encDia=(d)=>orders.filter(o=>o.delivery===getDiaStr(d)&&!["Cancelado","Concluído","Enviado"].includes(o.status));

  const saveComp=()=>{
    if(modal==="editComp") setCompromissos(prev=>prev.map(x=>x.id===form.id?form:x));
    else setCompromissos(prev=>[...prev,{...form,id:uid(),data:getDiaStr(diaSel)}]);
    setModal(null);showSavedGlobal("Compromisso salvo!");
  };
  const savePub=()=>{
    setPublicacoes(prev=>[...prev,{...formPub,id:uid(),data:getDiaStr(diaSel)}]);
    setModal(null);showSavedGlobal("Publicação salva!");
  };
  const saveIdeia=()=>{
    if(modal==="editIdeia") setIdeias(prev=>prev.map(x=>x.id===formIdeia.id?formIdeia:x));
    else setIdeias(prev=>[...prev,{...formIdeia,id:uid(),data:today}]);
    setModal(null);showSavedGlobal("Ideia salva!");
  };

  const gerarCardIdeia=async(idea,imgFundo=null)=>{
    const W=1080,H=1080;
    const canvas=document.createElement("canvas");
    canvas.width=W;canvas.height=H;
    const ctx=canvas.getContext("2d");

    if(imgFundo){
      await new Promise((res,rej)=>{
        const img=new Image();img.crossOrigin="anonymous";
        img.onload=()=>{
          const ir=img.width/img.height;
          let sw,sh,sx,sy;
          if(ir>1){sh=img.height;sw=sh;sx=(img.width-sw)/2;sy=0;}
          else{sw=img.width;sh=sw;sx=0;sy=(img.height-sh)/2;}
          ctx.drawImage(img,sx,sy,sw,sh,0,0,W,H);
          const ov=ctx.createLinearGradient(0,0,0,H);
          ov.addColorStop(0,"rgba(13,10,30,0.5)");
          ov.addColorStop(0.5,"rgba(13,10,30,0.6)");
          ov.addColorStop(1,"rgba(13,10,30,0.8)");
          ctx.fillStyle=ov;ctx.fillRect(0,0,W,H);
          res();
        };img.onerror=()=>{
          ctx.fillStyle="#1A1035";ctx.fillRect(0,0,W,H);res();
        };img.src=imgFundo;
      });
    } else {
      // Fundo gradiente roxo/lilás da marca
      const g=ctx.createLinearGradient(0,0,W,H);
      g.addColorStop(0,"#2D1B69");g.addColorStop(0.6,"#7B3FA6");g.addColorStop(1,"#C47ABF");
      ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
      // Ornamento sutil
      ctx.fillStyle="rgba(255,255,255,0.04)";
      ctx.beginPath();ctx.arc(W*0.8,H*0.2,280,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(W*0.15,H*0.8,220,0,Math.PI*2);ctx.fill();
    }

    // Título
    ctx.letterSpacing="0px";
    const bw=W-140;
    ctx.font="bold 52px Georgia,serif";
    const words=idea.titulo.split(" ");
    const lines=[];let cur="";
    words.forEach(w=>{
      const t=cur+w+" ";
      if(ctx.measureText(t).width>bw&&cur){lines.push(cur.trim());cur=w+" ";}
      else cur=t;
    });
    lines.push(cur.trim());

    // Descrição
    const descLines=[];
    if(idea.desc){
      ctx.font="34px Georgia,serif";
      const dwords=idea.desc.split(" ");let dc="";
      dwords.forEach(w=>{
        const t=dc+w+" ";
        if(ctx.measureText(t).width>bw-40&&dc){descLines.push(dc.trim());dc=w+" ";}
        else dc=t;
      });
      if(dc.trim())descLines.push(dc.trim());
    }

    const lineH=70,descLineH=46;
    const titleH=lines.length*lineH;
    const descH=descLines.length*descLineH;
    const totalH=titleH+(descLines.length?40+descH:0)+60;
    const startY=(H-totalH)/2;

    // Linha decorativa topo
    ctx.strokeStyle="rgba(255,255,255,0.3)";ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(70,startY-20);ctx.lineTo(W-70,startY-20);ctx.stroke();

    // Título
    ctx.textAlign="center";
    lines.forEach((l,i)=>{
      ctx.fillStyle=i===0?"#F0D6FF":"#FDFAFF";
      ctx.font=`bold ${i===0?54:50}px Georgia,serif`;
      ctx.fillText(l,W/2,startY+i*lineH+lineH*0.7);
    });

    // Linha + coração
    const lineY=startY+titleH+20;
    ctx.strokeStyle="rgba(216,180,206,0.6)";ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(W/2-60,lineY);ctx.lineTo(W/2+60,lineY);ctx.stroke();
    ctx.fillStyle="rgba(216,180,206,0.8)";ctx.font="28px serif";
    ctx.fillText("♥",W/2,lineY+8);

    // Descrição
    if(descLines.length){
      ctx.fillStyle="rgba(253,250,255,0.85)";ctx.font="italic 34px Georgia,serif";
      descLines.forEach((l,i)=>{
        ctx.fillText(l,W/2,lineY+52+i*descLineH);
      });
    }

    // Linha decorativa base
    ctx.strokeStyle="rgba(255,255,255,0.3)";ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(70,H-80);ctx.lineTo(W-70,H-80);ctx.stroke();

    // @simara.lobui
    ctx.fillStyle="rgba(240,214,255,0.75)";ctx.font="24px Arial,sans-serif";
    ctx.fillText("@simara.lobui",W/2,H-44);

    const url=canvas.toDataURL("image/png");
    const pw=window.open("","_blank","width=520,height=580");
    if(pw){
      pw.document.write(`<!DOCTYPE html><html><head><title>Card</title><style>body{margin:0;background:#1A1035;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:sans-serif;padding:20px;gap:14px;}img{max-width:420px;border-radius:10px;box-shadow:0 8px 32px rgba(0,0,0,0.6);}a{background:#7B4FA6;color:#fff;padding:12px 28px;border-radius:24px;text-decoration:none;font-weight:700;font-size:13px;}p{color:#D8B4CE;font-size:11px;margin:0;}</style></head><body><img src="${url}"><a href="${url}" download="card-ideia.png">⬇️ Baixar imagem</a><p>1080 × 1080 px</p></body></html>`);
      pw.document.close();
    }
    showSavedGlobal("Card gerado! ✨");
  };

  const [cardModal,setCardModal]=useState(null);
  const [imgFundoCard,setImgFundoCard]=useState(null);
  const imgFundoRef=useRef();

  return(
    <div className="fade" style={{padding:24}}>
      <Tabs tabs={[{k:"calendario",l:"📅 Calendário"},{k:"publicacoes",l:"📱 Publicações"},{k:"ideias",l:"💡 Banco de Ideias"}]} active={tab} set={setTab}/>

      {tab==="calendario"&&<>
        {/* Navegação do mês */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
          <button onClick={()=>{if(mesVis===0){setMesVis(11);setAnoVis(a=>a-1);}else setMesVis(m=>m-1);}} style={{background:"none",border:`1px solid ${C.areia}`,borderRadius:4,padding:"4px 12px",cursor:"pointer",fontSize:16}}>‹</button>
          <h3 style={{fontSize:18,fontFamily:"'Cormorant Garamond',serif"}}>{mesesNomes[mesVis]} {anoVis}</h3>
          <button onClick={()=>{if(mesVis===11){setMesVis(0);setAnoVis(a=>a+1);}else setMesVis(m=>m+1);}} style={{background:"none",border:`1px solid ${C.areia}`,borderRadius:4,padding:"4px 12px",cursor:"pointer",fontSize:16}}>›</button>
        </div>
        {/* Grid calendário */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2,marginBottom:16}}>
          {diasSem.map((d,i)=><div key={i} style={{textAlign:"center",fontSize:10,fontWeight:700,color:C.oliva,padding:"4px 0",letterSpacing:"1px"}}>{d}</div>)}
          {Array.from({length:primeiroDia}).map((_,i)=><div key={`e${i}`}/>)}
          {Array.from({length:diasNoMes},(_,i)=>i+1).map(d=>{
            const dStr=getDiaStr(d);
            const isHoje=dStr===today;
            const total=compDia(d).length+pubDia(d).length+encDia(d).length;
            const temUrg=compDia(d).some(c=>c.prioridade==="Alta");
            return(
              <div key={d} onClick={()=>{setDiaSel(d);}} style={{minHeight:52,border:`1px solid ${diaSel===d?C.cafe:isHoje?C.dourado:C.areia}`,borderRadius:4,padding:4,cursor:"pointer",background:diaSel===d?C.linho:isHoje?"#FFFDF5":"#fff",position:"relative"}}>
                <div style={{fontSize:12,fontWeight:isHoje?700:400,color:isHoje?C.dourado:C.cafe}}>{d}</div>
                {total>0&&<div style={{display:"flex",gap:2,flexWrap:"wrap",marginTop:2}}>
                  {compDia(d).length>0&&<div style={{width:6,height:6,borderRadius:"50%",background:temUrg?C.vermelho:C.cafe}}/>}
                  {pubDia(d).length>0&&<div style={{width:6,height:6,borderRadius:"50%",background:C.dourado}}/>}
                  {encDia(d).length>0&&<div style={{width:6,height:6,borderRadius:"50%",background:C.oliva}}/>}
                </div>}
              </div>
            );
          })}
        </div>
        {/* Legenda */}
        <div style={{display:"flex",gap:12,marginBottom:16,fontSize:10,color:C.oliva}}>
          <span><span style={{display:"inline-block",width:8,height:8,borderRadius:"50%",background:C.cafe,marginRight:4}}/>Compromisso</span>
          <span><span style={{display:"inline-block",width:8,height:8,borderRadius:"50%",background:C.dourado,marginRight:4}}/>Publicação</span>
          <span><span style={{display:"inline-block",width:8,height:8,borderRadius:"50%",background:C.oliva,marginRight:4}}/>Encomenda</span>
        </div>

        {/* Detalhe do dia selecionado */}
        {diaSel&&<Card style={{borderTop:`3px solid ${C.cafe}`}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
            <h3 style={{fontSize:16,fontFamily:"'Cormorant Garamond',serif"}}>{String(diaSel).padStart(2,"0")}/{String(mesVis+1).padStart(2,"0")}/{anoVis}</h3>
            <div style={{display:"flex",gap:6}}>
              <Btn sm onClick={()=>{setForm({desc:"",data:getDiaStr(diaSel),hora:"",prioridade:"Normal",status:"Pendente",tipo:"Compromisso"});setModal("comp");}}>+ Compromisso</Btn>
              <Btn sm v="ghost" onClick={()=>{setFormPub({data:getDiaStr(diaSel),tipo:"",status:"Pendente",obs:""});setModal("pub");}}>+ Publicação</Btn>
            </div>
          </div>

          {/* CHECKLIST DE TAREFAS DIÁRIAS */}
          <div style={{marginBottom:14}}>
            <div style={{fontSize:10,fontWeight:700,color:C.oliva,letterSpacing:"1.5px",textTransform:"uppercase",marginBottom:8}}>✅ Tarefas do dia</div>
            {TIPOS_PUB.map(tarefa=>{
              const dStr=getDiaStr(diaSel);
              const pub=publicacoes.find(p=>p.data===dStr&&p.tipo===tarefa);
              const conc=pub?.status==="Concluído";
              return(
                <div key={tarefa} onClick={()=>{
                  if(pub){
                    setPublicacoes(prev=>prev.map(x=>x.id===pub.id?{...x,status:conc?"Pendente":"Concluído"}:x));
                  } else {
                    setPublicacoes(prev=>[...prev,{id:uid(),data:dStr,tipo:tarefa,status:"Concluído",obs:""}]);
                  }
                }} style={{display:"flex",gap:10,alignItems:"center",padding:"6px 8px",marginBottom:3,borderRadius:4,cursor:"pointer",background:conc?"#EDF7ED":"transparent",transition:"all 0.2s"}}>
                  <span style={{fontSize:16,flexShrink:0}}>{conc?"✅":"⬜"}</span>
                  <span style={{fontSize:12,textDecoration:conc?"line-through":"none",color:conc?C.oliva:C.cafe}}>{tarefa}</span>
                </div>
              );
            })}
            {(()=>{
              const dStr=getDiaStr(diaSel);
              const total=TIPOS_PUB.length;
              const conc=publicacoes.filter(p=>p.data===dStr&&p.status==="Concluído").length;
              const pct=Math.round((conc/total)*100);
              return<div style={{marginTop:8,padding:"6px 8px",background:C.linho,borderRadius:4}}>
                <div style={{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:4}}>
                  <span style={{color:C.oliva}}>{conc}/{total} concluídas</span>
                  <span style={{fontWeight:700,color:pct===100?C.verde:C.cafe}}>{pct}%</span>
                </div>
                <PBar pct={pct} color={pct===100?C.verde:C.cafe} h={4}/>
              </div>;
            })()}
          </div>

          {/* Encomendas do dia */}
          {encDia(diaSel).length>0&&<>
            <div style={{fontSize:10,fontWeight:700,color:C.oliva,letterSpacing:"1.5px",textTransform:"uppercase",marginBottom:6}}>📦 Encomendas</div>
            {encDia(diaSel).map(o=><div key={o.id} style={{display:"flex",gap:8,alignItems:"center",padding:"6px 10px",background:"#E8EDE1",borderRadius:4,marginBottom:4}}>
              <span style={{fontSize:11,color:C.oliva}}>✓</span>
              <span style={{fontSize:12,fontWeight:600}}>{o.client}</span>
              <span style={{fontSize:11,color:C.oliva}}>— {o.product}</span>
              <Badge label={o.status} sm/>
            </div>)}
            <div style={{height:1,background:C.areia,margin:"10px 0"}}/>
          </>}
          {/* Compromissos do dia */}
          {compDia(diaSel).length>0&&<>
            <div style={{fontSize:10,fontWeight:700,color:C.oliva,letterSpacing:"1.5px",textTransform:"uppercase",marginBottom:6}}>📌 Compromissos</div>
            {compDia(diaSel).sort((a,b)=>(a.hora||"").localeCompare(b.hora||"")).map(c=>(
              <div key={c.id} style={{padding:"8px 10px",background:c.status==="Concluído"?"#E8EDE1":c.status==="Adiado"?"#FEF3E9":c.prioridade==="Alta"?"rgba(192,57,43,0.06)":C.linho,borderRadius:4,marginBottom:6,borderLeft:`3px solid ${c.status==="Concluído"?C.oliva:c.status==="Adiado"?C.dourado:c.prioridade==="Alta"?C.vermelho:C.cafe}`}}>
                <div style={{display:"flex",gap:8,alignItems:"center"}}>
                  {c.hora&&<span style={{fontSize:11,fontWeight:700,color:C.cafe,minWidth:36}}>{c.hora}</span>}
                  <span style={{flex:1,fontSize:12,fontWeight:600,textDecoration:c.status==="Concluído"?"line-through":"none",color:c.status==="Concluído"?C.oliva:C.cafe}}>{c.desc}</span>
                  <select value={c.status} onChange={e=>{
                    const ns=e.target.value;
                    setCompromissos(prev=>prev.map(x=>x.id===c.id?{...x,status:ns}:x));
                  }} style={{fontSize:10,padding:"2px 6px",border:`1px solid ${C.areia}`,borderRadius:3,color:C.cafe,background:"#fff"}}>
                    {STATUS_COMP.map(s=><option key={s}>{s}</option>)}
                  </select>
                  <button onClick={()=>{setForm({...c});setModal("editComp");}} style={{fontSize:11,background:"none",border:"none",cursor:"pointer",color:C.oliva}}>✎</button>
                  <button onClick={()=>{if(window.confirm("Excluir?"))setCompromissos(prev=>prev.filter(x=>x.id!==c.id));}} style={{fontSize:11,background:"none",border:"none",cursor:"pointer",color:C.vermelho}}>✕</button>
                </div>
                {c.status==="Adiado"&&<div style={{marginTop:6,display:"flex",gap:8,alignItems:"center"}}>
                  <span style={{fontSize:10,color:C.dourado,fontWeight:600}}>📅 Adiar para:</span>
                  <input type="date" defaultValue={c.novaData||""} onChange={e=>setCompromissos(prev=>prev.map(x=>x.id===c.id?{...x,novaData:e.target.value}:x))} style={{fontSize:11,padding:"3px 8px",border:`1px solid ${C.areia}`,borderRadius:3,color:C.cafe}}/>
                  {c.novaData&&<Btn sm v="ghost" onClick={()=>setCompromissos(prev=>prev.map(x=>x.id===c.id?{...x,data:c.novaData,status:"Pendente",novaData:""}:x))}>✓ Confirmar</Btn>}
                </div>}
              </div>
            ))}
            <div style={{height:1,background:C.areia,margin:"10px 0"}}/>
          </>}
          {/* Publicações do dia */}
          {pubDia(diaSel).length>0&&<>
            <div style={{fontSize:10,fontWeight:700,color:C.oliva,letterSpacing:"1.5px",textTransform:"uppercase",marginBottom:6}}>📱 Publicações</div>
            {pubDia(diaSel).map(p=><div key={p.id} style={{display:"flex",gap:8,alignItems:"center",padding:"6px 10px",background:C.linho,borderRadius:4,marginBottom:4}}>
              <button onClick={()=>setPublicacoes(prev=>prev.map(x=>x.id===p.id?{...x,status:x.status==="Concluído"?"Pendente":"Concluído"}:x))} style={{fontSize:14,background:"none",border:"none",cursor:"pointer"}}>{p.status==="Concluído"?"✅":"⬜"}</button>
              <span style={{flex:1,fontSize:12,textDecoration:p.status==="Concluído"?"line-through":"none"}}>{p.tipo}</span>
              {p.obs&&<span style={{fontSize:10,color:C.oliva}}>{p.obs}</span>}
              <button onClick={()=>setPublicacoes(prev=>prev.filter(x=>x.id!==p.id))} style={{fontSize:11,background:"none",border:"none",cursor:"pointer",color:C.vermelho}}>✕</button>
            </div>)}
          </>}
          {encDia(diaSel).length===0&&compDia(diaSel).length===0&&pubDia(diaSel).length===0&&
            <div style={{textAlign:"center",padding:"20px",color:C.oliva,fontStyle:"italic",fontSize:13}}>Dia livre ✦ Toque em "+ Compromisso" para adicionar.</div>}
        </Card>}
      </>}

      {tab==="publicacoes"&&<>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <p style={{fontFamily:"'Cormorant Garamond',serif",fontSize:14,fontStyle:"italic",color:C.oliva}}>Planejamento das redes sociais ✦</p>
          <Btn sm v="ghost" onClick={()=>setSugestoesModal(true)}>💡 Sugerir conteúdo</Btn>
        </div>
        <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>
          {TIPOS_PUB.map(t=>{const qtd=publicacoes.filter(p=>p.tipo===t).length;const conc=publicacoes.filter(p=>p.tipo===t&&p.status==="Concluído").length;return(
            <div key={t} style={{background:C.branco,border:`1px solid ${C.areia}`,borderRadius:6,padding:"8px 12px",minWidth:120}}>
              <div style={{fontSize:12,fontWeight:600,marginBottom:4}}>{t}</div>
              <div style={{fontSize:11,color:C.oliva}}>{conc}/{qtd} concluídos</div>
              {qtd>0&&<PBar pct={(conc/qtd)*100} h={3} color={C.oliva}/>}
            </div>
          );})}
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {publicacoes.sort((a,b)=>(a.data||"").localeCompare(b.data||"")).map(p=>(
            <div key={p.id} style={{display:"flex",gap:10,alignItems:"center",padding:"8px 12px",background:C.branco,border:`1px solid ${C.areia}`,borderRadius:6}}>
              <button onClick={()=>setPublicacoes(prev=>prev.map(x=>x.id===p.id?{...x,status:x.status==="Concluído"?"Pendente":"Concluído"}:x))} style={{fontSize:16,background:"none",border:"none",cursor:"pointer"}}>{p.status==="Concluído"?"✅":"⬜"}</button>
              <div style={{flex:1}}>
                <div style={{fontSize:12,fontWeight:600,textDecoration:p.status==="Concluído"?"line-through":"none"}}>{p.tipo}</div>
                <div style={{fontSize:10,color:C.oliva}}>{fmtDate(p.data)}{p.obs?` · ${p.obs}`:""}</div>
              </div>
              <button onClick={()=>setPublicacoes(prev=>prev.filter(x=>x.id!==p.id))} style={{fontSize:11,background:"none",border:"none",cursor:"pointer",color:C.vermelho}}>✕</button>
            </div>
          ))}
          {publicacoes.length===0&&<div style={{textAlign:"center",padding:"30px",color:C.oliva,fontStyle:"italic"}}>Nenhuma publicação planejada ✦</div>}
        </div>
      </>}

      {tab==="ideias"&&<>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:14}}>
          <p style={{fontFamily:"'Cormorant Garamond',serif",fontSize:14,fontStyle:"italic",color:C.oliva}}>Capture suas ideias antes que sumam ✦</p>
          <Btn onClick={()=>{setFormIdeia({titulo:"",desc:"",categoria:"Artesanato",utilizada:false});setModal("ideia");}}>+ Nova Ideia</Btn>
        </div>
        <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
          {ideias.sort((a,b)=>(b.data||"").localeCompare(a.data||"")).map(idea=>(
            <Card key={idea.id} style={{flex:"1 1 220px",opacity:idea.utilizada?0.6:1}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
                <span style={{fontSize:9,background:C.linho,color:C.oliva,padding:"2px 8px",borderRadius:10,fontWeight:600,letterSpacing:"1px",textTransform:"uppercase"}}>{idea.categoria}</span>
                <div style={{display:"flex",gap:4}}>
                  {idea.utilizada&&<span style={{fontSize:9,background:"#D4E8D4",color:"#2E6B2E",padding:"2px 7px",borderRadius:10,fontWeight:700}}>✓ Utilizada</span>}
                  <button onClick={()=>{setFormIdeia({...idea});setModal("editIdeia");}} style={{fontSize:11,background:"none",border:"none",cursor:"pointer",color:C.oliva}}>✎</button>
                </div>
              </div>
              <div style={{fontSize:14,fontWeight:700,marginBottom:4}}>{idea.titulo}</div>
              <p style={{fontSize:12,color:C.oliva,lineHeight:1.5,marginBottom:8}}>{idea.desc}</p>
              <div style={{display:"flex",gap:6}}>
                <Btn sm v="ghost" onClick={e=>{e.stopPropagation();setCardModal(idea);setImgFundoCard(null);}}>📤 Compartilhar</Btn>
                <Btn sm v="ghost" onClick={()=>{setFormIdeia({...idea});setModal("editIdeia");}}>{idea.utilizada?"↩ Desfazer":"✓ Utilizada"}</Btn>
                <Btn sm v="danger" onClick={()=>{if(window.confirm("Excluir ideia?"))setIdeias(prev=>prev.filter(x=>x.id!==idea.id));}}>✕</Btn>
              </div>
            </Card>
          ))}
          {ideias.length===0&&<div style={{width:"100%",textAlign:"center",padding:"30px",color:C.oliva,fontStyle:"italic"}}>Nenhuma ideia ainda ✦</div>}
        </div>
      </>}

      {/* Modal compromisso */}
      {(modal==="comp"||modal==="editComp")&&<Modal title={modal==="editComp"?"Editar Compromisso":"Novo Compromisso"} onClose={()=>setModal(null)}>
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <Inp label="Descrição" value={form.desc} onChange={v=>setForm(f=>({...f,desc:v}))} placeholder="Ex: Enviar encomenda, Reunião..."/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            <Inp label="Data" type="date" value={form.data} onChange={v=>setForm(f=>({...f,data:v}))}/>
            <Inp label="Horário" value={form.hora} onChange={v=>setForm(f=>({...f,hora:v}))} placeholder="Ex: 08:00"/>
            <Sel label="Prioridade" value={form.prioridade} onChange={v=>setForm(f=>({...f,prioridade:v}))} options={PRIORIDADES}/>
            <Sel label="Status" value={form.status} onChange={v=>setForm(f=>({...f,status:v}))} options={STATUS_COMP}/>
          </div>
        </div>
        <div style={{display:"flex",gap:10,marginTop:14,justifyContent:"flex-end"}}>
          <Btn v="ghost" onClick={()=>setModal(null)}>Cancelar</Btn>
          <Btn onClick={saveComp}>Salvar</Btn>
        </div>
      </Modal>}

      {/* Modal publicação */}
      {modal==="pub"&&<Modal title="Nova Publicação" onClose={()=>setModal(null)}>
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <Inp label="Data" type="date" value={formPub.data} onChange={v=>setFormPub(f=>({...f,data:v}))}/>
          <Sel label="Tipo de conteúdo" value={formPub.tipo} onChange={v=>setFormPub(f=>({...f,tipo:v}))} options={["",  ...TIPOS_PUB]}/>
          <Inp label="Observação (opcional)" value={formPub.obs} onChange={v=>setFormPub(f=>({...f,obs:v}))} placeholder="Tema, ideia, referência..."/>
        </div>
        <div style={{display:"flex",gap:10,marginTop:14,justifyContent:"flex-end"}}>
          <Btn v="ghost" onClick={()=>setModal(null)}>Cancelar</Btn>
          <Btn onClick={savePub}>Salvar</Btn>
        </div>
      </Modal>}

      {/* Modal ideia */}
      {(modal==="ideia"||modal==="editIdeia")&&<Modal title={modal==="editIdeia"?"Editar Ideia":"Nova Ideia"} onClose={()=>setModal(null)}>
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <Inp label="Título" value={formIdeia.titulo} onChange={v=>setFormIdeia(f=>({...f,titulo:v}))}/>
          <Sel label="Categoria" value={formIdeia.categoria} onChange={v=>setFormIdeia(f=>({...f,categoria:v}))} options={CATS_IDEIA}/>
          <Inp label="Descrição" value={formIdeia.desc} onChange={v=>setFormIdeia(f=>({...f,desc:v}))} rows={4}/>
        </div>
        <div style={{display:"flex",gap:10,marginTop:14,justifyContent:"flex-end"}}>
          <Btn v="ghost" onClick={()=>setModal(null)}>Cancelar</Btn>
          <Btn onClick={saveIdeia}>Salvar</Btn>
        </div>
      </Modal>}

      {/* Modal sugestões */}
      {sugestoesModal&&<Modal title="💡 Sugestões de Conteúdo" onClose={()=>setSugestoesModal(false)} wide>
        <p style={{fontFamily:"'Cormorant Garamond',serif",fontSize:14,fontStyle:"italic",color:C.oliva,marginBottom:14}}>Escolha uma sugestão para adicionar ao seu calendário ✦</p>
        {SUGESTOES_CONTEUDO.map(cat=>(
          <div key={cat.cat} style={{marginBottom:14}}>
            <div style={{fontSize:11,fontWeight:700,color:C.cafe,letterSpacing:"1.5px",textTransform:"uppercase",marginBottom:6}}>{cat.cat}</div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              {cat.sugs.map(s=>(
                <button key={s} onClick={()=>{setFormPub(f=>({...f,tipo:s}));setSugestoesModal(false);setModal("pub");}} style={{padding:"6px 12px",background:C.linho,border:`1px solid ${C.areia}`,borderRadius:20,fontSize:12,cursor:"pointer",color:C.cafe}}>{s}</button>
              ))}
            </div>
          </div>
        ))}
      </Modal>}
      {/* Modal compartilhar ideia como card */}
      {cardModal&&<Modal title="📤 Compartilhar como card" onClose={()=>setCardModal(null)}>
        <div style={{background:C.linho,borderRadius:8,padding:"16px",marginBottom:14}}>
          <div style={{fontSize:13,fontWeight:700,color:C.oliva,marginBottom:4}}>{cardModal.titulo}</div>
          {cardModal.desc&&<div style={{fontSize:12,color:C.cafe,fontStyle:"italic",lineHeight:1.6}}>{cardModal.desc.slice(0,120)}{cardModal.desc.length>120?"...":""}</div>}
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          <div style={{fontSize:12,fontWeight:600,color:C.oliva,marginBottom:4}}>Escolha o fundo:</div>
          <div style={{display:"flex",gap:10}}>
            <div onClick={()=>setImgFundoCard(null)} style={{flex:1,padding:"12px",borderRadius:8,border:`2px solid ${!imgFundoCard?C.cafe:C.areia}`,background:!imgFundoCard?C.linho:"transparent",cursor:"pointer",textAlign:"center"}}>
              <div style={{width:"100%",height:60,borderRadius:6,background:"linear-gradient(135deg,#1A2744,#2D1B69,#A563A2)",marginBottom:6}}/>
              <div style={{fontSize:11,fontWeight:600,color:C.cafe}}>Fundo da marca</div>
              <div style={{fontSize:10,color:C.oliva}}>Roxo/Marinho padrão</div>
            </div>
            <div onClick={()=>imgFundoRef.current?.click()} style={{flex:1,padding:"12px",borderRadius:8,border:`2px solid ${imgFundoCard?C.cafe:C.areia}`,background:imgFundoCard?C.linho:"transparent",cursor:"pointer",textAlign:"center"}}>
              {imgFundoCard
                ?<img src={imgFundoCard} style={{width:"100%",height:60,objectFit:"cover",borderRadius:6,marginBottom:6}}/>
                :<div style={{width:"100%",height:60,borderRadius:6,background:C.areia,display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,marginBottom:6}}>🖼️</div>}
              <div style={{fontSize:11,fontWeight:600,color:C.cafe}}>{imgFundoCard?"Imagem selecionada":"Minha foto"}</div>
              <div style={{fontSize:10,color:C.oliva}}>Toque para escolher</div>
            </div>
          </div>
          <input ref={imgFundoRef} type="file" accept="image/*" style={{display:"none"}} onChange={e=>{
            if(e.target.files[0]){const r=new FileReader();r.onload=ev=>setImgFundoCard(ev.target.result);r.readAsDataURL(e.target.files[0]);}
          }}/>
          <div style={{fontSize:10,color:C.oliva,fontStyle:"italic",background:"#FEF3E9",borderRadius:4,padding:"8px 10px"}}>
            💡 Somente o texto vai para o banco de dados — a imagem de fundo fica só no card gerado.
          </div>
        </div>
        <div style={{display:"flex",gap:10,marginTop:16,justifyContent:"flex-end"}}>
          <Btn v="ghost" onClick={()=>setCardModal(null)}>Cancelar</Btn>
          <Btn onClick={()=>gerarCardIdeia(cardModal,imgFundoCard)}>✨ Gerar card</Btn>
        </div>
      </Modal>}
    </div>
  );
};
const CATS_CARTA=["Reflexões","Arte","Obra","Clientes","Vida","Fé","Empreendedorismo","Aprendizados","Livro","Cartas","Organização"];
const ORIGENS_CARTA=["Cliente","Obra","Ateliê","Família","Bíblia","Conversa","Dia comum","Reflexão pessoal","Outro"];
const STATUS_CARTA=["Rascunho","Pronto","Exportado"];

const Diario = ({cartas,setCartas,volumes,setVolumes}) => {
  const [tab,setTab]=useState("cartas");
  const [modal,setModal]=useState(null);
  const [verModal,setVerModal]=useState(null);
  const [exportModal,setExportModal]=useState(false);
  const [busca,setBusca]=useState("");
  const [filtCat,setFiltCat]=useState("Todas");
  const [filtStatus,setFiltStatus]=useState("Todos");
  const [selExport,setSelExport]=useState([]);
  const [tituloLivro,setTituloLivro]=useState("");
  const [volumeSel,setVolumeSel]=useState("");
  const [formVol,setFormVol]=useState({titulo:"",subtitulo:""});
  const EF={titulo:"",subtitulo:"",data:today,categoria:"Reflexões",texto:"",origem:"Dia comum",status:"Rascunho",foto:"",volume:"",assinatura:"Simara Lobui"};
  const [form,setForm]=useState(EF);
  const fotoRef=useRef();

  const filtered=cartas.filter(c=>{
    const matchBusca=!busca||c.titulo?.toLowerCase().includes(busca.toLowerCase())||c.texto?.toLowerCase().includes(busca.toLowerCase())||c.data?.includes(busca);
    const matchCat=filtCat==="Todas"||c.categoria===filtCat;
    const matchStatus=filtStatus==="Todos"||c.status===filtStatus;
    return matchBusca&&matchCat&&matchStatus;
  }).sort((a,b)=>(b.data||"").localeCompare(a.data||""));

  const save=()=>{
    if(modal==="edit") setCartas(prev=>prev.map(x=>x.id===form.id?form:x));
    else setCartas(prev=>[...prev,{...form,id:uid()}]);
    setModal(null);showSavedGlobal("Carta salva!");
  };

  const exportarPDF=async()=>{
    const selecionadas=cartas.filter(c=>selExport.includes(c.id));
    if(!selecionadas.length){alert("Selecione ao menos uma carta.");return;}
    // Gera HTML do livro para impressão
    const html=`<!DOCTYPE html><html><head><meta charset="utf-8">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Playfair+Display:wght@400;700&display=swap');
      body{font-family:'Cormorant Garamond',serif;margin:0;padding:0;color:#2A1B15;background:#fff;}
      .capa{page-break-after:always;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:60px 80px;background:#5C4033;}
      .capa h1{font-family:'Playfair Display',serif;font-size:42px;color:#FAF8F5;margin-bottom:16px;font-weight:400;}
      .capa h2{font-size:22px;color:#D8C3A5;font-style:italic;margin-bottom:32px;font-weight:400;}
      .capa .autor{font-size:18px;color:#B08D57;letter-spacing:3px;text-transform:uppercase;}
      .carta{page-break-before:always;padding:80px;min-height:100vh;}
      .carta-titulo{font-family:'Playfair Display',serif;font-size:28px;text-align:center;margin-bottom:8px;color:#5C4033;}
      .carta-sub{font-size:16px;text-align:center;font-style:italic;color:#6B7152;margin-bottom:12px;}
      .carta-meta{font-size:12px;text-align:center;color:#9A8A7A;margin-bottom:40px;letter-spacing:1px;}
      .carta-divider{width:40px;height:1px;background:#B08D57;margin:0 auto 40px;}
      .carta-texto{font-size:16px;line-height:1.9;text-align:justify;white-space:pre-wrap;}
      .carta-assinatura{margin-top:48px;text-align:right;font-style:italic;font-size:15px;color:#5C4033;}
      @media print{body{-webkit-print-color-adjust:exact;}}
    </style></head><body>
    <div class="capa">
      <h1>${tituloLivro||"Sem título"}</h1>
      <h2>${volumeSel||""}</h2>
      <div class="autor">Simara Lobui</div>
    </div>
    ${selecionadas.map(c=>`
    <div class="carta">
      <h2 class="carta-titulo">${c.titulo||""}</h2>
      ${c.subtitulo?`<div class="carta-sub">${c.subtitulo}</div>`:""}
      <div class="carta-meta">${fmtDate(c.data)} · ${c.categoria} · ${c.origem}</div>
      <div class="carta-divider"></div>
      <div class="carta-texto">${c.texto||""}</div>
      <div class="carta-assinatura">${c.assinatura||"Simara Lobui"}</div>
    </div>`).join("")}
    </body></html>`;
    const w=window.open("","_blank");
    w.document.write(html);
    w.document.close();
    setTimeout(()=>w.print(),800);
    // Marca como exportado
    setCartas(prev=>prev.map(c=>selExport.includes(c.id)?{...c,status:"Exportado"}:c));
    setExportModal(false);setSelExport([]);
    showSavedGlobal("Livro gerado!");
  };

  return(
    <div className="fade" style={{padding:24}}>
      <div style={{background:`linear-gradient(135deg,${C.cafe},#3D2B1F)`,borderRadius:8,padding:"14px 20px",marginBottom:16,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div>
          <div style={{fontSize:9,color:C.dourado,letterSpacing:"3px",textTransform:"uppercase",fontWeight:700,marginBottom:3}}>Diário da Simara</div>
          <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:14,color:C.areia,fontStyle:"italic"}}>Um espaço só seu · Cartas que virarão livros ✦</div>
        </div>
        <Btn v="gold" onClick={()=>setExportModal(true)}>📖 Exportar livro</Btn>
      </div>

      <Tabs tabs={[{k:"cartas",l:"✍🏻 Cartas"},{k:"volumes",l:"📚 Volumes"}]} active={tab} set={setTab}/>

      {tab==="cartas"&&<>
        <div style={{display:"flex",gap:10,marginBottom:12,flexWrap:"wrap",alignItems:"center"}}>
          <div style={{flex:1,minWidth:180}}><Inp value={busca} onChange={setBusca} placeholder="Buscar por título, palavra ou data..."/></div>
          <Sel value={filtCat} onChange={setFiltCat} options={["Todas",...CATS_CARTA]}/>
          <Sel value={filtStatus} onChange={setFiltStatus} options={["Todos",...STATUS_CARTA]}/>
          <Btn onClick={()=>{setForm(EF);setModal("new");}}>+ Nova Carta</Btn>
        </div>
        <div style={{display:"flex",gap:14,flexWrap:"wrap"}}>
          {filtered.map(c=>(
            <Card key={c.id} hover style={{flex:"1 1 280px",cursor:"pointer"}} onClick={()=>setVerModal(c)}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
                <span style={{fontSize:9,background:C.linho,color:C.oliva,padding:"2px 8px",borderRadius:10,fontWeight:600,letterSpacing:"1px",textTransform:"uppercase"}}>{c.categoria}</span>
                <span style={{fontSize:9,background:c.status==="Exportado"?"#D4E8D4":c.status==="Pronto"?"#FEF3E9":C.linho,color:c.status==="Exportado"?"#2E6B2E":c.status==="Pronto"?C.dourado:C.oliva,padding:"2px 8px",borderRadius:10,fontWeight:700}}>{c.status}</span>
              </div>
              <h4 style={{fontSize:16,fontFamily:"'Cormorant Garamond',serif",fontWeight:600,marginBottom:3}}>{c.titulo}</h4>
              {c.subtitulo&&<div style={{fontSize:12,color:C.oliva,fontStyle:"italic",marginBottom:4}}>{c.subtitulo}</div>}
              <div style={{fontSize:11,color:C.oliva,marginBottom:8}}>{fmtDate(c.data)} · {c.origem}</div>
              <p style={{fontSize:12,color:C.cafe,lineHeight:1.6,overflow:"hidden",display:"-webkit-box",WebkitLineClamp:3,WebkitBoxOrient:"vertical"}}>{c.texto?.slice(0,150)}{c.texto?.length>150?"...":""}</p>
            </Card>
          ))}
          {filtered.length===0&&<div style={{width:"100%",textAlign:"center",padding:"40px",color:C.oliva,fontFamily:"'Cormorant Garamond',serif",fontStyle:"italic",fontSize:15}}>Nenhuma carta ainda. Comece a escrever ✦</div>}
        </div>
      </>}

      {tab==="volumes"&&<>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:14}}>
          <p style={{fontFamily:"'Cormorant Garamond',serif",fontSize:14,fontStyle:"italic",color:C.oliva}}>Organize seus livros por volumes ✦</p>
          <Btn onClick={()=>{setFormVol({titulo:"",subtitulo:""});setModal("vol");}}>+ Novo Volume</Btn>
        </div>
        <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
          {volumes.map(v=>{const cartsVol=cartas.filter(c=>c.volume===v.id);return(
            <Card key={v.id} style={{flex:"1 1 220px"}}>
              <div style={{fontSize:9,color:C.dourado,letterSpacing:"2px",textTransform:"uppercase",marginBottom:4,fontWeight:700}}>📚 {v.titulo}</div>
              {v.subtitulo&&<div style={{fontSize:13,fontStyle:"italic",color:C.oliva,marginBottom:6}}>{v.subtitulo}</div>}
              <div style={{fontSize:12,color:C.cafe,marginBottom:10}}>{cartsVol.length} carta{cartsVol.length!==1?"s":""}</div>
              <Btn sm v="ghost" onClick={()=>{setFormVol({...v});setModal("editVol");}}>✎ Editar</Btn>
            </Card>
          );})}
          {volumes.length===0&&<div style={{fontSize:13,color:C.oliva,fontStyle:"italic"}}>Nenhum volume criado ainda ✦</div>}
        </div>
      </>}

      {/* Modal ver carta */}
      {verModal&&<Modal title={verModal.titulo} onClose={()=>setVerModal(null)} wide>
        <div style={{fontFamily:"'Cormorant Garamond',serif"}}>
          {verModal.subtitulo&&<div style={{fontSize:16,fontStyle:"italic",color:C.oliva,marginBottom:6,textAlign:"center"}}>{verModal.subtitulo}</div>}
          <div style={{fontSize:12,color:C.oliva,textAlign:"center",marginBottom:16,letterSpacing:"1px"}}>{fmtDate(verModal.data)} · {verModal.categoria} · {verModal.origem}</div>
          <div style={{width:32,height:1,background:C.dourado,margin:"0 auto 24px"}}/>
          <div style={{fontSize:15,lineHeight:2,whiteSpace:"pre-wrap",color:C.cafe}}>{verModal.texto}</div>
          <div style={{marginTop:32,textAlign:"right",fontStyle:"italic",color:C.cafe,fontSize:14}}>— {verModal.assinatura||"Simara Lobui"}</div>
        </div>
        <div style={{display:"flex",gap:8,marginTop:16,justifyContent:"flex-end"}}>
          <Btn v="ghost" onClick={()=>{setForm({...verModal});setVerModal(null);setModal("edit");}}>✎ Editar</Btn>
          <Btn v="oliva" onClick={()=>setVerModal(null)}>Fechar</Btn>
        </div>
      </Modal>}

      {/* Modal nova/editar carta */}
      {(modal==="new"||modal==="edit")&&<Modal title={modal==="edit"?"Editar Carta":"Nova Carta"} onClose={()=>setModal(null)} wide>
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <Inp label="Título" value={form.titulo} onChange={v=>setForm(f=>({...f,titulo:v}))} placeholder="O título da sua carta..."/>
          <Inp label="Subtítulo (opcional)" value={form.subtitulo} onChange={v=>setForm(f=>({...f,subtitulo:v}))} placeholder="Uma frase, uma dedicatória..."/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            <Inp label="Data" type="date" value={form.data} onChange={v=>setForm(f=>({...f,data:v}))}/>
            <Sel label="Categoria" value={form.categoria} onChange={v=>setForm(f=>({...f,categoria:v}))} options={CATS_CARTA}/>
            <Sel label="Origem da inspiração" value={form.origem} onChange={v=>setForm(f=>({...f,origem:v}))} options={ORIGENS_CARTA}/>
            <Sel label="Status" value={form.status} onChange={v=>setForm(f=>({...f,status:v}))} options={STATUS_CARTA}/>
            <Sel label="Volume (opcional)" value={form.volume||""} onChange={v=>setForm(f=>({...f,volume:v}))} options={[{v:"",l:"Nenhum"},...volumes.map(v=>({v:v.id,l:v.titulo}))]}/>
          </div>
          <div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
              <label style={{fontSize:11,fontWeight:600,color:C.oliva,textTransform:"uppercase",letterSpacing:"0.8px"}}>Texto da carta</label>
              <button onClick={()=>{
                const sel=window.getSelection()?.toString();
                if(sel&&sel.trim().length>10){
                  setForm(f=>({...f,fraseDestaque:sel.trim()}));
                  showSavedGlobal("Trecho destacado como frase!");
                } else {
                  alert("Selecione um trecho do texto primeiro (mínimo 10 caracteres).");
                }
              }} style={{fontSize:11,padding:"4px 12px",background:C.linho,border:`1px solid ${C.dourado}`,borderRadius:20,cursor:"pointer",color:C.dourado,fontWeight:600}}>✦ Destacar trecho</button>
            </div>
            {form.fraseDestaque&&<div style={{background:"#FFFDF5",border:`1px solid ${C.dourado}`,borderRadius:4,padding:"8px 12px",marginBottom:8,fontSize:13,fontFamily:"'Cormorant Garamond',serif",fontStyle:"italic",color:C.cafe}}>
              <span style={{fontSize:9,color:C.dourado,fontWeight:700,letterSpacing:"2px",display:"block",marginBottom:3}}>✦ FRASE DESTACADA</span>
              "{form.fraseDestaque}"
              <button onClick={()=>setForm(f=>({...f,fraseDestaque:""}))} style={{marginLeft:8,fontSize:10,background:"none",border:"none",cursor:"pointer",color:C.oliva}}>✕</button>
            </div>}
            <textarea id="carta-textarea" value={form.texto} onChange={e=>setForm(f=>({...f,texto:e.target.value}))} rows={14} placeholder="Escreva aqui sua carta, reflexão, pensamento..." style={{width:"100%",padding:"12px",border:`1.5px solid ${C.areia}`,borderRadius:4,fontSize:14,fontFamily:"'Cormorant Garamond',serif",lineHeight:1.8,color:C.cafe,resize:"vertical"}}/>
          </div>
          <div style={{textAlign:"right",fontSize:12,fontStyle:"italic",color:C.oliva}}>Assinatura: Simara Lobui</div>
        </div>
        <div style={{display:"flex",gap:10,marginTop:14,justifyContent:"flex-end"}}>
          {modal==="edit"&&<Btn v="danger" onClick={()=>{if(window.confirm("Excluir esta carta? Esta ação não pode ser desfeita."))setCartas(prev=>prev.filter(x=>x.id!==form.id));setModal(null);}}>Excluir</Btn>}
          <Btn v="ghost" onClick={()=>setModal(null)}>Cancelar</Btn>
          <Btn onClick={save}>Salvar carta</Btn>
        </div>
      </Modal>}

      {/* Modal volume */}
      {(modal==="vol"||modal==="editVol")&&<Modal title={modal==="editVol"?"Editar Volume":"Novo Volume"} onClose={()=>setModal(null)}>
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <Inp label="Título do livro" value={formVol.titulo} onChange={v=>setFormVol(f=>({...f,titulo:v}))} placeholder="Ex: Renascida em Coragem"/>
          <Inp label="Volume / Subtítulo" value={formVol.subtitulo} onChange={v=>setFormVol(f=>({...f,subtitulo:v}))} placeholder="Ex: Volume 1, Volume 2..."/>
        </div>
        <div style={{display:"flex",gap:10,marginTop:14,justifyContent:"flex-end"}}>
          {modal==="editVol"&&<Btn v="danger" onClick={()=>{if(window.confirm("Excluir volume?"))setVolumes(prev=>prev.filter(x=>x.id!==formVol.id));setModal(null);}}>Excluir</Btn>}
          <Btn v="ghost" onClick={()=>setModal(null)}>Cancelar</Btn>
          <Btn onClick={()=>{if(modal==="editVol")setVolumes(prev=>prev.map(x=>x.id===formVol.id?formVol:x));else setVolumes(prev=>[...prev,{...formVol,id:uid()}]);setModal(null);showSavedGlobal("Volume salvo!");}}>Salvar</Btn>
        </div>
      </Modal>}

      {/* Modal exportar livro */}
      {exportModal&&<Modal title="📖 Exportar Livro" onClose={()=>setExportModal(false)} wide>
        <div style={{display:"flex",flexDirection:"column",gap:12,marginBottom:14}}>
          <Inp label="Título do livro" value={tituloLivro} onChange={setTituloLivro} placeholder="Ex: Renascida em Coragem"/>
          <Sel label="Volume" value={volumeSel} onChange={setVolumeSel} options={[{v:"",l:"Sem volume"},...volumes.map(v=>({v:v.titulo,l:v.titulo}))]}/>
        </div>
        <div style={{fontSize:11,fontWeight:700,color:C.oliva,letterSpacing:"1.5px",textTransform:"uppercase",marginBottom:8}}>Selecione as cartas ({selExport.length} selecionadas)</div>
        <div style={{maxHeight:320,overflowY:"auto",display:"flex",flexDirection:"column",gap:6}}>
          {cartas.sort((a,b)=>(a.data||"").localeCompare(b.data||"")).map(c=>(
            <div key={c.id} onClick={()=>setSelExport(prev=>prev.includes(c.id)?prev.filter(x=>x!==c.id):[...prev,c.id])} style={{display:"flex",gap:10,alignItems:"center",padding:"8px 12px",background:selExport.includes(c.id)?C.linho:"#fff",border:`1.5px solid ${selExport.includes(c.id)?C.cafe:C.areia}`,borderRadius:4,cursor:"pointer"}}>
              <span style={{fontSize:16}}>{selExport.includes(c.id)?"✅":"⬜"}</span>
              <div style={{flex:1}}>
                <div style={{fontSize:13,fontWeight:600}}>{c.titulo}</div>
                <div style={{fontSize:10,color:C.oliva}}>{fmtDate(c.data)} · {c.categoria} · {c.status}</div>
              </div>
            </div>
          ))}
        </div>
        <div style={{display:"flex",gap:10,marginTop:14,justifyContent:"flex-end"}}>
          <Btn v="ghost" onClick={()=>setExportModal(false)}>Cancelar</Btn>
          <Btn v="gold" onClick={exportarPDF} disabled={selExport.length===0}>📖 Gerar livro ({selExport.length} cartas)</Btn>
        </div>
      </Modal>}
    </div>
  );
};

// ─── CONSULTORIA ──────────────────────────────────────────────────────────────
const TIPOS_CONSULTORIA=["Área Fiscal e Administrativa","Gestão Financeira","Marketing Digital","Outro"];
const TEMPO_CONSULTORIA=["Mensal","Pacote","Diária","Por hora"];

// ─── CONSULTORIA — MÉTODO CONTÍNUA ───────────────────────────────────────────
const TIPOS_PEDIDO_CONSUL=["Esporádico","Fixo mensal","Por medição","Pacote de horas","Projeto"];
const STATUS_PEDIDO_CONSUL=["Aguardando","Em andamento","Finalizado","Cancelado"];
const TIPOS_ATEND_C=["Consultoria","Treinamento","Implantação","Reunião","Diagnóstico","Outro"];
const TIPO_COBRANCA=["Por hora","Taxa única","Pacote","Mensal fixo"];
const SERVICOS_CONSUL=["Área Fiscal e Administrativa","Gestão Financeira","Marketing Digital","Consultoria Geral","Implantação","Treinamento","Outro"];
const CORES_CONSUL={primaria:"#6C8271",secundaria:"#C1A268",texto:"#2C3E50",fundo:"#FFFFFF"};

// ─── PROJETOS CONTÍNUA (Método CONTÍNUA) — aba própria dentro da Consultoria ─────
// PC-START
const PC_STATUS=["Diagnóstico","Planejamento","Em execução","Em acompanhamento","Concluído","Pausado","Cancelado"];
const PC_NIVEIS=["CONTÍNUA ESSENCIAL","CONTÍNUA EM AÇÃO","CONTÍNUA ESTRATÉGICA"];
const PC_STATUS_ACAO=["Pendente","Em andamento","Concluída","Atrasada"];
const PC_STATUS_PRIOR=["Pendente","Em andamento","Concluída"];
const PC_NIVEL_PRIOR=["Alta","Média","Baixa"];
const PC_AREAS=["Financeiro","Fiscal","Administrativo","Comercial","Marketing","Pessoas","Operações","Tecnologia","Outro"];
const PC_FORMAS=["PIX","Boleto","Cartão","Transferência","Dinheiro","Parcelado"];
const PC_CAMPOS=["clientId","clienteNome","empresa","responsavel","nome","dataInicio","dataPrevista","status","nivel","objetivo","valor","formaPag","obs"];
const PC_DG_CAMPOS=[["situacao","Situação atual"],["objetivoCliente","Objetivo do cliente"],["problemas","Principais problemas"],["gargalos","Gargalos identificados"],["pontosFortes","Pontos fortes"],["oportunidades","Oportunidades"],["necessidades","Necessidades"],["prioridades","Prioridades"]];
const PC_COR={
  "Diagnóstico":["#EFE8F7","#7B4FA6"],"Planejamento":["#E4EEF9","#3D5A8A"],"Em execução":["#E4F0EA","#2E6B5E"],
  "Em acompanhamento":["#E6F3F6","#1F6F7A"],"Concluído":["#DDF0E6","#1F7A4D"],"Pausado":["#F6EFD9","#8A6D1F"],"Cancelado":["#F3E1DE","#c0392b"],
  "Pendente":["#F0ECF6","#3D5A8A"],"Em andamento":["#E4EEF9","#3D5A8A"],"Concluída":["#DDF0E6","#1F7A4D"],"Atrasada":["#FBE7E4","#c0392b"],
  "Alta":["#FBE7E4","#c0392b"],"Média":["#F6EFD9","#8A6D1F"],"Baixa":["#E4F0EA","#2E6B5E"]
};

// data de hoje no fuso local (evita "virar o dia" às 21h por causa do UTC)
const pcHoje=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().split("T")[0];};
const pcForm=(p)=>{
  const base={clientId:"",clienteNome:"",empresa:"",responsavel:"",nome:"",dataInicio:pcHoje(),dataPrevista:"",status:"Diagnóstico",nivel:"",objetivo:"",valor:0,formaPag:"PIX",obs:""};
  if(!p)return base;
  const o={id:p.id};PC_CAMPOS.forEach(k=>{o[k]=p[k]===undefined||p[k]===null?base[k]:p[k];});return o;
};

// ── regras (funções puras, sem tela) ──
const pcEv=(p,tipo,texto,data)=>({...p,eventos:[...(p.eventos||[]),{id:uid(),data:data||pcHoje(),tipo,texto}]});
const pcNomePadrao=(f)=>String(f.nome||"").trim()||`Projeto CONTÍNUA — ${f.clienteNome||"sem cliente"}`;
const pcNovo=(f)=>{
  const p={id:uid(),valor:Number(f.valor)||0,diagnostico:{},prioridades:[],acoes:[],atendimentos:[],indicadores:[],eventos:[],criadoEm:pcHoje()};
  PC_CAMPOS.forEach(k=>{if(k!=="valor")p[k]=f[k]===undefined||f[k]===null?"":f[k];});
  p.nome=pcNomePadrao(f);
  return pcEv(p,"projeto","Projeto criado");
};
const pcEditar=(p,f)=>{
  const n={...p};PC_CAMPOS.forEach(k=>{if(f[k]!==undefined)n[k]=f[k];});n.valor=Number(f.valor)||0;n.nome=pcNomePadrao(n);
  return p.status!==n.status?pcEv(n,"status",`Status: ${p.status} → ${n.status}`):n;
};
const pcSalvarDiag=(p,texto)=>({...p,diagnostico:{...(p.diagnostico||{}),...texto}});
const pcConcluirDiag=(p,texto,nivel)=>{
  const niv=(nivel===undefined||nivel===null)?(p.nivel||""):nivel;
  const n={...p,diagnostico:{...(p.diagnostico||{}),...texto,concluido:true,dataConclusao:pcHoje(),nivelDefinido:niv},nivel:niv,status:p.status==="Diagnóstico"?"Planejamento":p.status};
  return pcEv(n,"diagnostico",`Diagnóstico concluído${niv?` · ${niv}`:""}`);
};
const pcDefinirNivel=(p,nivel)=>{
  const niv=nivel||"";
  if((p.nivel||"")===niv)return p;
  return pcEv({...p,nivel:niv,diagnostico:{...(p.diagnostico||{}),nivelDefinido:niv}},"diagnostico",niv?`Nível do Método CONTÍNUA definido: ${niv}`:"Nível do Método CONTÍNUA voltou para \"a definir\"");
};
const pcReabrirDiag=(p)=>pcEv({...p,diagnostico:{...(p.diagnostico||{}),concluido:false}},"diagnostico","Diagnóstico reaberto para ajustes");
const pcImportar=(p)=>{
  const linhas=String((p.diagnostico||{}).problemas||"").split("\n").map(s=>s.replace(/^[-•*\d.)\s]+/,"").trim()).filter(Boolean);
  const ja=new Set((p.prioridades||[]).map(x=>String(x.problema||"").trim().toLowerCase()));
  const vistos=new Set();
  const novas=[];
  linhas.forEach(l=>{const k=l.toLowerCase();if(ja.has(k)||vistos.has(k))return;vistos.add(k);novas.push({id:`${uid()}${novas.length}`,prioridade:"Média",problema:l,causa:"",objetivo:"",impacto:"",responsavel:"",prazo:"",status:"Pendente"});});
  if(novas.length===0)return p;
  return pcEv({...p,prioridades:[...(p.prioridades||[]),...novas]},"prioridades",`${novas.length} prioridade(s) definida(s) a partir do diagnóstico`);
};
const pcSalvarPrior=(p,pr)=>{
  const lista=p.prioridades||[];
  if(pr.id&&lista.some(x=>x.id===pr.id))return {...p,prioridades:lista.map(x=>x.id===pr.id?{...x,...pr}:x)};
  return pcEv({...p,prioridades:[...lista,{...pr,id:uid()}]},"prioridades",`Prioridade definida: ${pr.problema}`);
};
const pcMoverPrior=(p,id,dir)=>{
  const l=[...(p.prioridades||[])];const i=l.findIndex(x=>x.id===id);const j=i+dir;
  if(i<0||j<0||j>=l.length)return p;
  [l[i],l[j]]=[l[j],l[i]];return {...p,prioridades:l};
};
const pcExcluirPrior=(p,id)=>({...p,prioridades:(p.prioridades||[]).filter(x=>x.id!==id),acoes:(p.acoes||[]).map(a=>a.prioridadeId===id?{...a,prioridadeId:""}:a)});
const pcAjustaConclusao=(velho,novo)=>{
  const n={...novo};
  if(n.status==="Concluída"){n.dataConclusao=(velho&&velho.status==="Concluída"&&velho.dataConclusao)||pcHoje();}
  else n.dataConclusao="";
  return n;
};
const pcSalvarAcao=(p,a)=>{
  const lista=p.acoes||[];
  const velho=a.id?lista.find(x=>x.id===a.id):null;
  if(velho){
    const n=pcAjustaConclusao(velho,{...velho,...a});
    let r={...p,acoes:lista.map(x=>x.id===a.id?n:x)};
    if(velho.status!=="Concluída"&&n.status==="Concluída")r=pcEv(r,"acao",`Ação concluída: ${n.acao}`);
    return r;
  }
  const n=pcAjustaConclusao(null,{...a,id:uid()});
  let r=pcEv({...p,acoes:[...lista,n]},"acao",`Ação criada: ${n.acao}`);
  if(n.status==="Concluída")r=pcEv(r,"acao",`Ação concluída: ${n.acao}`);
  return r;
};
const pcStatusAcao=(p,id,status)=>{
  const a=(p.acoes||[]).find(x=>x.id===id);if(!a)return p;
  return pcSalvarAcao(p,{...a,status});
};
const pcExcluirAcao=(p,id)=>({...p,acoes:(p.acoes||[]).filter(x=>x.id!==id)});
const pcStatusAcaoEf=(a)=>a.status!=="Concluída"&&a.prazo&&a.prazo<pcHoje()?"Atrasada":a.status;
const pcResumoAcoes=(p)=>{
  const s={total:0,concluidas:0,andamento:0,pendentes:0,atrasadas:0,pct:0};
  (p.acoes||[]).forEach(a=>{s.total++;const st=pcStatusAcaoEf(a);if(st==="Concluída")s.concluidas++;else if(st==="Atrasada")s.atrasadas++;else if(st==="Em andamento")s.andamento++;else s.pendentes++;});
  s.pct=s.total?Math.round(s.concluidas/s.total*100):0;return s;
};
const pcEtapas=(p)=>{
  const ac=p.acoes||[];const dg=p.diagnostico||{};
  const exec=ac.some(a=>a.status==="Em andamento"||a.status==="Concluída")||["Em execução","Em acompanhamento","Concluído"].includes(p.status);
  const acomp=["Em acompanhamento","Concluído"].includes(p.status)||(p.atendimentos||[]).length>0;
  return [
    {k:"diag",l:"Diagnóstico",ok:!!dg.concluido},
    {k:"prior",l:"Prioridades",ok:(p.prioridades||[]).length>0},
    {k:"plano",l:"Plano de ação",ok:ac.length>0},
    {k:"exec",l:"Execução",ok:exec},
    {k:"acomp",l:"Acompanhamento",ok:acomp},
    {k:"conc",l:"Conclusão",ok:p.status==="Concluído"}
  ];
};
const pcFin=(finance,p)=>{
  const l=(finance||[]).filter(f=>f.projetoId===p.id);
  const recebido=l.filter(f=>f.pago).reduce((s,f)=>s+Number(f.value||0),0);
  return {recebido,pendente:Math.max(0,(Number(p.valor)||0)-recebido),lancamentos:l.length};
};

// ── atendimentos do projeto ──
const PC_TIPOS_ATEND=["Diagnóstico","Planejamento","Acompanhamento","Execução assistida","Treinamento","Reunião","Outro"];
const pcMin=(ini,fim)=>{
  const f=(s)=>{const m=/^(\d{1,2}):(\d{2})$/.exec(String(s||"").trim());return m?Number(m[1])*60+Number(m[2]):NaN;};
  const a=f(ini),b=f(fim);return isNaN(a)||isNaN(b)?0:Math.max(0,b-a);
};
const pcFmtMin=(m)=>{m=Math.round(Number(m)||0);const h=Math.floor(m/60),mm=m%60;return h>0?(mm>0?`${h}h${String(mm).padStart(2,"0")}`:`${h}h`):`${mm}min`;};
const pcSalvarAtend=(p,a)=>{
  const lista=p.atendimentos||[];
  if(lista.some(x=>x.id===a.id))return {...p,atendimentos:lista.map(x=>x.id===a.id?a:x)};
  return pcEv({...p,atendimentos:[...lista,a]},"atendimento",`Atendimento (${a.tipo}): ${a.assunto}${a.duracaoMin>0?` · ${pcFmtMin(a.duracaoMin)}`:""}`,a.data);
};
const pcExcluirAtend=(p,id)=>({...p,atendimentos:(p.atendimentos||[]).filter(x=>x.id!==id)});
// espelho na Agenda: o atendimento (e o próximo agendado) aparecem como compromissos do tipo Consultoria
const pcAtendComps=(comps,p,a,proxOld)=>{
  const hoje=pcHoje();
  let l=[...(comps||[])];
  const up=(item,manterStatus)=>{const i=l.findIndex(c=>c.id===item.id);if(i<0){l.push(item);return;}l[i]=manterStatus?{...l[i],desc:item.desc,data:item.data,hora:item.hora}:{...l[i],...item};};
  const base={tipo:"Consultoria",projetoId:p.id,prioridade:"Alta",atendimentoId:a.id};
  up({...base,id:a.compromissoId,desc:`CONTÍNUA · ${p.clienteNome} — ${a.assunto}`,data:a.data,hora:a.hora||"",status:a.data<=hoje?"Concluído":"Pendente"},false);
  if(a.proxData)up({...base,id:a.proxCompromissoId,desc:`CONTÍNUA · ${p.clienteNome} — Próximo atendimento`,data:a.proxData,hora:a.proxHora||"09:00",status:"Pendente"},true);
  else if(proxOld)l=l.filter(c=>c.id!==proxOld);
  return l;
};
const pcAtendCompsExcluir=(comps,a)=>(comps||[]).filter(c=>c.id!==a.compromissoId&&(!a.proxCompromissoId||c.id!==a.proxCompromissoId));
const pcHorasAtend=(p)=>(p.atendimentos||[]).reduce((s,a)=>s+(Number(a.duracaoMin)||0),0);

// ── indicadores ──
const pcNum=(v)=>{const s=String(v===undefined||v===null?"":v).trim().replace(",",".");return s===""?NaN:Number(s);};
const pcProgInd=(i)=>{
  const a=pcNum(i.valorInicial),b=pcNum(i.valorAtual),m=pcNum(i.metaFinal);
  if(isNaN(a)||isNaN(b)||isNaN(m)||m===a)return null;
  return Math.max(0,Math.min(100,Math.round((b-a)/(m-a)*100)));
};
const pcV=(v,u)=>(v===""||v===undefined||v===null)?"—":`${v}${u||""}`;
const pcNovoInd=(f)=>{
  const ini=pcNum(f.valorInicial),mf=pcNum(f.metaFinal),atRaw=pcNum(f.valorAtual);
  const at=isNaN(atRaw)?ini:atRaw;
  const data=f.dataAcompanhamento||pcHoje();
  const s=(n)=>isNaN(n)?"":n;
  return {id:uid(),nome:f.nome,meta:f.meta||"",unidade:f.unidade||"",valorInicial:s(ini),valorAtual:s(at),metaFinal:s(mf),dataAcompanhamento:data,historico:isNaN(at)?[]:[{id:uid(),data,valor:at,obs:"Registro inicial"}]};
};
const pcSalvarInd=(p,f)=>{
  const lista=p.indicadores||[];
  if(f.id&&lista.some(x=>x.id===f.id)){
    const m=pcNum(f.metaFinal),ini=pcNum(f.valorInicial);
    return {...p,indicadores:lista.map(x=>x.id===f.id?{...x,nome:f.nome,meta:f.meta||"",unidade:f.unidade||"",valorInicial:isNaN(ini)?"":ini,metaFinal:isNaN(m)?"":m}:x)};
  }
  const n=pcNovoInd(f);
  return pcEv({...p,indicadores:[...lista,n]},"indicador",`Indicador criado: ${n.nome}`);
};
const pcRegistrarInd=(p,indId,r)=>{
  const lista=p.indicadores||[];const ind=lista.find(x=>x.id===indId);
  const v=pcNum(r.valor);if(!ind||isNaN(v))return p;
  const data=r.data||pcHoje();
  const novo={...ind,valorAtual:v,dataAcompanhamento:data,historico:[...(ind.historico||[]),{id:uid(),data,valor:v,obs:r.obs||""}]};
  return pcEv({...p,indicadores:lista.map(x=>x.id===indId?novo:x)},"indicador",`Indicador ${ind.nome}: ${pcV(ind.valorAtual)} → ${v}${ind.unidade?` ${ind.unidade}`:""}`,data);
};
const pcExcluirInd=(p,id)=>({...p,indicadores:(p.indicadores||[]).filter(x=>x.id!==id)});
const pcLinhaTempo=(p)=>(p.eventos||[]).map((e,i)=>({e,i})).sort((x,y)=>x.e.data===y.e.data?x.i-y.i:String(x.e.data).localeCompare(String(y.e.data))).map(x=>x.e).reverse();
const PC_EV_COR={projeto:"#7B4FA6",status:"#8A6D1F",diagnostico:"#3D5A8A",prioridades:"#c0392b",acao:"#1F7A4D",atendimento:"#1F6F7A",indicador:"#9B6DC0"};
const PC_EV_ROT={projeto:"Projeto",status:"Status",diagnostico:"Diagnóstico",prioridades:"Prioridades",acao:"Ação",atendimento:"Atendimento",indicador:"Indicador"};

const PcSpark=({pontos})=>{
  if(!pontos||pontos.length<2)return null;
  const w=120,h=30,min=Math.min(...pontos),max=Math.max(...pontos),rng=(max-min)||1;
  const pts=pontos.map((v,i)=>`${(i/(pontos.length-1))*(w-4)+2},${h-3-((v-min)/rng)*(h-6)}`).join(" ");
  return <svg width={w} height={h} style={{display:"block"}}><polyline points={pts} fill="none" stroke={CORES_CONSUL.primaria} strokeWidth="2" strokeLinejoin="round"/></svg>;
};

const PcChip=({t,sm})=>{const c=PC_COR[t]||["#EEE","#555"];return <span style={{background:c[0],color:c[1],borderRadius:20,padding:sm?"2px 8px":"3px 11px",fontSize:sm?10:11,fontWeight:700,whiteSpace:"nowrap"}}>{t}</span>;};
const PcNivel=({n})=>n
  ?<span style={{background:"#F3EEE0",color:"#8A6D1F",borderRadius:20,padding:"3px 11px",fontSize:11,fontWeight:700,whiteSpace:"nowrap"}}>{n}</span>
  :<span style={{background:"#F3F0F7",color:"#8C8499",border:"1px dashed #C9BEDB",borderRadius:20,padding:"2px 10px",fontSize:11,fontWeight:700,whiteSpace:"nowrap"}}>Nível a definir</span>;
const PcBarra=({pct,cor})=><div style={{height:8,background:"#EEE8F4",borderRadius:6,overflow:"hidden"}}><div style={{width:`${pct}%`,height:"100%",background:cor||CORES_CONSUL.primaria,transition:"width .3s"}}/></div>;

const ProjetosContinua=({projetos=[],setProjetos,clients=[],setClients,finance=[],setFinance,compromissos=[],setCompromissos,config})=>{
  const cor=CORES_CONSUL;
  const [selId,setSelId]=useState(null);
  const [tab,setTab]=useState("resumo");
  const [filtro,setFiltro]=useState("ativos");
  const [fAcao,setFAcao]=useState("todas");
  const [modal,setModal]=useState(null);
  const [form,setForm]=useState(null);
  const [dg,setDg]=useState({});
  const [dgSujo,setDgSujo]=useState(false);
  const [nivelDg,setNivelDg]=useState("");
  const [novoCli,setNovoCli]=useState(null);
  const [docBusy,setDocBusy]=useState(false);
  const [docPrev,setDocPrev]=useState(null);
  useEffect(()=>{if(modal!=="projeto")setNovoCli(null);},[modal]);
  const sel=projetos.find(p=>p.id===selId)||null;

  useEffect(()=>{
    const d=(sel&&sel.diagnostico)||{};
    const t={};PC_DG_CAMPOS.forEach(([k])=>{t[k]=d[k]||"";});
    setDg(t);setDgSujo(false);
    setNivelDg((sel&&sel.nivel)||"");
  },[selId,sel&&sel.nivel]);

  const upd=(fn)=>setProjetos&&setProjetos(prev=>prev.map(p=>p.id===selId?fn(p):p));
  const F=(k,v)=>setForm(f=>({...f,[k]:v}));

  // ── projeto: criar / editar / excluir ──
  const cadastrarCliente=()=>{
    const nome=String((novoCli&&novoCli.name)||"").trim();
    if(!nome){alert("Informe o nome do cliente.");return;}
    if(clients.some(c=>String(c.name||"").trim().toLowerCase()===nome.toLowerCase())&&!window.confirm(`Já existe um cliente chamado "${nome}". Cadastrar outro mesmo assim? (Se for o mesmo, escolha-o na lista.)`))return;
    const c={name:nome,phone:String(novoCli.phone||"").trim(),email:"",city:"",vip:false,origem:"WhatsApp",nascimento:"",tipo:"cliente",cpfCnpj:"",empresa:String(novoCli.empresa||"").trim(),id:uid(),orders:0,total:0,joined:pcHoje()};
    setClients(prev=>[...prev,c].sort((a,b)=>String(a.name||"").localeCompare(String(b.name||""),"pt")));
    setForm(f=>({...f,clientId:c.id,clienteNome:c.name,empresa:c.empresa||f.empresa}));
    setNovoCli(null);showSavedGlobal("Cliente cadastrado!");
  };
  const salvarProjeto=()=>{
    if(!form.clientId){alert("Escolha o cliente do projeto.");return;}
    if(form.id){
      setProjetos(prev=>prev.map(p=>p.id===form.id?pcEditar(p,form):p));
    } else {
      const novo=pcNovo(form);
      setProjetos(prev=>[...prev,novo]);
      setSelId(novo.id);setTab("resumo");
    }
    setModal(null);showSavedGlobal("Projeto salvo!");
  };
  const excluirProjeto=()=>{
    if(!sel)return;
    const fl=(finance||[]).filter(f=>f.projetoId===sel.id).length;
    if(!window.confirm(`Excluir o projeto "${sel.nome}" e todo o seu conteúdo (diagnóstico, prioridades, ações, atendimentos e indicadores)? Os compromissos dele também saem da Agenda.${fl>0?`\n\nAtenção: existem ${fl} lançamento(s) no financeiro ligados a ele; eles NÃO serão apagados.`:""}\n\nEssa ação não pode ser desfeita.`))return;
    setProjetos(prev=>prev.filter(p=>p.id!==sel.id));
    if(setCompromissos)setCompromissos(prev=>prev.filter(c=>c.projetoId!==sel.id));
    setSelId(null);
  };

  // ── diagnóstico ──
  const salvarDiag=()=>{upd(p=>pcSalvarDiag(p,dg));setDgSujo(false);showSavedGlobal("Diagnóstico salvo!");};
  const salvarNivel=()=>{upd(pp=>pcDefinirNivel(pp,nivelDg));showSavedGlobal(nivelDg?"Nível salvo!":"Nível marcado como \"a definir\".");};
  const concluirDiag=()=>{
    const avisos=[];
    if(!String(dg.situacao||"").trim()&&!String(dg.problemas||"").trim())avisos.push("O diagnóstico ainda está vazio.");
    if(!nivelDg)avisos.push("O nível ainda está \"a definir\".");
    const msg=avisos.length?`${avisos.join(" ")} Concluir mesmo assim? Você pode reabrir o diagnóstico ou definir o nível depois.`:`Concluir o diagnóstico com o nível ${nivelDg}?`;
    if(!window.confirm(msg))return;
    upd(pp=>pcConcluirDiag(pp,dg,nivelDg));setDgSujo(false);showSavedGlobal("Diagnóstico concluído!");
  };

  // ── prioridades ──
  const importarProblemas=()=>{
    if(!sel)return;
    const antes=(sel.prioridades||[]).length;

  const novaPrior=()=>{setForm({prioridade:"Média",problema:"",causa:"",objetivo:"",impacto:"",responsavel:(sel&&sel.responsavel)||"",prazo:"",status:"Pendente"});setModal("prior");};

  // ── documentos (A4: imprimir, PDF ou imagem; PDF/imagem podem ser enviados por WhatsApp) ──
  const pcCarregarScript=(src,teste)=>new Promise((res,rej)=>{if(teste())return res();const s=document.createElement("script");s.src=src;s.onload=()=>teste()?res():rej(new Error("biblioteca não iniciou"));s.onerror=()=>rej(new Error("sem conexão"));document.head.appendChild(s);});
  const pcHtmlParaCanvas=async(html)=>{
    const fr=document.createElement("iframe");fr.setAttribute("aria-hidden","true");
    fr.style.cssText="position:fixed;left:-10000px;top:0;width:794px;height:1200px;border:0;";
    document.body.appendChild(fr);
    try{
      await new Promise(res=>{fr.onload=()=>res();fr.srcdoc=html;});
      const doc=fr.contentDocument;if(doc.fonts&&doc.fonts.ready)await doc.fonts.ready;
      await new Promise(r=>setTimeout(r,200));
      const h=Math.max(doc.body.scrollHeight,doc.documentElement.scrollHeight);fr.style.height=h+"px";
      return await window.html2canvas(doc.body,{scale:2,backgroundColor:"#ffffff",useCORS:true,windowWidth:794,windowHeight:h});
    } finally { document.body.removeChild(fr); }
  };
  const pcAbrirImprimir=(html)=>{const w=window.open("","_blank");if(w){w.document.write(html);w.document.close();setTimeout(()=>w.print(),600);}};
  const gerarDoc=async(titulo,arquivo,html,saida,legenda)=>{
    if(saida==="print"){pcAbrirImprimir(html);return;}
    setDocBusy(true);
    try{
      await pcCarregarScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js",()=>!!window.html2canvas);
      if(saida==="pdf")await pcCarregarScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",()=>!!(window.jspdf&&window.jspdf.jsPDF));
      const canvas=await pcHtmlParaCanvas(html);
      const base=String(arquivo).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"");
      let file;
      if(saida==="pdf"){
        const pdf=new window.jspdf.jsPDF({unit:"pt",format:"a4",compress:true});
        const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight();
        const imgH=canvas.height*pw/canvas.width;const img=canvas.toDataURL("image/jpeg",0.92);
        let y=0,pg=0;while(y<imgH-2){if(pg>0)pdf.addPage();pdf.addImage(img,"JPEG",0,-y,pw,imgH);y+=ph;pg++;}
        file=new File([pdf.output("blob")],`${base}.pdf`,{type:"application/pdf"});
      } else {
        const blob=await new Promise(r=>canvas.toBlob(r,"image/png"));
        file=new File([blob],`${base}.png`,{type:"image/png"});
      }
      const tel=(clients.find(c=>c.id===p.clientId)||{}).phone||"";
      setDocPrev({titulo,file,prev:canvas.toDataURL("image/jpeg",0.6),texto:legenda,tel:tel.replace(/\D/g,"")});
      setModal("docPrev");
    }catch(e){alert("Não consegui gerar o arquivo ("+((e&&e.message)||"erro")+"). Confira a internet ou use “Imprimir”.");}
    setDocBusy(false);
  };
  const baixarDoc=()=>{if(!docPrev)return;const url=URL.createObjectURL(docPrev.file);const a=document.createElement("a");a.href=url;a.download=docPrev.file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000);};
  const enviarDoc=async()=>{
    const d=docPrev;if(!d)return;
    try{if(navigator.canShare&&navigator.canShare({files:[d.file]})){await navigator.share({files:[d.file],text:d.texto});setModal(null);setDocPrev(null);return;}}catch(e){if(e&&e.name==="AbortError")return;}
    baixarDoc();
    if(!d.tel){alert("Cliente sem WhatsApp cadastrado — o arquivo foi baixado, é só anexar na conversa.");setModal(null);setDocPrev(null);return;}
    window.open(`https://wa.me/${d.tel}?text=${encodeURIComponent(d.texto)}`,"_blank");
    showSavedGlobal("Arquivo baixado — anexe na conversa do WhatsApp.");
  };

  const docContrato=()=>{

    <h2>Investimento</h2><div class="campo"><b>Valor total:</b> <span style="font-size:16px">${fmtBRL(p.valor)}</span></div><div class="campo"><b>Forma de pagamento:</b> ${p.formaPag||"PIX"}</div>
    ${(!p.formaPag||p.formaPag==="PIX")?`<div class="pix">💠 <b>Dados PIX:</b> ${(config&&config.consultoria&&config.consultoria.pixNome)||"Simara Ap. de Souza Lobui"} · Chave CPF: ${(config&&config.consultoria&&config.consultoria.pixChave)||"357.252.138.62"}</div>`:""}
    ${p.obs?`<h2>Observações</h2><div class="campo">${p.obs}</div>`:""}

    ${pcRodape(config)}</body></html>`;

*Simara Lobui · Consultoria*`};

    const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Diagnóstico — ${p.nome}</title><style>${pcDocStyles}</style></head><body>
    ${pcHdr(p,"DIAGNÓSTICO",dd.concluido?`Concluído em ${fmtDate(dd.dataConclusao)}`:"Em andamento")}

    <h2>Nível do Método CONTÍNUA</h2><div class="campo">${p.nivel||"a definir"}</div>
    ${pcRodape(config)}</body></html>`;
    return {html,arquivo:`Diagnostico ${p.nome} ${p.clienteNome}`,titulo:"Diagnóstico",legenda:`Olá, ${p.clienteNome.split(" ")[0]}! Segue o diagnóstico do projeto "${p.nome}" em anexo. 🤎
*Simara Lobui · Consultoria*`};

  const docPlano=()=>{
    const linhas=(p.acoes||[]).map(a=>`<tr><td>${a.area||"—"}</td><td>${a.acao}</td><td>${a.responsavel||"—"}</td><td>${a.prazo?fmtDate(a.prazo):"—"}</td><td>${pcStatusAcaoEf(a)}</td></tr>`).join("");
    const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Plano de ação — ${p.nome}</title><style>${pcDocStyles}</style></head><body>
    ${pcHdr(p,"PLANO DE AÇÃO")}

    ${pcRodape(config)}</body></html>`;
    return {html,arquivo:`Plano de acao ${p.nome} ${p.clienteNome}`,titulo:"Plano de ação",legenda:`Olá, ${p.clienteNome.split(" ")[0]}! Segue o plano de ação do projeto "${p.nome}" em anexo. 🤎
*Simara Lobui · Consultoria*`};
  };
  const docAcompanhamento=()=>{
    const r=pcResumoAcoes(p);
    const li=(arr)=>arr.length?`<ul>${arr.map(a=>`<li>${a.acao}${a.prazo?` — prazo ${fmtDate(a.prazo)}`:""}</li>`).join("")}</ul>`:'<div class="campo">Nenhuma.</div>';
    const ac=p.acoes||[];

    ${pcHdr(p,"RELATÓRIO DE ACOMPANHAMENTO")}
    ${pcCliBloco(p,clients.find(c=>c.id===p.clientId))}

    ${pcRodape(config)}</body></html>`;
    return {html,arquivo:`Acompanhamento ${p.nome} ${p.clienteNome}`,titulo:"Relatório de acompanhamento",legenda:`Olá, ${p.clienteNome.split(" ")[0]}! Segue o relatório de acompanhamento do projeto "${p.nome}" em anexo. 🤎

    const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Evolução — ${p.nome}</title><style>${pcDocStyles}</style></head><body>

  const PC_DOCS=[["contrato","📑 Contrato do projeto",docContrato],["diag","🔎 Diagnóstico",docDiagnostico],["plano","✅ Plano de ação",docPlano],["acomp","📈 Relatório de acompanhamento",docAcompanhamento],["evol","🧭 Relatório de evolução",docEvolucao],["enc","🏁 Encerramento",docEncerramento]];

  const modais=(<>

    {modal==="prior"&&form&&<Modal wide title={form.id?"✎ Editar prioridade":"🎯 Nova prioridade"} onClose={()=>setModal(null)}>

    {modal==="acao"&&form&&sel&&<Modal wide title={form.id?"✎ Editar ação":"✅ Nova ação"} onClose={()=>setModal(null)}>

            <div style={{fontSize:8,color:cor.secundaria,letterSpacing:"3px",textTransform:"uppercase",fontWeight:700}}>Método CONTÍNUA</div>

  // ═════════ PROJETO ABERTO ═════════
  const p=sel;
  const r=pcResumoAcoes(p);
  const et=pcEtapas(p);
  const atual=et.findIndex(e=>!e.ok);
  const fin=pcFin(finance,p);
  const abas=[["resumo","📊 Resumo"],["diag","🔎 Diagnóstico"],["prior","🎯 Prioridades"],["plano","✅ Plano de ação"],["atend","🗓 Atendimentos"],["ind","📈 Indicadores"],["evol","🧭 Evolução"],["doc","📄 Documentos"]];

  const renderResumo=()=>{
    const proximas=(p.acoes||[]).filter(a=>a.status!=="Concluída").slice().sort((a,b)=>String(a.prazo||"9999").localeCompare(String(b.prazo||"9999"))).slice(0,5);
    const eventos=pcLinhaTempo(p).slice(0,6);
    const ultimoAtend=(p.atendimentos||[]).slice().sort((a,b)=>String(a.data).localeCompare(String(b.data))).pop();
    const cartao=(rot,val,cl)=>(
      <div style={{background:C.linho,borderRadius:8,padding:"10px 12px"}}>
        <div style={{fontSize:10,fontWeight:700,letterSpacing:1,color:C.oliva,textTransform:"uppercase"}}>{rot}</div>
        <div style={{fontSize:15,fontWeight:700,color:cl||C.cafe,marginTop:3,wordBreak:"break-word"}}>{val}</div>
      </div>);

      {!p.nivel&&<div style={{background:"#FFF7E0",border:"1px solid #F0DDA0",borderRadius:8,padding:"10px 14px",marginBottom:12,fontSize:13,color:"#8A6D1F",display:"flex",gap:10,alignItems:"center",justifyContent:"space-between",flexWrap:"wrap"}}>

        <Btn sm v="ghost" onClick={()=>setTab("diag")}>Ir para Diagnóstico</Btn>
      </div>}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:8,marginBottom:12}}>
        {cartao("Cliente",p.clienteNome||"—")}
        {cartao("Nível",p.nivel||"A definir")}
        {cartao("Período",`${fmtDate(p.dataInicio)} → ${p.dataPrevista?fmtDate(p.dataPrevista):"em aberto"}`)}
        {cartao("Valor contratado",fmtBRL(p.valor))}
        {cartao("Valor recebido",fmtBRL(fin.recebido),C.verde)}
        {cartao("Valor pendente",fmtBRL(fin.pendente),fin.pendente>0?C.vermelho:C.verde)}

      <div style={{display:"flex",justifyContent:"flex-end",marginBottom:10}}><Btn sm onClick={novoLanc}>💰 Lançar recebimento</Btn></div>
      {(finance||[]).filter(f=>f.projetoId===p.id).length>0&&<>
        <Divider label="Lançamentos"/>
        {(finance||[]).filter(f=>f.projetoId===p.id).slice().sort((a,b)=>String(b.date||"").localeCompare(String(a.date||""))).map(f=>(
          <div key={f.id} style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",background:"#fff",border:`1px solid ${C.areia}`,borderRadius:6,padding:"7px 12px",marginBottom:6,fontSize:12}}>
            <span style={{flex:1,minWidth:120,color:C.cafe,fontWeight:700}}>{fmtBRL(f.value)}</span>
            <span style={{color:C.oliva}}>venc. {fmtDate(f.dataVencimento)}</span>
            <span style={{fontSize:10,fontWeight:700,padding:"1px 8px",borderRadius:10,background:f.pago?"#DDF0E6":"#F0ECF6",color:f.pago?"#1F7A4D":C.oliva}}>{f.pago?"✓ Pago":"A receber"}</span>
            <Btn sm v="ghost" onClick={()=>togglePago(f)}>{f.pago?"↩ Marcar não pago":"✓ Marcar pago"}</Btn>
            <Btn sm v="ghost" onClick={()=>excluirLanc(f)}>🗑</Btn>
          </div>))}
      </>}
      {p.objetivo&&<div style={{background:"#fff",border:`1px solid ${C.areia}`,borderRadius:8,padding:"10px 14px",marginBottom:12,fontSize:13,color:C.oliva}}><b style={{color:C.cafe}}>Objetivo principal:</b> {p.objetivo}</div>}

      <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:6}}>
        {et.map((e,i)=>{

        {cartao("Concluídas",r.concluidas,C.verde)}

        {cartao("Pendentes",r.pendentes)}
        {cartao("Atrasadas",r.atrasadas,r.atrasadas>0?C.vermelho:C.cafe)}

      <PcBarra pct={r.pct}/>

      <Divider label="Atendimentos"/>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:8}}>

      </div>

      <Divider label={`Indicadores (${(p.indicadores||[]).length})`}/>
      {(p.indicadores||[]).length===0
        ?<div style={{fontSize:12,color:C.oliva}}>Nenhum indicador cadastrado. Registre na aba Indicadores para acompanhar a evolução.</div>
        :(p.indicadores||[]).slice(0,4).map(i=>{const pr=pcProgInd(i);return(
          <div key={i.id} style={{marginBottom:8}}>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:C.oliva,marginBottom:3,gap:8}}>
              <b style={{color:C.cafe}}>{i.nome}</b><span>{pcV(i.valorAtual,i.unidade?` ${i.unidade}`:"")} → meta {pcV(i.metaFinal,i.unidade?` ${i.unidade}`:"")}</span>

      <Divider label={`Prioridades (${(p.prioridades||[]).length})`}/>

        ?<div style={{fontSize:12,color:C.oliva}}>Ainda não definidas. Depois do diagnóstico, transforme os problemas em prioridades.</div>
        :(p.prioridades||[]).slice(0,3).map((x,i)=>(
          <div key={x.id} style={{display:"flex",gap:8,alignItems:"center",fontSize:13,color:C.oliva,marginBottom:4}}>
            <b style={{color:C.cafe}}>#{i+1}</b><span style={{flex:1}}>{x.problema}</span><PcChip t={x.prioridade} sm/>
          </div>))}

      <Divider label="Próximos passos"/>
      {ultimoAtend&&String(ultimoAtend.proximos||"").trim()&&<div style={{background:"#E6F3F6",borderRadius:6,padding:"8px 12px",marginBottom:8,fontSize:12,color:"#1F6F7A",whiteSpace:"pre-line"}}><b>Do último atendimento ({fmtDate(ultimoAtend.data)}):</b> {ultimoAtend.proximos}</div>}
      {proximas.length===0
        ?<div style={{fontSize:12,color:C.oliva}}>{(p.acoes||[]).length===0?"Monte o plano de ação para ver aqui as próximas ações.":"Tudo concluído por aqui. 🎉"}</div>
        :proximas.map(a=>{const st=pcStatusAcaoEf(a);return(
          <div key={a.id} style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",background:"#fff",border:`1px solid ${C.areia}`,borderRadius:6,padding:"8px 12px",marginBottom:6,fontSize:13}}>
            <span style={{flex:1,minWidth:160,color:C.cafe,fontWeight:600}}>{a.acao}</span>
            <span style={{fontSize:11,color:st==="Atrasada"?C.vermelho:C.oliva,fontWeight:st==="Atrasada"?700:400}}>{a.prazo?fmtDate(a.prazo):"sem prazo"}</span>
            <PcChip t={st} sm/>
          </div>);})}

      {eventos.length>0&&<>
        <Divider label="Últimas atualizações"/>
        {eventos.map(e=>(
          <div key={e.id} style={{display:"flex",gap:10,fontSize:12,color:C.oliva,padding:"4px 0",borderBottom:`1px dashed ${C.areia}`}}>
            <span style={{minWidth:72,color:C.cafe,fontWeight:600}}>{fmtDate(e.data)}</span><span>{e.texto}</span>
          </div>))}
      </>}
    </div>);
  };

  const renderDiag=()=>{
    const dd=p.diagnostico||{};
    return(<div>
      {dd.concluido&&<div style={{background:"#DDF0E6",color:"#1F7A4D",borderRadius:8,padding:"10px 14px",marginBottom:12,fontSize:13,fontWeight:600,display:"flex",justifyContent:"space-between",gap:8,flexWrap:"wrap",alignItems:"center"}}>
        <span>✓ Diagnóstico concluído em {fmtDate(dd.dataConclusao)}{p.nivel?` · ${p.nivel}`:" · nível a definir"}</span>
        <Btn sm v="ghost" onClick={()=>{upd(pcReabrirDiag);}}>↩ Reabrir</Btn>
      </div>}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(260px,1fr))",gap:12}}>
        {PC_DG_CAMPOS.map(([k,l])=>(
          <div key={k}>
            <Inp label={l} rows={k==="situacao"||k==="problemas"?5:4} value={dg[k]} onChange={v=>{setDg(d=>({...d,[k]:v}));setDgSujo(true);}}
