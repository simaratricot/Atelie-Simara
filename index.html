const BaixaModal = ({lancamento,contas,onConfirm,onClose}) => {
  const [valorPago,setValorPago]=useState(lancamento.value);
  const [dataPag,setDataPag]=useState(today);
  const [contaId,setContaId]=useState(contas[0]?.id||"");
  const parcial=Number(valorPago)<lancamento.value&&Number(valorPago)>0;
  return(
    <Modal title={`Baixar — ${lancamento.desc}`} onClose={onClose}>
      <div style={{background:C.linho,borderRadius:6,padding:"10px 12px",marginBottom:12}}>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:3}}>
          <span style={{color:C.oliva}}>Valor previsto</span>
          <span style={{fontWeight:700}}>{fmtBRL(lancamento.value)}</span>
        </div>
        {lancamento.clientName&&<div style={{fontSize:11,color:C.oliva}}>Cliente: {lancamento.clientName}</div>}
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        <Inp label="Valor recebido (R$)" type="number" value={valorPago} onChange={setValorPago}/>
        <Inp label="Data do recebimento" type="date" value={dataPag} onChange={setDataPag}/>
        <Sel label="Banco/Conta que recebeu" value={contaId} onChange={setContaId}
          options={[{v:"",l:"Selecionar conta..."},...contas.map(c=>({v:c.id,l:`${c.nome} (${fmtBRL(c.saldo||0)})`}))]}/>
      </div>
      {parcial&&<div style={{background:"#FEF3E9",borderRadius:6,padding:"10px",marginTop:10,fontSize:12,color:"#9A6B40"}}>
        ⚠ Pagamento parcial: será gerado um novo lançamento de <b>{fmtBRL(lancamento.value-Number(valorPago))}</b> como pendente.
      </div>}
      <div style={{display:"flex",gap:8,marginTop:14,justifyContent:"flex-end"}}>
        <Btn v="ghost" onClick={onClose}>Cancelar</Btn>
        <Btn onClick={()=>onConfirm(lancamento,Number(valorPago),dataPag,contaId)}>✓ Confirmar baixa</Btn>
      </div>
    </Modal>
  );
};

const Finance = ({finance,setFinance,orders,contas,setContas,clients=[]}) => {
  const [tab,setTab]=useState("lanc");
  const [formModal,setFormModal]=useState(false);
  const [contaModal,setContaModal]=useState(false);
  const [transModal,setTransModal]=useState(false);
  const [baixaModal,setBaixaModal]=useState(null);
  const [per,setPer]=useState("mes");
  const [mes,setMes]=useState(today.slice(0,7));
  const [ano,setAno]=useState(today.slice(0,4));
  const [filtStatus,setFiltStatus]=useState("todos");
  const [buscaFin,setBuscaFin]=useState("");
  const [form,setForm]=useState({type:"receita",desc:"",value:0,date:today,dataVencimento:today,category:"Moda",centrocusto:"Vendas",pago:false,fixa:false,diaFixo:10,qtdMeses:12,anoFixo:new Date().getFullYear(),contaId:"",clientName:"",orderId:""});
  const [cForm,setCForm]=useState({nome:"",tipo:"Conta corrente",saldo:0,cor:"#B08D57"});
  const [tForm,setTForm]=useState({de:"",para:"",valor:0,data:today,nota:""});
  const MESES=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];

  const isVencido=f=>!f.pago&&f.dataVencimento&&f.dataVencimento<today;
  const getStatus=f=>{if(f.pago)return "pago";if(f.pagoParcial)return "parcial";if(isVencido(f))return "vencido";return "pendente";};

  const inPer=f=>{if(per==="dia")return f.date===today||f.dataVencimento===today;if(per==="mes")return f.date?.startsWith(mes)||f.dataVencimento?.startsWith(mes);if(per==="ano")return f.date?.startsWith(ano)||f.dataVencimento?.startsWith(ano);return true;};
  const filtraBusca=f=>!buscaFin||f.desc?.toLowerCase().includes(buscaFin.toLowerCase())||f.clientName?.toLowerCase().includes(buscaFin.toLowerCase());
  const filtPer=finance.filter(f=>inPer(f)&&filtraBusca(f));
  const filt=filtStatus==="todos"?filtPer:filtStatus==="parcial"?filtPer.filter(f=>f.pagoParcial):filtPer.filter(f=>getStatus(f)===filtStatus);

  const rec=filtPer.filter(f=>f.type==="receita"&&!f.pagoParcial).reduce((a,f)=>a+f.value,0);
  const desp=filtPer.filter(f=>f.type==="despesa").reduce((a,f)=>a+f.value,0);

  // Resumos
  const mesFmt=today.slice(0,7);
  const recHojeVal=finance.filter(f=>f.type==="receita"&&f.dataVencimento===today&&!f.pago).reduce((a,f)=>a+f.value,0);
  const pagHojeVal=finance.filter(f=>f.type==="despesa"&&f.dataVencimento===today&&!f.pago).reduce((a,f)=>a+f.value,0);
  const recMes=finance.filter(f=>f.type==="receita"&&f.pago&&f.dataPagamento?.startsWith(mesFmt)).reduce((a,f)=>a+f.value,0);
  const pendMes=finance.filter(f=>f.type==="receita"&&!f.pago&&f.dataVencimento?.startsWith(mesFmt)).reduce((a,f)=>a+f.value,0);
  const vencidos=finance.filter(f=>isVencido(f)).length;
  const aPag=finance.filter(f=>f.type==="despesa"&&!f.pago).reduce((a,f)=>a+f.value,0);
  const aRec=finance.filter(f=>f.type==="receita"&&!f.pago).reduce((a,f)=>a+f.value,0);
  const balAno=Array.from({length:12},(_,i)=>{const m=`${ano}-${String(i+1).padStart(2,"0")}`;const r=finance.filter(f=>f.type==="receita"&&f.date?.startsWith(m)).reduce((a,f)=>a+f.value,0);const d=finance.filter(f=>f.type==="despesa"&&f.date?.startsWith(m)).reduce((a,f)=>a+f.value,0);return{mes:m,label:MESES[i],r,d,lucro:r-d};});
  const recHoje=finance.filter(f=>f.type==="receita"&&f.date===today).reduce((a,f)=>a+f.value,0);

  // BAIXA com pagamento parcial
  const doBaixa=(lanc,valorPago,dataPag,contaId)=>{
    if(valorPago>=lanc.value){
      // Pago total
      setFinance(prev=>prev.map(x=>x.id===lanc.id?{...x,pago:true,pagoParcial:false,dataPagamento:dataPag,contaId,valorPago:lanc.value}:x));
      if(contaId){const delta=lanc.type==="receita"?lanc.value:-lanc.value;setContas(prev=>prev.map(c=>c.id===contaId?{...c,saldo:(c.saldo||0)+delta}:c));}
    } else {
      // Pagamento parcial — marca como parcial e gera saldo
      const saldo=lanc.value-valorPago;
      setFinance(prev=>[
        ...prev.map(x=>x.id===lanc.id?{...x,pagoParcial:true,pago:false,dataPagamento:dataPag,contaId,valorPagoParc:valorPago,value:valorPago}:x),
        {id:uid(),type:lanc.type,desc:`${lanc.desc} – Saldo`,value:saldo,date:lanc.date,dataVencimento:lanc.dataVencimento,category:lanc.category,centrocusto:lanc.centrocusto,pago:false,orderId:lanc.orderId,clientName:lanc.clientName,contaId:""}
      ]);
      if(contaId){const delta=lanc.type==="receita"?valorPago:-valorPago;setContas(prev=>prev.map(c=>c.id===contaId?{...c,saldo:(c.saldo||0)+delta}:c));}
    }
    setBaixaModal(null);
    showSavedGlobal("Baixa registrada!");
  };

  // CANCELAR BAIXA
  const cancelarBaixa=(lanc)=>{
    if(!window.confirm("Cancelar esta baixa? O lançamento voltará para pendente e o saldo da conta será revertido."))return;
    setFinance(prev=>prev.map(x=>x.id===lanc.id?{...x,pago:false,pagoParcial:false,dataPagamento:null,valorPago:0}:x));
    if(lanc.contaId){const delta=lanc.type==="receita"?-lanc.value:lanc.value;setContas(prev=>prev.map(c=>c.id===lanc.contaId?{...c,saldo:(c.saldo||0)+delta}:c));}
    showSavedGlobal("Baixa cancelada!");
  };

  const saveForm=()=>{
    if(form.fixa&&form.type==="despesa"){
      const inicio=new Date(form.dataInicio||today);
      const lancs=[];
      for(let i=0;i<Number(form.qtdMeses||12);i++){
        const m=new Date(inicio.getFullYear(),inicio.getMonth()+i,Number(form.diaFixo||inicio.getDate()));
        const dataVenc=m.toISOString().split("T")[0];
        lancs.push({...form,id:uid(),value:Number(form.value),pago:false,fixa:true,
          date:dataVenc,dataVencimento:dataVenc,
          desc:`${form.desc} (${i+1}/${form.qtdMeses||12})`});
      }
      setFinance(prev=>[...prev,...lancs]);
      showSavedGlobal(`${lancs.length} lançamentos criados!`);
    } else {
      setFinance(prev=>[...prev,{...form,id:uid(),value:Number(form.value),pago:false}]);
      showSavedGlobal("Lançamento salvo!");
    }
    setFormModal(false);
  };
  const saveConta=()=>{if(cForm.id)setContas(prev=>prev.map(c=>c.id===cForm.id?{...cForm,saldo:Number(cForm.saldo)}:c));else setContas(prev=>[...prev,{...cForm,id:uid(),saldo:Number(cForm.saldo)}]);setContaModal(false);showSavedGlobal("Conta salva!");};
  const doTrans=()=>{const v=Number(tForm.valor);setContas(prev=>prev.map(c=>c.id===tForm.de?{...c,saldo:(c.saldo||0)-v}:c.id===tForm.para?{...c,saldo:(c.saldo||0)+v}:c));const de=contas.find(c=>c.id===tForm.de);const para=contas.find(c=>c.id===tForm.para);setFinance(prev=>[...prev,{id:uid(),type:"despesa",desc:`Transferência → ${para?.nome}`,value:v,date:tForm.data,category:"Outros",centrocusto:"Despesas",pago:true,contaId:tForm.de},{id:uid(),type:"receita",desc:`Transferência ← ${de?.nome}`,value:v,date:tForm.data,category:"Outros",centrocusto:"Investimentos",pago:true,contaId:tForm.para}]);setTransModal(false);};

  const StatusBtn=({f})=>{
    const s=getStatus(f);
    if(s==="pago"||s==="parcial") return(
      <div style={{display:"flex",gap:4,alignItems:"center",flexWrap:"wrap"}}>
        <span style={{fontSize:10,padding:"2px 8px",borderRadius:10,fontWeight:700,background:s==="parcial"?"#FEF3E9":"#D4E8D4",color:s==="parcial"?"#9A6B40":"#2E6B2E"}}>{s==="parcial"?`Parcial ${fmtBRL(f.valorPagoParc||0)}`:"✓ Pago"}{f.dataPagamento?` · ${fmtDate(f.dataPagamento)}`:""}</span>
        <button onClick={()=>cancelarBaixa(f)} style={{fontSize:9,padding:"2px 6px",borderRadius:8,border:`1px solid ${C.areia}`,background:"transparent",color:C.oliva,cursor:"pointer"}}>↩ Cancelar</button>
      </div>
    );
    return(
      <button onClick={()=>setBaixaModal(f)} style={{fontSize:10,padding:"3px 10px",borderRadius:10,fontWeight:700,border:`1px solid ${isVencido(f)?C.vermelho:C.dourado}`,cursor:"pointer",background:isVencido(f)?"rgba(192,57,43,0.08)":"rgba(176,141,87,0.08)",color:isVencido(f)?C.vermelho:C.dourado}}>
        {isVencido(f)?"⚠ Vencido":"💰 Baixar"}
      </button>
    );
  };

  return (
    <div className="fade" style={{padding:24}}>
      {/* RESUMO — hoje e mês */}
      <div style={{background:`linear-gradient(135deg,#1A2744,#2D1B69)`,borderRadius:8,padding:"16px 20px",marginBottom:16,border:"1px solid rgba(165,99,162,0.3)"}}>
        <div style={{fontSize:9,color:"#D8B4CE",letterSpacing:"3px",textTransform:"uppercase",fontWeight:700,marginBottom:12}}>Painel financeiro</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
          <div style={{background:"rgba(255,255,255,0.08)",borderRadius:6,padding:"10px 14px",border:"1px solid rgba(216,180,206,0.15)"}}>
            <div style={{fontSize:9,color:"#D8B4CE",textTransform:"uppercase",letterSpacing:"1.5px",marginBottom:4,fontWeight:600}}>Receber hoje</div>
            <div style={{fontSize:22,fontFamily:"'Playfair Display',serif",color:"#FDFAFF",fontWeight:700}}>{fmtBRL(recHojeVal)}</div>
          </div>
          <div style={{background:"rgba(255,255,255,0.08)",borderRadius:6,padding:"10px 14px",border:"1px solid rgba(216,180,206,0.15)"}}>
            <div style={{fontSize:9,color:"#D8B4CE",textTransform:"uppercase",letterSpacing:"1.5px",marginBottom:4,fontWeight:600}}>Pagar hoje</div>
            <div style={{fontSize:22,fontFamily:"'Playfair Display',serif",color:pagHojeVal>0?"#FF8A80":"#FDFAFF",fontWeight:700}}>{fmtBRL(pagHojeVal)}</div>
          </div>
        </div>
        <div style={{display:"flex",gap:20,flexWrap:"wrap",paddingTop:10,borderTop:"1px solid rgba(216,180,206,0.15)"}}>
          {[{l:"Recebido no mês",v:fmtBRL(recMes),c:"#FDFAFF"},{l:"Pendente no mês",v:fmtBRL(pendMes),c:"#D8B4CE"},{l:"Vencidos",v:`${vencidos}`,c:vencidos>0?"#FF8A80":"#D8B4CE"}].map(k=>(
            <div key={k.l}><div style={{fontSize:9,color:"rgba(216,180,206,0.7)",letterSpacing:"1px",textTransform:"uppercase",marginBottom:2}}>{k.l}</div><div style={{fontSize:15,fontFamily:"'Playfair Display',serif",color:k.c,fontWeight:700}}>{k.v}</div></div>
          ))}
        </div>
      </div>

      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:14,alignItems:"center"}}>
        <Tabs tabs={[{k:"lanc",l:"Lançamentos"},{k:"rec",l:"A Receber"},{k:"pag",l:"A Pagar"},{k:"bal",l:"Balanço"},{k:"cx",l:"Fluxo de Caixa"},{k:"div",l:"Divisão do Dia"}]} active={tab} set={setTab}/>
        <div style={{marginLeft:"auto",display:"flex",gap:8}}>
          <Btn sm v="ghost" onClick={()=>{setCForm({nome:"",tipo:"Conta corrente",saldo:0,cor:"#B08D57"});setContaModal(true);}}>+ Conta</Btn>
          <Btn onClick={()=>setFormModal(true)}>+ Lançamento</Btn>
        </div>
      </div>

      {contas.length>0&&<div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:16}}>
        {contas.map(c=><div key={c.id} className="ch" onClick={()=>{setCForm({...c});setContaModal(true);}} style={{flex:"1 1 130px",background:`linear-gradient(135deg,${c.cor||C.dourado},${c.cor||C.dourado}bb)`,borderRadius:8,padding:"12px 16px",cursor:"pointer"}}>
          <div style={{fontSize:10,color:"rgba(255,255,255,0.8)",letterSpacing:"1px",textTransform:"uppercase",marginBottom:3}}>{c.tipo}</div>
          <div style={{fontSize:13,fontWeight:700,color:"#fff",marginBottom:3}}>{c.nome}</div>
          <div style={{fontSize:20,fontFamily:"'Playfair Display',serif",color:"#fff",fontWeight:700}}>{fmtBRL(c.saldo||0)}</div>
        </div>)}
        <div onClick={()=>{setCForm({nome:"",tipo:"Conta corrente",saldo:0,cor:"#B08D57"});setContaModal(true);}} style={{flex:"1 1 90px",border:`2px dashed ${C.areia}`,borderRadius:8,padding:"12px",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",fontSize:12,color:C.oliva,fontWeight:600}}>+ Nova conta</div>
        <div onClick={()=>{setTForm({de:contas[0]?.id||"",para:contas[1]?.id||"",valor:0,data:today,nota:""});setTransModal(true);}} style={{flex:"1 1 90px",border:`2px dashed ${C.dourado}`,borderRadius:8,padding:"12px",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",fontSize:12,color:C.dourado,fontWeight:600}}>⇄ Transferir</div>
      </div>}

      {tab==="lanc"&&<>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:10,alignItems:"center"}}>
          {[{k:"dia",l:"Hoje"},{k:"mes",l:"Mês"},{k:"ano",l:"Ano"},{k:"todos",l:"Todos"}].map(p=><button key={p.k} onClick={()=>setPer(p.k)} style={{padding:"4px 12px",borderRadius:20,border:`1.5px solid ${per===p.k?C.cafe:C.areia}`,background:per===p.k?C.cafe:"transparent",color:per===p.k?"#fff":C.cafe,fontSize:11,fontWeight:600,cursor:"pointer"}}>{p.l}</button>)}
          {per==="mes"&&<input type="month" value={mes} onChange={e=>setMes(e.target.value)} style={{padding:"5px 10px",border:`1.5px solid ${C.areia}`,borderRadius:3,fontSize:12,color:C.cafe}}/>}
          {per==="ano"&&<input type="number" value={ano} onChange={e=>setAno(e.target.value)} style={{padding:"5px 10px",border:`1.5px solid ${C.areia}`,borderRadius:3,fontSize:12,color:C.cafe,width:80}}/>}
          <div style={{flex:1,minWidth:160}}><Inp value={buscaFin} onChange={setBuscaFin} placeholder="Buscar cliente/fornecedor..."/></div>
        </div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}}>
          {[{k:"todos",l:"Todos"},{k:"pendente",l:"⏳ Pendentes"},{k:"pago",l:"✓ Pagos"},{k:"parcial",l:"◑ Parciais"},{k:"vencido",l:"⚠ Vencidos"}].map(s=><button key={s.k} onClick={()=>setFiltStatus(s.k)} style={{padding:"3px 11px",borderRadius:20,border:`1.5px solid ${filtStatus===s.k?C.cafe:C.areia}`,background:filtStatus===s.k?C.cafe:"transparent",color:filtStatus===s.k?"#fff":C.cafe,fontSize:11,fontWeight:600,cursor:"pointer"}}>{s.l}</button>)}
        </div>
        <div style={{display:"flex",gap:12,flexWrap:"wrap",marginBottom:14}}>
          {[{l:"Receitas",v:fmtBRL(rec),c:C.oliva},{l:"Despesas",v:fmtBRL(desp),c:C.vermelho},{l:"Lucro",v:fmtBRL(rec-desp),c:rec-desp>=0?C.dourado:C.vermelho},{l:"Margem",v:`${rec>0?Math.round(((rec-desp)/rec)*100):0}%`,c:C.cafe}].map(k=><Card key={k.l} style={{flex:"1 1 100px"}}><div style={{fontSize:9,letterSpacing:"1.5px",textTransform:"uppercase",color:C.oliva,marginBottom:3,fontWeight:700}}>{k.l}</div><div style={{fontSize:20,fontFamily:"'Playfair Display',serif",color:k.c}}>{k.v}</div></Card>)}
        </div>
        {filt.length===0?<div style={{textAlign:"center",padding:"30px",color:C.oliva,fontFamily:"'Cormorant Garamond',serif",fontStyle:"italic",fontSize:14}}>Nenhum lançamento nesse período ✦</div>:(
        <Card style={{padding:0,overflow:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",minWidth:500}}>
            <thead><tr style={{background:C.linho}}>{["Data","Tipo","Descrição","Valor","Vencimento","Status",""].map(h=><th key={h} style={{padding:"8px 10px",textAlign:"left",fontSize:10,fontWeight:700,letterSpacing:"1px",textTransform:"uppercase",color:C.oliva,borderBottom:`1px solid ${C.areia}`,whiteSpace:"nowrap"}}>{h}</th>)}</tr></thead>
            <tbody>
              {[...filt].sort((a,b)=>(b.dataVencimento||b.date||"").localeCompare(a.dataVencimento||a.date||"")).map(f=>(
                <tr key={f.id} style={{borderBottom:`1px solid ${C.linho}`,background:isVencido(f)?"rgba(192,57,43,0.03)":f.pagoParcial?"rgba(176,141,87,0.05)":"transparent"}}>
                  <td style={{padding:"8px 10px",fontSize:12,color:C.oliva,whiteSpace:"nowrap"}}>{fmtDate(f.date)}</td>
                  <td style={{padding:"8px 10px"}}><span style={{fontSize:10,padding:"2px 7px",borderRadius:10,fontWeight:700,background:f.type==="receita"?"#D4E8D4":"#FEE",color:f.type==="receita"?"#2E6B2E":C.vermelho}}>{f.type==="receita"?"RECEITA":"DESPESA"}</span></td>
                  <td style={{padding:"8px 10px"}}><div style={{fontSize:12,fontWeight:600}}>{f.desc}{f.fixa&&<span style={{fontSize:9,background:"#FEF3E9",color:C.dourado,padding:"1px 5px",borderRadius:10,fontWeight:700,marginLeft:4}}>FIXA</span>}</div>{f.clientName&&<div style={{fontSize:10,color:C.oliva}}>{f.clientName}{f.orderId?` · ${f.orderId}`:""}</div>}</td>
                  <td style={{padding:"8px 10px",fontSize:13,fontWeight:700,color:f.type==="receita"?C.oliva:C.vermelho,whiteSpace:"nowrap"}}>{f.type==="receita"?"+":"-"}{fmtBRL(f.value)}</td>
                  <td style={{padding:"8px 10px",fontSize:11,color:isVencido(f)?C.vermelho:C.oliva,whiteSpace:"nowrap",fontWeight:isVencido(f)?700:400}}>{fmtDate(f.dataVencimento)}</td>
                  <td style={{padding:"8px 10px"}}><StatusBtn f={f}/></td>
                  <td style={{padding:"8px 10px"}}><Btn sm v="danger" onClick={()=>{if(window.confirm("Excluir lançamento?"))setFinance(prev=>prev.filter(x=>x.id!==f.id));}}>✕</Btn></td>
                </tr>
              ))}
            </tbody>
          </table>
        </Card>)}

// ─── METAS ────────────────────────────────────────────────────────────────────
const Metas = ({finance,orders,metas,setMetas}) => {
  const anoAtual=new Date().getFullYear();
  const [anoSel,setAnoSel]=useState(anoAtual);
  const [editando,setEditando]=useState(false);
  const metaAno=metas.find(m=>m.ano===anoSel)||{ano:anoSel,faturamentoMensal:3000,encomendas:10,produtosVendidos:15,investimentoAnual:10000};
  const [form,setForm]=useState(metaAno);

  useEffect(()=>{const m=metas.find(x=>x.ano===anoSel)||{ano:anoSel,faturamentoMensal:3000,encomendas:10,produtosVendidos:15,investimentoAnual:10000};setForm(m);},[anoSel,metas]);

  const mesAtual=today.slice(0,7);
  const fatMes=finance.filter(f=>f.type==="receita"&&f.date?.startsWith(mesAtual)).reduce((a,f)=>a+f.value,0);
  const encMes=orders.filter(o=>o.dataCompra?.startsWith(mesAtual)&&o.status!=="Cancelado").length;
  const invAno=finance.filter(f=>f.centrocusto==="Investimentos"&&f.date?.startsWith(String(anoSel))).reduce((a,f)=>a+f.value,0);

  const salvar=()=>{setMetas(prev=>[...prev.filter(m=>m.ano!==anoSel),{...form,ano:anoSel}]);setEditando(false);};

  const MetaCard=({icon,label,meta,real,fmt,cor})=>{
    const pct=meta>0?Math.min(100,(real/meta)*100):0;
    return(
      <Card style={{flex:"1 1 200px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <div><div style={{fontSize:18}}>{icon}</div><div style={{fontSize:13,fontWeight:700,color:C.cafe,marginTop:1}}>{label}</div></div>
          <div style={{textAlign:"right"}}><div style={{fontSize:20,fontFamily:"'Playfair Display',serif",fontWeight:700,color:cor||C.dourado}}>{fmt(real)}</div><div style={{fontSize:11,color:C.oliva}}>de {fmt(meta)}</div></div>
        </div>
        <PBar pct={pct} color={pct>=100?C.verde:pct>=70?C.dourado:pct>=40?C.oliva:C.areia}/>
        <div style={{display:"flex",justifyContent:"space-between",marginTop:5}}>

    const comDesc=comFrete*(1-Number(form.desconto||0)/100);
    const arredondado=Math.ceil(comDesc/5)*5;

          ["Subtotal",fmtBRL(resultado.sub)],
          [`Margem de lucro (${resultado.margem}%)`,fmtBRL(resultado.comMargem-resultado.sub)],
