          </div>))}
      </div>
      <div style={{display:"flex",gap:8,marginTop:14,alignItems:"center",flexWrap:"wrap"}}>
        <Btn onClick={salvarDiag}>💾 Salvar diagnóstico</Btn>
        {dgSujo&&<span style={{fontSize:12,color:C.vermelho,fontWeight:600}}>● alterações não salvas</span>}
      </div>
      <div style={{marginTop:16,background:C.linho,borderRadius:8,padding:14}}>
        <div style={{fontSize:11,fontWeight:700,letterSpacing:1,color:C.oliva,textTransform:"uppercase",marginBottom:8}}>Nível do Método CONTÍNUA</div>
        <div style={{display:"flex",gap:10,alignItems:"flex-end",flexWrap:"wrap"}}>
          <div style={{flex:1,minWidth:220}}><Sel label="Nível identificado" value={nivelDg} onChange={setNivelDg} options={[{v:"",l:"A definir (ainda sem dados suficientes)"},...PC_NIVEIS.map(n=>({v:n,l:n}))]}/></div>
          <Btn v="ghost" onClick={salvarNivel}>💾 Salvar nível</Btn>
        </div>
        <div style={{fontSize:11,color:C.oliva,marginTop:8}}>{nivelDg!==(p.nivel||"")?<b style={{color:C.vermelho}}>● nível ainda não salvo. </b>:null}Pode definir agora ou depois, quando tiver os dados do cliente.</div>
      </div>
      {!dd.concluido&&<div style={{marginTop:12,background:C.linho,borderRadius:8,padding:14}}>
        <div style={{fontSize:11,fontWeight:700,letterSpacing:1,color:C.oliva,textTransform:"uppercase",marginBottom:8}}>Concluir diagnóstico</div>
        <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
          <Btn v="oliva" onClick={concluirDiag}>✓ Concluir diagnóstico</Btn>
          <span style={{fontSize:11,color:C.oliva,flex:1,minWidth:200}}>Ao concluir, o status passa para "Planejamento". Não é obrigatório ter o nível definido nem tudo preenchido; dá para reabrir.</span>
        </div>
      </div>}
    </div>);
  };

  const renderPrior=()=>{
    const lista=p.prioridades||[];
    const temProblemas=String(dg.problemas||(p.diagnostico||{}).problemas||"").trim().length>0;
    return(<div>
      <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap"}}>
        <Btn onClick={novaPrior}>+ Nova prioridade</Btn>
        {temProblemas&&<Btn v="ghost" onClick={importarProblemas}>📥 Trazer problemas do diagnóstico</Btn>}
      </div>
      {lista.length===0&&<div style={{background:C.linho,borderRadius:8,padding:"22px 16px",textAlign:"center",color:C.oliva,fontSize:13,lineHeight:1.6}}>
        Nenhuma prioridade ainda.<br/>{temProblemas?"Use \"Trazer problemas do diagnóstico\" para criar uma prioridade para cada problema listado.":"Registre os problemas no Diagnóstico ou crie uma prioridade manualmente."}
      </div>}
      {lista.map((x,i)=>{
        const nAc=(p.acoes||[]).filter(a=>a.prioridadeId===x.id).length;
        return(
        <div key={x.id} style={{background:"#fff",border:`1px solid ${C.areia}`,borderLeft:`4px solid ${(PC_COR[x.prioridade]||["","#999"])[1]}`,borderRadius:8,padding:"12px 14px",marginBottom:10}}>
          <div style={{display:"flex",gap:8,justifyContent:"space-between",flexWrap:"wrap",alignItems:"flex-start"}}>
            <div style={{flex:1,minWidth:200}}><span style={{color:C.cafe,fontWeight:700}}>#{i+1}</span> <span style={{color:C.cafe,fontWeight:600,fontSize:14}}>{x.problema}</span></div>
            <div style={{display:"flex",gap:6}}><PcChip t={x.prioridade} sm/><PcChip t={x.status} sm/></div>
          </div>
          {campo("Causa/gargalo",x.causa)}{campo("Objetivo",x.objetivo)}{campo("Impacto esperado",x.impacto)}{campo("Responsável",x.responsavel)}{campo("Prazo",x.prazo?fmtDate(x.prazo):"")}
          <div style={{display:"flex",gap:6,marginTop:10,flexWrap:"wrap",alignItems:"center"}}>
            <Btn sm v="ghost" onClick={()=>upd(pp=>pcMoverPrior(pp,x.id,-1))}>↑</Btn>
            <Btn sm v="ghost" onClick={()=>upd(pp=>pcMoverPrior(pp,x.id,1))}>↓</Btn>
            <Btn sm v="ghost" onClick={()=>{setForm({...x});setModal("prior");}}>✎ Editar</Btn>
            <Btn sm v="oliva" onClick={()=>criarAcaoDaPrior(x)}>➜ Criar ação</Btn>
            <Btn sm v="ghost" onClick={()=>{if(window.confirm("Excluir esta prioridade?"))upd(pp=>pcExcluirPrior(pp,x.id));}}>🗑</Btn>
            {nAc>0&&<span style={{fontSize:11,color:C.oliva}}>🔗 {nAc} ação(ões)</span>}
          </div>
        </div>);})}
    </div>);
  };

  const renderPlano=()=>{
    const filtros=[["todas","Todas",r.total],["Pendente","Pendentes",r.pendentes],["Em andamento","Em andamento",r.andamento],["Concluída","Concluídas",r.concluidas],["Atrasada","Atrasadas",r.atrasadas]];
    const lista=(p.acoes||[]).filter(a=>fAcao==="todas"||pcStatusAcaoEf(a)===fAcao).slice().sort((a,b)=>{
      const ca=a.status==="Concluída"?1:0,cb=b.status==="Concluída"?1:0;
      if(ca!==cb)return ca-cb;
      return String(a.prazo||"9999").localeCompare(String(b.prazo||"9999"));
    });
    const seg=(n,cl)=>n>0?<div style={{width:`${n/Math.max(1,r.total)*100}%`,background:cl}}/>:null;
    return(<div>
      <div style={{display:"flex",gap:8,marginBottom:10,flexWrap:"wrap",alignItems:"center"}}>
        <Btn onClick={novaAcao}>+ Nova ação</Btn>
        <span style={{fontSize:12,color:C.oliva}}>{r.concluidas} de {r.total} concluídas ({r.pct}%)</span>
      </div>
      {r.total>0&&<div style={{display:"flex",height:10,borderRadius:6,overflow:"hidden",background:"#EEE8F4",marginBottom:12}}>
        {seg(r.concluidas,"#1F7A4D")}{seg(r.andamento,"#3D5A8A")}{seg(r.atrasadas,"#c0392b")}{seg(r.pendentes,"#C9BEDB")}
      </div>}
      <div style={{display:"flex",gap:6,marginBottom:12,overflowX:"auto",paddingBottom:2}}>
        {filtros.map(([k,l,n])=>btnPill(fAcao===k,()=>setFAcao(k),`${l} (${n})`))}
      </div>
      {lista.length===0&&<div style={{background:C.linho,borderRadius:8,padding:"22px 16px",textAlign:"center",color:C.oliva,fontSize:13}}>
        {r.total===0?"Nenhuma ação ainda. Crie a primeira ou use \"Criar ação\" dentro de uma prioridade.":"Nenhuma ação neste filtro."}
      </div>}
      {lista.map(a=>{
        const st=pcStatusAcaoEf(a);
        const pr=(p.prioridades||[]).findIndex(x=>x.id===a.prioridadeId);
        return(
        <div key={a.id} style={{background:"#fff",border:`1px solid ${C.areia}`,borderLeft:`4px solid ${(PC_COR[st]||["","#999"])[1]}`,borderRadius:8,padding:"12px 14px",marginBottom:10,opacity:st==="Concluída"?0.85:1}}>
          <div style={{display:"flex",gap:8,justifyContent:"space-between",flexWrap:"wrap",alignItems:"flex-start"}}>
            <div style={{flex:1,minWidth:200,color:C.cafe,fontWeight:600,fontSize:14,textDecoration:st==="Concluída"?"line-through":"none"}}>{a.acao}</div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}><PcChip t={st} sm/><PcChip t={a.prioridade} sm/>{a.area&&<span style={{background:"#F3F0F7",color:C.oliva,borderRadius:20,padding:"2px 8px",fontSize:10,fontWeight:700}}>{a.area}</span>}</div>
          </div>
          <div style={{fontSize:12,color:C.oliva,marginTop:4}}>
            {a.responsavel?`👤 ${a.responsavel}  `:""}
            <span style={{color:st==="Atrasada"?C.vermelho:C.oliva,fontWeight:st==="Atrasada"?700:400}}>{a.prazo?`📅 ${fmtDate(a.prazo)}`:"📅 sem prazo"}</span>
            {a.dataConclusao?`  ✓ concluída em ${fmtDate(a.dataConclusao)}`:""}
            {pr>=0?`  🎯 prioridade #${pr+1}`:""}
          </div>
          {a.descricao&&<div style={{fontSize:12,color:C.oliva,marginTop:4,whiteSpace:"pre-line"}}>{a.descricao}</div>}
          {campo("Resultado esperado",a.resultadoEsperado)}{campo("Resultado alcançado",a.resultadoAlcancado)}{campo("Obs.",a.obs)}
          <div style={{display:"flex",gap:6,marginTop:10,flexWrap:"wrap"}}>
            {st!=="Concluída"&&st!=="Em andamento"&&<Btn sm v="ghost" onClick={()=>upd(pp=>pcStatusAcao(pp,a.id,"Em andamento"))}>▶ Iniciar</Btn>}
            {st!=="Concluída"&&<Btn sm v="oliva" onClick={()=>upd(pp=>pcStatusAcao(pp,a.id,"Concluída"))}>✓ Concluir</Btn>}
            {st==="Concluída"&&<Btn sm v="ghost" onClick={()=>upd(pp=>pcStatusAcao(pp,a.id,"Pendente"))}>↩ Reabrir</Btn>}
            <Btn sm v="ghost" onClick={()=>{setForm({...a});setModal("acao");}}>✎ Editar</Btn>
            <Btn sm v="ghost" onClick={()=>{if(window.confirm("Excluir esta ação?"))upd(pp=>pcExcluirAcao(pp,a.id));}}>🗑</Btn>
          </div>
        </div>);})}
    </div>);
  };

  const renderAtend=()=>{
    const lista=(p.atendimentos||[]).slice().sort((a,b)=>String(b.data).localeCompare(String(a.data))||String(b.hora||"").localeCompare(String(a.hora||"")));
    return(<div>
      <div style={{display:"flex",gap:10,marginBottom:12,flexWrap:"wrap",alignItems:"center"}}>
        <Btn onClick={novoAtend}>+ Registrar atendimento</Btn>
        <span style={{fontSize:12,color:C.oliva}}>{lista.length} atendimento(s) · {pcFmtMin(pcHorasAtend(p))} realizadas</span>
      </div>
      {lista.length===0&&<div style={{background:C.linho,borderRadius:8,padding:"22px 16px",textAlign:"center",color:C.oliva,fontSize:13,lineHeight:1.6}}>Nenhum atendimento registrado.<br/>Cada atendimento fica ligado a este projeto e aparece na Agenda.</div>}
      {lista.map(a=>(
        <div key={a.id} style={{background:"#fff",border:`1px solid ${C.areia}`,borderLeft:`4px solid ${PC_EV_COR.atendimento}`,borderRadius:8,padding:"12px 14px",marginBottom:10}}>
          <div style={{display:"flex",gap:8,justifyContent:"space-between",flexWrap:"wrap",alignItems:"flex-start"}}>
            <div style={{flex:1,minWidth:200}}>
              <div style={{fontSize:11,color:C.oliva,fontWeight:700}}>{fmtDate(a.data)}{a.hora?` · ${a.hora}${a.horaFim?`–${a.horaFim}`:""}`:""}{a.duracaoMin>0?` · ${pcFmtMin(a.duracaoMin)}`:""}</div>
              <div style={{color:C.cafe,fontWeight:600,fontSize:14}}>{a.assunto}</div>
            </div>
            <span style={{background:"#E6F3F6",color:"#1F6F7A",borderRadius:20,padding:"3px 11px",fontSize:11,fontWeight:700}}>{a.tipo}</span>
          </div>
          {[["O que foi realizado",a.realizado],["Orientações",a.orientacoes],["Decisões tomadas",a.decisoes],["Próximos passos",a.proximos],["Observações",a.obs]].map(([r,v])=>String(v||"").trim()?<div key={r} style={{fontSize:12,color:C.oliva,marginTop:5,whiteSpace:"pre-line"}}><b style={{color:C.cafe}}>{r}:</b> {v}</div>:null)}
          {a.proxData&&<div style={{fontSize:12,color:"#1F6F7A",marginTop:6,fontWeight:600}}>📅 Próximo agendado: {fmtDate(a.proxData)} {a.proxHora||""}</div>}
          <div style={{display:"flex",gap:6,marginTop:10}}>
            <Btn sm v="ghost" onClick={()=>{setForm({...a,duracaoMin:a.duracaoMin||"",hora:a.hora||"",horaFim:a.horaFim||"",proxData:a.proxData||"",proxHora:a.proxHora||"09:00",compromissoId:a.compromissoId||"",proxCompromissoId:a.proxCompromissoId||""});setModal("atend");}}>✎ Editar</Btn>
            <Btn sm v="ghost" onClick={()=>excluirAtend(a)}>🗑</Btn>
          </div>
        </div>))}
    </div>);
  };

  const renderInd=()=>{
    const lista=p.indicadores||[];
    return(<div>
      <div style={{display:"flex",gap:10,marginBottom:12,flexWrap:"wrap",alignItems:"center"}}>
        <Btn onClick={novoInd}>+ Novo indicador</Btn>
        <span style={{fontSize:12,color:C.oliva}}>{lista.length} indicador(es)</span>
      </div>
      {lista.length===0&&<div style={{background:C.linho,borderRadius:8,padding:"22px 16px",textAlign:"center",color:C.oliva,fontSize:13,lineHeight:1.6}}>Nenhum indicador ainda.<br/>Defina o que será medido (valor inicial e meta final) e atualize ao longo do projeto.</div>}
      {lista.map(i=>{
        const pr=pcProgInd(i);
        const pontos=(i.historico||[]).map(h=>Number(h.valor)).filter(v=>!isNaN(v));
        const un=i.unidade?` ${i.unidade}`:"";
        return(
        <div key={i.id} style={{background:"#fff",border:`1px solid ${C.areia}`,borderLeft:`4px solid ${PC_EV_COR.indicador}`,borderRadius:8,padding:"12px 14px",marginBottom:10}}>
          <div style={{display:"flex",gap:8,justifyContent:"space-between",flexWrap:"wrap",alignItems:"flex-start"}}>
            <div style={{flex:1,minWidth:200}}>
              <div style={{color:C.cafe,fontWeight:700,fontSize:14}}>{i.nome}</div>
              {i.meta&&<div style={{fontSize:12,color:C.oliva}}>Meta: {i.meta}</div>}
            </div>
            <PcSpark pontos={pontos}/>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(100px,1fr))",gap:8,margin:"10px 0"}}>
            {[["Inicial",pcV(i.valorInicial,un)],["Atual",pcV(i.valorAtual,un)],["Meta final",pcV(i.metaFinal,un)],["Último acompanhamento",fmtDate(i.dataAcompanhamento)]].map(([r,v])=>(
              <div key={r} style={{background:C.linho,borderRadius:6,padding:"6px 10px"}}><div style={{fontSize:9,fontWeight:700,letterSpacing:1,textTransform:"uppercase",color:C.oliva}}>{r}</div><div style={{fontSize:13,fontWeight:700,color:C.cafe}}>{v}</div></div>))}
          </div>
          {pr!==null&&<><PcBarra pct={pr} cor={pr>=100?"#1F7A4D":undefined}/><div style={{fontSize:11,color:C.oliva,marginTop:3}}>{pr}% do caminho até a meta</div></>}
          {(i.historico||[]).length>1&&<div style={{marginTop:8}}>
            {(i.historico||[]).slice().reverse().slice(0,4).map(h=>(<div key={h.id} style={{fontSize:11,color:C.oliva}}>{fmtDate(h.data)} · <b>{h.valor}{un}</b>{h.obs&&h.obs!=="Registro inicial"?` — ${h.obs}`:""}</div>))}
          </div>}
          <div style={{display:"flex",gap:6,marginTop:10,flexWrap:"wrap"}}>

            <Btn sm v="ghost" onClick={()=>{setForm({id:i.id,nome:i.nome,meta:i.meta||"",unidade:i.unidade||"",valorInicial:i.valorInicial,metaFinal:i.metaFinal});setModal("ind");}}>✎ Editar</Btn>
            <Btn sm v="ghost" onClick={()=>{if(window.confirm("Excluir este indicador e o seu histórico?"))upd(pp=>pcExcluirInd(pp,i.id));}}>🗑</Btn>
          </div>
        </div>);})}
    </div>);
  };

  const renderEvol=()=>{
    const dd=p.diagnostico||{};
    const ac=p.acoes||[];
    const conc=ac.filter(a=>a.status==="Concluída");
    const atras=ac.filter(a=>pcStatusAcaoEf(a)==="Atrasada");
    const pend=ac.filter(a=>a.status!=="Concluída"&&pcStatusAcaoEf(a)!=="Atrasada");
    const ultimo=(p.atendimentos||[]).slice().sort((a,b)=>String(a.data).localeCompare(String(b.data))).pop();
    const linha=pcLinhaTempo(p);
    const bloco=(titulo,conteudo)=>(<div style={{marginBottom:14}}><Divider label={titulo}/>{conteudo}</div>);
    const vazio=(txt)=><div style={{fontSize:12,color:C.oliva}}>{txt}</div>;
    const itemAcao=(a,extra)=>(<div key={a.id} style={{fontSize:13,color:C.oliva,padding:"5px 0",borderBottom:`1px dashed ${C.areia}`}}><b style={{color:C.cafe}}>{a.acao}</b>{a.prazo?` · prazo ${fmtDate(a.prazo)}`:""}{extra}</div>);
    return(<div>
      {bloco("Situação inicial",(dd.situacao||dd.objetivoCliente)
        ?<div style={{background:"#fff",border:`1px solid ${C.areia}`,borderRadius:8,padding:"10px 14px",fontSize:13,color:C.oliva,whiteSpace:"pre-line"}}>{dd.situacao&&<div><b style={{color:C.cafe}}>Situação:</b> {dd.situacao}</div>}{dd.objetivoCliente&&<div style={{marginTop:4}}><b style={{color:C.cafe}}>Objetivo do cliente:</b> {dd.objetivoCliente}</div>}</div>
        :vazio("Preencha o Diagnóstico para registrar a situação inicial."))}

const PR_STATUS=["Novo","Contato realizado","Aguardando retorno","Conversa iniciada","Reunião agendada","Diagnóstico","Proposta enviada","Negociação","Cliente","Sem interesse","Perdido"];

  "Conversa iniciada":["#E6F3F6","#1F6F7A"],"Reunião agendada":["#E6F3F6","#1F6F7A"],"Diagnóstico":["#EFE8F7","#7B4FA6"],

const prHoje=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().split("T")[0];};
const PR_CAMPOS=["empresa","cnpj","segmento","porte","cidadeUf","site","instagram","linkedin","responsavel","cargo","telefone","whatsapp","email","origem","status","obs"];
const prForm=(p)=>{
  const base={empresa:"",cnpj:"",segmento:"",porte:"",cidadeUf:"",site:"",instagram:"",linkedin:"",responsavel:"",cargo:"",telefone:"",whatsapp:"",email:"",origem:PR_ORIGENS[0],status:"Novo",obs:""};
  if(!p)return base;
  const o={id:p.id};PR_CAMPOS.forEach(k=>{o[k]=p[k]===undefined||p[k]===null?base[k]:p[k];});return o;
};

// ── regras (funções puras) ──
const prEv=(p,tipo,texto,data)=>({...p,eventos:[...(p.eventos||[]),{id:uid(),data:data||prHoje(),tipo,texto}]});
const prNovo=(f)=>{
  const p={id:uid(),contatos:[],eventos:[],proximoContato:null,oportunidade:null,criadoEm:prHoje()};
  PR_CAMPOS.forEach(k=>{p[k]=f[k]===undefined||f[k]===null?"":f[k];});
  if(!p.status)p.status="Novo";
  return prEv(p,"prospect",`Prospect cadastrado: ${p.empresa}`);
};
const prEditar=(p,f)=>{
  const n={...p};PR_CAMPOS.forEach(k=>{if(f[k]!==undefined)n[k]=f[k];});
  return p.status!==n.status?prEv(n,"status",`Status: ${p.status} → ${n.status}`):n;
};
const prMoverStatus=(p,status)=>{
  if(p.status===status)return p;
  return prEv({...p,status},"status",`Status: ${p.status} → ${status}`);
};
const prSalvarContato=(p,c)=>{
  const lista=p.contatos||[];
  let n;
  if(c.id&&lista.some(x=>x.id===c.id)){
    n={...p,contatos:lista.map(x=>x.id===c.id?c:x)};
  } else {
    const registro={...c,id:uid()};
    n=prEv({...p,contatos:[...lista,registro]},"contato",`${registro.tipo} por ${registro.canal}${registro.resposta?" — "+String(registro.resposta).slice(0,60):""}`,registro.data);
  }
  if(c.proxData)n={...n,proximoContato:{data:c.proxData,motivo:c.proxMotivo||"",obs:c.proxObs||""}};
  return n;
};
const prExcluirContato=(p,id)=>({...p,contatos:(p.contatos||[]).filter(x=>x.id!==id)});
const prLimparProximo=(p)=>({...p,proximoContato:null});
const prFollowEf=(p,hoje)=>{
  if(!p.proximoContato||!p.proximoContato.data)return null;
  if(PR_ENCERRADOS.includes(p.status))return null;
  return p.proximoContato.data<hoje?"atrasado":p.proximoContato.data===hoje?"hoje":"futuro";
};
const PR_ORDEM={"Novo":0,"Contato realizado":1,"Aguardando retorno":1,"Conversa iniciada":2,"Reunião agendada":3,"Diagnóstico":4,"Proposta enviada":5,"Negociação":5,"Cliente":6};
const PR_FUNIL_DEF=[["Prospect",0],["Primeiro contato",1],["Conversa",2],["Reunião",3],["Diagnóstico",4],["Proposta",5],["Cliente",6]];
const prMaiorEtapa=(p)=>{
  // todo prospect conta ao menos como "Prospect" (0); "Sem interesse"/"Perdido" não zeram o que já foi alcançado antes
  let max=PR_ORDEM[p.status]!==undefined?PR_ORDEM[p.status]:0;
  (p.eventos||[]).forEach(e=>{
    if(e.tipo==="status"){
      const m=/→ (.+)$/.exec(e.texto);
      if(m&&PR_ORDEM[m[1]]!==undefined)max=Math.max(max,PR_ORDEM[m[1]]);
    }
  });
  return max;
};
const prPainel=(prospects)=>{
  const total=prospects.length;
  const novos=prospects.filter(p=>p.status==="Novo").length;
  const contatosRealizados=prospects.reduce((s,p)=>s+(p.contatos||[]).length,0);
  const aguardando=prospects.filter(p=>p.status==="Aguardando retorno").length;
  const conversas=prospects.filter(p=>p.status==="Conversa iniciada").length;
  const reunioes=prospects.filter(p=>p.status==="Reunião agendada").length;
  const diagnosticos=prospects.filter(p=>prMaiorEtapa(p)>=4).length;
  const propostas=prospects.filter(p=>prMaiorEtapa(p)>=5).length;
  const clientes=prospects.filter(p=>p.status==="Cliente").length;
  const perdidas=prospects.filter(p=>p.status==="Sem interesse"||p.status==="Perdido").length;
  const taxaConv=total>0?Math.round(clientes/total*100):0;
  const funil=PR_FUNIL_DEF.map(([label,ord])=>({label,count:prospects.filter(p=>prMaiorEtapa(p)>=ord).length}));
  return {total,novos,contatosRealizados,aguardando,conversas,reunioes,diagnosticos,propostas,clientes,perdidas,taxaConv,funil};
};

const isHoje=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().split("T")[0];};
const IS_CAMPOS=["clientId","clienteNome","empresa","sistema","responsavel","desenvolvedor","dataInicio","dataPrevista","horasContratadas","status","obs"];
const isForm=(p)=>{
  const base={clientId:"",clienteNome:"",empresa:"",sistema:"",responsavel:"Simara Lobui",desenvolvedor:"",dataInicio:isHoje(),dataPrevista:"",horasContratadas:"",status:"Em implantação",obs:""};
  if(!p)return base;
  const o={id:p.id};IS_CAMPOS.forEach(k=>{o[k]=p[k]===undefined||p[k]===null?base[k]:p[k];});return o;
};

// ── regras (funções puras) ──
const isEv=(p,tipo,texto,data)=>({...p,eventos:[...(p.eventos||[]),{id:uid(),data:data||isHoje(),tipo,texto}]});
const isNovo=(f)=>{
  const p={id:uid(),levantamentoDev:isPerguntasDevIniciais(),modulos:[],diagnostico:{},mapaOperacao:[],checklist:[],eventos:[],horasUtilizadas:0,criadoEm:isHoje()};
  IS_CAMPOS.forEach(k=>{p[k]=f[k]===undefined||f[k]===null?"":f[k];});
  p.horasContratadas=Number(f.horasContratadas)||0;
  if(!p.status)p.status="Em implantação";
  if(!String(p.sistema||"").trim())p.sistema="Sistema";
  return isEv(p,"projeto",`Implantação iniciada: ${p.sistema} — ${p.clienteNome}`);
};
const isEditar=(p,f)=>{
  const n={...p};IS_CAMPOS.forEach(k=>{if(f[k]!==undefined)n[k]=f[k];});
  n.horasContratadas=Number(f.horasContratadas)||0;
  return p.status!==n.status?isEv(n,"status",`Status: ${p.status} → ${n.status}`):n;
};

const isExcluirPerguntaDev=(p,id)=>({...p,levantamentoDev:(p.levantamentoDev||[]).filter(x=>x.id!==id)});
const isToggleModulo=(p,m)=>{
  const sel=new Set(p.modulos||[]);

  return {...p,modulos:IS_MODULOS.filter(x=>sel.has(x))};
};
const isTodosModulos=(p)=>({...p,modulos:[...IS_MODULOS]});

// ── mapa da operação ──
const isSalvarProcesso=(p,f)=>{
  const lista=p.mapaOperacao||[];
  if(f.id&&lista.some(x=>x.id===f.id))return {...p,mapaOperacao:lista.map(x=>x.id===f.id?{...x,...f}:x)};

  const l=p.mapaOperacao||[];
  const prontos=l.filter(x=>x.situacao==="🟢 No sistema").length;
  return {total:l.length,prontos,pct:l.length?Math.round(prontos/l.length*100):0};

const isExcluirPendencia=(p,id)=>({...p,pendencias:(p.pendencias||[]).filter(x=>x.id!==id)});
const isStatusPendencia=(p,id,status)=>{
  const lista=p.pendencias||[];const alvo=lista.find(x=>x.id===id);if(!alvo)return p;
  let n={...p,pendencias:lista.map(x=>x.id===id?{...x,status}:x)};
  if(status==="Concluída"&&alvo.status!=="Concluída")n=isEv(n,"pendencia",`Pendência resolvida: ${alvo.item}`);
  return n;
};
const isPendenciasResumo=(p)=>{
  const l=p.pendencias||[];
  return {total:l.length,abertas:l.filter(x=>x.status!=="Concluída").length,resolvidas:l.filter(x=>x.status==="Concluída").length};
};

const IS_TRILHA=[
  ["FASE 1 — Conhecer o Sistema",["Visão geral do sistema","Menus, abas e módulos","Para que serve cada módulo","Quem utiliza / em qual momento","Relação entre os módulos"]],
  ["FASE 2 — Construir a Base",["Cadastros e participantes","Produtos/serviços","Usuários e informações necessárias","Plano de contas (centro de custo)","Contas bancárias","Condições de pagamento"]],
  ["FASE 3 — Comercial",["Orçamento","Aprovação","Contrato","Condições comerciais","Transformação da venda em operação"]],
  ["FASE 4 — Operacional",["Programação","Ordem de serviço","Rota/agenda","Execução","Baixa/conclusão"]],
  ["FASE 5 — Faturamento",["Conferência do serviço","Análise para faturamento","Emissão de nota/fatura","Envio ao cliente","Integração com o financeiro"]],
  ["FASE 6 — Financeiro",["Contas a receber","Contas a pagar","Baixas","Conferências","Relatórios/indicadores"]],
  ["FASE 7 — Integração e Continuidade",["Fazer um processo completo dentro do sistema","Identificar erros","Corrigir","Conferir os resultados","Executar o processo sem depender do instrutor"]]
];
const IS_TRILHA_TOTAL=IS_TRILHA.reduce((s,[,itens])=>s+itens.length,0);
const isToggleTrilha=(p,item)=>{
  const marcados=new Set(p.trilha||[]);
  marcados.has(item)?marcados.delete(item):marcados.add(item);
  return {...p,trilha:[...marcados]};
};
const isTrilhaFase=(p,itens)=>{
  const marcados=new Set(p.trilha||[]);
  const feitos=itens.filter(i=>marcados.has(i)).length;
  return {total:itens.length,feitos,pct:itens.length?Math.round(feitos/itens.length*100):0};
};
const isTrilhaGeral=(p)=>{
  const marcados=new Set(p.trilha||[]);
  const feitos=IS_TRILHA.reduce((s,[,itens])=>s+itens.filter(i=>marcados.has(i)).length,0);
  return {total:IS_TRILHA_TOTAL,feitos,pct:IS_TRILHA_TOTAL?Math.round(feitos/IS_TRILHA_TOTAL*100):0};
};

const isEtapas=(p)=>[
  {k:"lev",l:"Levantamento c/ desenvolvedor",ok:isLevantamentoPct(p)>=100},
  {k:"diag",l:"Diagnóstico",ok:!!(p.diagnostico||{}).concluido},
  {k:"mapa",l:"Mapa da operação",ok:(p.mapaOperacao||[]).length>0},
  {k:"check",l:"Pré-implantação",ok:isChecklistResultado(p)==="🟢 Pronto para treinar"},
  {k:"cronograma",l:"Linha do tempo",ok:(p.cronograma||[]).length>0},
  {k:"treino",l:"Plano de treinamento",ok:(p.planoTreinamento||[]).length>0},
  {k:"sessoes",l:"Execução",ok:(p.sessoes||[]).length>0}
];

const IsChip=({t,sm})=>{const c=IS_COR[t]||["#EEE","#555"];return <span style={{background:c[0],color:c[1],borderRadius:20,padding:sm?"2px 8px":"3px 11px",fontSize:sm?10:11,fontWeight:700,whiteSpace:"nowrap"}}>{t}</span>;};

const ImplantacaoSistema=({implantacoes=[],setImplantacoes,clients=[],setClients})=>{
  const cor=CORES_CONSUL;
  const [selId,setSelId]=useState(null);
  const [tab,setTab]=useState("resumo");
  const [filtro,setFiltro]=useState("ativas");
  const [modal,setModal]=useState(null);
  const [form,setForm]=useState(null);
  const [novoCli,setNovoCli]=useState(null);

  const sel=implantacoes.find(p=>p.id===selId)||null;

  const upd=(fn)=>setImplantacoes&&setImplantacoes(prev=>prev.map(p=>p.id===selId?fn(p):p));
  const F=(k,v)=>setForm(f=>({...f,[k]:v}));

  // ── projeto: criar / editar / excluir ──
  const cadastrarCliente=()=>{
    const nome=String((novoCli&&novoCli.name)||"").trim();
    if(!nome){alert("Informe o nome do cliente.");return;}
    if(clients.some(c=>String(c.name||"").trim().toLowerCase()===nome.toLowerCase())&&!window.confirm(`Já existe um cliente chamado "${nome}". Cadastrar outro mesmo assim? (Se for o mesmo, escolha-o na lista.)`))return;
    const c={name:nome,phone:String(novoCli.phone||"").trim(),email:"",city:"",vip:false,origem:"Implantação",nascimento:"",tipo:"cliente",cpfCnpj:"",empresa:String(novoCli.empresa||"").trim(),id:uid(),orders:0,total:0,joined:isHoje()};
    setClients(prev=>[...prev,c].sort((a,b)=>String(a.name||"").localeCompare(String(b.name||""),"pt")));
    setForm(f=>({...f,clientId:c.id,clienteNome:c.name,empresa:c.empresa||f.empresa}));
    setNovoCli(null);showSavedGlobal("Cliente cadastrado!");
  };
  const salvarProjeto=()=>{
    if(!form.clientId){alert("Escolha o cliente desta implantação.");return;}
    if(form.id){
      setImplantacoes(prev=>prev.map(p=>p.id===form.id?isEditar(p,form):p));
    } else {
      const novo=isNovo(form);
      setImplantacoes(prev=>[...prev,novo]);
      setSelId(novo.id);setTab("resumo");
    }
    setModal(null);showSavedGlobal("Implantação salva!");
  };
  const excluirProjeto=()=>{
    if(!sel)return;
    if(!window.confirm(`Excluir a implantação de "${sel.sistema}" em ${sel.clienteNome}? Todo o levantamento, diagnóstico, mapa e checklist serão apagados.\n\nEssa ação não pode ser desfeita.`))return;
    setImplantacoes(prev=>prev.filter(p=>p.id!==sel.id));
    setSelId(null);
  };

  // ── diagnóstico ──
  const [dg,setDg]=useState({});
  const [dgSujo,setDgSujo]=useState(false);
  useEffect(()=>{
    const d=(sel&&sel.diagnostico)||{};
    const t={};IS_DIAG_CAMPOS.forEach(([k])=>{t[k]=d[k]||"";});
    setDg(t);setDgSujo(false);
  },[selId]);
  const salvarDiag=()=>{upd(p=>isSalvarDiag(p,dg));setDgSujo(false);showSavedGlobal("Diagnóstico salvo!");};
  const concluirDiag=()=>{upd(isConcluirDiag);setDgSujo(false);showSavedGlobal("Diagnóstico concluído!");};

  // ── mapa da operação ──
  const novoProcesso=()=>{setForm({processo:"",quemExecuta:"",comoFazHoje:"",comoFaraSistema:"",situacao:IS_SITUACAO_PROC[0]});setModal("processo");};
  const salvarProcesso=()=>{
    if(!String(form.processo||"").trim()){alert("Informe o processo.");return;}
    upd(p=>isSalvarProcesso(p,form));setModal(null);showSavedGlobal("Processo mapeado!");
  };

  // ── linha do tempo ──
  const novaAtividade=()=>{setForm({atividade:"",responsavel:"",dependencia:"",previsto:"",status:"Pendente"});setModal("atividade");};
  const salvarAtividade=()=>{
    if(!String(form.atividade||"").trim()){alert("Informe a atividade.");return;}
    upd(p=>isSalvarAtividade(p,form));setModal(null);showSavedGlobal("Atividade salva!");
  };

  // ── plano de treinamento ──
  const novoTreino=()=>{setForm({usuario:"",conteudo:"",horasPrevistas:"",status:"Pendente"});setModal("treino");};
  const salvarTreino=()=>{
    if(!String(form.conteudo||"").trim()){alert("Informe o conteúdo do treinamento.");return;}
    upd(p=>isSalvarTreino(p,form));setModal(null);showSavedGlobal("Treinamento planejado!");
  };

  // ── execução (sessões) ──
  const novaSessao=()=>{setForm({data:isHoje(),participantes:"",objetivo:"",conteudoPrevisto:"",resultado:"Concluído",categoria:IS_CATEGORIA_HORA[0],horasPrevistas:"",horasUtilizadas:"",motivoDiferenca:""});setModal("sessao");};
  const salvarSessao=()=>{
    if(!form.data){alert("Informe a data da sessão.");return;}
    if(!String(form.objetivo||"").trim()){alert("Informe o objetivo da sessão.");return;}
    upd(p=>isSalvarSessao(p,form));setModal(null);showSavedGlobal("Sessão registrada!");
  };

  // ── pendências ──
  const novaPendencia=()=>{setForm({item:"",responsavel:IS_RESP_PEND[0],origem:IS_MOTIVO_DIF[0],prazo:"",status:"Pendente"});setModal("pendencia");};
  const salvarPendencia=()=>{
    if(!String(form.item||"").trim()){alert("Descreva a pendência.");return;}
    upd(p=>isSalvarPendencia(p,form));setModal(null);showSavedGlobal("Pendência registrada!");
  };

  const btnPill=(ativo,onClick,label)=>(
    <button key={label} onClick={onClick} style={{padding:"7px 14px",borderRadius:20,border:`1.5px solid ${ativo?cor.primaria:C.areia}`,background:ativo?cor.primaria:"#fff",color:ativo?"#fff":C.oliva,fontSize:12,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap",fontFamily:"inherit"}}>{label}</button>
  );
  const campo=(rot,val)=>val?<div style={{fontSize:12,color:C.oliva,marginTop:3}}><b style={{color:C.cafe}}>{rot}:</b> {val}</div>:null;

  const modais=(<>
    {modal==="projeto"&&form&&<Modal wide title={form.id?"✎ Editar implantação":"🖥️ Nova implantação"} onClose={()=>setModal(null)}>

        <div style={{gridColumn:"1 / -1"}}>
          <Sel label="Cliente" value={form.clientId} onChange={v=>{const c=clients.find(x=>x.id===v);setForm(f=>({...f,clientId:v,clienteNome:c?c.name:"",empresa:(c&&c.empresa)||f.empresa}));}}

        </div>
        {!form.id&&setClients&&<div style={{gridColumn:"1 / -1"}}>

            ?<button onClick={()=>setNovoCli({name:"",phone:"",empresa:""})} style={{background:"none",border:"none",color:C.cafe,fontWeight:700,fontSize:12,cursor:"pointer",padding:0,textDecoration:"underline",fontFamily:"inherit"}}>+ Cliente ainda não cadastrado? Cadastrar agora</button>
            :<div style={{background:C.linho,borderRadius:8,padding:12}}>
              <div style={{fontSize:11,fontWeight:700,letterSpacing:1,color:C.oliva,textTransform:"uppercase",marginBottom:8}}>Cadastro rápido de cliente</div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:10}}>
                <Inp label="Nome" value={novoCli.name} onChange={v=>setNovoCli(n=>({...n,name:v}))}/>
                <Inp label="WhatsApp" value={novoCli.phone} onChange={v=>setNovoCli(n=>({...n,phone:v}))}/>
                <Inp label="Empresa" value={novoCli.empresa} onChange={v=>setNovoCli(n=>({...n,empresa:v}))}/>
              </div>
              <div style={{display:"flex",gap:8,marginTop:10,justifyContent:"flex-end"}}>
                <Btn sm v="ghost" onClick={()=>setNovoCli(null)}>Cancelar</Btn>
                <Btn sm onClick={cadastrarCliente}>Cadastrar e selecionar</Btn>
              </div>
            </div>}
        </div>}
        <Inp label="Empresa" value={form.empresa} onChange={v=>F("empresa",v)}/>
        <Inp label="Sistema" value={form.sistema} onChange={v=>F("sistema",v)} placeholder="Nome do sistema a implantar"/>
        <Inp label="Responsável pela implantação" value={form.responsavel} onChange={v=>F("responsavel",v)}/>
        <Inp label="Desenvolvedor" value={form.desenvolvedor} onChange={v=>F("desenvolvedor",v)}/>
        <Inp label="Data de início" type="date" value={form.dataInicio} onChange={v=>F("dataInicio",v)}/>
        <Inp label="Previsão de conclusão" type="date" value={form.dataPrevista} onChange={v=>F("dataPrevista",v)}/>
        <Inp label="Horas contratadas/estimadas" type="number" value={form.horasContratadas} onChange={v=>F("horasContratadas",v)}/>
        <Sel label="Status" value={form.status} onChange={v=>F("status",v)} options={IS_STATUS}/>
        <div style={{gridColumn:"1 / -1"}}><Inp label="Observações" rows={2} value={form.obs} onChange={v=>F("obs",v)}/></div>
      </div>
      <div style={{display:"flex",gap:8,marginTop:16,justifyContent:"flex-end",flexWrap:"wrap"}}>
        <Btn v="ghost" onClick={()=>setModal(null)}>Cancelar</Btn>
        <Btn onClick={salvarProjeto}>💾 Salvar implantação</Btn>
      </div>
    </Modal>}

    {modal==="atividade"&&form&&<Modal wide title={form.id?"✎ Editar atividade":"🗓 Nova atividade"} onClose={()=>setModal(null)}>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:12}}>
        <div style={{gridColumn:"1 / -1"}}><Inp label="Atividade" value={form.atividade} onChange={v=>F("atividade",v)} placeholder="Ex: Treinamento Comercial"/></div>
        <Inp label="Responsável" value={form.responsavel} onChange={v=>F("responsavel",v)}/>
        <Inp label="Dependência" value={form.dependencia} onChange={v=>F("dependencia",v)} placeholder="Ex: depende do Diagnóstico"/>
        <Inp label="Horas previstas" type="number" value={form.previsto} onChange={v=>F("previsto",v)}/>
        <Sel label="Status" value={form.status} onChange={v=>F("status",v)} options={IS_STATUS_ITEM}/>
      </div>
      <div style={{display:"flex",gap:8,marginTop:16,justifyContent:"flex-end",flexWrap:"wrap"}}>
        <Btn v="ghost" onClick={()=>setModal(null)}>Cancelar</Btn>
        <Btn onClick={salvarAtividade}>💾 Salvar atividade</Btn>
      </div>
    </Modal>}

    {modal==="treino"&&form&&<Modal wide title={form.id?"✎ Editar treinamento":"🎓 Novo treinamento"} onClose={()=>setModal(null)}>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:12}}>
        <Inp label="Usuário / área" value={form.usuario} onChange={v=>F("usuario",v)} placeholder="Ex: Administrativo"/>
        <Inp label="Horas previstas" type="number" value={form.horasPrevistas} onChange={v=>F("horasPrevistas",v)}/>
        <div style={{gridColumn:"1 / -1"}}><Inp label="Conteúdo (processo, não tela)" value={form.conteudo} onChange={v=>F("conteudo",v)} placeholder="Ex: Cadastros"/></div>
        <Sel label="Status" value={form.status} onChange={v=>F("status",v)} options={IS_STATUS_ITEM}/>
      </div>
      <div style={{display:"flex",gap:8,marginTop:16,justifyContent:"flex-end",flexWrap:"wrap"}}>
        <Btn v="ghost" onClick={()=>setModal(null)}>Cancelar</Btn>
        <Btn onClick={salvarTreino}>💾 Salvar treinamento</Btn>
      </div>
    </Modal>}

    {modal==="sessao"&&form&&<Modal wide title={form.id?"✎ Editar sessão":"🎬 Registrar sessão de treinamento"} onClose={()=>setModal(null)}>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:12}}>
        <Inp label="Data" type="date" value={form.data} onChange={v=>F("data",v)}/>
        <Inp label="Participantes" value={form.participantes} onChange={v=>F("participantes",v)}/>
        <div style={{gridColumn:"1 / -1"}}><Inp label="Objetivo da sessão" value={form.objetivo} onChange={v=>F("objetivo",v)}/></div>
        <div style={{gridColumn:"1 / -1"}}><Inp label="Conteúdo previsto" rows={2} value={form.conteudoPrevisto} onChange={v=>F("conteudoPrevisto",v)}/></div>
        <Sel label="Resultado" value={form.resultado} onChange={v=>F("resultado",v)} options={IS_RESULTADO_SESSAO}/>
        <Sel label="Categoria da hora" value={form.categoria} onChange={v=>F("categoria",v)} options={IS_CATEGORIA_HORA}/>
        <Inp label="Horas previstas" type="number" value={form.horasPrevistas} onChange={v=>F("horasPrevistas",v)}/>
        <Inp label="Horas utilizadas" type="number" value={form.horasUtilizadas} onChange={v=>F("horasUtilizadas",v)}/>
        <Sel label="Motivo da diferença (se houve)" value={form.motivoDiferenca} onChange={v=>F("motivoDiferenca",v)} options={[{v:"",l:"—"},...IS_MOTIVO_DIF.map(m=>({v:m,l:m}))]}/>
      </div>
      <div style={{display:"flex",gap:8,marginTop:16,justifyContent:"flex-end",flexWrap:"wrap"}}>
        <Btn v="ghost" onClick={()=>setModal(null)}>Cancelar</Btn>
        <Btn onClick={salvarSessao}>💾 Salvar sessão</Btn>
      </div>
    </Modal>}

    {modal==="pendencia"&&form&&<Modal wide title={form.id?"✎ Editar pendência":"🧩 Nova pendência"} onClose={()=>setModal(null)}>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:12}}>
        <div style={{gridColumn:"1 / -1"}}><Inp label="Pendência" value={form.item} onChange={v=>F("item",v)}/></div>
        <Sel label="Responsável" value={form.responsavel} onChange={v=>F("responsavel",v)} options={IS_RESP_PEND}/>
        <Sel label="Origem" value={form.origem} onChange={v=>F("origem",v)} options={IS_MOTIVO_DIF}/>
        <Inp label="Prazo" type="date" value={form.prazo} onChange={v=>F("prazo",v)}/>
        <Sel label="Status" value={form.status} onChange={v=>F("status",v)} options={IS_STATUS_ITEM}/>
      </div>
      <div style={{display:"flex",gap:8,marginTop:16,justifyContent:"flex-end",flexWrap:"wrap"}}>
        <Btn v="ghost" onClick={()=>setModal(null)}>Cancelar</Btn>
        <Btn onClick={salvarPendencia}>💾 Salvar pendência</Btn>
      </div>
    </Modal>}

    {modal==="processo"&&form&&<Modal wide title={form.id?"✎ Editar processo":"🧩 Mapear processo"} onClose={()=>setModal(null)}>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:12}}>
        <div style={{gridColumn:"1 / -1"}}><Inp label="Processo" value={form.processo} onChange={v=>F("processo",v)} placeholder="Ex: Cadastro de clientes"/></div>
        <Inp label="Quem executa" value={form.quemExecuta} onChange={v=>F("quemExecuta",v)}/>
        <Sel label="Situação" value={form.situacao} onChange={v=>F("situacao",v)} options={IS_SITUACAO_PROC}/>
        <div style={{gridColumn:"1 / -1"}}><Inp label="Como faz hoje" rows={2} value={form.comoFazHoje} onChange={v=>F("comoFazHoje",v)}/></div>
        <div style={{gridColumn:"1 / -1"}}><Inp label="Como fará no sistema" rows={2} value={form.comoFaraSistema} onChange={v=>F("comoFaraSistema",v)}/></div>
      </div>
      <div style={{display:"flex",gap:8,marginTop:16,justifyContent:"flex-end",flexWrap:"wrap"}}>
        <Btn v="ghost" onClick={()=>setModal(null)}>Cancelar</Btn>
        <Btn onClick={salvarProcesso}>💾 Salvar processo</Btn>
      </div>
    </Modal>}
  </>);

  // ═════════ LISTA DE IMPLANTAÇÕES ═════════
  if(!sel){
    const lista=implantacoes.filter(p=>filtro==="todas"?true:filtro==="concluidas"?IS_ENCERRADOS.includes(p.status):!IS_ENCERRADOS.includes(p.status));
    return(
      <div className="fade" style={{padding:14}}>
        <div style={{background:`linear-gradient(135deg,${cor.primaria},#3D5247)`,borderRadius:8,padding:"14px 18px",marginBottom:12,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
          <div>
            <div style={{fontSize:8,color:cor.secundaria,letterSpacing:"3px",textTransform:"uppercase",fontWeight:700}}>Procedimento Padrão</div>
            <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:15,color:"#FDFAFF",fontStyle:"italic"}}>Implantação e Treinamento</div>
          </div>
          <Btn onClick={()=>{setForm(isForm());setModal("projeto");}}>+ Nova implantação</Btn>
        </div>
        <div style={{display:"flex",gap:6,marginBottom:12,overflowX:"auto"}}>
          {btnPill(filtro==="ativas",()=>setFiltro("ativas"),"Em andamento")}
          {btnPill(filtro==="concluidas",()=>setFiltro("concluidas"),"Encerradas")}
          {btnPill(filtro==="todas",()=>setFiltro("todas"),"Todas")}
        </div>
        {lista.length===0&&<div style={{background:C.linho,borderRadius:8,padding:"28px 18px",textAlign:"center",color:C.oliva,fontSize:13,lineHeight:1.6}}>
          <div style={{fontSize:30,marginBottom:6}}>🖥️</div>
          {implantacoes.length===0
            ?<>Nenhuma implantação ainda.<br/>Cadastre a primeira empresa que você vai treinar no sistema.</>
            :<>Nenhuma implantação neste filtro.</>}
        </div>}
        {lista.map(p=>{
          const et=isEtapas(p);
          const feitas=et.filter(e=>e.ok).length;
          return(
            <div key={p.id} onClick={()=>{setSelId(p.id);setTab("resumo");}} style={{background:C.branco,border:`1px solid ${C.areia}`,borderRadius:8,padding:14,marginBottom:10,cursor:"pointer"}}>
              <div style={{display:"flex",justifyContent:"space-between",gap:8,flexWrap:"wrap"}}>
                <div style={{minWidth:180}}>
                  <div style={{fontWeight:700,color:C.cafe,fontSize:15}}>{p.sistema}</div>
                  <div style={{fontSize:12,color:C.oliva}}>{p.clienteNome}{p.empresa?` · ${p.empresa}`:""}</div>
                </div>
                <IsChip t={p.status}/>
              </div>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:C.oliva,margin:"10px 0 4px",flexWrap:"wrap",gap:6}}>
                <span>{feitas} de {et.length} etapas iniciais concluídas</span>
                <span>{fmtDate(p.dataInicio)} → {p.dataPrevista?fmtDate(p.dataPrevista):"em aberto"}{Number(p.horasContratadas)>0?` · ${p.horasContratadas}h previstas`:""}</span>

              <PcBarra pct={Math.round(feitas/et.length*100)}/>
            </div>
          );
        })}
        {modais}

const pcCicloData=(anoMes,dia)=>{
  const [ano,mes]=anoMes.split("-").map(Number);
  const ultimo=new Date(ano,mes,0).getDate();
  const d=Math.min(Math.max(1,Number(dia)||1),ultimo);
  return `${anoMes}-${String(d).padStart(2,"0")}`;
};
const pcProxAnoMes=(anoMes)=>{const [a,m]=anoMes.split("-").map(Number);const d=new Date(a,m,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;};

const ConsultoriaPedidos=({consultoria,setConsultoria,finance,setFinance,compromissos,setCompromissos,clients,config})=>{
  const [tab,setTab]=useState("pedidos");

  const [selAtends,setSelAtends]=useState([]);
  // Pedido "Fixo mensal": garante sozinho o lembrete na Agenda (mês atual e o próximo), sem duplicar e sem apagar o que a pessoa já editou.
  const fixosKey=consultoria.filter(c=>c.tipo==="Fixo mensal"&&c.status!=="Cancelado").map(c=>`${c.id}:${c.diaEmissao||22}:${c.clienteNome}`).join("|");
  useEffect(()=>{
    if(!setCompromissos)return;
    const fixos=consultoria.filter(c=>c.tipo==="Fixo mensal"&&c.status!=="Cancelado");
    if(fixos.length===0)return;

    setCompromissos(prev=>{
      const ids=new Set(prev.map(c=>c.id));

        [mesAtual,mesProx].forEach(am=>{

            novos.push({id:cid,desc:`Mensalidade — ${ped.clienteNome} (todo dia ${ped.diaEmissao||22})`,data:pcCicloData(am,ped.diaEmissao),hora:"09:00",prioridade:"Alta",status:"Pendente",tipo:"Consultoria",pedidoId:ped.id});
          }
        });
      });
      return novos.length>0?[...prev,...novos]:prev;
    });
  },[fixosKey]);
  const [atHora,setAtHora]=useState("");
  useEffect(()=>{if(modal!=="atend")setAtHora("");},[modal]);
  const [medHora,setMedHora]=useState("");
  const [medSalvaHora,setMedSalvaHora]=useState(true);
  const [compForm,setCompForm]=useState(null);
  const salvarComp=()=>{

    setCompromissos(prev=>[...prev,{id:uid(),desc:compForm.desc,data:compForm.data,hora:compForm.hora||"09:00",prioridade:compForm.prioridade||"Alta",status:"Pendente",tipo:"Consultoria",pedidoId:sel.id}]);
    setModal(null);showSavedGlobal("Adicionado à Agenda!");
  };
  const [wppView,setWppView]=useState("menu");
  const [wppFmt,setWppFmt]=useState("pdf");
  const [wppBusy,setWppBusy]=useState(false);
  const [wppDoc,setWppDoc]=useState(null);
  const [wppMes,setWppMes]=useState(today.slice(0,7));
  const [wppDia,setWppDia]=useState(22);

  const CC=CORES_CONSUL;
  const numPedido=(id)=>{const idx=consultoria.findIndex(c=>c.id===id);return String((idx>=0?idx:0)+1).padStart(3,"0");};

  const EFP={clientId:"",clienteNome:"",clienteCpfCnpj:"",empresaTerceira:"",servico:"Área Fiscal e Administrativa",tipo:"Esporádico",tipoCobranca:"Por hora",status:"Em andamento",valor:0,valorHora:0,horasContratadas:0,diaEmissao:22,dataInicio:today,dataFim:"",dataVencimento:"",formaPag:"PIX",obs:"",orcamento:false,lancarFinanceiro:false};
  const [form,setForm]=useState(EFP);
  const EFA={id:null,data:today,horaInicio:"",horaFim:"",duracao:0,assunto:"",tipo:"Consultoria",obs:"",valor:0,proximosPassos:"",proximaData:"",proximaHora:"09:00",lancarFinanceiro:false,dataVencFin:"",formaPagFin:"PIX"};
  const [atendForm,setAtendForm]=useState(EFA);
  const [medForm,setMedForm]=useState({obs:"",dataVencimento:"",formaPag:"PIX"});

  const sel=consultoria.find(c=>c.id===selId);

  const calcDuracao=(ini,fim)=>{if(!ini||!fim)return 0;const[hI,mI]=ini.split(":").map(Number);const[hF,mF]=fim.split(":").map(Number);return Math.max(0,Math.round(((hF*60+mF)-(hI*60+mI))/60*1e6)/1e6);};
  // duração exata do atendimento: recalcula pelos horários quando existem (corrige gravações antigas arredondadas)
  const durEx=(a)=>calcDuracao(a.horaInicio,a.horaFim)||Number(a.duracao||0);
  const fmtHoras=(h)=>{if(!h||h===0)return "0h";const hrs=Math.floor(h);const mins=Math.round((h-hrs)*60);return mins>0?`${hrs}h${String(mins).padStart(2,"0")}`:`${hrs}h`;};
  const num=(v)=>{const n=Number(String(v==null?"":v).replace(",","."));return isNaN(n)?0:n;};
  const taxaHora=(p)=>{if(!p)return 0;const vh=num(p.valorHora);if(vh<=0)return 0;return(p.tipoCobranca==="Por hora"||["Por medição","Pacote de horas"].includes(p.tipo))?vh:0;};
  const calcValorAtend=(dur,p)=>Math.round(taxaHora(p)*Number(dur||0)*100)/100;
  // valor efetivo: usa o valor gravado; se estiver zerado, calcula pelas horas x valor/hora do pedido
  // valor de um atendimento numa taxa informada (usa o valor gravado; se zerado, horas x taxa)
  // valor digitado à mão (0 = automático). Valores antigos que só diferem do cálculo exato por arredondamento contam como automáticos.
  const vManual=(a,rate)=>{const v=Number(a.valor||0);if(v<=0)return 0;const r=Number(rate||0);const auto=Math.round(r*durEx(a)*100)/100;return(auto>0&&Math.abs(v-auto)<=r*0.006+0.01)?0:v;};
  const vRate=(a,rate)=>{const m=vManual(a,rate);return m>0?m:Math.round(Number(rate||0)*durEx(a)*100)/100;};
  const taxaMed=()=>num(medHora)>0?num(medHora):taxaHora(sel);
  const vEf=(a,p)=>vRate(a,taxaHora(p));
  const totalHoras=(p)=>(p.atendimentos||[]).reduce((s,a)=>s+durEx(a),0);
  const horasRestantes=(p)=>Math.max(0,Number(p.horasContratadas||0)-totalHoras(p));
  const atendAbertos=(p)=>(p.atendimentos||[]).filter(a=>!a.medicaoId);
  const totalValorAtend=(p)=>(p.atendimentos||[]).reduce((s,a)=>s+vEf(a,p),0);

  // Financeiro consultoria
  const mesFmt2=today.slice(0,7);
  const fatMes=finance.filter(f=>f.tipoReceita==="Consultoria"&&f.date?.startsWith(mesFmt2)&&f.pago).reduce((s,f)=>s+f.value,0);
  const aMedir=consultoria.reduce((s,c)=>s+atendAbertos(c).reduce((ss,a)=>ss+vEf(a,c),0),0);
  const aReceberConsul=finance.filter(f=>f.tipoReceita==="Consultoria"&&!f.pago&&f.dataVencimento>=today).reduce((s,f)=>s+f.value,0);
  const vencidoConsul=finance.filter(f=>f.tipoReceita==="Consultoria"&&!f.pago&&f.dataVencimento<today).reduce((s,f)=>s+f.value,0);
  const proxComp=compromissos.filter(c=>c.tipo==="Consultoria"&&c.data>=today&&c.status!=="Concluído").sort((a,b)=>a.data.localeCompare(b.data)).slice(0,5);

  const configConsul=config?.consultoria||{telefone:"",email:"",pixChave:"357.252.138.62",pixNome:"Simara Ap. de Souza Lobui"};

  const filtered=consultoria.filter(c=>{
    const matchBusca=!busca||(c.clienteNome+c.servico).toLowerCase().includes(busca.toLowerCase());
    const matchStatus=filtStatus==="Todos"||c.status===filtStatus;
    return matchBusca&&matchStatus;
  });

  const savePedido=()=>{
    if(!form.clienteNome)return;
    const isNew=!form.id;
    const elegivel=["Esporádico","Projeto"].includes(form.tipo)&&Number(form.valor)>0&&!form.orcamento;
    const quer=isNew&&elegivel&&form.lancarFinanceiro===true;
    const finId=quer?uid():null;
    const novo={...form,id:form.id||uid(),atendimentos:[],medicoes:[],lancarFinanceiro:false,...(isNew&&elegivel?{lancado:quer,financeiroId:finId}:{})};
    if(isNew){
      setConsultoria(prev=>[...prev,novo]);
      // Só vai para o financeiro se você marcar "Lançar no financeiro agora"
      if(quer){
        setFinance(prev=>[...prev,{id:finId,type:"receita",tipoReceita:"Consultoria",desc:`Consultoria — ${novo.clienteNome} — ${novo.servico}`,value:Number(novo.valor),date:today,dataVencimento:novo.dataVencimento||today,pago:false,category:"Consultoria",clientName:novo.clienteNome}]);
      }
    } else {
      setConsultoria(prev=>prev.map(x=>x.id===novo.id?{...x,...novo,atendimentos:x.atendimentos,medicoes:x.medicoes}:x));
    }
    setModal(null);showSavedGlobal(novo.orcamento?"Orçamento salvo!":(quer?"Pedido salvo e lançado no financeiro!":"Pedido salvo!"));
  };

  const aprovarOrcamento=(p)=>{
    setConsultoria(prev=>prev.map(x=>x.id===p.id?{...x,orcamento:false,status:"Em andamento"}:x));
    showSavedGlobal("Orçamento aprovado — virou pedido!");
  };

  const saveAtend=()=>{
    if(!sel||!atendForm.assunto)return;
    const dur=calcDuracao(atendForm.horaInicio,atendForm.horaFim)||Number(atendForm.duracao)||0;
    const rateAt=taxaHora(sel)>0?taxaHora(sel):num(atHora);
    const valAuto=Math.round(rateAt*dur*100)/100;
    const extraPed=(taxaHora(sel)<=0&&num(atHora)>0)?{valorHora:num(atHora)}:{};
    const valFinal=Number(atendForm.valor)>0?Number(atendForm.valor):valAuto;
    const jaLanc=!!atendForm.financeiroId&&finance.some(f=>f.id===atendForm.financeiroId);
    if(atendForm.lancarFinanceiro&&!jaLanc&&valFinal<=0){
      alert("Para lançar no financeiro o atendimento precisa ter valor. Preencha o campo Valor (R$) ou o valor por hora no pedido.");
      return;
    }
    const lancar=!!atendForm.lancarFinanceiro&&!jaLanc&&valFinal>0;
    const finId=lancar?uid():(jaLanc?atendForm.financeiroId:null);
    const vencFin=atendForm.dataVencFin||today;
    const novo={...atendForm,id:atendForm.id||uid(),duracao:dur,valor:Number(atendForm.valor)>0?Number(atendForm.valor):0,lancarFinanceiro:false,financeiroId:finId};

    if(atendForm.id){
      setConsultoria(prev=>prev.map(c=>c.id===sel.id?{...c,...extraPed,atendimentos:(c.atendimentos||[]).map(a=>a.id===novo.id?novo:a)}:c));

    if(lancar){

      setFinance(prev=>[...prev,{id:finId,type:"receita",tipoReceita:"Consultoria",desc:`Atendimento — ${sel.clienteNome} — ${atendForm.assunto}`,value:valFinal,date:today,dataVencimento:vencFin,formaPag:atendForm.formaPagFin||"PIX",pago:false,category:"Consultoria",clientName:sel.clienteNome}]);
    } else if(jaLanc){
      // já foi lançado antes: atualiza o mesmo lançamento (se ainda não foi pago) em vez de duplicar
      setFinance(prev=>prev.map(f=>f.id===finId&&!f.pago&&valFinal>0?{...f,value:valFinal,desc:`Atendimento — ${sel.clienteNome} — ${atendForm.assunto}`}:f));
    }
    if(atendForm.proximaData){
      setCompromissos(prev=>[...prev,{id:uid(),desc:`Consultoria — ${sel.clienteNome}${sel.empresaTerceira?` (${sel.empresaTerceira})`:""} `,data:atendForm.proximaData,hora:atendForm.proximaHora||"09:00",prioridade:"Alta",status:"Pendente",tipo:"Consultoria",pedidoId:sel.id}]);
    }
    setAtendForm(EFA);setModal(null);

  const fecharMedicao=(lancar)=>{
    if(!sel)return;

    const medId=uid();

    setConsultoria(prev=>prev.map(c=>c.id===sel.id?{...c,
      valorHora:(medSalvaHora&&num(medHora)>0)?num(medHora):c.valorHora,
      medicoes:[...(c.medicoes||[]),nova],
      atendimentos:(c.atendimentos||[]).map(a=>atends.find(x=>x.id===a.id)?{...a,valor:vRate(a,rate),medicaoId:medId}:a)
    }:c));
    if(quer){
      setFinance(prev=>[...prev,{id:finId,type:"receita",tipoReceita:"Consultoria",desc:`Medição — ${sel.clienteNome} — ${fmtHoras(hrs)}`,value:val,date:today,dataVencimento:medForm.dataVencimento||today,pago:false,category:"Consultoria",clientName:sel.clienteNome}]);
    }
    setMedForm({obs:"",dataVencimento:"",formaPag:"PIX"});setSelAtends([]);setModal(null);
    showSavedGlobal(quer?"Medição fechada e lançada no financeiro!":"Medição salva no pedido (não foi para o financeiro).");
  };

  // lançar no financeiro um pedido que ficou só no pedido
  const lancarPedidoFin=()=>{
    if(!sel||!(Number(sel.valor)>0))return;
    if(!window.confirm(`Lançar ${fmtBRL(Number(sel.valor))} deste pedido no financeiro?`))return;
    const finId=uid();
    setFinance(prev=>[...prev,{id:finId,type:"receita",tipoReceita:"Consultoria",desc:`Consultoria — ${sel.clienteNome} — ${sel.servico}`,value:Number(sel.valor),date:today,dataVencimento:sel.dataVencimento||today,pago:false,category:"Consultoria",clientName:sel.clienteNome}]);
    setConsultoria(prev=>prev.map(c=>c.id===sel.id?{...c,lancado:true,financeiroId:finId}:c));

  // lançar no financeiro uma medição que ficou só no pedido
  const lancarMedicaoFin=(m)=>{
    if(!sel)return;

    if(!window.confirm(`Lançar ${fmtBRL(m.valor)} desta medição no financeiro?`))return;
    const finId=uid();
    setFinance(prev=>[...prev,{id:finId,type:"receita",tipoReceita:"Consultoria",desc:`Medição — ${sel.clienteNome} — ${fmtHoras(m.horas)}`,value:Number(m.valor),date:today,dataVencimento:m.dataVencimento||today,pago:false,category:"Consultoria",clientName:sel.clienteNome}]);
    setConsultoria(prev=>prev.map(c=>c.id===sel.id?{...c,medicoes:c.medicoes.map(x=>x.id===m.id?{...x,lancado:true,financeiroId:finId}:x)}:c));
    showSavedGlobal("Medição lançada no financeiro!");
  };

  const lancarMensal=()=>{
    if(!sel||!sel.valor)return;
    setModal("lancarMes");
  };
  const [mesLancar,setMesLancar]=useState(today.slice(0,7));
  const [diaLancar,setDiaLancar]=useState(sel?.diaEmissao||22);
  const confirmarMensal=(enviar)=>{
    const jaTem=finance.some(f=>f.clientName===sel.clienteNome&&String(f.desc||"").startsWith(`Mensalidade ${mesLancar}`));
    if(jaTem&&!window.confirm(`Já existe um lançamento de mensalidade de ${mesLancar} para este cliente. Lançar de novo mesmo assim?`))return;
    if(enviar&&wppFmt==="texto"&&!telDe(sel)){alert("Cadastre o WhatsApp do cliente para enviar (ou escolha PDF/Imagem).");return;}
    const venc=`${mesLancar}-${String(diaLancar||22).padStart(2,"0")}`;
    setFinance(prev=>[...prev,{id:uid(),type:"receita",tipoReceita:"Consultoria",desc:`Mensalidade ${mesLancar} — ${sel.clienteNome}`,value:Number(sel.valor),date:today,dataVencimento:venc,pago:false,category:"Consultoria",clientName:sel.clienteNome,pedidoId:sel.id}]);
    setModal(null);
    if(enviar){
      showSavedGlobal(wppFmt==="texto"?"Mensalidade lançada! Abrindo o WhatsApp…":"Mensalidade lançada! Preparando o documento…");
      enviarDoc("mes",{mes:mesLancar,dia:diaLancar||22});
    } else showSavedGlobal(`Mensalidade ${fmtBRL(Number(sel.valor))} lançada!`);
  };

  const enviarWhatsApp=(p,tipo,med,extra)=>{
    const cli=clients.find(c=>c.id===p.clientId)||{};
    const tel=(cli.phone||"").replace(/\D/g,"");
    if(!tel){alert("Cadastre o WhatsApp do cliente primeiro.");return;}
    const pixTxt=configConsul.pixNome?`💠 PIX: ${configConsul.pixNome} · CPF: ${configConsul.pixChave||"357.252.138.62"}\n`:"";
    const assin="*Simara Lobui · Consultoria*";
    let msg="";
    if(tipo==="pedido"||tipo==="orcamento"){
      const isOrc=tipo==="orcamento";
      const valTxt=taxaHora(p)>0?`${fmtBRL(taxaHora(p))}/hora`:`${fmtBRL(Number(p.valor||0))}${p.tipo==="Fixo mensal"?"/mês":""}`;
      msg=`*${isOrc?"ORÇAMENTO":"PEDIDO"} DE CONSULTORIA Nº ${numPedido(p.id)}*\n\n*Cliente:* ${p.clienteNome}\n*Serviço:* ${p.servico}\n*Modalidade:* ${p.tipo}\n*Valor:* ${valTxt}\n*Pagamento:* ${p.formaPag||"PIX"}\n${p.dataVencimento?`*Vencimento:* ${fmtDate(p.dataVencimento)}\n`:""}\n${pixTxt}\n${p.obs?`*Observações:* ${p.obs}\n`:""}\n${isOrc?"Este orçamento aguarda sua aprovação. Depois de aprovado, ele vira pedido e iniciamos os atendimentos. 🤎":"Dúvidas? Estou à disposição! 🤎"}\n${assin}`;
    } else if(tipo==="contrato"){
      msg=`*CONTRATO Nº ${numPedido(p.id)}*\n\n*Cliente:* ${p.clienteNome}\n*Serviço:* ${p.servico}\n*Modalidade:* ${p.tipo}\n*Valor:* ${fmtBRL(Number(p.valor||0))}${p.tipo==="Fixo mensal"?"/mês":""}\n*Pagamento:* ${p.formaPag||"PIX"}\n${p.tipo==="Fixo mensal"?`*Vencimento:* todo dia ${p.diaEmissao}\n`:""}\n${pixTxt}\nEm anexo segue o contrato para sua análise. Após aprovação, podemos iniciar os serviços.\n\n${assin}`;
    } else if(tipo==="medicao"&&med){
      const ats=(p.atendimentos||[]).filter(a=>a.medicaoId===med.id);
      const lista=ats.map(a=>`• ${fmtDate(a.data)} — ${(a.assunto||"").slice(0,70)} (${fmtHoras(a.duracao)}${vEf(a,p)>0?` · ${fmtBRL(vEf(a,p))}`:""})`).join("\n");
      msg=`*MEDIÇÃO DE CONSULTORIA*\n\n*Cliente:* ${p.clienteNome}\n*Data:* ${fmtDate(med.dataFim)}\n${lista?`\n*Atendimentos:*\n${lista}\n\n`:""}*Total de horas:* ${fmtHoras(med.horas)}\n*Valor:* ${med.valor>0?fmtBRL(med.valor):"—"}\n${med.dataVencimento?`*Vencimento:* ${fmtDate(med.dataVencimento)}\n`:""}\n${(!med.formaPag||med.formaPag==="PIX")?pixTxt:""}\n${assin}`;
    } else if(tipo==="mes"&&extra){
      msg=legendaArquivo(p,"mes",null,extra).replace("O espelho do lançamento segue em anexo. ","");
    } else return;
    window.open(`https://wa.me/${tel}?text=${encodeURIComponent(msg)}`);

  // ===== ENVIO DO ESPELHO DO DOCUMENTO (PDF / IMAGEM) =====
  const MESES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  const telDe=(p)=>((clients.find(c=>c.id===p.clientId)||{}).phone||"").replace(/\D/g,"");
  const dadosMes=(p,mes,dia)=>{
    const lanc=finance.find(f=>f.clientName===p.clienteNome&&String(f.desc||"").startsWith(`Mensalidade ${mes}`));
    const valor=lanc?Number(lanc.value):Number(p.valor||0);
    const venc=(lanc&&lanc.dataVencimento)||`${mes}-${String(dia||p.diaEmissao||22).padStart(2,"0")}`;
    const [ano,mm]=String(mes).split("-");
    const nomeMes=`${MESES[Number(mm)-1]||mm}/${ano}`;
    const ats=(p.atendimentos||[]).filter(a=>String(a.data||"").startsWith(mes));
    return {lanc,valor,venc,nomeMes,ats};
  };
  const legendaArquivo=(p,tipo,med,extra)=>{
    const nome=(p.clienteNome||"").split(" ")[0];
    const assin="*Simara Lobui · Consultoria*";
    const pixOk=(!p.formaPag||p.formaPag==="PIX");
    const pix=pixOk?`💠 PIX: ${configConsul.pixNome||"Simara Ap. de Souza Lobui"} · CPF: ${configConsul.pixChave||"357.252.138.62"}\n`:"";
    if(tipo==="mes"&&extra){
      const d=dadosMes(p,extra.mes,extra.dia);
      return `*PEDIDO DE CONSULTORIA Nº ${numPedido(p.id)} — LANÇAMENTO DE ${d.nomeMes.toUpperCase()}*\n\n*Cliente:* ${p.clienteNome}\n*Serviço:* ${p.servico}\n*Modalidade:* ${p.tipo}\n*Competência:* ${d.nomeMes}\n*Valor:* ${fmtBRL(d.valor)}\n*Vencimento:* ${fmtDate(d.venc)}\n*Pagamento:* ${p.formaPag||"PIX"}\n${pix}\nConfirmando a prestação do serviço neste mês. O espelho do lançamento segue em anexo. Dúvidas? Estou à disposição! 🤎\n${assin}`;
    }
    if(tipo==="medicao"&&med){
      return `Olá, ${nome}! Segue a medição em anexo — ${fmtHoras(med.horas)}${med.valor>0?` · ${fmtBRL(med.valor)}`:""}. 🤎\n${med.valor>0?pix:""}${assin}`;
    }
    const rot=tipo==="orcamento"?"orçamento":tipo==="contrato"?"contrato":"pedido";
    return `Olá, ${nome}! Segue o ${rot} Nº ${numPedido(p.id)} em anexo. 🤎\n${assin}`;
  };
  const carregarScript=(src,teste)=>new Promise((res,rej)=>{
    if(teste())return res();
    const s=document.createElement("script");s.src=src;
    s.onload=()=>teste()?res():rej(new Error("biblioteca não iniciou"));
    s.onerror=()=>rej(new Error("sem conexão com a biblioteca"));
    document.head.appendChild(s);
  });
  const htmlParaCanvas=async(html)=>{
    const fr=document.createElement("iframe");
    fr.setAttribute("aria-hidden","true");
    fr.style.cssText="position:fixed;left:-10000px;top:0;width:794px;height:1200px;border:0;";
    document.body.appendChild(fr);
    try{
      await new Promise(res=>{fr.onload=()=>res();fr.srcdoc=html;});
      const doc=fr.contentDocument;
      if(doc.fonts&&doc.fonts.ready)await doc.fonts.ready;
      await new Promise(r=>setTimeout(r,200));
      const h=Math.max(doc.body.scrollHeight,doc.documentElement.scrollHeight);
      fr.style.height=h+"px";
      return await window.html2canvas(doc.body,{scale:2,backgroundColor:"#ffffff",useCORS:true,windowWidth:794,windowHeight:h});
    } finally { document.body.removeChild(fr); }
  };
  const prepararEnvio=async(html,saida,nomeArq,legenda,p)=>{
    setWppBusy(true);
    try{
      await carregarScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js",()=>!!window.html2canvas);
      if(saida==="pdf")await carregarScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",()=>!!(window.jspdf&&window.jspdf.jsPDF));
      const canvas=await htmlParaCanvas(html);
      const base=String(nomeArq).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"");
      let file;
      if(saida==="pdf"){
        const pdf=new window.jspdf.jsPDF({unit:"pt",format:"a4",compress:true});
        const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight();
        const imgH=canvas.height*pw/canvas.width;
        const img=canvas.toDataURL("image/jpeg",0.92);
        let y=0,pg=0;
        while(y<imgH-2){if(pg>0)pdf.addPage();pdf.addImage(img,"JPEG",0,-y,pw,imgH);y+=ph;pg++;}
        file=new File([pdf.output("blob")],`${base}.pdf`,{type:"application/pdf"});
      } else {
        const blob=await new Promise(r=>canvas.toBlob(r,"image/png"));
        file=new File([blob],`${base}.png`,{type:"image/png"});
      }
      setWppDoc({file,prev:canvas.toDataURL("image/jpeg",0.6),texto:legenda,tel:telDe(p),saida});
      setModal("wppPrev");
    }catch(e){
      alert("Não consegui gerar o arquivo ("+((e&&e.message)||"erro")+"). Confira a internet e tente de novo, ou use a opção 'Só texto'.");
    }
    setWppBusy(false);
  };
  const baixarArquivo=()=>{
    if(!wppDoc)return;
    const url=URL.createObjectURL(wppDoc.file);
    const a=document.createElement("a");a.href=url;a.download=wppDoc.file.name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),15000);
  };
  const enviarArquivo=async()=>{
    const d=wppDoc;if(!d)return;
    try{
      if(navigator.canShare&&navigator.canShare({files:[d.file]})){
        await navigator.share({files:[d.file],text:d.texto});
        setModal(null);setWppDoc(null);return;
      }
    }catch(e){ if(e&&e.name==="AbortError")return; }
    baixarArquivo();
    window.open(`https://wa.me/${d.tel||""}?text=${encodeURIComponent(d.texto)}`,"_blank");
    showSavedGlobal("Arquivo baixado — anexe na conversa do WhatsApp.");
  };
  const enviarDoc=(tipo,extra)=>{
    const p=sel;if(!p||wppBusy)return;
    extra=extra||{};
    if(tipo==="mes"){
      if(!/^\d{4}-\d{2}$/.test(extra.mes||"")){alert("Informe o mês no formato AAAA-MM (ex.: 2026-09).");return;}
      const d=dadosMes(p,extra.mes,extra.dia);
      if(!(d.valor>0)){alert("Este pedido está sem valor mensal.");return;}
      if(d.lanc&&d.lanc.pago&&!window.confirm("Este mês já consta como PAGO no financeiro. Enviar mesmo assim?"))return;
    }
    if(wppFmt==="texto"){
      if(!telDe(p)){alert("Cadastre o WhatsApp do cliente primeiro.");return;}
      enviarWhatsApp(p,tipo,extra.med,extra);
      setModal(null);setWppView("menu");return;

    if(tipo==="pedido")gerarPedido(p,wppFmt);
    else if(tipo==="orcamento")gerarContrato({...p,orcamento:true},wppFmt);
    else if(tipo==="contrato")gerarContrato({...p,orcamento:false},wppFmt);
    else if(tipo==="medicao")gerarMedicao(extra.med,p,wppFmt);
    else if(tipo==="mes")gerarLancamentoMes(p,extra.mes,extra.dia,wppFmt);
  };

  const docStyles=`body{font-family:'Georgia',serif;max-width:740px;margin:0 auto;color:#2C3E50;padding:30px;line-height:1.75;}

  @media print{body{padding:20px;}}`;

  const rodapeDoc=`<div class="ftr">Simara Ap. de Souza Lobui · Consultoria Comercial e Administrativa${configConsul.telefone?` · Tel: ${configConsul.telefone}`:(config?.whatsapp?` · WhatsApp: ${config.whatsapp}`:"")}</div>`;

      {selId&&sel&&<>

          <button onClick={()=>setSelId(null)} style={{background:"none",border:"none",cursor:"pointer",fontSize:18,color:C.cafe}}>←</button>
          <div style={{flex:1,minWidth:0}}>

          <Btn sm v="ghost" onClick={()=>{setCompForm({desc:`Consultoria — ${sel.clienteNome}`,data:"",hora:"09:00",prioridade:"Alta"});setModal("comp");}}>📅 Agenda</Btn>
