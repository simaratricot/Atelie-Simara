const addDays = (d,n) => { const dt=new Date(d+"T00:00"); dt.setDate(dt.getDate()+n); return dt.toISOString().split("T")[0]; };
const calcDays = h => { let rem=h,days=0,i=0; const wh=Object.values(WEEK_HRS); while(rem>0){rem-=wh[i%7];days++;i++;} return days; };

// Adiciona apenas dias úteis (segunda a sexta)
const addWorkDays = (startDate, n) => {
  const dt = new Date(startDate+"T00:00");
  let added = 0;
  while(added < n) {
    dt.setDate(dt.getDate()+1);
    const dow = dt.getDay();
    if(dow !== 0 && dow !== 6) added++; // pula sab/dom
  }
  return dt.toISOString().split("T")[0];
};

// Calcula próxima data de entrega baseada na fila atual
const calcProximaEntrega = (orders, produto, config) => {
  const buffer = Number(produto?.buffer || config?.bufferDias || 2);
  const envio = Number(config?.diasEnvio || 1);
  const horas = Number(produto?.hours || 7);
  const diasProd = calcDays(horas);

  // Pega todos os pedidos ativos (não concluídos/cancelados)
  const ativos = orders
    .filter(o => !["Concluído","Cancelado","Enviado"].includes(o.status))
    .sort((a,b) => (a.position||999)-(b.position||999));

  // Encontra a última data de entrega na fila
  let base = today;
  if(ativos.length > 0) {
    const ultDelivery = ativos
      .map(o => o.delivery)
      .filter(Boolean)
      .sort()
      .pop();
    if(ultDelivery && ultDelivery > today) base = ultDelivery;
  }

  // Nova entrega = última + produção + buffer + envio (em dias úteis)
  const novaEntrega = addWorkDays(base, diasProd + buffer + envio);
  return { novaEntrega, diasProd, buffer, envio, base };
};

// Comprime imagens base64 para reduzir tamanho antes de salvar
const comprimirFotos = (data) => {
  if (!data) return data;
  if (Array.isArray(data)) {
    return data.map(item => {
      if (typeof item !== "object" || item === null) return item;
      const novo = {...item};
      // Comprime arrays de fotos (produtos, projetos, etc)
      if (Array.isArray(novo.photos)) {
        novo.photos = novo.photos.map(f => {
          if (!f || !f.startsWith("data:image")) return f;
          // Já está pequeno o suficiente
          if (f.length < 50000) return f;
          // Reduz qualidade via canvas
          try {
            const img = new Image();
            img.src = f;
            const canvas = document.createElement("canvas");
            const maxW = 400;
            const ratio = maxW / (img.width || maxW);
            canvas.width = Math.min(img.width || maxW, maxW);
            canvas.height = (img.height || maxW) * ratio;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            return canvas.toDataURL("image/jpeg", 0.5);
          } catch { return f; }
        });
      }
      // Comprime foto individual (depoimentos, banners, stock)
      if (novo.foto && novo.foto.startsWith("data:image") && novo.foto.length > 50000) {
        try {
          const img = new Image();
          img.src = novo.foto;
          const canvas = document.createElement("canvas");
          canvas.width = 200; canvas.height = 200;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, 200, 200);
          novo.foto = canvas.toDataURL("image/jpeg", 0.5);
        } catch {}
      }
      return novo;
    });
  }
  if (typeof data === "object" && data !== null) {
    const novo = {...data};
    if (novo.fotoArtesa && novo.fotoArtesa.startsWith("data:image") && novo.fotoArtesa.length > 50000) {
      try {
        const img = new Image();
        img.src = novo.fotoArtesa;
        const canvas = document.createElement("canvas");
        canvas.width = 300; canvas.height = 300;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, 300, 300);
        novo.fotoArtesa = canvas.toDataURL("image/jpeg", 0.6);
      } catch {}
    }
    return novo;
  }
  return data;
};

// ─── COMPRESSÃO DE FOTO PARA FIREBASE ────────────────────────────────────────
const comprimirParaFirebase = (dataUrl) => {
  if (!dataUrl || !dataUrl.startsWith("data:image")) return dataUrl;
  // Se já pequena, retorna como está
  if (dataUrl.length < 150000) return dataUrl;
  // Comprime via canvas
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      // Máximo 500px para garantir < 150KB no Firebase
      const max = 500;
      const ratio = Math.min(max/img.width, max/img.height, 1);
      canvas.width = Math.round(img.width * ratio);
      canvas.height = Math.round(img.height * ratio);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      let q = 0.6;
      let result = canvas.toDataURL("image/jpeg", q);
      // Reduz qualidade até caber
      while (result.length > 150000 && q > 0.2) {
        q -= 0.1;
        result = canvas.toDataURL("image/jpeg", q);
      }
      res(result);
    };
    img.onerror = () => res(dataUrl);
    img.src = dataUrl;
  });
};

// ─── FIREBASE — FONTE PRINCIPAL DE DADOS ─────────────────────────────────────
const fbSave = async (key, value) => {
  try {
    let forCloud = value;

    if (Array.isArray(value)) {
      // Comprime fotos de cada item antes de salvar
      forCloud = await Promise.all(value.map(async item => {
        if (typeof item !== "object" || !item) return item;
        const c = {...item};
        // Comprime todas as fotos do array photos
        if (c.photos?.length) {
          c.photos = await Promise.all(c.photos.map(p => comprimirParaFirebase(p)));
        }
        // Comprime foto de cor
        if (c.cores?.length) {
          c.cores = await Promise.all(c.cores.map(async cor => ({
            ...cor,
            foto: cor.foto ? await comprimirParaFirebase(cor.foto) : cor.foto
          })));
        }
        // Comprime foto individual
        if (c.foto) c.foto = await comprimirParaFirebase(c.foto);
        return c;
      }));
    } else if (typeof value === "object" && value !== null) {
      forCloud = {...value};
      if (forCloud.fotoArtesa) forCloud.fotoArtesa = await comprimirParaFirebase(forCloud.fotoArtesa);
      if (forCloud.logoMarca) forCloud.logoMarca = await comprimirParaFirebase(forCloud.logoMarca);
    }

    // Verifica tamanho final
    const json = JSON.stringify(forCloud);
    if (json.length > 900000) {
      console.warn("Firebase: documento ainda grande após compressão:", json.length);
    }

    // Salva no Firebase
    await db.collection("atelie").doc(key).set({
      value: json,
      updated: Date.now()
    });
    // Salva local como backup
    try { localStorage.setItem("atelie_"+key, JSON.stringify(value)); } catch {}
  } catch(e) { console.warn("Firebase save error:", e.message); }
};

// Indicador global de salvamento
let _setSavedGlobal = null;
const showSavedGlobal = (msg="✓ Salvo com sucesso!") => {
  if (_setSavedGlobal) _setSavedGlobal(msg);
};

const useStorage = (key, initial) => {
  const K = "atelie_" + key;
  const loaded = useRef(false);

  const [val, setVal] = useState(() => {
    // Começa com localStorage enquanto Firebase carrega
    try {
      const s = localStorage.getItem(K);
      if (s) return JSON.parse(s);
    } catch {}
    return initial;
  });

  // Carrega Firebase como fonte principal — sobrescreve local
  useEffect(() => {
    if (loaded.current) return;
    loaded.current = true;
    db.collection("atelie").doc(key).get().then(doc => {
      if (doc.exists) {
        try {
          const cloudVal = JSON.parse(doc.data().value);
          // Firebase tem prioridade — é a fonte de verdade
          setVal(cloudVal);
          try { localStorage.setItem(K, JSON.stringify(cloudVal)); } catch {}
        } catch {}
      }
    }).catch(() => {});
  }, []);

  const set = useCallback(u => {
    setVal(prev => {
      const next = typeof u === "function" ? u(prev) : u;
      fbSave(key, next);
      showSavedGlobal();
      return next;
    });
  }, [K, key]);

  return [val, set];
};

// ─── UPLOAD DE FOTOS ──────────────────────────────────────────────────────────
const PhotoUp = ({photos=[],onChange,label}) => {
  const ref=useRef();
  const add=async files=>{
    const v=Array.from(files).filter(f=>f.type.startsWith("image/")).slice(0,8-photos.length);
    if(!v.length)return;
    const urls=await Promise.all(v.map(readFile));
    onChange([...photos,...urls]);
  };
  return (
    <div>
      <label style={{fontSize:11,fontWeight:600,letterSpacing:"0.8px",color:C.oliva,textTransform:"uppercase",display:"block",marginBottom:6}}>{label||"Fotos"} ({photos.length}/8)</label>
      <div onClick={()=>ref.current.click()} style={{border:`2px dashed ${C.areia}`,borderRadius:6,padding:"12px",textAlign:"center",cursor:"pointer",background:C.linho,marginBottom:8}}>
        <div style={{fontSize:22,marginBottom:2}}>📷</div>
        <div style={{fontSize:12,color:C.cafe,fontWeight:600}}>Toque para adicionar fotos</div>
        <input ref={ref} type="file" accept="image/*" multiple style={{display:"none"}} onChange={e=>add(e.target.files)}/>
      </div>
      {photos.length>0&&<div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        {photos.map((src,i)=>(
          <div key={i} style={{position:"relative",width:64,height:64,borderRadius:4,overflow:"hidden",border:`2px solid ${i===0?C.dourado:C.areia}`}}>
            <img src={src} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>
            <button onClick={()=>onChange(photos.filter((_,j)=>j!==i))} style={{position:"absolute",top:1,right:1,background:"rgba(192,57,43,0.9)",border:"none",color:"#fff",borderRadius:2,fontSize:10,padding:"1px 4px",cursor:"pointer"}}>✕</button>
            {i>0&&<button onClick={()=>{const n=[...photos];const[x]=n.splice(i,1);n.unshift(x);onChange(n);}} style={{position:"absolute",bottom:1,left:1,background:"rgba(176,141,87,0.9)",border:"none",color:"#fff",borderRadius:2,fontSize:9,padding:"1px 3px",cursor:"pointer"}}>★</button>}
            {i===0&&<div style={{position:"absolute",bottom:1,left:1,background:"rgba(176,141,87,0.9)",borderRadius:2,color:"#fff",fontSize:9,padding:"1px 3px"}}>Capa</div>}
          </div>
        ))}
        {photos.length<8&&<div onClick={()=>ref.current.click()} style={{width:64,height:64,borderRadius:4,border:`2px dashed ${C.areia}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,color:C.areia,cursor:"pointer",background:C.linho}}>+</div>}
      </div>}
    </div>
  );
};

const Dashboard = ({orders,finance,stockSup,frases,clients,config,compromissos,publicacoes,cartas,volumes,setCartas,setFrases,setView}) => {
  const ativos=orders.filter(o=>!["Concluído","Enviado","Cancelado"].includes(o.status));
  const agenda=orders.filter(o=>o.delivery&&o.delivery>=today&&!["Concluído","Cancelado"].includes(o.status)).sort((a,b)=>a.delivery.localeCompare(b.delivery));
  const frasesAtivas=frases.filter(f=>f.ativa);
  const frase=frasesAtivas.length>0?frasesAtivas[dayOfYear()%frasesAtivas.length]:null;
  const lowStock=stockSup.filter(s=>s.qty<=s.min);
  const statusAtivos=Object.keys(STATUS).filter(s=>!["Concluído","Enviado","Cancelado"].includes(s));
  const todayMMDD=today.slice(5);
  const aniversariantes=(clients||[]).filter(c=>{
    if(!c.nascimento)return false;
    const n=c.nascimento;
    if(n.includes("/"))return n.slice(0,5)===new Date().toLocaleDateString("pt-BR").slice(0,5);
    return n.slice(5)===todayMMDD;
  });
  const recHoje=finance.filter(f=>f.type==="receita"&&f.dataVencimento===today&&!f.pago).reduce((a,f)=>a+f.value,0);
  const pagHoje=finance.filter(f=>f.type==="despesa"&&f.dataVencimento===today&&!f.pago).reduce((a,f)=>a+f.value,0);

  // Publicações do dia
  const pubHoje=publicacoes.filter(p=>p.data===today);
  const pubConc=pubHoje.filter(p=>p.status==="Concluído").length;
  const pubPct=pubHoje.length>0?Math.round((pubConc/pubHoje.length)*100):0;

  // Compromissos do dia
  const compHoje=compromissos.filter(c=>c.data===today).sort((a,b)=>(a.hora||"").localeCompare(b.hora||""));

  // Livro em andamento
  const volAtual=volumes.length>0?volumes[volumes.length-1]:null;
  const cartasVol=volAtual?cartas.filter(c=>c.volume===volAtual.id):[];
  const paginasApx=Math.round(cartas.length*4.5);
  const metaPags=200;
  const pct=Math.min(100,Math.round((paginasApx/metaPags)*100));

  const [inspModal,setInspModal]=useState(false);
  const [fraseModal,setFraseModal]=useState(false);
  const [novaFrase,setNovaFrase]=useState("");
  const [encerrModal,setEncerrModal]=useState(false);
  const [pensamento,setPensamento]=useState("");
  const [fraseImg,setFraseImg]=useState(false);

  const hora=new Date().getHours();
  const saudacao=hora<12?"🌅 Bom dia":"🌿 Boa tarde";

  const compartilharFrase=async()=>{
    if(!frase)return;
    const W=1080,H=1080;
    const canvas=document.createElement("canvas");
    canvas.width=W;canvas.height=H;
    const ctx=canvas.getContext("2d");

    // Fundo gradiente da marca
    const grad=ctx.createLinearGradient(0,0,W,H);
    grad.addColorStop(0,"#1A2744");
    grad.addColorStop(0.5,"#2D1B69");
    grad.addColorStop(1,"#A563A2");
    ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);

    // Ornamentos circulares suaves
    ctx.fillStyle="rgba(216,180,206,0.06)";
    ctx.beginPath();ctx.arc(W*0.85,H*0.12,280,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="rgba(165,99,162,0.08)";
    ctx.beginPath();ctx.arc(W*0.1,H*0.88,220,0,Math.PI*2);ctx.fill();

    // Logo se tiver
    if(config?.logoMarca){
      try{
        await new Promise((res)=>{
          const logo=new Image();logo.crossOrigin="anonymous";
          logo.onload=()=>{
            ctx.globalAlpha=0.9;
            const lw=140,lh=(logo.height/logo.width)*lw;
            ctx.drawImage(logo,W/2-lw/2,60,lw,lh);
            ctx.globalAlpha=1;res();
          };logo.onerror=()=>res();logo.src=config.logoMarca;
        });
      }catch{}
    }

    // Linha decorativa topo
    ctx.strokeStyle="rgba(216,180,206,0.3)";ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(120,200);ctx.lineTo(W-120,200);ctx.stroke();

    // Categoria
    ctx.fillStyle="#D8B4CE";ctx.font="bold 22px Arial,sans-serif";
    ctx.textAlign="center";ctx.letterSpacing="4px";
    ctx.fillText(frase.categoria.toUpperCase(),W/2,240);

    // Aspas decorativas
    ctx.fillStyle="rgba(165,99,162,0.4)";ctx.font="bold 120px Georgia,serif";
    ctx.textAlign="left";ctx.fillText('"',90,420);

    // Texto da frase — centralizado com quebra de linha
    ctx.fillStyle="#FDFAFF";ctx.font="italic 52px Georgia,serif";
    ctx.textAlign="center";ctx.letterSpacing="0px";
    const words=frase.texto.split(" ");
    let line="",y=370,maxW=820;
    words.forEach(w=>{
      const test=line+w+" ";
      if(ctx.measureText(test).width>maxW&&line){
        ctx.fillText(line.trim(),W/2,y);line=w+" ";y+=72;
      } else line=test;
    });
    ctx.fillText(line.trim(),W/2,y);y+=72;

    // Aspas finais
    ctx.fillStyle="rgba(165,99,162,0.4)";ctx.font="bold 120px Georgia,serif";
    ctx.textAlign="right";ctx.fillText('"',W-90,y+40);

    // Linha divisória
    ctx.strokeStyle="rgba(165,99,162,0.5)";ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(W/2-60,y+80);ctx.lineTo(W/2+60,y+80);ctx.stroke();
    ctx.fillStyle="#A563A2";ctx.font="26px serif";ctx.textAlign="center";
    ctx.fillText("♥",W/2,y+90);

    // Assinatura
    ctx.fillStyle="#D8B4CE";ctx.font="italic 32px Georgia,serif";
    ctx.fillText("— Simara Lobui",W/2,y+140);
    ctx.fillStyle="rgba(216,180,206,0.5)";ctx.font="18px Arial,sans-serif";
    ctx.letterSpacing="2px";ctx.fillText("@simara.lobui",W/2,y+180);

    const url=canvas.toDataURL("image/png");
    const pw=window.open("","_blank","width=460,height=520");
    if(pw){
      pw.document.write(`<!DOCTYPE html><html><head><title>Frase do dia</title><style>body{margin:0;background:#1A2744;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:sans-serif;padding:20px;gap:12px;}img{max-width:380px;border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,0.5);}a{background:#A563A2;color:#fff;padding:12px 28px;border-radius:24px;text-decoration:none;font-weight:700;font-size:13px;letter-spacing:1px;text-align:center;}p{color:#D8B4CE;font-size:11px;margin:0;}</style></head><body><img src="${url}"><a href="${url}" download="frase-simara.png">⬇️ Baixar imagem</a><p>1080 × 1080 px · Feed e Stories</p></body></html>`);
      pw.document.close();
    }
  };

  const salvarPensamento=()=>{
    if(!pensamento.trim())return;
    setCartas(prev=>[...prev,{id:uid(),titulo:"Pensamento do dia",subtitulo:"",data:today,categoria:"Reflexões",texto:pensamento,origem:"Dia comum",status:"Rascunho",assinatura:"Simara Lobui",volume:""}]);
    setPensamento("");setEncerrModal(false);
    showSavedGlobal("Pensamento salvo no Diário!");
  };

  return (
    <div className="fade" style={{padding:24,display:"flex",flexDirection:"column",gap:18}}>

      {/* SAUDAÇÃO */}
      <div style={{background:`linear-gradient(135deg,#23355A 0%,#2D1B69 50%,#A563A2 100%)`,borderRadius:8,padding:"20px 24px",position:"relative",overflow:"hidden"}}>
        <div style={{position:"absolute",top:-40,right:-20,fontSize:180,opacity:0.06,fontFamily:"serif",color:"#fff"}}>✦</div>
        <div style={{position:"absolute",bottom:-30,left:-10,width:200,height:200,borderRadius:"50%",background:"rgba(216,180,206,0.08)"}}/>
        {/* Saudação */}
        <div style={{fontSize:20,color:"#FDFAFF",fontFamily:"'Cormorant Garamond',serif",fontWeight:400,marginBottom:4,display:"flex",alignItems:"center",gap:8}}>
          <span>{hora<12?"🌅":hora<18?"☀️":"🌙"}</span> {saudacao}, Simara!
        </div>
        <div style={{fontSize:10,color:"rgba(216,180,206,0.7)",letterSpacing:"1px",marginBottom:12}}>

// ─── PRODUTOS ─────────────────────────────────────────────────────────────────
const calcPreco = (custo,horas,valorHora,margem) => {
  const mo=horas*valorHora;
  const sub=custo+mo;
  return Math.ceil((sub+sub*(margem/100))/5)*5;
};

const Products = ({products,setProducts,categories,config,stockSup}) => {
  const [search,setSearch]=useState("");
  const [catF,setCatF]=useState("Todos");
  const [modal,setModal]=useState(null);
  const EF={name:"",category:categories[0]||"Moda",subcategory:"",type:"encomenda",price:0,cost:0,hours:0,margem:40,desc:"",buffer:2,img:"🧶",photos:[],stock:0,materiais:[],tamanhos:[],cores:[],valorPorTamanho:[],caracteristicas:"",beneficio:"",sensacao:""};
  const [form,setForm]=useState(EF);
  const allCats=["Todos",...categories];
  const filtered=products.filter(p=>(catF==="Todos"||p.category===catF)&&p.name.toLowerCase().includes(search.toLowerCase()));
  const custoMat=(form.materiais||[]).reduce((sum,m)=>{const it=stockSup.find(s=>s.id===m.itemId);return sum+(it?.custoUnitario||0)*Number(m.qtd||0);},0);
  const custoFinal=form.materiais?.length>0?custoMat:Number(form.cost||0);
  const precoSug=calcPreco(custoFinal,Number(form.hours||0),config.valorHora,Number(form.margem||40));
  const SUBS={Moda:["Blusas","Coletes","Toucas","Cachecóis","Acessórios"],Casa:["Jogos de banheiro","Panos de prato","Decoração"],Amigurumi:["Bichinhos","Personagens"]};

  const compartilharProduto=async(p)=>{
    const W=1080,H=1920;
    const canvas=document.createElement("canvas");
    canvas.width=W;canvas.height=H;
    const ctx=canvas.getContext("2d");
    const precoStr=p.valorPorTamanho?.length>0?fmtBRL(Math.min(...p.valorPorTamanho.map(v=>v.preco))):fmtBRL(p.price);

    // ── FUNDO ESCURO ELEGANTE ──
    ctx.fillStyle="#0D0A1A";ctx.fillRect(0,0,W,H);

    // ── FOTO OCUPA 75% DA ARTE (produto é o destaque) ──
    if(p.photos?.[0]){
      try{
        await new Promise((res,rej)=>{
          const img=new Image();img.crossOrigin="anonymous";
          img.onload=()=>{
            const fh=H*0.72,fw=W,fx=0,fy=0;
            const ir=img.width/img.height,fr=fw/fh;
            let sw,sh,sx,sy;
            if(ir>fr){sh=img.height;sw=sh*fr;sx=(img.width-sw)/2;sy=0;}
            else{sw=img.width;sh=sw/fr;sx=0;sy=(img.height-sh)/2;}
            ctx.drawImage(img,sx,sy,sw,sh,fx,fy,fw,fh);
            // Degradê suave apenas na base da foto
            const gB=ctx.createLinearGradient(0,fh*0.6,0,fh);
            gB.addColorStop(0,"rgba(13,10,26,0)");
            gB.addColorStop(1,"rgba(13,10,26,0.98)");
            ctx.fillStyle=gB;ctx.fillRect(0,fh*0.6,W,fh*0.4);
            res();
          };img.onerror=rej;img.src=p.photos[0];
        });
      }catch{}
    } else {
      // Sem foto: fundo lilás com emoji
      const g=ctx.createLinearGradient(0,0,0,H*0.72);
      g.addColorStop(0,"#2D1B69");g.addColorStop(1,"#0D0A1A");
      ctx.fillStyle=g;ctx.fillRect(0,0,W,H*0.72);
      ctx.fillStyle="rgba(165,99,162,0.3)";ctx.font="200px serif";ctx.textAlign="center";
      ctx.fillText(p.img||"🧶",W/2,H*0.4);
    }

    // ── NOME DO PRODUTO — mais acima, sobre a foto ──
    const nY=H*0.68;
    ctx.textAlign="left";
    ctx.shadowColor="rgba(0,0,0,0.5)";ctx.shadowBlur=12;

    if(partes.length===1){
      ctx.fillStyle="#FDFAFF";ctx.font="bold 86px Georgia,serif";ctx.letterSpacing="-2px";
      ctx.fillText(partes[0],52,nY);
    } else {
      ctx.fillStyle="#FDFAFF";ctx.font="bold 72px Georgia,serif";ctx.letterSpacing="-1px";
      ctx.fillText(partes[0],52,nY-56);
      ctx.fillStyle="#D8B4CE";ctx.font="bold 76px Georgia,serif";
      ctx.fillText(partes.slice(1,3).join(" "),52,nY+18);
      if(partes.length>3){
        ctx.fillStyle="rgba(216,180,206,0.85)";ctx.font="italic 56px Georgia,serif";
        ctx.fillText(partes.slice(3).join(" "),52,nY+86);
      }
    }
    ctx.shadowBlur=0;

    // ── BADGE DISPONIBILIDADE ──
    const dispLabel=p.type==="pronta"?`✓ Pronta Entrega — ${p.stock} unid.`:"✦ Sob Encomenda";
    const dispColor=p.type==="pronta"?"rgba(46,107,46,0.85)":"rgba(75,45,127,0.85)";
    ctx.fillStyle=dispColor;
    const dispW=ctx.measureText(dispLabel).width+40;
    ctx.beginPath();ctx.roundRect(44,H*0.72+8,dispW+20,40,20);ctx.fill();
    ctx.fillStyle="#FDFAFF";ctx.font="bold 22px Arial,sans-serif";ctx.letterSpacing="1px";ctx.textAlign="left";
    ctx.fillText(dispLabel,64,H*0.72+34);

    // ── LINHA DECORATIVA ──
    ctx.strokeStyle="#A563A2";ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(52,H*0.72+60);ctx.lineTo(220,H*0.72+60);ctx.stroke();

    // ── ÁREA DE INFORMAÇÕES ──
    const infoY=H*0.72+76;

    // Preço
    ctx.fillStyle="rgba(165,99,162,0.15)";ctx.beginPath();ctx.roundRect(44,infoY,380,108,10);ctx.fill();
    ctx.strokeStyle="rgba(165,99,162,0.35)";ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(44,infoY,380,108,10);ctx.stroke();
    ctx.fillStyle="rgba(216,180,206,0.7)";ctx.font="20px Arial,sans-serif";ctx.letterSpacing="1px";ctx.textAlign="left";
    ctx.fillText("A partir de",66,infoY+36);
    ctx.fillStyle="#FDFAFF";ctx.font="bold 58px Georgia,serif";ctx.letterSpacing="-1px";
    ctx.fillText(precoStr,66,infoY+96);

    // ── CBS — texto completo com quebra de linha ──
    const drawTextBlock=(label,icon,texto,startY,maxW)=>{
      if(!texto||startY>H-100)return startY;
      ctx.letterSpacing="0px";ctx.textAlign="left";
      // Label
      ctx.fillStyle="#A563A2";ctx.font="bold 24px Arial,sans-serif";
      ctx.fillText(`${icon} ${label}`,52,startY);
      let y=startY+32;
      // Texto completo com quebra
      ctx.fillStyle="rgba(253,250,255,0.88)";ctx.font="22px Georgia,serif";
      const words=texto.split(" ");let line="";
      for(const w of words){
        const test=line+w+" ";
        if(ctx.measureText(test).width>maxW&&line){
          if(y>H-80)break;
          ctx.fillText(line.trim(),52,y);line=w+" ";y+=30;
        }else line=test;
      }
      if(line.trim()&&y<=H-80){ctx.fillText(line.trim(),52,y);y+=30;}
      return y+14;
    };

    const maxW=W-104;
    let cY=infoY+120;
    if(p.caracteristicas)cY=drawTextBlock("Características","✦",p.caracteristicas,cY,maxW);
    if(p.beneficio)cY=drawTextBlock("Benefício","♥",p.beneficio,cY,maxW);
    if(p.sensacao)cY=drawTextBlock("Sensação","◈",p.sensacao,cY,maxW);

    // ── LOGO (se cadastrada) ──
    if(config?.logoMarca){
      try{
        await new Promise((res,rej)=>{
          const logo=new Image();logo.crossOrigin="anonymous";
          logo.onload=()=>{
            const lw=120,lh=(logo.height/logo.width)*lw;
            // Fundo circular branco
            ctx.fillStyle="rgba(255,255,255,0.12)";
            ctx.beginPath();ctx.arc(W-80,80,58,0,Math.PI*2);ctx.fill();
            ctx.globalAlpha=0.92;
            ctx.drawImage(logo,W-80-lw/2,80-lh/2,lw,lh);
            ctx.globalAlpha=1;res();
          };
          logo.onerror=()=>{
            ctx.fillStyle="rgba(253,250,255,0.9)";ctx.font="bold 20px Arial,sans-serif";ctx.letterSpacing="2px";ctx.textAlign="right";
            ctx.fillText("SIMARA LOBUI",W-44,68);
            ctx.fillStyle="rgba(165,99,162,0.8)";ctx.font="italic 16px Georgia,serif";ctx.letterSpacing="0px";
            ctx.fillText("tricô & crochê",W-44,92);
            res();
          };
          logo.src=config.logoMarca;
        });
      }catch{}
    } else {
      ctx.fillStyle="rgba(253,250,255,0.85)";ctx.font="bold 20px Arial,sans-serif";ctx.letterSpacing="2px";ctx.textAlign="right";
      ctx.fillText("SIMARA LOBUI",W-44,68);
      ctx.fillStyle="rgba(165,99,162,0.8)";ctx.font="italic 16px Georgia,serif";ctx.letterSpacing="0px";
      ctx.fillText("tricô & crochê",W-44,92);
    }

    // ── RODAPÉ MINIMALISTA ──
    const rY=H-90;
    ctx.strokeStyle="rgba(165,99,162,0.3)";ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(44,rY);ctx.lineTo(W-44,rY);ctx.stroke();
    ctx.fillStyle="rgba(216,180,206,0.6)";ctx.font="22px Arial,sans-serif";ctx.letterSpacing="4px";ctx.textAlign="center";
    ctx.fillText(`@${config?.instagram?.replace("@","")||"simara.lobui"}`,W/2,rY+44);

    // ── DOWNLOAD DIRETO (funciona no celular) ──
    const previewUrl=canvas.toDataURL("image/jpeg",0.92);
    const a=document.createElement("a");
    a.href=previewUrl;
    a.download=`divulgacao-${p.name.replace(/\s+/g,"-").toLowerCase()}.jpg`;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    showSavedGlobal("Arte baixada! ✨");

  const comprimirFoto = async (dataUrl) => {
    if(!dataUrl || !dataUrl.startsWith("data:image")) return dataUrl;
    return new Promise(res => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        // Limita a 600px máximo para garantir que cabe no Firebase
        const max = 600;
        const ratio = Math.min(max/img.width, max/img.height, 1);
        canvas.width = Math.round(img.width * ratio);
        canvas.height = Math.round(img.height * ratio);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        // Qualidade 0.6 — bom visual, tamanho pequeno
        const compressed = canvas.toDataURL("image/jpeg", 0.6);
        // Se ainda muito grande, comprime mais
        if(compressed.length > 400000) {
          canvas.width = Math.round(canvas.width * 0.7);
          canvas.height = Math.round(canvas.height * 0.7);
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          res(canvas.toDataURL("image/jpeg", 0.5));
        } else {
          res(compressed);
        }
      };
      img.onerror = () => res(dataUrl);
      img.src = dataUrl;
    });
  };

const reorderQ = orders => {

  const reordered=active.map(o=>({...o,position:pos++}));

const Orders = ({orders,setOrders,products,config,onFicha,clients,setClients,finance,setFinance,contas,setContas}) => {
  const [filter,setFilter]=useState("Ativos");
  const [modal,setModal]=useState(null);
  const [baixaModal,setBaixaModal]=useState(null);
  const [detail,setDetail]=useState(null);
  const EF={client:"",phone:"",origem:"WhatsApp",itens:[{product:"",color:"",size:"",qty:1,price:0}],measures:"",price:0,desconto:0,tipoDesc:"valor",precoFinal:0,dataCompra:today,delivery:"",status:"Pedido recebido",valorPago:0,note:"",tracking:"",payment:"PIX",condicao:"À vista",entrada:0,dataEntradaPag:today,dataSaldo:"",parcelas:[],qtdParcelas:2,position:1};
  const [form,setForm]=useState(EF);

  const filtered=filter==="Ativos"?orders.filter(o=>!["Concluído","Cancelado","Enviado"].includes(o.status)):filter==="Todos"?orders:orders.filter(o=>o.status===filter);
  const unread=orders.filter(o=>!o.read).length;

  const precoComDesc=(price,desc,tipo)=>{
    const p=Number(price||0),d=Number(desc||0);
    return tipo==="pct"?p*(1-d/100):Math.max(0,p-d);
  };

  const openNew=()=>{
    const pos=orders.filter(o=>!["Concluído","Cancelado","Enviado"].includes(o.status)).length+1;
    setForm({...EF,position:pos,id:`EN-${String(orders.length+1).padStart(3,"0")}`});
    setModal("new");
  };
  const openEdit=o=>{setForm({...EF,...o,parcelas:o.parcelas||[],desconto:o.desconto||0,tipoDesc:o.tipoDesc||"valor"});setModal("edit");};

  const gerarLancamentos=(o,newId,itens,pF,prodDesc)=>{
    const cat=products.find(p=>p.name===itens[0]?.product)?.category||"Moda";
    const base={type:"receita",category:cat,centrocusto:"Vendas",
      orderId:newId,clientName:o.client,payment:o.payment,
      dataLancamento:o.dataCompra,pago:false}; // SEMPRE pendente

    const novos=[];
    if(o.condicao==="À vista"){
      novos.push({...base,id:uid(),
        desc:`${newId} – ${prodDesc} – À vista`,
        value:pF,date:o.dataCompra,
        dataVencimento:o.dataCompra,pago:false});

    } else if(o.condicao==="Com entrada"){
      if(Number(o.entrada)>0){
        novos.push({...base,id:uid(),
          desc:`${newId} – Entrada – ${o.client}`,
          value:Number(o.entrada),date:o.dataEntradaPag||o.dataCompra,
          dataVencimento:o.dataEntradaPag||o.dataCompra,pago:false});
      }
      const saldo=pF-Number(o.entrada||0);
      if(saldo>0){
        novos.push({...base,id:uid(),
          desc:`${newId} – Saldo – ${o.client}`,
          value:saldo,date:o.dataCompra,
          dataVencimento:o.dataSaldo||o.delivery||o.dataCompra,
          pago:false});
      }
    } else if(o.condicao==="Parcelado"&&o.parcelas?.length){
      // Uma linha por parcela
      o.parcelas.forEach(p=>{
        novos.push({...base,id:uid(),
          desc:`${newId} – ${p.n}ª parcela de ${o.parcelas.length} – ${o.client}`,
          value:p.valor,date:o.dataCompra,
          dataVencimento:p.data,pago:false,parcela:p.n});
      });
    }
    return novos;
  };

  const save=()=>{
    const itens=form.itens||[{product:form.product,color:form.color,size:form.size,qty:1,price:Number(form.price)}];
    const totalItens=itens.reduce((a,i)=>a+Number(i.price||0)*Number(i.qty||1),0);
    const precoBase=totalItens||Number(form.price)||0;
    const taxaEnvio=Number(form.taxaEnvio||0);
    const d=Number(form.desconto||0);
    const comDesc=form.tipoDesc==="pct"?precoBase*(1-d/100):Math.max(0,precoBase-d);
    const pF=comDesc+taxaEnvio;
    const prodDesc=itens.length===1?itens[0].product:`${itens.length} produtos`;

    let o={...form,itens,price:precoBase,precoFinal:pF,
      product:prodDesc,
      color:itens.length===1?itens[0].color:"",
      size:itens.length===1?itens[0].size:""};

    if(o.condicao==="Parcelado"&&(!o.parcelas||!o.parcelas.length)){
      o.parcelas=calcParcs(o.dataCompra||today,Number(o.qtdParcelas)||2,pF);
    }

    if(modal==="new"){
      const newId=`EN-${String(orders.length+1).padStart(3,"0")}`;
      const novoOrder={...o,id:newId,read:true,historicoPagamentos:[],valorPago:0};
      setOrders(prev=>reorderQ([...prev,novoOrder]));

      // Auto-cadastra cliente
      if(o.client&&!clients.find(c=>c.name===o.client)){
        setClients(prev=>[...prev,{id:uid(),name:o.client,phone:o.phone,
          email:"",city:"",orders:1,total:pF,vip:false,joined:today,origem:o.origem}]);
      }

      // Lança no financeiro — todos pendentes
      const novos=gerarLancamentos(o,newId,itens,pF,prodDesc);
      if(novos.length>0) setFinance(prev=>[...prev,...novos]);

    } else {
      // EDIÇÃO — salva o pedido
      const pedidoOriginal=orders.find(x=>x.id===o.id);
      setOrders(prev=>reorderQ(prev.map(x=>x.id===o.id?{...o,valorPago:x.valorPago,historicoPagamentos:x.historicoPagamentos}:x)));

      // Só pergunta sobre financeiro se mudou valor ou condição de pagamento
      const mudouValor=Math.abs((pedidoOriginal?.precoFinal||0)-pF)>0.01;
      const mudouCondicao=pedidoOriginal?.condicao!==o.condicao;
      const lancExist=finance.filter(f=>f.orderId===o.id);

      if(lancExist.length>0&&(mudouValor||mudouCondicao)){
        const resp=window.confirm(
          `O valor ou condição de pagamento foi alterado.\n\nOK = Substituir lançamentos no financeiro\nCancelar = Manter os lançamentos existentes`
        );
        if(resp){
          const novos=gerarLancamentos(o,o.id,itens,pF,prodDesc);
          setFinance(prev=>[...prev.filter(f=>f.orderId!==o.id),...novos]);
        }
        // Se cancelar, NÃO faz nada no financeiro
      }
      // Se não mudou valor/condição (ex: só mudou data de entrega), não toca no financeiro
    }
    setModal(null);
    showSavedGlobal("Pedido salvo com sucesso!");
  };

  const doBaixa=(order,valor,data,contaId)=>{
    const novoPago=(order.valorPago||0)+Number(valor);
    const pF=order.precoFinal||order.price;
    const saldo=Math.max(0,pF-novoPago);
    setOrders(prev=>prev.map(o=>o.id===order.id?{...o,valorPago:novoPago,paid:saldo<=0,historicoPagamentos:[...(o.historicoPagamentos||[]),{data,valor:Number(valor),contaId}]}:o));
    setFinance(prev=>[...prev,{id:uid(),type:"receita",desc:`${order.id} – Baixa – ${order.client}`,value:Number(valor),date:data,category:"Moda",centrocusto:"Vendas",pago:true,contaId,orderId:order.id,clientName:order.client,dataLancamento:today,dataVencimento:data}]);
    if(contaId)setContas(prev=>prev.map(c=>c.id===contaId?{...c,saldo:(c.saldo||0)+Number(valor)}:c));
    setBaixaModal(null);
  };

  const cancelar=id=>setOrders(prev=>reorderQ(prev.map(o=>o.id===id?{...o,status:"Cancelado",read:true}:o)));

  const sendWA=o=>{
    const pF=o.precoFinal||o.price;
    const saldo=Math.max(0,pF-(o.valorPago||0));
    const msg=`Olá, ${o.client.split(" ")[0]}! 🤎\n\n*Pedido confirmado!*\n\nNº: ${o.id}\nProduto: ${o.product}\nCor: ${o.color||"—"} · Tamanho: ${o.size||"—"}\nValor: ${fmtBRL(pF)}${o.desconto>0?`\nDesconto: -${o.tipoDesc==="pct"?o.desconto+"%":fmtBRL(o.desconto)}`:""}${o.condicao==="Com entrada"?`\nEntrada: ${fmtBRL(o.entrada)}\nSaldo: ${fmtBRL(saldo)}\nData limite saldo: ${fmtDate(o.dataSaldo||o.delivery)}`:""}${o.condicao==="Parcelado"&&o.parcelas?.length?`\nParcelas:\n${o.parcelas.map(p=>`  ${p.n}ª: ${fmtBRL(p.valor)} em ${fmtDate(p.data)}`).join("\n")}`:""}\nFila: ${o.position}ª\nEntrega: ${fmtDate(o.delivery)}\n\n${BRAND}`;
    window.open(`https://wa.me/${o.phone?.replace(/\D/g,"")}?text=${waMsg(msg)}`);
  };

  const counts=[["Ativos",orders.filter(o=>!["Concluído","Cancelado","Enviado"].includes(o.status)).length],["Concluídos",orders.filter(o=>["Concluído","Enviado"].includes(o.status)).length],["Cancelados",orders.filter(o=>o.status==="Cancelado").length]];

  return (
    <div className="fade" style={{padding:24}}>
      {unread>0&&<div style={{background:"#FEF3E9",border:`1.5px solid ${C.dourado}`,borderRadius:6,padding:"10px 14px",marginBottom:14,display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
        <span className="pulse" style={{fontSize:16}}>🔔</span>
        <span style={{fontSize:13,fontWeight:700,color:C.cafe}}>{unread} novo{unread!==1?"s":""} pedido{unread!==1?"s":""}!</span>
        <Btn sm v="ghost" onClick={()=>setOrders(prev=>prev.map(o=>({...o,read:true})))}>Marcar lido</Btn>
      </div>}
      <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:14,alignItems:"center"}}>
        {counts.map(([l,v])=><div key={l} style={{background:C.branco,border:`1px solid ${C.areia}`,borderRadius:6,padding:"6px 14px",textAlign:"center"}}><div style={{fontSize:18,fontWeight:700,fontFamily:"'Playfair Display',serif",color:C.cafe}}>{v}</div><div style={{fontSize:10,color:C.oliva}}>{l}</div></div>)}
        <div style={{marginLeft:"auto"}}><Btn onClick={openNew}>+ Nova Encomenda</Btn></div>
      </div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:14}}>
        {["Ativos","Todos",...Object.keys(STATUS)].map(s=><button key={s} onClick={()=>setFilter(s)} style={{padding:"3px 11px",borderRadius:20,border:`1.5px solid ${filter===s?C.cafe:C.areia}`,background:filter===s?C.cafe:"transparent",color:filter===s?"#fff":C.cafe,fontSize:11,fontWeight:600,cursor:"pointer"}}>{s}</button>)}
      </div>
      {filtered.length===0&&<div style={{textAlign:"center",padding:"40px 0",color:C.oliva,fontFamily:"'Cormorant Garamond',serif",fontStyle:"italic",fontSize:15}}>Nenhum pedido aqui ✦</div>}
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {filtered.map(o=>{
          const pF=o.precoFinal||o.price||0;
          const saldoAb=Math.max(0,pF-(o.valorPago||0));
          return (
            <Card key={o.id} style={{padding:"12px 16px",borderLeft:`4px solid ${!o.read&&o.status!=="Cancelado"?C.dourado:o.status==="Cancelado"?C.vermelho:"transparent"}`,opacity:o.status==="Cancelado"?0.7:1}}>
              <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center"}}>
                <div style={{flex:1,minWidth:140,cursor:"pointer"}} onClick={()=>{setOrders(prev=>prev.map(x=>x.id===o.id?{...x,read:true}:x));setDetail(o);}}>
                  <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:2}}>
                    <span style={{fontSize:11,fontWeight:700,color:C.dourado}}>{o.id}</span>
                    {!o.read&&o.status!=="Cancelado"&&<span className="pulse" style={{fontSize:8,background:C.dourado,color:"#fff",padding:"1px 5px",borderRadius:10,fontWeight:700}}>NOVO</span>}
                    {saldoAb<=0?<span style={{fontSize:9,background:"#D4E8D4",color:"#2E6B2E",padding:"1px 6px",borderRadius:10,fontWeight:700}}>PAGO</span>:o.valorPago>0?<span style={{fontSize:9,background:"#FEF3E9",color:"#9A6B40",padding:"1px 6px",borderRadius:10,fontWeight:700}}>PARCIAL</span>:<span style={{fontSize:9,background:"#FEF3E9",color:"#9A6B40",padding:"1px 6px",borderRadius:10,fontWeight:700}}>PENDENTE</span>}
                  </div>
                  <div style={{fontSize:13,fontWeight:700}}>{o.client}</div>
                  <div style={{fontSize:11,color:C.oliva}}>{o.product}{o.color?` · ${o.color}`:""}{o.size?` · ${o.size}`:""} · Fila: {o.position}ª</div>
                </div>
                <div style={{textAlign:"right",flexShrink:0}}>
                  <div style={{fontSize:15,fontFamily:"'Playfair Display',serif",fontWeight:700,color:C.dourado}}>{fmtBRL(pF)}</div>
                  {saldoAb>0&&o.status!=="Cancelado"&&<div style={{fontSize:10,color:C.vermelho}}>Saldo: {fmtBRL(saldoAb)}</div>}
                  <div style={{fontSize:10,color:C.oliva}}>Entrega: {fmtDate(o.delivery)}</div>
                </div>
                <Badge label={o.status}/>
                <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
                  {o.status!=="Cancelado"&&<select value={o.status} onChange={e=>setOrders(prev=>reorderQ(prev.map(x=>x.id===o.id?{...x,status:e.target.value}:x)))} style={{padding:"4px 6px",border:`1px solid ${C.areia}`,borderRadius:3,fontSize:11,color:C.cafe,background:C.branco}}>
                    {Object.keys(STATUS).filter(s=>s!=="Cancelado").map(s=><option key={s}>{s}</option>)}
                  </select>}
                  {o.status!=="Cancelado"&&saldoAb>0&&<Btn sm v="oliva" onClick={()=>setBaixaModal(o)}>💰</Btn>}
                  <Btn sm v="ghost" onClick={()=>{setOrders(prev=>prev.map(x=>x.id===o.id?{...x,read:true}:x));openEdit(o);}}>✎</Btn>
                  {o.status!=="Cancelado"&&<Btn sm v="ghost" onClick={()=>sendWA(o)}>💬</Btn>}
                  {onFicha&&o.status!=="Cancelado"&&<Btn sm v="gold" onClick={()=>onFicha(o)}>📋</Btn>}
                  {o.status!=="Cancelado"&&<Btn sm v="danger" onClick={()=>{if(window.confirm(`Cancelar pedido ${o.id}?`))cancelar(o.id);}}>✕</Btn>}
                </div>
              </div>
              {o.note&&<div style={{fontSize:11,color:C.oliva,marginTop:5,fontStyle:"italic"}}>Obs: {o.note}</div>}
              {o.tracking&&<div style={{fontSize:11,color:C.oliva,marginTop:3}}>Rastreio: <b>{o.tracking}</b></div>}
              {o.historicoPagamentos?.length>0&&<div style={{marginTop:6,paddingTop:6,borderTop:`1px dashed ${C.areia}`}}>
                <div style={{fontSize:9,color:C.oliva,fontWeight:700,letterSpacing:"1px",textTransform:"uppercase",marginBottom:3}}>Histórico de pagamentos</div>
                {o.historicoPagamentos.map((h,i)=><span key={i} style={{fontSize:11,color:C.cafe,marginRight:10}}>{fmtDate(h.data)}: {fmtBRL(h.valor)}</span>)}
              </div>}
            </Card>
          );
        })}
      </div>

      {baixaModal&&(
        <Modal title={`Registrar pagamento — ${baixaModal.id}`} onClose={()=>setBaixaModal(null)}>
          <BaixaForm order={baixaModal} contas={contas} onConfirm={doBaixa}/>
        </Modal>
      )}

      {detail&&(
        <Modal title={`Pedido ${detail.id}`} onClose={()=>setDetail(null)} wide>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
            {[["Cliente",detail.client],["WhatsApp",detail.phone],["Como chegou",detail.origem],["Produto",detail.product],["Cor",detail.color],["Tamanho",detail.size],["Medidas",detail.measures],["Pagamento",detail.payment],["Data compra",fmtDate(detail.dataCompra)],["Entrega",fmtDate(detail.delivery)]].map(([l,v])=>(
              <div key={l}><div style={{fontSize:9,color:C.oliva,fontWeight:700,letterSpacing:"1px",textTransform:"uppercase",marginBottom:1}}>{l}</div><div style={{fontSize:12,fontWeight:600}}>{v||"—"}</div></div>
            ))}
          </div>
          <div style={{background:C.linho,borderRadius:6,padding:"12px",marginBottom:10}}>
            <div style={{display:"flex",gap:14,flexWrap:"wrap"}}>
              <div><div style={{fontSize:9,color:C.oliva,textTransform:"uppercase",fontWeight:600,marginBottom:1}}>Posição</div><div style={{fontSize:20,fontFamily:"'Playfair Display',serif",fontWeight:700}}>{detail.position}ª</div></div>
              <div><div style={{fontSize:9,color:C.oliva,textTransform:"uppercase",fontWeight:600,marginBottom:1}}>Status</div><Badge label={detail.status}/></div>
              <div><div style={{fontSize:9,color:C.oliva,textTransform:"uppercase",fontWeight:600,marginBottom:1}}>Total / Pago / Saldo</div><div style={{fontSize:13,fontWeight:700}}>{fmtBRL(detail.precoFinal||detail.price)} / {fmtBRL(detail.valorPago||0)} / <span style={{color:C.vermelho}}>{fmtBRL(Math.max(0,(detail.precoFinal||detail.price)-(detail.valorPago||0)))}</span></div></div>
            </div>
          </div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <Btn v="oliva" onClick={()=>sendWA(detail)}>💬 WhatsApp</Btn>
            <Btn v="ghost" onClick={()=>{setDetail(null);openEdit(detail);}}>✎ Editar</Btn>
            {onFicha&&<Btn v="gold" onClick={()=>{setDetail(null);onFicha(detail);}}>📋 Ficha</Btn>}
          </div>
        </Modal>
      )}

      {modal&&<OrderForm form={form} setForm={setForm} products={products} config={config} clients={clients} onClose={()=>setModal(null)} onSave={save}/>}
    </div>
  );
};

const BaixaForm = ({order,contas,onConfirm}) => {
  const pF=order.precoFinal||order.price||0;
  const saldoAb=Math.max(0,pF-(order.valorPago||0));
  const [valor,setValor]=useState(saldoAb);
  const [data,setData]=useState(today);
  const [contaId,setContaId]=useState(contas[0]?.id||"");
  return (
    <div>
      <div style={{background:C.linho,borderRadius:6,padding:"12px",marginBottom:12}}>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:3}}><span style={{color:C.oliva}}>Total</span><span style={{fontWeight:700}}>{fmtBRL(pF)}</span></div>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:3}}><span style={{color:C.oliva}}>Já pago</span><span>{fmtBRL(order.valorPago||0)}</span></div>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:13,paddingTop:6,borderTop:`1px dashed ${C.areia}`}}><span style={{fontWeight:700}}>Saldo em aberto</span><span style={{fontWeight:700,color:C.vermelho}}>{fmtBRL(saldoAb)}</span></div>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        <Inp label="Valor pago agora (R$)" type="number" value={valor} onChange={setValor}/>
        <Inp label="Data do pagamento" type="date" value={data} onChange={setData}/>
        <Sel label="Conta que recebeu" value={contaId} onChange={setContaId} options={contas.map(c=>({v:c.id,l:c.nome}))}/>
      </div>
      <div style={{background:C.linho,borderRadius:4,padding:"10px",marginTop:10,textAlign:"center"}}>
        <span style={{fontSize:12,color:C.oliva}}>Saldo restante: </span>
        <span style={{fontSize:15,fontWeight:700,fontFamily:"'Playfair Display',serif",color:Math.max(0,saldoAb-Number(valor))<=0?C.oliva:C.vermelho}}>{fmtBRL(Math.max(0,saldoAb-Number(valor)))}</span>
      </div>
      <div style={{display:"flex",justifyContent:"flex-end",marginTop:14}}>
        <Btn onClick={()=>onConfirm(order,valor,data,contaId)}>Confirmar pagamento</Btn>
      </div>
    </div>
  );
};

const OrderForm = ({form,setForm,products,config,clients,onClose,onSave}) => {
  const pcd=()=>{
    const itens=form.itens||[];
    const totalItens=itens.reduce((a,i)=>a+Number(i.price||0)*Number(i.qty||1),0)||Number(form.price||0);
    const d=Number(form.desconto||0);
    const comDesc=form.tipoDesc==="pct"?totalItens*(1-d/100):Math.max(0,totalItens-d);
    return comDesc+Number(form.taxaEnvio||0);
  };

  const addItem=()=>setForm(f=>({...f,itens:[...(f.itens||[]),{product:"",color:"",size:"",qty:1,price:0}]}));
  const updItem=(idx,field,val)=>setForm(f=>{
    const itens=[...(f.itens||[])];
    itens[idx]={...itens[idx],[field]:val};
    if(field==="product"){
      const p=products.find(x=>x.name===val);
      itens[idx].price=p?.price||0;
      itens[idx].color="";itens[idx].size="";
    }
    if(field==="size"){
      const p=products.find(x=>x.name===itens[idx].product);
      const vt=p?.valorPorTamanho?.find(v=>v.tamanho===val);
      if(vt)itens[idx].price=vt.preco;
    }
    const totalItens=itens.reduce((a,i)=>a+Number(i.price||0)*Number(i.qty||1),0);
    return{...f,itens,price:totalItens};
  });
  const rmItem=(idx)=>setForm(f=>({...f,itens:(f.itens||[]).filter((_,i)=>i!==idx)}));

  const itens=form.itens||[{product:form.product||"",color:form.color||"",size:form.size||"",qty:1,price:Number(form.price||0)}];
  const totalItens=itens.reduce((a,i)=>a+Number(i.price||0)*Number(i.qty||1),0);

  return (
    <Modal title="Encomenda" onClose={onClose} wide>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        <div style={{gridColumn:"1/-1"}}>
          <ClienteSearch value={form.client} onChange={v=>setForm(f=>({...f,client:v}))} onPhoneChange={v=>setForm(f=>({...f,phone:v}))} clients={clients}/>
        </div>
        <Inp label="WhatsApp" value={form.phone} onChange={v=>setForm(f=>({...f,phone:v}))}/>
        <Sel label="Como chegou até você" value={form.origem} onChange={v=>setForm(f=>({...f,origem:v}))} options={ORIGENS}/>
      </div>

      {/* MÚLTIPLOS PRODUTOS */}
      <Divider label="Produtos do pedido"/>
      {itens.map((item,idx)=>{
        const selProd=products.find(p=>p.name===item.product);
        return(
          <div key={idx} style={{background:C.linho,borderRadius:6,padding:"12px",marginBottom:8,position:"relative"}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
              <span style={{fontSize:11,fontWeight:700,color:C.oliva}}>Item {idx+1}</span>
              {itens.length>1&&<Btn sm v="danger" onClick={()=>rmItem(idx)}>✕ Remover</Btn>}
            </div>
            <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr",gap:8,marginBottom:8}}>
              <div>
                <label style={{fontSize:10,fontWeight:600,color:C.oliva,textTransform:"uppercase",display:"block",marginBottom:3}}>Produto</label>
                <select value={item.product} onChange={e=>updItem(idx,"product",e.target.value)} style={{width:"100%",padding:"8px 10px",border:`1.5px solid ${C.areia}`,borderRadius:3,fontSize:13,color:C.cafe,background:C.branco}}>
                  <option value="">Selecionar...</option>
                  {products.map(p=><option key={p.id}>{p.name}</option>)}
                </select>
              </div>
              <div>
                <label style={{fontSize:10,fontWeight:600,color:C.oliva,textTransform:"uppercase",display:"block",marginBottom:3}}>Qtd</label>
                <input type="number" min="1" value={item.qty} onChange={e=>updItem(idx,"qty",e.target.value)} style={{width:"100%",padding:"8px 10px",border:`1.5px solid ${C.areia}`,borderRadius:3,fontSize:13,color:C.cafe}}/>
              </div>
              <div>
                <label style={{fontSize:10,fontWeight:600,color:C.oliva,textTransform:"uppercase",display:"block",marginBottom:3}}>Preço unit.</label>
                <input type="number" value={item.price} onChange={e=>updItem(idx,"price",e.target.value)} style={{width:"100%",padding:"8px 10px",border:`1.5px solid ${C.areia}`,borderRadius:3,fontSize:13,color:C.cafe}}/>
              </div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              {selProd?.cores?.length>0
                ?<Sel label="Cor" value={item.color} onChange={v=>updItem(idx,"color",v)} options={["—",...selProd.cores.map(c=>c.nome)]}/>
                :<Inp label="Cor" value={item.color} onChange={v=>updItem(idx,"color",v)}/>}
              {selProd?.tamanhos?.length>0
                ?<Sel label="Tamanho" value={item.size} onChange={v=>updItem(idx,"size",v)} options={["—",...selProd.tamanhos]}/>
                :<Inp label="Tamanho" value={item.size} onChange={v=>updItem(idx,"size",v)}/>}
            </div>
            <div style={{textAlign:"right",marginTop:6,fontSize:12,fontWeight:700,color:C.dourado}}>Subtotal: {fmtBRL(Number(item.price)*Number(item.qty||1))}</div>
          </div>
        );
      })}
      <Btn sm v="ghost" onClick={addItem}>+ Adicionar produto</Btn>
      {itens.length>1&&<div style={{background:C.cafe,color:"#fff",borderRadius:6,padding:"8px 12px",marginTop:8,display:"flex",justifyContent:"space-between"}}>
        <span style={{fontSize:13,fontWeight:700}}>Total dos itens</span>
        <span style={{fontSize:15,fontFamily:"'Playfair Display',serif",fontWeight:700}}>{fmtBRL(totalItens)}</span>
      </div>}

      <Divider label="Detalhes do pedido"/>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        <div style={{gridColumn:"1/-1"}}><Inp label="Medidas" value={form.measures} onChange={v=>setForm(f=>({...f,measures:v}))} placeholder="Ex: Busto 90cm / Comprimento 60cm"/></div>

        {/* DESCONTO */}
        <div>
          <label style={{fontSize:11,fontWeight:600,letterSpacing:"0.8px",color:C.oliva,textTransform:"uppercase",display:"block",marginBottom:4}}>Desconto</label>
          <div style={{display:"flex",gap:6}}>

        {form.condicao==="Parcelado"&&<div style={{gridColumn:"1/-1"}}>
          <div style={{display:"flex",gap:10,marginBottom:10,flexWrap:"wrap",alignItems:"center"}}>

              const n=parseInt(form.qtdParcelas,10)||2;

                </div>

            </div>

        </div>}

        <div style={{gridColumn:"1/-1"}}><Sel label="Status" value={form.status} onChange={v=>setForm(f=>({...f,status:v}))} options={Object.keys(STATUS).filter(s=>s!=="Cancelado")}/></div>

      {/* RESUMO FINAL */}
      <div style={{background:`linear-gradient(135deg,${C.cafe},#3D2B1F)`,borderRadius:6,padding:"12px 16px",marginTop:12,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span style={{fontSize:13,color:"#FAF8F5",fontWeight:600}}>Total do pedido</span>
        <span style={{fontSize:20,fontFamily:"'Playfair Display',serif",color:C.dourado,fontWeight:700}}>{fmtBRL(pcd())}</span>
      </div>

      <div style={{display:"flex",gap:10,marginTop:16,justifyContent:"flex-end"}}>
        <Btn v="ghost" onClick={onClose}>Cancelar</Btn>
        <Btn onClick={onSave}>Salvar pedido</Btn>
      </div>
    </Modal>
  );
};

// ─── PRODUÇÃO ─────────────────────────────────────────────────────────────────
const Production = ({orders,products}) => {
  const active=orders.filter(o=>!["Concluído","Enviado","Cancelado","Pronto para envio"].includes(o.status)).sort((a,b)=>(a.position||999)-(b.position||999));
  const prontos=orders.filter(o=>o.status==="Pronto para envio");
  const totalH=active.reduce((a,o)=>{const p=products.find(x=>x.name===o.product);return a+(p?.hours||0);},0);
  return (
    <div className="fade" style={{padding:24}}>
      <div style={{display:"flex",gap:12,flexWrap:"wrap",marginBottom:18}}>
        {[{l:"Horas na fila",v:`${totalH}h`,c:C.dourado},{l:"Horas/semana",v:`${TOTAL_WH}h`,c:C.cafe},{l:"Semanas necessárias",v:Math.ceil(totalH/TOTAL_WH)||0,c:C.oliva}].map(k=>(
          <Card key={k.l} style={{flex:"1 1 130px",textAlign:"center"}}><div style={{fontSize:26,fontFamily:"'Playfair Display',serif",color:k.c}}>{k.v}</div><div style={{fontSize:10,color:C.oliva,letterSpacing:"1px",textTransform:"uppercase",marginTop:2}}>{k.l}</div></Card>
        ))}
      </div>
      <h3 style={{fontSize:15,marginBottom:12}}>Fila de produção</h3>
      {active.length===0&&<div style={{textAlign:"center",padding:"30px",color:C.oliva,fontFamily:"'Cormorant Garamond',serif",fontStyle:"italic",fontSize:15}}>Nenhum pedido em produção ✦</div>}
      {active.map((o,idx)=>{
        const p=products.find(x=>x.name===o.product);
        const hrs=p?.hours||0,dias=calcDays(hrs),buf=p?.buffer||0;
        const pct=o.status==="Pedido recebido"?5:o.status==="Materiais separados"?15:o.status==="Em produção"?55:o.status==="Finalização"?85:o.status==="Pronto para envio"?100:0;
        return (
          <Card key={o.id} style={{marginBottom:10}}>
            <div style={{display:"flex",gap:12,flexWrap:"wrap",alignItems:"center"}}>
              <div style={{width:26,height:26,borderRadius:"50%",background:C.cafe,color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,flexShrink:0}}>{idx+1}</div>
              <div style={{flex:1}}><div style={{fontSize:13,fontWeight:700}}>{o.product}</div><div style={{fontSize:11,color:C.oliva}}>{o.client}{o.color?` · ${o.color}`:""}{ o.size?` · ${o.size}`:""}</div></div>
              {[{l:"Horas",v:`${hrs}h`},{l:"Dias prod.",v:`${dias}d`},{l:"Buffer",v:`+${buf}d`},{l:"Total",v:`${dias+buf}d`,h:true}].map(x=><div key={x.l} style={{textAlign:"center"}}><div style={{fontSize:10,color:C.oliva}}>{x.l}</div><div style={{fontSize:14,fontWeight:700,color:x.h?C.dourado:C.cafe}}>{x.v}</div></div>)}
              <Badge label={o.status}/>
            </div>
            <div style={{marginTop:8}}><PBar pct={pct}/></div>
          </Card>
        );
      })}
    </div>
  );
};

// ─── ESTOQUE ──────────────────────────────────────────────────────────────────
const StockSup = ({stockSup,setStockSup}) => {
  const [search,setSearch]=useState("");
  const [modal,setModal]=useState(null);
  const [moveModal,setMoveModal]=useState(null);
  const [histModal,setHistModal]=useState(null);
  const [moveQty,setMoveQty]=useState(1);
  const [moveNota,setMoveNota]=useState("");
  const EF={nome:"",tipo:"Linha/Fio",unidade:"un",qty:0,min:0,custoUnitario:0,fornecedor:"",foto:"",historico:[]};
  const [form,setForm]=useState(EF);
  const fileRef=useRef();
  const filtered=stockSup.filter(s=>s.nome.toLowerCase().includes(search.toLowerCase()));
  const low=stockSup.filter(s=>Number(s.qty)<=Number(s.min));

  const save=()=>{
    const s={...form,qty:Number(form.qty),min:Number(form.min),custoUnitario:Number(form.custoUnitario)};
    if(modal==="new")setStockSup(prev=>[...prev,{...s,id:uid(),historico:[{data:today,op:"entrada",qtd:s.qty,nota:"Cadastro inicial"}]}]);
    else setStockSup(prev=>prev.map(x=>x.id===s.id?{...x,...s}:x));
    setModal(null);
  };

  const move=(item,op)=>{
    const diff=op==="add"?Number(moveQty):-Number(moveQty);
    const newQty=Math.max(0,item.qty+diff);
    setStockSup(prev=>prev.map(x=>x.id===item.id?{...x,qty:newQty,historico:[{data:today,op:op==="add"?"entrada":"saída",qtd:Number(moveQty),nota:moveNota},...(x.historico||[])]}:x));
    setMoveModal(null);setMoveQty(1);setMoveNota("");
  };

  return (
    <div>
      <div style={{display:"flex",gap:10,marginBottom:14,flexWrap:"wrap",alignItems:"center"}}>
        <div style={{flex:1,minWidth:160}}><Inp value={search} onChange={setSearch} placeholder="Buscar material..."/></div>
        <Btn onClick={()=>{setForm(EF);setModal("new");}}>+ Novo Material</Btn>
      </div>
      <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:14}}>
        {[{l:"Itens",v:stockSup.length},{l:"Valor em estoque",v:fmtBRL(stockSup.reduce((a,s)=>a+Number(s.qty||0)*Number(s.custoUnitario||0),0))},{l:"Abaixo do mínimo",v:low.length}].map(k=><Card key={k.l} style={{flex:"1 1 120px",textAlign:"center"}}><div style={{fontSize:20,fontFamily:"'Playfair Display',serif",color:C.dourado}}>{k.v}</div><div style={{fontSize:10,color:C.oliva,letterSpacing:"1px",marginTop:2,textTransform:"uppercase"}}>{k.l}</div></Card>)}
      </div>
      {filtered.length===0&&<div style={{textAlign:"center",padding:"30px",color:C.oliva,fontFamily:"'Cormorant Garamond',serif",fontStyle:"italic",fontSize:14}}>Nenhum material cadastrado ainda ✦</div>}
      <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
        {filtered.map(s=>(
          <div key={s.id} className="ch" style={{flex:"1 1 180px",minWidth:170,background:C.branco,border:`1px solid ${Number(s.qty)<=Number(s.min)?C.dourado:C.areia}`,borderRadius:8,overflow:"hidden",position:"relative"}}>
            {Number(s.qty)<=Number(s.min)&&<div style={{position:"absolute",top:6,right:6,background:C.vermelho,color:"#fff",fontSize:9,fontWeight:700,padding:"2px 6px",borderRadius:10,zIndex:1}}>Baixo</div>}
            <div style={{height:80,background:s.foto?undefined:`linear-gradient(135deg,${C.areia},${C.dourado})`,backgroundImage:s.foto?`url(${s.foto})`:"none",backgroundSize:"cover",backgroundPosition:"center",display:"flex",alignItems:"center",justifyContent:"center",fontSize:28}}>{!s.foto&&"🧶"}</div>
            <div style={{padding:"10px 12px"}}>
              <div style={{fontSize:13,fontWeight:700}}>{s.nome}</div>
              <div style={{fontSize:10,color:C.oliva,marginBottom:5}}>{s.tipo}</div>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
                <span style={{fontSize:13,fontWeight:700}}>{s.qty} {s.unidade}</span>
                <span style={{fontSize:11,color:C.dourado}}>{fmtBRL(s.custoUnitario)}/{s.unidade}</span>
              </div>
              <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                <Btn sm v="oliva" onClick={()=>setMoveModal({item:s,op:"add"})}>➕</Btn>
                <Btn sm v="danger" onClick={()=>setMoveModal({item:s,op:"sub"})}>➖</Btn>
                <Btn sm v="ghost" onClick={()=>{setForm({...EF,...s,historico:s.historico||[]});setModal("edit");}}>✎</Btn>
                <Btn sm v="ghost" onClick={()=>setHistModal(s)}>📋</Btn>
                <Btn sm v="danger" onClick={()=>{if(window.confirm(`Excluir "${s.nome}"?`))setStockSup(prev=>prev.filter(x=>x.id!==s.id));}}>✕</Btn>
              </div>
            </div>
          </div>
        ))}
      </div>

      {moveModal&&<Modal title={moveModal.op==="add"?"Adicionar quantidade":"Registrar saída"} onClose={()=>setMoveModal(null)}>
        <div style={{textAlign:"center",marginBottom:14}}>
          <div style={{fontSize:15,fontWeight:700}}>{moveModal.item.nome}</div>
          <div style={{fontSize:26,fontFamily:"'Playfair Display',serif",color:C.dourado,marginTop:4}}>{moveModal.item.qty} {moveModal.item.unidade}</div>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          <Inp label={`Quantidade (${moveModal.item.unidade})`} type="number" value={moveQty} onChange={setMoveQty}/>
          <Inp label="Observação" value={moveNota} onChange={setMoveNota} placeholder="Ex: compra, uso em pedido..."/>
        </div>
        <div style={{display:"flex",justifyContent:"flex-end",marginTop:14}}>
          <Btn v={moveModal.op==="add"?"primary":"danger"} onClick={()=>move(moveModal.item,moveModal.op)}>Confirmar</Btn>
        </div>
      </Modal>}

      {histModal&&<Modal title={`Histórico — ${histModal.nome}`} onClose={()=>setHistModal(null)}>
        {!(histModal.historico?.length)&&<div style={{fontSize:13,color:C.oliva,fontStyle:"italic",textAlign:"center"}}>Sem movimentações.</div>}
        {(histModal.historico||[]).map((h,i)=><div key={i} style={{display:"flex",gap:10,padding:"7px 0",borderBottom:`1px solid ${C.linho}`}}>
          <div style={{width:26,height:26,borderRadius:"50%",background:h.op==="entrada"?"#D4E8D4":"#FEE",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,flexShrink:0}}>{h.op==="entrada"?"➕":"➖"}</div>
          <div style={{flex:1}}><div style={{fontSize:12,fontWeight:700,color:h.op==="entrada"?C.oliva:C.vermelho}}>{h.op==="entrada"?"+":"-"}{h.qtd} {histModal.unidade}</div>{h.nota&&<div style={{fontSize:11,color:C.oliva}}>{h.nota}</div>}</div>
          <div style={{fontSize:11,color:C.oliva,flexShrink:0}}>{fmtDate(h.data)}</div>
        </div>)}
      </Modal>}

      {modal&&<Modal title={modal==="new"?"Novo Material":"Editar Material"} onClose={()=>setModal(null)}>
        <div style={{display:"flex",gap:12,alignItems:"center",marginBottom:12}}>
          <div style={{width:56,height:56,borderRadius:6,background:form.foto?undefined:`linear-gradient(135deg,${C.areia},${C.dourado})`,backgroundImage:form.foto?`url(${form.foto})`:"none",backgroundSize:"cover",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,cursor:"pointer",border:`2px dashed ${C.areia}`}} onClick={()=>fileRef.current.click()}>{!form.foto&&"📷"}</div>
          <Btn sm v="ghost" onClick={()=>fileRef.current.click()}>📷 Foto do fio/material</Btn>
          <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={async e=>{if(e.target.files[0]){const u=await readFile(e.target.files[0]);setForm(f=>({...f,foto:u}));}}}/>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <div style={{gridColumn:"1/-1"}}><Inp label="Nome" value={form.nome} onChange={v=>setForm(f=>({...f,nome:v}))}/></div>
          <Sel label="Tipo" value={form.tipo} onChange={v=>setForm(f=>({...f,tipo:v}))} options={TIPOS_SUP}/>
          <Sel label="Unidade" value={form.unidade} onChange={v=>setForm(f=>({...f,unidade:v}))} options={UNIDADES}/>
          <Inp label="Quantidade atual" type="number" value={form.qty} onChange={v=>setForm(f=>({...f,qty:v}))}/>
          <Inp label="Estoque mínimo" type="number" value={form.min} onChange={v=>setForm(f=>({...f,min:v}))}/>
          <Inp label="Custo unitário (R$)" type="number" value={form.custoUnitario} onChange={v=>setForm(f=>({...f,custoUnitario:v}))}/>
          <Inp label="Fornecedor" value={form.fornecedor} onChange={v=>setForm(f=>({...f,fornecedor:v}))}/>
        </div>
        <div style={{display:"flex",gap:10,marginTop:14,justifyContent:"flex-end"}}><Btn v="ghost" onClick={()=>setModal(null)}>Cancelar</Btn><Btn onClick={save}>Salvar</Btn></div>
      </Modal>}
    </div>
  );
};

              <div><div style={{fontSize:13,fontWeight:700}}>{p.name}</div><div style={{fontSize:11,color:C.oliva}}>{p.category}</div></div>
            </div>

              <button onClick={()=>setProducts(prev=>prev.map(x=>x.id===p.id?{...x,stock:Math.max(0,(x.stock||0)-1)}:x))} style={{width:28,height:28,borderRadius:"50%",border:`1.5px solid ${C.areia}`,background:"transparent",fontSize:16,cursor:"pointer"}}>−</button>
              <span style={{fontSize:18,fontWeight:700,width:28,textAlign:"center"}}>{p.stock||0}</span>
              <button onClick={()=>setProducts(prev=>prev.map(x=>x.id===p.id?{...x,stock:(x.stock||0)+1}:x))} style={{width:28,height:28,borderRadius:"50%",border:`1.5px solid ${C.areia}`,background:"transparent",fontSize:16,cursor:"pointer"}}>+</button>
            </div>
          </Card>
        ))}
      </div>

};
