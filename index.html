              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
                <div>
                  <label style={{fontSize:11,fontWeight:600,color:C.oliva,textTransform:"uppercase",letterSpacing:"0.8px",display:"block",marginBottom:4}}>Dia de vencimento</label>
                  <input type="number" min="1" max="31" value={form.diaFixo||10} onChange={e=>setForm(f=>({...f,diaFixo:Number(e.target.value)}))} style={{width:"100%",padding:"9px 13px",border:`2px solid ${C.cafe}`,borderRadius:3,fontSize:16,fontWeight:700,color:C.cafe,background:"#fff"}}/>
                </div>
                <div>
                  <label style={{fontSize:11,fontWeight:600,color:C.oliva,textTransform:"uppercase",letterSpacing:"0.8px",display:"block",marginBottom:4}}>Nº de meses</label>
                  <input type="number" min="1" max="120" value={form.qtdMeses||12} onChange={e=>setForm(f=>({...f,qtdMeses:Number(e.target.value)}))} style={{width:"100%",padding:"9px 13px",border:`2px solid ${C.cafe}`,borderRadius:3,fontSize:16,fontWeight:700,color:C.cafe,background:"#fff"}}/>
                </div>
              </div>
              <div style={{background:"#fff",borderRadius:4,padding:"10px 12px",fontSize:12,color:C.cafe,borderLeft:`3px solid ${C.dourado}`}}>

      </Modal>}

      {contaModal&&<Modal title={cForm.id?"Editar Conta":"Nova Conta"} onClose={()=>setContaModal(false)}>
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <Inp label="Nome da conta" value={cForm.nome} onChange={v=>setCForm(f=>({...f,nome:v}))} placeholder="Ex: Mercado Pago, Nubank..."/>

          <div><label style={{fontSize:11,fontWeight:600,letterSpacing:"0.8px",color:C.oliva,textTransform:"uppercase",display:"block",marginBottom:6}}>Cor</label>

          </div>
        </div>
        <div style={{display:"flex",gap:10,marginTop:16,justifyContent:"flex-end"}}>
          {cForm.id&&<Btn v="danger" onClick={()=>{setContas(prev=>prev.filter(c=>c.id!==cForm.id));setContaModal(false);}}>Excluir</Btn>}
          <Btn v="ghost" onClick={()=>setContaModal(false)}>Cancelar</Btn><Btn onClick={saveConta}>Salvar</Btn>
        </div>
      </Modal>}

      {transModal&&<Modal title="Transferência entre contas" onClose={()=>setTransModal(false)}>
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <Sel label="Da conta" value={tForm.de} onChange={v=>setTForm(f=>({...f,de:v}))} options={contas.map(c=>({v:c.id,l:c.nome}))}/>
          <Sel label="Para conta" value={tForm.para} onChange={v=>setTForm(f=>({...f,para:v}))} options={contas.map(c=>({v:c.id,l:c.nome}))}/>
          <Inp label="Valor (R$)" type="number" value={tForm.valor} onChange={v=>setTForm(f=>({...f,valor:v}))}/>
          <Inp label="Data" type="date" value={tForm.data} onChange={v=>setTForm(f=>({...f,data:v}))}/>
          <Inp label="Observação" value={tForm.nota} onChange={v=>setTForm(f=>({...f,nota:v}))}/>
        </div>
        <div style={{display:"flex",gap:10,marginTop:16,justifyContent:"flex-end"}}><Btn v="ghost" onClick={()=>setTransModal(false)}>Cancelar</Btn><Btn onClick={doTrans}>Transferir</Btn></div>

    </div>

};

// ─── METAS ────────────────────────────────────────────────────────────────────
const Metas = ({finance,orders,metas,setMetas}) => {
  const anoAtual=new Date().getFullYear();
  const [anoSel,setAnoSel]=useState(anoAtual);
  const [editando,setEditando]=useState(false);
  const metaAno=metas.find(m=>m.ano===anoSel)||{ano:anoSel,faturamentoMensal:3000,encomendas:10,produtosVendidos:15,investimentoAnual:10000};
  const [form,setForm]=useState(metaAno);

  useEffect(()=>{const m=metas.find(x=>x.ano===anoSel)||{ano:anoSel,faturamentoMensal:3000,encomendas:10,produtosVendidos:15,investimentoAnual:10000};setForm(m);},[anoSel,metas]);

  const mesAtual=today.slice(0,7);
  const fatMes=finance.filter(f=>f.type==="receita"&&f.date?.startsWith(mesAtual)).reduce((a,f)=>a+f.value,0);
  const encMes=orders.filter(o=>o.dataCompra?.startsWith(mesAtual)&&o.status!=="Cancelado").length;
  const invAno=finance.filter(f=>f.centrocusto==="Investimentos"&&f.date?.startsWith(String(anoSel))).reduce((a,f)=>a+f.value,0);

  const salvar=()=>{setMetas(prev=>[...prev.filter(m=>m.ano!==anoSel),{...form,ano:anoSel}]);setEditando(false);};

  const MetaCard=({icon,label,meta,real,fmt,cor})=>{
    const pct=meta>0?Math.min(100,(real/meta)*100):0;
    return(
      <Card style={{flex:"1 1 200px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <div><div style={{fontSize:18}}>{icon}</div><div style={{fontSize:13,fontWeight:700,color:C.cafe,marginTop:1}}>{label}</div></div>
          <div style={{textAlign:"right"}}><div style={{fontSize:20,fontFamily:"'Playfair Display',serif",fontWeight:700,color:cor||C.dourado}}>{fmt(real)}</div><div style={{fontSize:11,color:C.oliva}}>de {fmt(meta)}</div></div>
        </div>
        <PBar pct={pct} color={pct>=100?C.verde:pct>=70?C.dourado:pct>=40?C.oliva:C.areia}/>
        <div style={{display:"flex",justifyContent:"space-between",marginTop:5}}>
          <span style={{fontSize:11,color:C.oliva}}>{pct.toFixed(0)}% atingido</span>
          {pct>=100?<span style={{fontSize:11,fontWeight:700,color:C.verde}}>✓ Meta atingida!</span>:<span style={{fontSize:11,color:C.oliva}}>Falta {fmt(Math.max(0,meta-real))}</span>}
        </div>

    const arredondado=Math.ceil(comDesc/5)*5;

const Agenda = ({orders,compromissos,setCompromissos,publicacoes,setPublicacoes,ideias,setIdeias}) => {
  const hoje=new Date();
  const [anoVis,setAnoVis]=useState(hoje.getFullYear());
  const [mesVis,setMesVis]=useState(hoje.getMonth());
  const [diaSel,setDiaSel]=useState(null);
  const [tab,setTab]=useState("calendario");
  const [modal,setModal]=useState(null);
  const [sugestoesModal,setSugestoesModal]=useState(false);
  const [form,setForm]=useState({desc:"",data:"",hora:"",prioridade:"Normal",status:"Pendente",tipo:"Compromisso"});
  const [formPub,setFormPub]=useState({data:"",tipo:"",status:"Pendente",obs:""});
  const [formIdeia,setFormIdeia]=useState({titulo:"",desc:"",categoria:"Artesanato",utilizada:false});
  const CATS_IDEIA=["Artesanato","Obra","Empreendedorismo","Clientes","Marketing","Vendas","Propósito","Reflexão","Fé","Produtos","Livro","Criatividade"];

  const diasNoMes=new Date(anoVis,mesVis+1,0).getDate();
  const primeiroDia=new Date(anoVis,mesVis,1).getDay();
  const mesesNomes=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  const diasSem=["D","S","T","Q","Q","S","S"];

  const getDiaStr=(d)=>`${anoVis}-${String(mesVis+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  const compDia=(d)=>compromissos.filter(c=>c.data===getDiaStr(d));
  const pubDia=(d)=>publicacoes.filter(p=>p.data===getDiaStr(d));
  const encDia=(d)=>orders.filter(o=>o.delivery===getDiaStr(d)&&!["Cancelado","Concluído","Enviado"].includes(o.status));

  const saveComp=()=>{
    if(modal==="editComp") setCompromissos(prev=>prev.map(x=>x.id===form.id?form:x));
    else setCompromissos(prev=>[...prev,{...form,id:uid(),data:getDiaStr(diaSel)}]);
    setModal(null);showSavedGlobal("Compromisso salvo!");
  };
  const savePub=()=>{
    setPublicacoes(prev=>[...prev,{...formPub,id:uid(),data:getDiaStr(diaSel)}]);
    setModal(null);showSavedGlobal("Publicação salva!");
  };
  const saveIdeia=()=>{
    if(modal==="editIdeia") setIdeias(prev=>prev.map(x=>x.id===formIdeia.id?formIdeia:x));
    else setIdeias(prev=>[...prev,{...formIdeia,id:uid(),data:today}]);
    setModal(null);showSavedGlobal("Ideia salva!");
  };

  const gerarCardIdeia=async(idea,imgFundo=null)=>{
    const W=1080,H=1080; // quadrado para feed/stories
    const canvas=document.createElement("canvas");
    canvas.width=W;canvas.height=H;
    const ctx=canvas.getContext("2d");

    if(imgFundo){
      // Com imagem de fundo
      await new Promise((res,rej)=>{
        const img=new Image();img.crossOrigin="anonymous";
        img.onload=()=>{
          const ir=img.width/img.height;
          let sw,sh,sx,sy;
          if(ir>1){sh=img.height;sw=sh;sx=(img.width-sw)/2;sy=0;}
          else{sw=img.width;sh=sw;sx=0;sy=(img.height-sh)/2;}
          ctx.drawImage(img,sx,sy,sw,sh,0,0,W,H);
          // Overlay escuro para texto legível
          const ov=ctx.createLinearGradient(0,0,0,H);
          ov.addColorStop(0,"rgba(26,39,68,0.45)");
          ov.addColorStop(0.5,"rgba(26,39,68,0.55)");
          ov.addColorStop(1,"rgba(26,39,68,0.75)");
          ctx.fillStyle=ov;ctx.fillRect(0,0,W,H);
          res();
        };img.onerror=rej;img.src=imgFundo;
      });
    } else {
      // Fundo padrão da marca
      const g=ctx.createLinearGradient(0,0,W,H);
      g.addColorStop(0,"#1A2744");g.addColorStop(0.5,"#2D1B69");g.addColorStop(1,"#A563A2");
      ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
      // Ornamentos
      ctx.fillStyle="rgba(216,180,206,0.06)";ctx.beginPath();ctx.arc(W*0.85,H*0.15,300,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="rgba(165,99,162,0.08)";ctx.beginPath();ctx.arc(W*0.1,H*0.85,250,0,Math.PI*2);ctx.fill();
    }

    // Caixa do texto central (estilo da sua referência)
    const bx=80,bw=W-160;
    // Quebra o texto em linhas
    ctx.font="bold 48px Georgia,serif";
    const words=idea.titulo.split(" ");
    const lines=[];let cur="";
    words.forEach(w=>{const t=cur+w+" ";if(ctx.measureText(t).width>bw-60&&cur){lines.push(cur.trim());cur=w+" ";}else cur=t;});
    lines.push(cur.trim());
    const lineH=64,textH=lines.length*lineH;
    const descLines=[];
    if(idea.desc){
      ctx.font="36px Georgia,serif";
      const dwords=idea.desc.split(" ");let dc="";
      dwords.forEach(w=>{const t=dc+w+" ";if(ctx.measureText(t).width>bw-80&&dc){descLines.push(dc.trim());dc=w+" ";}else dc=t;});
      descLines.push(dc.trim());
    }
    const descH=descLines.length*50;
    const totalH=textH+(descLines.length?descH+30:0);
    const byt=Math.max(H*0.28,(H-totalH)/2-40);

    // Caixa branca translúcida
    ctx.fillStyle="rgba(253,250,255,0.13)";
    ctx.beginPath();ctx.roundRect(bx,byt-30,bw,totalH+100,16);ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,0.2)";ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(bx,byt-30,bw,totalH+100,16);ctx.stroke();

    // Título
    ctx.fillStyle="#FDFAFF";ctx.textAlign="center";ctx.font="bold 48px Georgia,serif";
    lines.forEach((l,i)=>{
      if(i===0){ctx.fillStyle="#D8B4CE";}else{ctx.fillStyle="#FDFAFF";}
      ctx.fillText(l,W/2,byt+i*lineH);
    });

    // Linha decorativa
    let lineY=byt+textH+10;
    ctx.strokeStyle="#A563A2";ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(W/2-80,lineY);ctx.lineTo(W/2+80,lineY);ctx.stroke();
    ctx.fillStyle="#A563A2";ctx.font="28px serif";ctx.fillText("♥",W/2,lineY+8);

    // Descrição
    if(descLines.length){
      ctx.fillStyle="rgba(253,250,255,0.82)";ctx.font="italic 34px Georgia,serif";
      descLines.forEach((l,i)=>ctx.fillText(l,W/2,lineY+60+i*50));
    }

    // @simara.lobui no rodapé (como na sua referência)
    ctx.fillStyle="rgba(216,180,206,0.7)";ctx.font="26px Arial,sans-serif";ctx.letterSpacing="2px";
    ctx.fillText("@simara.lobui",W/2,H-44);

    // Preview + download
    const url=canvas.toDataURL("image/png");
    const pw=window.open("","_blank","width=500,height=560");
    if(pw){
      pw.document.write(`<!DOCTYPE html><html><head><title>Card — ${idea.titulo}</title><style>body{margin:0;background:#1A2744;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:sans-serif;padding:20px;gap:12px;}img{max-width:400px;border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,0.5);}a{background:#A563A2;color:#fff;padding:12px 28px;border-radius:24px;text-decoration:none;font-weight:700;font-size:13px;letter-spacing:1px;}p{color:#D8B4CE;font-size:11px;margin:0;}</style></head><body><img src="${url}"><a href="${url}" download="card-frase.png">⬇️ Baixar imagem</a><p>1080 × 1080 px · Feed e Stories</p></body></html>`);
      pw.document.close();
    }
    showSavedGlobal("Card gerado! ✨");
  };

  const [cardModal,setCardModal]=useState(null);
  const [imgFundoCard,setImgFundoCard]=useState(null);
  const imgFundoRef=useRef();

  return(
    <div className="fade" style={{padding:24}}>
      <Tabs tabs={[{k:"calendario",l:"📅 Calendário"},{k:"publicacoes",l:"📱 Publicações"},{k:"ideias",l:"💡 Banco de Ideias"}]} active={tab} set={setTab}/>

      {tab==="calendario"&&<>
        {/* Navegação do mês */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
          <button onClick={()=>{if(mesVis===0){setMesVis(11);setAnoVis(a=>a-1);}else setMesVis(m=>m-1);}} style={{background:"none",border:`1px solid ${C.areia}`,borderRadius:4,padding:"4px 12px",cursor:"pointer",fontSize:16}}>‹</button>
          <h3 style={{fontSize:18,fontFamily:"'Cormorant Garamond',serif"}}>{mesesNomes[mesVis]} {anoVis}</h3>
          <button onClick={()=>{if(mesVis===11){setMesVis(0);setAnoVis(a=>a+1);}else setMesVis(m=>m+1);}} style={{background:"none",border:`1px solid ${C.areia}`,borderRadius:4,padding:"4px 12px",cursor:"pointer",fontSize:16}}>›</button>
        </div>
        {/* Grid calendário */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2,marginBottom:16}}>

            const dStr=getDiaStr(d);

            const temUrg=compDia(d).some(c=>c.prioridade==="Alta");
            return(
              <div key={d} onClick={()=>{setDiaSel(d);}} style={{minHeight:52,border:`1px solid ${diaSel===d?C.cafe:isHoje?C.dourado:C.areia}`,borderRadius:4,padding:4,cursor:"pointer",background:diaSel===d?C.linho:isHoje?"#FFFDF5":"#fff",position:"relative"}}>

                {total>0&&<div style={{display:"flex",gap:2,flexWrap:"wrap",marginTop:2}}>
                  {compDia(d).length>0&&<div style={{width:6,height:6,borderRadius:"50%",background:temUrg?C.vermelho:C.cafe}}/>}
                  {pubDia(d).length>0&&<div style={{width:6,height:6,borderRadius:"50%",background:C.dourado}}/>}
                  {encDia(d).length>0&&<div style={{width:6,height:6,borderRadius:"50%",background:C.oliva}}/>}
                </div>}
              </div>
            );
          })}
        </div>
        {/* Legenda */}
        <div style={{display:"flex",gap:12,marginBottom:16,fontSize:10,color:C.oliva}}>
          <span><span style={{display:"inline-block",width:8,height:8,borderRadius:"50%",background:C.cafe,marginRight:4}}/>Compromisso</span>
          <span><span style={{display:"inline-block",width:8,height:8,borderRadius:"50%",background:C.dourado,marginRight:4}}/>Publicação</span>
          <span><span style={{display:"inline-block",width:8,height:8,borderRadius:"50%",background:C.oliva,marginRight:4}}/>Encomenda</span>
        </div>

        {/* Detalhe do dia selecionado */}
        {diaSel&&<Card style={{borderTop:`3px solid ${C.cafe}`}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
            <h3 style={{fontSize:16,fontFamily:"'Cormorant Garamond',serif"}}>{String(diaSel).padStart(2,"0")}/{String(mesVis+1).padStart(2,"0")}/{anoVis}</h3>
            <div style={{display:"flex",gap:6}}>
              <Btn sm onClick={()=>{setForm({desc:"",data:getDiaStr(diaSel),hora:"",prioridade:"Normal",status:"Pendente",tipo:"Compromisso"});setModal("comp");}}>+ Compromisso</Btn>
              <Btn sm v="ghost" onClick={()=>{setFormPub({data:getDiaStr(diaSel),tipo:"",status:"Pendente",obs:""});setModal("pub");}}>+ Publicação</Btn>
            </div>

            {TIPOS_PUB.map(tarefa=>{

                  } else {

                  <span style={{fontSize:16,flexShrink:0}}>{conc?"✅":"⬜"}</span>

            {encDia(diaSel).map(o=><div key={o.id} style={{display:"flex",gap:8,alignItems:"center",padding:"6px 10px",background:"#E8EDE1",borderRadius:4,marginBottom:4}}>
              <span style={{fontSize:11,color:C.oliva}}>✓</span>

          {/* Compromissos do dia */}
          {compDia(diaSel).length>0&&<>
            <div style={{fontSize:10,fontWeight:700,color:C.oliva,letterSpacing:"1.5px",textTransform:"uppercase",marginBottom:6}}>📌 Compromissos</div>
            {compDia(diaSel).sort((a,b)=>(a.hora||"").localeCompare(b.hora||"")).map(c=>(
              <div key={c.id} style={{padding:"8px 10px",background:c.status==="Concluído"?"#E8EDE1":c.status==="Adiado"?"#FEF3E9":c.prioridade==="Alta"?"rgba(192,57,43,0.06)":C.linho,borderRadius:4,marginBottom:6,borderLeft:`3px solid ${c.status==="Concluído"?C.oliva:c.status==="Adiado"?C.dourado:c.prioridade==="Alta"?C.vermelho:C.cafe}`}}>

                    {STATUS_COMP.map(s=><option key={s}>{s}</option>)}

                  <button onClick={()=>{setForm({...c});setModal("editComp");}} style={{fontSize:11,background:"none",border:"none",cursor:"pointer",color:C.oliva}}>✎</button>
                  <button onClick={()=>{if(window.confirm("Excluir?"))setCompromissos(prev=>prev.filter(x=>x.id!==c.id));}} style={{fontSize:11,background:"none",border:"none",cursor:"pointer",color:C.vermelho}}>✕</button>

                {c.status==="Adiado"&&<div style={{marginTop:6,display:"flex",gap:8,alignItems:"center"}}>
                  <span style={{fontSize:10,color:C.dourado,fontWeight:600}}>📅 Adiar para:</span>
                  <input type="date" defaultValue={c.novaData||""} onChange={e=>setCompromissos(prev=>prev.map(x=>x.id===c.id?{...x,novaData:e.target.value}:x))} style={{fontSize:11,padding:"3px 8px",border:`1px solid ${C.areia}`,borderRadius:3,color:C.cafe}}/>
                  {c.novaData&&<Btn sm v="ghost" onClick={()=>setCompromissos(prev=>prev.map(x=>x.id===c.id?{...x,data:c.novaData,status:"Pendente",novaData:""}:x))}>✓ Confirmar</Btn>}
                </div>}
              </div>
            ))}
            <div style={{height:1,background:C.areia,margin:"10px 0"}}/>
          </>}
          {/* Publicações do dia */}
          {pubDia(diaSel).length>0&&<>
            <div style={{fontSize:10,fontWeight:700,color:C.oliva,letterSpacing:"1.5px",textTransform:"uppercase",marginBottom:6}}>📱 Publicações</div>
            {pubDia(diaSel).map(p=><div key={p.id} style={{display:"flex",gap:8,alignItems:"center",padding:"6px 10px",background:C.linho,borderRadius:4,marginBottom:4}}>
              <button onClick={()=>setPublicacoes(prev=>prev.map(x=>x.id===p.id?{...x,status:x.status==="Concluído"?"Pendente":"Concluído"}:x))} style={{fontSize:14,background:"none",border:"none",cursor:"pointer"}}>{p.status==="Concluído"?"✅":"⬜"}</button>
              <span style={{flex:1,fontSize:12,textDecoration:p.status==="Concluído"?"line-through":"none"}}>{p.tipo}</span>

            </div>)}
          </>}
          {encDia(diaSel).length===0&&compDia(diaSel).length===0&&pubDia(diaSel).length===0&&

        </Card>}
      </>}

      {tab==="publicacoes"&&<>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <p style={{fontFamily:"'Cormorant Garamond',serif",fontSize:14,fontStyle:"italic",color:C.oliva}}>Planejamento das redes sociais ✦</p>
          <Btn sm v="ghost" onClick={()=>setSugestoesModal(true)}>💡 Sugerir conteúdo</Btn>
        </div>
        <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>

            </div>
          ))}

        </div>

      {tab==="ideias"&&<>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:14}}>
          <p style={{fontFamily:"'Cormorant Garamond',serif",fontSize:14,fontStyle:"italic",color:C.oliva}}>Capture suas ideias antes que sumam ✦</p>
          <Btn onClick={()=>{setFormIdeia({titulo:"",desc:"",categoria:"Artesanato",utilizada:false});setModal("ideia");}}>+ Nova Ideia</Btn>
        </div>
        <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
          {ideias.sort((a,b)=>(b.data||"").localeCompare(a.data||"")).map(idea=>(
            <Card key={idea.id} style={{flex:"1 1 220px",opacity:idea.utilizada?0.6:1}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
                <span style={{fontSize:9,background:C.linho,color:C.oliva,padding:"2px 8px",borderRadius:10,fontWeight:600,letterSpacing:"1px",textTransform:"uppercase"}}>{idea.categoria}</span>
                <div style={{display:"flex",gap:4}}>
                  {idea.utilizada&&<span style={{fontSize:9,background:"#D4E8D4",color:"#2E6B2E",padding:"2px 7px",borderRadius:10,fontWeight:700}}>✓ Utilizada</span>}

                </div>
              </div>

                <Btn sm v="ghost" onClick={e=>{e.stopPropagation();setCardModal(idea);setImgFundoCard(null);}}>📤 Compartilhar</Btn>
                <Btn sm v="ghost" onClick={()=>{setFormIdeia({...idea});setModal("editIdeia");}}>{idea.utilizada?"↩ Desfazer":"✓ Utilizada"}</Btn>
                <Btn sm v="danger" onClick={()=>{if(window.confirm("Excluir ideia?"))setIdeias(prev=>prev.filter(x=>x.id!==idea.id));}}>✕</Btn>
              </div>
            </Card>
          ))}
          {ideias.length===0&&<div style={{width:"100%",textAlign:"center",padding:"30px",color:C.oliva,fontStyle:"italic"}}>Nenhuma ideia ainda ✦</div>}
        </div>
      </>}

      {/* Modal compromisso */}
      {(modal==="comp"||modal==="editComp")&&<Modal title={modal==="editComp"?"Editar Compromisso":"Novo Compromisso"} onClose={()=>setModal(null)}>
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <Inp label="Descrição" value={form.desc} onChange={v=>setForm(f=>({...f,desc:v}))} placeholder="Ex: Enviar encomenda, Reunião..."/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            <Inp label="Data" type="date" value={form.data} onChange={v=>setForm(f=>({...f,data:v}))}/>
            <Inp label="Horário" value={form.hora} onChange={v=>setForm(f=>({...f,hora:v}))} placeholder="Ex: 08:00"/>
            <Sel label="Prioridade" value={form.prioridade} onChange={v=>setForm(f=>({...f,prioridade:v}))} options={PRIORIDADES}/>
            <Sel label="Status" value={form.status} onChange={v=>setForm(f=>({...f,status:v}))} options={STATUS_COMP}/>
          </div>
        </div>
        <div style={{display:"flex",gap:10,marginTop:14,justifyContent:"flex-end"}}>
          <Btn v="ghost" onClick={()=>setModal(null)}>Cancelar</Btn>
          <Btn onClick={saveComp}>Salvar</Btn>
        </div>
      </Modal>}

      {/* Modal publicação */}
      {modal==="pub"&&<Modal title="Nova Publicação" onClose={()=>setModal(null)}>
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <Inp label="Data" type="date" value={formPub.data} onChange={v=>setFormPub(f=>({...f,data:v}))}/>
          <Sel label="Tipo de conteúdo" value={formPub.tipo} onChange={v=>setFormPub(f=>({...f,tipo:v}))} options={["",  ...TIPOS_PUB]}/>
          <Inp label="Observação (opcional)" value={formPub.obs} onChange={v=>setFormPub(f=>({...f,obs:v}))} placeholder="Tema, ideia, referência..."/>
        </div>
        <div style={{display:"flex",gap:10,marginTop:14,justifyContent:"flex-end"}}>
          <Btn v="ghost" onClick={()=>setModal(null)}>Cancelar</Btn>
          <Btn onClick={savePub}>Salvar</Btn>
        </div>
      </Modal>}

      {/* Modal ideia */}
      {(modal==="ideia"||modal==="editIdeia")&&<Modal title={modal==="editIdeia"?"Editar Ideia":"Nova Ideia"} onClose={()=>setModal(null)}>
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <Inp label="Título" value={formIdeia.titulo} onChange={v=>setFormIdeia(f=>({...f,titulo:v}))}/>
          <Sel label="Categoria" value={formIdeia.categoria} onChange={v=>setFormIdeia(f=>({...f,categoria:v}))} options={CATS_IDEIA}/>
          <Inp label="Descrição" value={formIdeia.desc} onChange={v=>setFormIdeia(f=>({...f,desc:v}))} rows={4}/>
        </div>
        <div style={{display:"flex",gap:10,marginTop:14,justifyContent:"flex-end"}}>
          <Btn v="ghost" onClick={()=>setModal(null)}>Cancelar</Btn>

        {SUGESTOES_CONTEUDO.map(cat=>(

        <div style={{background:C.linho,borderRadius:8,padding:"16px",marginBottom:14}}>
          <div style={{fontSize:13,fontWeight:700,color:C.oliva,marginBottom:4}}>{cardModal.titulo}</div>
          {cardModal.desc&&<div style={{fontSize:12,color:C.cafe,fontStyle:"italic",lineHeight:1.6}}>{cardModal.desc.slice(0,120)}{cardModal.desc.length>120?"...":""}</div>}
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          <div style={{fontSize:12,fontWeight:600,color:C.oliva,marginBottom:4}}>Escolha o fundo:</div>
          <div style={{display:"flex",gap:10}}>
            <div onClick={()=>setImgFundoCard(null)} style={{flex:1,padding:"12px",borderRadius:8,border:`2px solid ${!imgFundoCard?C.cafe:C.areia}`,background:!imgFundoCard?C.linho:"transparent",cursor:"pointer",textAlign:"center"}}>
              <div style={{width:"100%",height:60,borderRadius:6,background:"linear-gradient(135deg,#1A2744,#2D1B69,#A563A2)",marginBottom:6}}/>
              <div style={{fontSize:11,fontWeight:600,color:C.cafe}}>Fundo da marca</div>
              <div style={{fontSize:10,color:C.oliva}}>Roxo/Marinho padrão</div>
            </div>
            <div onClick={()=>imgFundoRef.current?.click()} style={{flex:1,padding:"12px",borderRadius:8,border:`2px solid ${imgFundoCard?C.cafe:C.areia}`,background:imgFundoCard?C.linho:"transparent",cursor:"pointer",textAlign:"center"}}>
              {imgFundoCard
                ?<img src={imgFundoCard} style={{width:"100%",height:60,objectFit:"cover",borderRadius:6,marginBottom:6}}/>
                :<div style={{width:"100%",height:60,borderRadius:6,background:C.areia,display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,marginBottom:6}}>🖼️</div>}
              <div style={{fontSize:11,fontWeight:600,color:C.cafe}}>{imgFundoCard?"Imagem selecionada":"Minha foto"}</div>
              <div style={{fontSize:10,color:C.oliva}}>Toque para escolher</div>
            </div>
          </div>
          <input ref={imgFundoRef} type="file" accept="image/*" style={{display:"none"}} onChange={e=>{
            if(e.target.files[0]){const r=new FileReader();r.onload=ev=>setImgFundoCard(ev.target.result);r.readAsDataURL(e.target.files[0]);}
          }}/>
          <div style={{fontSize:10,color:C.oliva,fontStyle:"italic",background:"#FEF3E9",borderRadius:4,padding:"8px 10px"}}>
            💡 Somente o texto vai para o banco de dados — a imagem de fundo fica só no card gerado.
          </div>
        </div>
        <div style={{display:"flex",gap:10,marginTop:16,justifyContent:"flex-end"}}>
          <Btn v="ghost" onClick={()=>setCardModal(null)}>Cancelar</Btn>
          <Btn onClick={()=>gerarCardIdeia(cardModal,imgFundoCard)}>✨ Gerar card</Btn>
        </div>
      </Modal>}
    </div>
  );
};
const CATS_CARTA=["Reflexões","Arte","Obra","Clientes","Vida","Fé","Empreendedorismo","Aprendizados","Livro","Cartas","Organização"];
const ORIGENS_CARTA=["Cliente","Obra","Ateliê","Família","Bíblia","Conversa","Dia comum","Reflexão pessoal","Outro"];
const STATUS_CARTA=["Rascunho","Pronto","Exportado"];

const Diario = ({cartas,setCartas,volumes,setVolumes}) => {
  const [tab,setTab]=useState("cartas");
  const [modal,setModal]=useState(null);
  const [verModal,setVerModal]=useState(null);
  const [exportModal,setExportModal]=useState(false);
  const [busca,setBusca]=useState("");
  const [filtCat,setFiltCat]=useState("Todas");
  const [filtStatus,setFiltStatus]=useState("Todos");
  const [selExport,setSelExport]=useState([]);
  const [tituloLivro,setTituloLivro]=useState("");
  const [volumeSel,setVolumeSel]=useState("");
  const [formVol,setFormVol]=useState({titulo:"",subtitulo:""});
  const EF={titulo:"",subtitulo:"",data:today,categoria:"Reflexões",texto:"",origem:"Dia comum",status:"Rascunho",foto:"",volume:"",assinatura:"Simara Lobui"};
  const [form,setForm]=useState(EF);
  const fotoRef=useRef();

  const filtered=cartas.filter(c=>{
    const matchBusca=!busca||c.titulo?.toLowerCase().includes(busca.toLowerCase())||c.texto?.toLowerCase().includes(busca.toLowerCase())||c.data?.includes(busca);
    const matchCat=filtCat==="Todas"||c.categoria===filtCat;
    const matchStatus=filtStatus==="Todos"||c.status===filtStatus;
    return matchBusca&&matchCat&&matchStatus;
  }).sort((a,b)=>(b.data||"").localeCompare(a.data||""));

  const save=()=>{
    if(modal==="edit") setCartas(prev=>prev.map(x=>x.id===form.id?form:x));
    else setCartas(prev=>[...prev,{...form,id:uid()}]);
    setModal(null);showSavedGlobal("Carta salva!");
  };

  const exportarPDF=async()=>{
    const selecionadas=cartas.filter(c=>selExport.includes(c.id));
    if(!selecionadas.length){alert("Selecione ao menos uma carta.");return;}
    // Gera HTML do livro para impressão
    const html=`<!DOCTYPE html><html><head><meta charset="utf-8">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Playfair+Display:wght@400;700&display=swap');

      .capa{page-break-after:always;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:60px 80px;background:#5C4033;}
      .capa h1{font-family:'Playfair Display',serif;font-size:42px;color:#FAF8F5;margin-bottom:16px;font-weight:400;}
      .capa h2{font-size:22px;color:#D8C3A5;font-style:italic;margin-bottom:32px;font-weight:400;}
      .capa .autor{font-size:18px;color:#B08D57;letter-spacing:3px;text-transform:uppercase;}
      .carta{page-break-before:always;padding:80px;min-height:100vh;}
      .carta-titulo{font-family:'Playfair Display',serif;font-size:28px;text-align:center;margin-bottom:8px;color:#5C4033;}
      .carta-sub{font-size:16px;text-align:center;font-style:italic;color:#6B7152;margin-bottom:12px;}
      .carta-meta{font-size:12px;text-align:center;color:#9A8A7A;margin-bottom:40px;letter-spacing:1px;}
      .carta-divider{width:40px;height:1px;background:#B08D57;margin:0 auto 40px;}
      .carta-texto{font-size:16px;line-height:1.9;text-align:justify;white-space:pre-wrap;}
      .carta-assinatura{margin-top:48px;text-align:right;font-style:italic;font-size:15px;color:#5C4033;}
      @media print{body{-webkit-print-color-adjust:exact;}}
    </style></head><body>
    <div class="capa">
      <h1>${tituloLivro||"Sem título"}</h1>
      <h2>${volumeSel||""}</h2>
      <div class="autor">Simara Lobui</div>
    </div>
    ${selecionadas.map(c=>`
    <div class="carta">
      <h2 class="carta-titulo">${c.titulo||""}</h2>
      ${c.subtitulo?`<div class="carta-sub">${c.subtitulo}</div>`:""}
      <div class="carta-meta">${fmtDate(c.data)} · ${c.categoria} · ${c.origem}</div>
      <div class="carta-divider"></div>
      <div class="carta-texto">${c.texto||""}</div>
      <div class="carta-assinatura">${c.assinatura||"Simara Lobui"}</div>
    </div>`).join("")}
    </body></html>`;
    const w=window.open("","_blank");
    w.document.write(html);
    w.document.close();
    setTimeout(()=>w.print(),800);
    // Marca como exportado
    setCartas(prev=>prev.map(c=>selExport.includes(c.id)?{...c,status:"Exportado"}:c));
    setExportModal(false);setSelExport([]);

  return(
    <div className="fade" style={{padding:24}}>
      <div style={{background:`linear-gradient(135deg,${C.cafe},#3D2B1F)`,borderRadius:8,padding:"14px 20px",marginBottom:16,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div>
          <div style={{fontSize:9,color:C.dourado,letterSpacing:"3px",textTransform:"uppercase",fontWeight:700,marginBottom:3}}>Diário da Simara</div>
          <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:14,color:C.areia,fontStyle:"italic"}}>Um espaço só seu · Cartas que virarão livros ✦</div>
        </div>
        <Btn v="gold" onClick={()=>setExportModal(true)}>📖 Exportar livro</Btn>
      </div>

      <Tabs tabs={[{k:"cartas",l:"✍🏻 Cartas"},{k:"volumes",l:"📚 Volumes"}]} active={tab} set={setTab}/>

      {tab==="cartas"&&<>
        <div style={{display:"flex",gap:10,marginBottom:12,flexWrap:"wrap",alignItems:"center"}}>

          <Sel value={filtCat} onChange={setFiltCat} options={["Todas",...CATS_CARTA]}/>
          <Sel value={filtStatus} onChange={setFiltStatus} options={["Todos",...STATUS_CARTA]}/>
          <Btn onClick={()=>{setForm(EF);setModal("new");}}>+ Nova Carta</Btn>
        </div>
        <div style={{display:"flex",gap:14,flexWrap:"wrap"}}>
          {filtered.map(c=>(
            <Card key={c.id} hover style={{flex:"1 1 280px",cursor:"pointer"}} onClick={()=>setVerModal(c)}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
                <span style={{fontSize:9,background:C.linho,color:C.oliva,padding:"2px 8px",borderRadius:10,fontWeight:600,letterSpacing:"1px",textTransform:"uppercase"}}>{c.categoria}</span>
                <span style={{fontSize:9,background:c.status==="Exportado"?"#D4E8D4":c.status==="Pronto"?"#FEF3E9":C.linho,color:c.status==="Exportado"?"#2E6B2E":c.status==="Pronto"?C.dourado:C.oliva,padding:"2px 8px",borderRadius:10,fontWeight:700}}>{c.status}</span>
              </div>
              <h4 style={{fontSize:16,fontFamily:"'Cormorant Garamond',serif",fontWeight:600,marginBottom:3}}>{c.titulo}</h4>
              {c.subtitulo&&<div style={{fontSize:12,color:C.oliva,fontStyle:"italic",marginBottom:4}}>{c.subtitulo}</div>}
              <div style={{fontSize:11,color:C.oliva,marginBottom:8}}>{fmtDate(c.data)} · {c.origem}</div>
              <p style={{fontSize:12,color:C.cafe,lineHeight:1.6,overflow:"hidden",display:"-webkit-box",WebkitLineClamp:3,WebkitBoxOrient:"vertical"}}>{c.texto?.slice(0,150)}{c.texto?.length>150?"...":""}</p>
            </Card>
          ))}
          {filtered.length===0&&<div style={{width:"100%",textAlign:"center",padding:"40px",color:C.oliva,fontFamily:"'Cormorant Garamond',serif",fontStyle:"italic",fontSize:15}}>Nenhuma carta ainda. Comece a escrever ✦</div>}
        </div>
      </>}

      {tab==="volumes"&&<>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:14}}>
          <p style={{fontFamily:"'Cormorant Garamond',serif",fontSize:14,fontStyle:"italic",color:C.oliva}}>Organize seus livros por volumes ✦</p>
          <Btn onClick={()=>{setFormVol({titulo:"",subtitulo:""});setModal("vol");}}>+ Novo Volume</Btn>
        </div>
        <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
          {volumes.map(v=>{const cartsVol=cartas.filter(c=>c.volume===v.id);return(
            <Card key={v.id} style={{flex:"1 1 220px"}}>
              <div style={{fontSize:9,color:C.dourado,letterSpacing:"2px",textTransform:"uppercase",marginBottom:4,fontWeight:700}}>📚 {v.titulo}</div>
              {v.subtitulo&&<div style={{fontSize:13,fontStyle:"italic",color:C.oliva,marginBottom:6}}>{v.subtitulo}</div>}
              <div style={{fontSize:12,color:C.cafe,marginBottom:10}}>{cartsVol.length} carta{cartsVol.length!==1?"s":""}</div>
              <Btn sm v="ghost" onClick={()=>{setFormVol({...v});setModal("editVol");}}>✎ Editar</Btn>
            </Card>
          );})}
          {volumes.length===0&&<div style={{fontSize:13,color:C.oliva,fontStyle:"italic"}}>Nenhum volume criado ainda ✦</div>}
        </div>
      </>}

      {/* Modal ver carta */}
      {verModal&&<Modal title={verModal.titulo} onClose={()=>setVerModal(null)} wide>
        <div style={{fontFamily:"'Cormorant Garamond',serif"}}>
          {verModal.subtitulo&&<div style={{fontSize:16,fontStyle:"italic",color:C.oliva,marginBottom:6,textAlign:"center"}}>{verModal.subtitulo}</div>}
          <div style={{fontSize:12,color:C.oliva,textAlign:"center",marginBottom:16,letterSpacing:"1px"}}>{fmtDate(verModal.data)} · {verModal.categoria} · {verModal.origem}</div>
          <div style={{width:32,height:1,background:C.dourado,margin:"0 auto 24px"}}/>
          <div style={{fontSize:15,lineHeight:2,whiteSpace:"pre-wrap",color:C.cafe}}>{verModal.texto}</div>
          <div style={{marginTop:32,textAlign:"right",fontStyle:"italic",color:C.cafe,fontSize:14}}>— {verModal.assinatura||"Simara Lobui"}</div>
        </div>
        <div style={{display:"flex",gap:8,marginTop:16,justifyContent:"flex-end"}}>
          <Btn v="ghost" onClick={()=>{setForm({...verModal});setVerModal(null);setModal("edit");}}>✎ Editar</Btn>
          <Btn v="oliva" onClick={()=>setVerModal(null)}>Fechar</Btn>
        </div>
      </Modal>}

      {/* Modal nova/editar carta */}
      {(modal==="new"||modal==="edit")&&<Modal title={modal==="edit"?"Editar Carta":"Nova Carta"} onClose={()=>setModal(null)} wide>
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <Inp label="Título" value={form.titulo} onChange={v=>setForm(f=>({...f,titulo:v}))} placeholder="O título da sua carta..."/>
          <Inp label="Subtítulo (opcional)" value={form.subtitulo} onChange={v=>setForm(f=>({...f,subtitulo:v}))} placeholder="Uma frase, uma dedicatória..."/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            <Inp label="Data" type="date" value={form.data} onChange={v=>setForm(f=>({...f,data:v}))}/>
            <Sel label="Categoria" value={form.categoria} onChange={v=>setForm(f=>({...f,categoria:v}))} options={CATS_CARTA}/>
            <Sel label="Origem da inspiração" value={form.origem} onChange={v=>setForm(f=>({...f,origem:v}))} options={ORIGENS_CARTA}/>
            <Sel label="Status" value={form.status} onChange={v=>setForm(f=>({...f,status:v}))} options={STATUS_CARTA}/>
            <Sel label="Volume (opcional)" value={form.volume||""} onChange={v=>setForm(f=>({...f,volume:v}))} options={[{v:"",l:"Nenhum"},...volumes.map(v=>({v:v.id,l:v.titulo}))]}/>
          </div>
          <div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
              <label style={{fontSize:11,fontWeight:600,color:C.oliva,textTransform:"uppercase",letterSpacing:"0.8px"}}>Texto da carta</label>
              <button onClick={()=>{
                const sel=window.getSelection()?.toString();
                if(sel&&sel.trim().length>10){
                  setForm(f=>({...f,fraseDestaque:sel.trim()}));
                  showSavedGlobal("Trecho destacado como frase!");
                } else {
                  alert("Selecione um trecho do texto primeiro (mínimo 10 caracteres).");
                }
              }} style={{fontSize:11,padding:"4px 12px",background:C.linho,border:`1px solid ${C.dourado}`,borderRadius:20,cursor:"pointer",color:C.dourado,fontWeight:600}}>✦ Destacar trecho</button>
            </div>
            {form.fraseDestaque&&<div style={{background:"#FFFDF5",border:`1px solid ${C.dourado}`,borderRadius:4,padding:"8px 12px",marginBottom:8,fontSize:13,fontFamily:"'Cormorant Garamond',serif",fontStyle:"italic",color:C.cafe}}>
              <span style={{fontSize:9,color:C.dourado,fontWeight:700,letterSpacing:"2px",display:"block",marginBottom:3}}>✦ FRASE DESTACADA</span>
              "{form.fraseDestaque}"
              <button onClick={()=>setForm(f=>({...f,fraseDestaque:""}))} style={{marginLeft:8,fontSize:10,background:"none",border:"none",cursor:"pointer",color:C.oliva}}>✕</button>
            </div>}
            <textarea id="carta-textarea" value={form.texto} onChange={e=>setForm(f=>({...f,texto:e.target.value}))} rows={14} placeholder="Escreva aqui sua carta, reflexão, pensamento..." style={{width:"100%",padding:"12px",border:`1.5px solid ${C.areia}`,borderRadius:4,fontSize:14,fontFamily:"'Cormorant Garamond',serif",lineHeight:1.8,color:C.cafe,resize:"vertical"}}/>
          </div>
          <div style={{textAlign:"right",fontSize:12,fontStyle:"italic",color:C.oliva}}>Assinatura: Simara Lobui</div>
        </div>
        <div style={{display:"flex",gap:10,marginTop:14,justifyContent:"flex-end"}}>
          {modal==="edit"&&<Btn v="danger" onClick={()=>{if(window.confirm("Excluir esta carta? Esta ação não pode ser desfeita."))setCartas(prev=>prev.filter(x=>x.id!==form.id));setModal(null);}}>Excluir</Btn>}
          <Btn v="ghost" onClick={()=>setModal(null)}>Cancelar</Btn>
          <Btn onClick={save}>Salvar carta</Btn>
        </div>
      </Modal>}

      {/* Modal volume */}
      {(modal==="vol"||modal==="editVol")&&<Modal title={modal==="editVol"?"Editar Volume":"Novo Volume"} onClose={()=>setModal(null)}>
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <Inp label="Título do livro" value={formVol.titulo} onChange={v=>setFormVol(f=>({...f,titulo:v}))} placeholder="Ex: Renascida em Coragem"/>
          <Inp label="Volume / Subtítulo" value={formVol.subtitulo} onChange={v=>setFormVol(f=>({...f,subtitulo:v}))} placeholder="Ex: Volume 1, Volume 2..."/>
        </div>
        <div style={{display:"flex",gap:10,marginTop:14,justifyContent:"flex-end"}}>
          {modal==="editVol"&&<Btn v="danger" onClick={()=>{if(window.confirm("Excluir volume?"))setVolumes(prev=>prev.filter(x=>x.id!==formVol.id));setModal(null);}}>Excluir</Btn>}
          <Btn v="ghost" onClick={()=>setModal(null)}>Cancelar</Btn>
          <Btn onClick={()=>{if(modal==="editVol")setVolumes(prev=>prev.map(x=>x.id===formVol.id?formVol:x));else setVolumes(prev=>[...prev,{...formVol,id:uid()}]);setModal(null);showSavedGlobal("Volume salvo!");}}>Salvar</Btn>
        </div>
      </Modal>}

      {/* Modal exportar livro */}
      {exportModal&&<Modal title="📖 Exportar Livro" onClose={()=>setExportModal(false)} wide>
        <div style={{display:"flex",flexDirection:"column",gap:12,marginBottom:14}}>
          <Inp label="Título do livro" value={tituloLivro} onChange={setTituloLivro} placeholder="Ex: Renascida em Coragem"/>
          <Sel label="Volume" value={volumeSel} onChange={setVolumeSel} options={[{v:"",l:"Sem volume"},...volumes.map(v=>({v:v.titulo,l:v.titulo}))]}/>
        </div>
        <div style={{fontSize:11,fontWeight:700,color:C.oliva,letterSpacing:"1.5px",textTransform:"uppercase",marginBottom:8}}>Selecione as cartas ({selExport.length} selecionadas)</div>
        <div style={{maxHeight:320,overflowY:"auto",display:"flex",flexDirection:"column",gap:6}}>
          {cartas.sort((a,b)=>(a.data||"").localeCompare(b.data||"")).map(c=>(
            <div key={c.id} onClick={()=>setSelExport(prev=>prev.includes(c.id)?prev.filter(x=>x!==c.id):[...prev,c.id])} style={{display:"flex",gap:10,alignItems:"center",padding:"8px 12px",background:selExport.includes(c.id)?C.linho:"#fff",border:`1.5px solid ${selExport.includes(c.id)?C.cafe:C.areia}`,borderRadius:4,cursor:"pointer"}}>
              <span style={{fontSize:16}}>{selExport.includes(c.id)?"✅":"⬜"}</span>
              <div style={{flex:1}}>
                <div style={{fontSize:13,fontWeight:600}}>{c.titulo}</div>
                <div style={{fontSize:10,color:C.oliva}}>{fmtDate(c.data)} · {c.categoria} · {c.status}</div>
              </div>
            </div>
          ))}
        </div>
        <div style={{display:"flex",gap:10,marginTop:14,justifyContent:"flex-end"}}>
          <Btn v="ghost" onClick={()=>setExportModal(false)}>Cancelar</Btn>
          <Btn v="gold" onClick={exportarPDF} disabled={selExport.length===0}>📖 Gerar livro ({selExport.length} cartas)</Btn>
        </div>
      </Modal>}
    </div>
  );
};

const Projects = ({projects,setProjects}) => {

// ─── RELATÓRIOS ───────────────────────────────────────────────────────────────
const Reports = ({orders,products,finance,clients}) => {
  const anoAtual=today.slice(0,4);
  const mesAtual=today.slice(0,7);
  const ordAtivos=orders.filter(o=>o.status!=="Cancelado");
  const fatTotal=ordAtivos.reduce((a,o)=>a+(o.precoFinal||o.price||0),0);
  const recTotal=finance.filter(f=>f.type==="receita"&&f.pago).reduce((a,f)=>a+f.value,0);
  const recPend=finance.filter(f=>f.type==="receita"&&!f.pago).reduce((a,f)=>a+f.value,0);
  const avgTicket=ordAtivos.length>0?fatTotal/ordAtivos.length:0;
  const despTotal=finance.filter(f=>f.type==="despesa").reduce((a,f)=>a+f.value,0);
  const invTotal=finance.filter(f=>f.centrocusto==="Investimentos").reduce((a,f)=>a+f.value,0);
  const lucro=recTotal-despTotal;
  const origens=clients.reduce((acc,c)=>{if(c.origem)acc[c.origem]=(acc[c.origem]||0)+1;return acc;},{});
  // Produtos mais vendidos
  const prodVendas=orders.filter(o=>o.status!=="Cancelado").reduce((acc,o)=>{
    const nome=o.product||"Sem nome";
    if(!acc[nome])acc[nome]={nome,qtd:0,total:0};
    acc[nome].qtd+=(o.itens?.length||1);
    acc[nome].total+=(o.precoFinal||o.price||0);
    return acc;
  },{});
  const topProd=Object.values(prodVendas).sort((a,b)=>b.total-a.total).slice(0,5);
  return(
    <div className="fade" style={{padding:24}}>
      <div style={{display:"flex",gap:12,flexWrap:"wrap",marginBottom:18}}>
        {[{l:"Ticket médio",v:fmtBRL(avgTicket),c:C.dourado},{l:"Total pedidos",v:ordAtivos.length,c:C.cafe},{l:"Clientes",v:clients.length,c:C.oliva},{l:"Margem",v:`${fatTotal>0?Math.round((lucro/fatTotal)*100):0}%`,c:lucro>=0?C.dourado:C.vermelho}].map(k=>(
          <Card key={k.l} style={{flex:"1 1 110px",textAlign:"center"}}><div style={{fontSize:22,fontFamily:"'Playfair Display',serif",color:k.c}}>{k.v}</div><div style={{fontSize:10,color:C.oliva,letterSpacing:"1px",textTransform:"uppercase",marginTop:2}}>{k.l}</div></Card>
        ))}
      </div>
      <div style={{display:"flex",gap:14,flexWrap:"wrap",marginBottom:14}}>
        <Card style={{flex:1,minWidth:200}}>
          <h3 style={{fontSize:14,marginBottom:12}}>Resumo financeiro</h3>
          {[["Faturamento total",fmtBRL(fatTotal)],["Já recebido",fmtBRL(recTotal)],["A receber",fmtBRL(recPend)],["Total despesas",fmtBRL(despTotal)],["Lucro líquido",fmtBRL(lucro)],["Investimentos",fmtBRL(invTotal)]].map(([l,v])=>(
            <div key={l} style={{display:"flex",justifyContent:"space-between",padding:"7px 0",borderBottom:`1px solid ${C.linho}`}}><span style={{fontSize:12,color:C.oliva}}>{l}</span><span style={{fontSize:13,fontWeight:700}}>{v}</span></div>
          ))}
        </Card>
        {topProd.length>0&&<Card style={{flex:1,minWidth:180}}>
          <h3 style={{fontSize:14,marginBottom:12}}>Produtos mais vendidos</h3>
          {topProd.map((p,i)=>(
            <div key={p.nome} style={{marginBottom:10}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
                <span style={{fontSize:12,fontWeight:600}}>{i+1}. {p.nome}</span>
                <span style={{fontSize:12,color:C.dourado,fontWeight:700}}>{fmtBRL(p.total)}</span>
              </div>

            </div>
          ))}
        </Card>}
      </div>
      {Object.keys(origens).length>0&&<Card>
        <h3 style={{fontSize:14,marginBottom:12}}>Como as clientes chegaram</h3>

// ─── MONITOR DE ARMAZENAMENTO ─────────────────────────────────────────────────
const StorageMonitor = () => {
  const [info, setInfo] = useState(null);
  useEffect(() => {
    try {
      let total = 0;
      const keys = [];
      for (let k in localStorage) {
        if (!localStorage.hasOwnProperty(k)) continue;
        const size = (localStorage[k].length * 2) / 1024;
        if (k.startsWith("atelie_") && !k.endsWith("_bk")) {
          keys.push({k: k.replace("atelie_",""), size: size.toFixed(1)});
          total += size;
        }
      }
      setInfo({total: total.toFixed(0), keys, limite: 5120, pct: Math.round((total/5120)*100)});
    } catch { setInfo(null); }
  }, []);

  if (!info) return null;
  const cor = info.pct > 80 ? C.vermelho : info.pct > 50 ? C.dourado : C.verde;
  return (
    <div style={{background:C.branco,borderRadius:6,padding:"10px 12px",marginBottom:4}}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
        <span style={{fontSize:12,fontWeight:700,color:C.cafe}}>Espaço utilizado</span>
        <span style={{fontSize:12,fontWeight:700,color:cor}}>{info.total} KB de 5.120 KB ({info.pct}%)</span>
      </div>
      <PBar pct={info.pct} color={cor} h={6}/>
      {info.pct > 70 && <div style={{fontSize:11,color:C.vermelho,marginTop:6,fontWeight:600}}>⚠ Espaço quase cheio! Faça backup e evite adicionar muitas fotos em alta resolução.</div>}
      {info.pct <= 70 && <div style={{fontSize:11,color:C.oliva,marginTop:6}}>✓ Espaço disponível para seus dados.</div>}
    </div>
  );
};

              {idx<banners.length-1&&<button onClick={()=>{const n=[...banners];[n[idx],n[idx+1]]=[n[idx+1],n[idx]];setBanners(n);}} style={{background:"rgba(255,255,255,0.2)",border:"none",color:"#fff",borderRadius:3,padding:"4px 7px",cursor:"pointer",fontSize:11}}>↓</button>}
              <button onClick={()=>setBanners(prev=>prev.map(x=>x.id===b.id?{...x,ativo:!x.ativo}:x))} style={{padding:"3px 8px",borderRadius:12,border:`1px solid ${b.ativo?C.dourado:"rgba(255,255,255,0.3)"}`,background:b.ativo?"rgba(176,141,87,0.3)":"transparent",color:b.ativo?C.dourado:"rgba(255,255,255,0.5)",fontSize:11,fontWeight:600,cursor:"pointer"}}>{b.ativo?"Ativo":"Inativo"}</button>
              <button onClick={()=>setBanners(prev=>prev.filter(x=>x.id!==b.id))} style={{padding:"3px 8px",borderRadius:12,border:"1px solid rgba(192,57,43,0.6)",background:"rgba(192,57,43,0.2)",color:"#e07070",fontSize:11,fontWeight:600,cursor:"pointer"}}>✕</button>
            </div>
          </div>
        ))}

      {tab==="depoimentos"&&<>

              {novaDepo.foto?<img src={novaDepo.foto} style={{width:"100%",height:"100%",objectFit:"cover"}}/>:"📷"}
            </div>
            <input ref={depoRef} type="file" accept="image/*" style={{display:"none"}} onChange={async e=>{if(e.target.files[0]){const u=await readFile(e.target.files[0]);setNovaDepo(d=>({...d,foto:u}));}}}/>
            <div style={{flex:1}}><Inp label="Nome da cliente" value={novaDepo.name} onChange={v=>setNovaDepo(d=>({...d,name:v}))}/></div>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            <Inp label="Produto comprado" value={novaDepo.product} onChange={v=>setNovaDepo(d=>({...d,product:v}))}/>
            <Inp label="Depoimento" value={novaDepo.comment} onChange={v=>setNovaDepo(d=>({...d,comment:v}))} rows={2}/>
            <Btn sm onClick={()=>{if(!novaDepo.name.trim())return;setDepoimentos(p=>[...p,{...novaDepo,id:uid()}]);setNovaDepo({name:"",product:"",comment:"",foto:""});}}>+ Adicionar</Btn>
          </div>
        </Card>
        {depoimentos.length===0&&<div style={{textAlign:"center",padding:"16px",color:C.oliva,fontStyle:"italic",fontSize:13}}>Nenhum depoimento ainda.</div>}
        {depoimentos.map(d=>(
          <div key={d.id} style={{background:C.branco,border:`1px solid ${C.areia}`,borderRadius:6,padding:"10px 12px",marginBottom:8}}>
            <div style={{display:"flex",gap:8,marginBottom:5,alignItems:"center"}}>
              <div style={{width:32,height:32,borderRadius:"50%",overflow:"hidden",background:`linear-gradient(135deg,${C.areia},${C.dourado})`,flexShrink:0}}>{d.foto?<img src={d.foto} style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<div style={{width:"100%",height:"100%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,color:C.cafe}}>{d.name.slice(0,2)}</div>}</div>
              <div><div style={{fontSize:13,fontWeight:700}}>{d.name}</div><div style={{fontSize:11,color:C.oliva}}>{d.product}</div></div>
              <Btn sm v="danger" style={{marginLeft:"auto"}} onClick={()=>setDepoimentos(prev=>prev.filter(x=>x.id!==d.id))}>✕</Btn>
            </div>
            <p style={{fontSize:13,fontFamily:"'Cormorant Garamond',serif",fontStyle:"italic"}}>"{d.comment}"</p>
          </div>
        ))}
      </>}

      {tab==="categorias"&&<>
        <Card style={{marginBottom:14}}>
          <div style={{display:"flex",gap:8}}>
            <div style={{flex:1}}><Inp value={novaCat} onChange={setNovaCat} placeholder="Nome da nova categoria"/></div>
            <Btn sm onClick={()=>{if(!novaCat.trim()||categories.includes(novaCat))return;setCategories(p=>[...p,novaCat]);setNovaCat("");}}>Adicionar</Btn>
          </div>
        </Card>
        {categories.map(c=>(
          <div key={c} style={{display:"flex",gap:10,alignItems:"center",background:C.branco,border:`1px solid ${C.areia}`,borderRadius:6,padding:"10px 12px",marginBottom:8}}>

            <Btn sm v="danger" onClick={()=>setCategories(prev=>prev.filter(x=>x!==c))}>✕</Btn>
          </div>
        ))}
      </>}

    </div>
  );
};

// ─── RASTREAR PEDIDO (modal público) ─────────────────────────────────────────
const RastrearModal = ({onClose}) => {
  const [q,setQ]=useState("");
  const [result,setResult]=useState(null);
  const buscar=()=>{
    try{
      const all=JSON.parse(localStorage.getItem("atelie_orders")||"[]");
      const found=all.find(o=>o.id?.toLowerCase()===q.toLowerCase()||o.client?.toLowerCase().includes(q.toLowerCase()));
      setResult(found||"none");
    }catch{setResult("none");}
  };
  return(
    <Modal title="Acompanhar Meu Pedido" onClose={onClose} wide>
      <p style={{fontFamily:"'Cormorant Garamond',serif",fontSize:14,fontStyle:"italic",color:C.oliva,marginBottom:12}}>Digite o número do pedido (ex: EN-001) ou seu nome.</p>
      <div style={{display:"flex",gap:8,marginBottom:12}}>
        <div style={{flex:1}}><Inp value={q} onChange={setQ} placeholder="EN-001 ou seu nome..."/></div>
        <Btn onClick={buscar}>Buscar</Btn>
      </div>
      {result==="none"&&<div style={{textAlign:"center",padding:"14px",color:C.oliva,fontStyle:"italic"}}>Pedido não encontrado. Verifique o número ou fale pelo WhatsApp.</div>}
      {result&&result!=="none"&&(
        <div style={{background:C.linho,borderRadius:8,padding:"16px"}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}>
            <div><div style={{fontSize:9,color:C.oliva,textTransform:"uppercase",letterSpacing:"1px",marginBottom:1}}>Pedido</div><div style={{fontSize:22,fontFamily:"'Playfair Display',serif",fontWeight:700}}>{result.id}</div></div>
            <Badge label={result.status}/>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
            {[["Produto",result.product],["Cor",result.color||"—"],["Tamanho",result.size||"—"],["Posição na fila",`${result.position}ª`],["Previsão de entrega",fmtDate(result.delivery)],["Valor total",fmtBRL(result.precoFinal||result.price)],["Já pago",fmtBRL(result.valorPago||0)],["Saldo restante",fmtBRL(Math.max(0,(result.precoFinal||result.price||0)-(result.valorPago||0)))]].map(([l,v])=>(
              <div key={l}><div style={{fontSize:9,color:C.oliva,textTransform:"uppercase",fontWeight:600,letterSpacing:"1px",marginBottom:1}}>{l}</div><div style={{fontSize:13,fontWeight:600}}>{v}</div></div>
            ))}
          </div>
          {result.tracking&&<div style={{marginTop:10,fontSize:12,fontWeight:700}}>Rastreio: {result.tracking}</div>}
        </div>
      )}
    </Modal>
  );
};

// ─── FICHA DO PEDIDO ──────────────────────────────────────────────────────────
const FichaPedido = ({order,products,onClose,config}) => {
  const pF=order?.precoFinal||order?.price||0;
  const saldo=Math.max(0,pF-(order?.valorPago||0));
  const itens=order?.itens?.length>0?order.itens:[{product:order?.product,color:order?.color,size:order?.size,qty:1,price:pF}];
  if(!order)return null;

  const shareWA=()=>{
    const itensStr=itens.map(i=>`  • ${i.product}${i.color&&i.color!=="—"?` · ${i.color}`:""}${i.size&&i.size!=="—"?` · ${i.size}`:""}${i.qty>1?` (${i.qty}x)`:""} — ${fmtBRL(Number(i.price)*Number(i.qty||1))}`).join("\n");
    const msg=`🤎 *Ficha do Pedido ${order.id}*\n\nCliente: ${order.client}\n\n*Produtos:*\n${itensStr}\n\nValor total: ${fmtBRL(pF)}${order.desconto>0?`\nDesconto: -${order.tipoDesc==="pct"?order.desconto+"%":fmtBRL(order.desconto)}`:""}${order.taxaEnvio>0?`\nFrete: ${fmtBRL(order.taxaEnvio)}`:""}${order.condicao==="Com entrada"?`\nEntrada: ${fmtBRL(order.entrada)} em ${fmtDate(order.dataEntradaPag)}\nSaldo: ${fmtBRL(saldo)}`:""}${order.condicao==="Parcelado"&&order.parcelas?.length?`\nParcelas:\n${order.parcelas.map(x=>`  ${x.n}ª: ${fmtBRL(x.valor)} em ${fmtDate(x.data)}`).join("\n")}`:""}\nMedidas: ${order.measures||"—"}\nEntrega: ${fmtDate(order.delivery)}\nFila: ${order.position}ª\n\n${BRAND}`;
    window.open(`https://wa.me/${order.phone?.replace(/\D/g,"")}?text=${waMsg(msg)}`);
  };

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(35,53,90,0.55)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:300,padding:16,overflowY:"auto"}}>
      <div style={{background:"#FDFAFF",borderRadius:10,width:"100%",maxWidth:440,maxHeight:"95vh",overflowY:"auto"}}>
        <div style={{padding:"18px 20px"}}>

          {/* CABEÇALHO */}
          <div style={{background:`linear-gradient(135deg,#23355A,#2D1B69)`,borderRadius:8,padding:"14px 18px",marginBottom:16,textAlign:"center"}}>
            <div style={{fontSize:8,color:"#D8B4CE",letterSpacing:"4px",textTransform:"uppercase",fontWeight:700,marginBottom:2}}>Ateliê Digital</div>
            <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:17,color:"#FDFAFF",fontStyle:"italic"}}>{BRAND_SHORT}</div>
            <div style={{fontSize:8,color:"rgba(216,180,206,0.7)",letterSpacing:"2px",marginTop:1}}>TRICOT, AMOR & ARTE</div>
          </div>

          {/* PEDIDO + STATUS */}
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14}}>
            <div>
              <div style={{fontSize:9,color:C.oliva,textTransform:"uppercase",letterSpacing:"1px"}}>Pedido</div>
              <div style={{fontSize:24,fontFamily:"'Playfair Display',serif",fontWeight:700,color:C.oliva}}>{order.id}</div>
            </div>
            <div style={{textAlign:"right"}}>
              <Badge label={order.status}/>
              <div style={{fontSize:10,color:C.oliva,marginTop:3}}>Fila: {order.position}ª</div>
            </div>
          </div>

          {/* CLIENTE */}
          <div style={{borderBottom:`1px solid ${C.areia}`,paddingBottom:8,marginBottom:12}}>
            <div style={{fontSize:8,color:C.oliva,fontWeight:700,letterSpacing:"1.5px",textTransform:"uppercase",marginBottom:2}}>Cliente</div>
            <div style={{fontSize:14,fontWeight:700,color:C.oliva}}>{order.client}</div>
            {order.phone&&<div style={{fontSize:11,color:C.oliva,opacity:0.7}}>{order.phone}</div>}
          </div>

          {/* PRODUTOS — cada item detalhado */}
          <div style={{marginBottom:12}}>
            <div style={{fontSize:8,color:C.oliva,fontWeight:700,letterSpacing:"1.5px",textTransform:"uppercase",marginBottom:6}}>Produtos do pedido</div>
            {itens.map((item,i)=>(
              <div key={i} style={{background:i%2===0?C.linho:"#fff",borderRadius:6,padding:"8px 10px",marginBottom:5,border:`1px solid ${C.areia}`}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
                  <div style={{flex:1}}>
                    <div style={{fontSize:12,fontWeight:700,color:C.oliva,lineHeight:1.3}}>{item.product||"—"}</div>
                    <div style={{display:"flex",gap:8,marginTop:3,flexWrap:"wrap"}}>
                      {item.color&&item.color!=="—"&&<span style={{fontSize:10,color:C.oliva}}>Cor: <b>{item.color}</b></span>}
                      {item.size&&item.size!=="—"&&<span style={{fontSize:10,color:C.oliva}}>Tam: <b>{item.size}</b></span>}
                      {item.qty>1&&<span style={{fontSize:10,color:C.oliva}}>Qtd: <b>{item.qty}</b></span>}
                    </div>
                  </div>
                  <div style={{fontSize:13,fontWeight:700,color:C.oliva,whiteSpace:"nowrap"}}>{fmtBRL(Number(item.price||0)*Number(item.qty||1))}</div>
                </div>
              </div>
            ))}
          </div>

          {/* MEDIDAS */}
          {order.measures&&<div style={{fontSize:10,color:C.oliva,marginBottom:10,padding:"5px 8px",background:C.linho,borderRadius:4}}><b>Medidas:</b> {order.measures}</div>}

          {/* PAGAMENTO */}
          <div style={{background:C.linho,borderRadius:6,padding:"10px 12px",marginBottom:10}}>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:4}}>
              <span style={{color:C.oliva}}>Forma</span>
              <span style={{fontWeight:600}}>{order.condicao||order.payment}</span>
            </div>
            {order.taxaEnvio>0&&<div style={{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:3}}>
              <span style={{color:C.oliva}}>Frete</span><span>{fmtBRL(order.taxaEnvio)}</span>
            </div>}
            {order.desconto>0&&<div style={{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:3}}>
              <span style={{color:C.oliva}}>Desconto</span><span>-{order.tipoDesc==="pct"?order.desconto+"%":fmtBRL(order.desconto)}</span>
            </div>}
            <div style={{display:"flex",justifyContent:"space-between",fontSize:13,fontWeight:700,paddingTop:5,borderTop:`1px solid ${C.areia}`}}>
              <span>Valor total</span><span>{fmtBRL(pF)}</span>
            </div>

            {/* PARCELAS */}
            {order.condicao==="Parcelado"&&order.parcelas?.length>0&&<>
              <div style={{fontSize:9,color:C.oliva,letterSpacing:"1.5px",textTransform:"uppercase",marginTop:8,marginBottom:4,fontWeight:700}}>Parcelas</div>
              {order.parcelas.map((x,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:2}}>
                <span style={{color:C.oliva}}>{x.n}ª — {fmtDate(x.data)}</span>
                <span style={{fontWeight:600}}>{fmtBRL(x.valor)}</span>
              </div>)}
            </>}

            {/* COM ENTRADA */}
            {order.condicao==="Com entrada"&&<>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:11,marginTop:5}}>
                <span style={{color:C.oliva}}>Entrada ({fmtDate(order.dataEntradaPag)})</span>
                <span style={{fontWeight:600}}>{fmtBRL(order.entrada||0)}</span>
              </div>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:C.vermelho}}>
                <span>Saldo até {fmtDate(order.dataSaldo||order.delivery)}</span>
                <span style={{fontWeight:700}}>{fmtBRL(saldo)}</span>
              </div>
            </>}

            <div style={{borderTop:`1px dashed ${C.areia}`,marginTop:6,paddingTop:6}}>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:11}}>
                <span style={{fontWeight:700}}>Já pago</span>
                <span style={{fontWeight:700,color:C.oliva}}>{fmtBRL(order.valorPago||0)}</span>
              </div>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:12}}>
                <span style={{fontWeight:700}}>Saldo em aberto</span>
                <span style={{fontWeight:700,color:saldo<=0?C.oliva:C.vermelho}}>{fmtBRL(saldo)}</span>
              </div>
            </div>
          </div>

          {/* ENTREGA */}
          <div style={{textAlign:"center",padding:"8px",background:"rgba(165,99,162,0.08)",borderRadius:6,marginBottom:8,border:`1px solid rgba(165,99,162,0.2)`}}>
            <div style={{fontSize:8,color:C.oliva,textTransform:"uppercase",letterSpacing:"1.5px",marginBottom:2}}>Previsão de entrega</div>
            <div style={{fontSize:18,fontFamily:"'Playfair Display',serif",fontWeight:700,color:C.oliva}}>{fmtDate(order.delivery)}</div>
          </div>

          {order.note&&<div style={{fontSize:10,color:C.oliva,fontStyle:"italic",marginBottom:8}}>Obs: {order.note}</div>}
          <div style={{textAlign:"center",paddingTop:8,borderTop:`1px solid ${C.areia}`,fontSize:8,color:C.oliva,letterSpacing:"1.5px"}}>Feito com amor · {BRAND}</div>
        </div>

        <div style={{padding:"10px 20px",borderTop:`1px solid ${C.areia}`,display:"flex",gap:8,flexWrap:"wrap",background:C.linho}}>
          <Btn v="oliva" onClick={shareWA}>💬 WhatsApp</Btn>
          <Btn v="ghost" onClick={()=>window.print()}>🖨 Imprimir</Btn>
          <Btn v="ghost" onClick={onClose} style={{marginLeft:"auto"}}>Fechar</Btn>
        </div>
      </div>
    </div>
  );
};

// ─── SITE PÚBLICO (catálogo para clientes) ────────────────────────────────────
const SitePublico = ({products=[],banners=[],depoimentos=[],categories=[],config={},orders=[],setOrders,clients=[],setClients}) => {
  const [secao,setSecao]=useState("inicio");
  const [compraModal,setCompraModal]=useState(null);
  const [rastrear,setRastrear]=useState(false);
  const [destIdx,setDestIdx]=useState(0);
  const [filtCat,setFiltCat]=useState("Todos");

  // Paleta do logo
  const P={roxo:"#A563A2",marinho:"#23355A",lilas:"#D8B4CE",branco:"#FDFAFF",lilasClaro:"#F3EAF5",texto:"#1A1A2E"};

  // Separa produtos por visibilidade
  const pubProd=products.filter(p=>p.nocatalogo!==false);

  // Carrossel destaques

    <div onClick={()=>setCompraModal(p)} style={{cursor:"pointer",background:"#fff",borderRadius:8,overflow:"hidden",boxShadow:"0 2px 12px rgba(35,53,90,0.06)",transition:"transform 0.25s,box-shadow 0.25s",flex:grande?"0 0 280px":"1 1 180px"}}
      onMouseEnter={e=>{e.currentTarget.style.transform="translateY(-3px)";e.currentTarget.style.boxShadow="0 8px 24px rgba(35,53,90,0.13)";}}

          :<div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:52,background:`linear-gradient(135deg,${P.lilasClaro},${P.lilas})`}}>{p.img||"🧶"}</div>}
        <div style={{position:"absolute",top:8,left:8}}>
          {p.type==="pronta"&&p.stock<=2&&p.stock>0&&<span style={{background:"#FF6B6B",color:"#fff",fontSize:8,fontWeight:700,padding:"3px 8px",borderRadius:20,letterSpacing:"1px"}}>ÚLTIMA{p.stock>1?"S":""} {p.stock}</span>}
          {p.type==="pronta"&&p.stock>2&&<span style={{background:P.marinho,color:"#fff",fontSize:8,fontWeight:700,padding:"3px 8px",borderRadius:20,letterSpacing:"1px"}}>PRONTA ENTREGA</span>}
        </div>
      </div>
      <div style={{padding:"12px 14px 16px"}}>
        <div style={{fontSize:9,color:P.roxo,letterSpacing:"2px",textTransform:"uppercase",marginBottom:4,fontWeight:600}}>{p.subcategory||p.category}</div>
        <div style={{fontSize:14,fontWeight:600,color:P.marinho,marginBottom:8,lineHeight:1.3}}>{p.name}</div>
        {p.cores?.length>0&&<div style={{display:"flex",gap:3,marginBottom:8}}>{p.cores.slice(0,5).map(c=><div key={c.id} title={c.nome} style={{width:10,height:10,borderRadius:"50%",overflow:"hidden",border:`1.5px solid ${P.lilas}`,background:P.lilas}}>{c.foto&&<img src={c.foto} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>}</div>)}</div>}

          <span style={{fontSize:15,fontFamily:"'Cormorant Garamond',serif",color:P.marinho,fontWeight:700}}>{preco(p)}</span>
          <button onClick={e=>{e.stopPropagation();setCompraModal(p);}} style={{background:P.roxo,color:"#fff",border:"none",borderRadius:20,padding:"5px 14px",fontSize:10,fontWeight:600,cursor:"pointer",letterSpacing:"1px"}}>Ver</button>
        </div>

    </div>

  return(
    <div style={{minHeight:"100vh",background:P.branco,fontFamily:"'Poppins',sans-serif",color:P.marinho}}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&display=swap');
        .nav-link{background:none;border:none;font-family:'Poppins',sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;padding:4px 0;color:#23355A;font-weight:500;}
        .nav-link:hover{color:#A563A2;}
