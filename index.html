                      <span style={{fontSize:10,background:"#E4F0EA",color:C.verde,padding:"1px 6px",borderRadius:6}}>Mensalidade</span>
                      <span style={{fontSize:11,fontWeight:700,color:C.verde}}>{fmtBRL(f.value)}</span>
                      <span style={{fontSize:10,fontWeight:700,padding:"1px 6px",borderRadius:6,background:f.pago?"#DDF0E6":vencido?"#FBE7E4":"#F0ECF6",color:f.pago?"#1F7A4D":vencido?C.vermelho:C.oliva}}>{f.pago?"✓ Pago":vencido?"Vencido":"A receber"}</span>
                      <button title="Enviar ao cliente por WhatsApp" onClick={()=>{setWppView("mes");setWppMes(it.mes);setWppDia(Number(venc.slice(8,10))||sel.diaEmissao||22);setModal("wpp");}} style={{fontSize:12,background:"none",border:"none",cursor:"pointer",color:C.verde}}>💬</button>
                    </div>
                  </div>
                  <div style={{fontSize:12,color:C.oliva}}>Mensalidade de {MESES[Number(mm)-1]||mm}/{ano} — serviço confirmado e lançado no financeiro{venc?` · venc. ${fmtDate(venc)}`:""}</div>
                </div>);
              })}
            </>;
          })()}
        </div>}

        {subTab==="med"&&<div style={{display:"flex",flexDirection:"column",gap:6}}>
          {sel.tipo!=="Por medição"&&sel.tipo!=="Pacote de horas"&&<div style={{textAlign:"center",padding:"16px",color:C.oliva,fontSize:12,fontStyle:"italic"}}>Medições disponíveis para "Por medição" e "Pacote de horas".</div>}
          {(sel.tipo==="Por medição"||sel.tipo==="Pacote de horas")&&<>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
              <span style={{fontSize:12,color:C.oliva}}>Abertos: {atendAbertos(sel).length} · {fmtHoras(atendAbertos(sel).reduce((s,a)=>s+durEx(a),0))}{atendAbertos(sel).reduce((s,a)=>s+vEf(a,sel),0)>0?` · ${fmtBRL(atendAbertos(sel).reduce((s,a)=>s+vEf(a,sel),0))}`:""}</span>
              <Btn sm v="oliva" onClick={()=>{setSelAtends([]);setMedForm({obs:"",dataVencimento:"",formaPag:"PIX"});setMedHora(taxaHora(sel)>0?String(taxaHora(sel)):"");setMedSalvaHora(true);setModal("medicao");}}>📏 Fechar</Btn>
            </div>
            {(sel.medicoes||[]).length===0&&<div style={{textAlign:"center",padding:"16px",color:C.oliva,fontSize:12,fontStyle:"italic"}}>Nenhuma medição fechada ✦</div>}
            {(sel.medicoes||[]).slice().reverse().map((m,i)=>(
              <div key={m.id} style={{padding:"9px 11px",background:m.status==="Cancelado"?"#FEF2F2":C.branco,border:`1px solid ${m.status==="Cancelado"?C.vermelho:C.areia}`,borderRadius:6,borderLeft:`3px solid ${m.status==="Cancelado"?C.vermelho:CC.secundaria}`,opacity:m.status==="Cancelado"?0.7:1}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
                  <span style={{fontSize:12,fontWeight:700,color:C.cafe}}>Medição {(sel.medicoes||[]).length-i}{m.status==="Cancelado"?" — CANCELADA":""}</span>
                  <div style={{display:"flex",gap:5,alignItems:"center"}}>
                    <span style={{fontSize:11,fontWeight:700,color:C.oliva}}>{fmtHoras(m.horas)}</span>
                    {m.valor>0&&<span style={{fontSize:11,fontWeight:700,color:C.verde}}>{fmtBRL(m.valor)}</span>}
                    {m.status!=="Cancelado"&&m.lancado===true&&<span style={{fontSize:10,color:C.verde}} title="Lançada no financeiro">💰 no financeiro</span>}
                    {m.status!=="Cancelado"&&m.lancado===false&&<span style={{fontSize:10,color:C.oliva}} title="Só no pedido">📌 só no pedido</span>}
                    {m.status!=="Cancelado"&&<>
                      {m.lancado===false&&m.valor>0&&<Btn sm v="ghost" onClick={()=>lancarMedicaoFin(m)}>💰 Lançar</Btn>}
                      <Btn sm v="ghost" onClick={()=>gerarMedicao(m,sel)}>📄</Btn>
                      <button onClick={()=>enviarWhatsApp(sel,"medicao",m)} style={{fontSize:11,background:"none",border:"none",cursor:"pointer",color:C.verde}}>💬</button>
                      <button onClick={()=>{
                        const novoVal=window.prompt("Editar valor (R$):",m.valor||0);
                        if(novoVal===null)return;
                        const novaObs=window.prompt("Editar observação:",m.obs||"");
                        if(novaObs===null)return;
                        setConsultoria(prev=>prev.map(c=>c.id===sel.id?{...c,medicoes:c.medicoes.map(x=>x.id===m.id?{...x,valor:Number(novoVal)||x.valor,obs:novaObs}:x)}:c));
                        showSavedGlobal("Medição atualizada!");
                      }} style={{fontSize:11,background:"none",border:"none",cursor:"pointer",color:C.oliva}}>✎</button>
                      <button onClick={()=>{
                        if(!window.confirm("Cancelar medição? Atendimentos voltarão para abertos."))return;
                        if(m.financeiroId){setFinance(prev=>prev.filter(f=>f.id!==m.financeiroId));}
                        else if(m.lancado!==false){setFinance(prev=>prev.filter(f=>!(f.tipoReceita==="Consultoria"&&f.clientName===sel.clienteNome&&f.date===m.dataFim&&f.desc?.includes("Medição"))));}
                        setConsultoria(prev=>prev.map(c=>c.id===sel.id?{...c,medicoes:c.medicoes.map(x=>x.id===m.id?{...x,status:"Cancelado"}:x),atendimentos:c.atendimentos.map(a=>a.medicaoId===m.id?{...a,medicaoId:null}:a)}:c));
                        showSavedGlobal("Medição cancelada.");
                      }} style={{fontSize:11,background:"none",border:"none",cursor:"pointer",color:C.vermelho}}>✕</button>
                    </>}
                  </div>
                </div>
                <div style={{fontSize:11,color:C.oliva}}>{fmtDate(m.dataFim)}{m.dataVencimento?` · Venc: ${fmtDate(m.dataVencimento)}`:""}{m.obs?` · ${m.obs}`:""}</div>
              </div>
            ))}
          </>}
        </div>}

        {subTab==="dados"&&<Card>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"5px 12px"}}>
            {[["Cliente",sel.clienteNome],sel.empresaTerceira?["Empresa",sel.empresaTerceira]:null,["Serviço",sel.servico],["Modalidade",sel.tipo],["Cobrança",sel.tipoCobranca],["Status",sel.status],["Valor",`${fmtBRL(Number(sel.valor||0))}${sel.tipo==="Fixo mensal"?"/mês":""}`],sel.valorHora>0?["Valor/hora",fmtBRL(Number(sel.valorHora))]:null,sel.horasContratadas>0?["Horas",fmtHoras(Number(sel.horasContratadas))]:null,["Pagamento",sel.formaPag||"PIX"],["Início",fmtDate(sel.dataInicio)],["Término",sel.dataFim?fmtDate(sel.dataFim):"Indeterminado"],sel.dataVencimento?["Vencimento",fmtDate(sel.dataVencimento)]:null,sel.diaEmissao&&sel.tipo==="Fixo mensal"?["Dia emissão",`Dia ${sel.diaEmissao}`]:null].filter(Boolean).map(([l,v])=>(
              <div key={l} style={{borderBottom:`1px solid ${C.linho}`,paddingBottom:3}}>
                <div style={{fontSize:8,color:C.oliva,textTransform:"uppercase",letterSpacing:"1px",fontWeight:700}}>{l}</div>
                <div style={{fontSize:12,fontWeight:600,color:C.cafe}}>{v}</div>
              </div>
            ))}
          </div>
          {sel.obs&&<div style={{marginTop:8,fontSize:12,color:C.oliva,fontStyle:"italic",background:C.linho,borderRadius:4,padding:"7px 10px"}}>{sel.obs}</div>}
        </Card>}
      </>}

      {/* MODAL PEDIDO */}
      {modal==="pedido"&&<Modal title={form.orcamento?(form.id?"Editar Orçamento":"Novo Orçamento"):(form.id?"Editar Pedido":"Novo Pedido")} onClose={()=>setModal(null)} wide>
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          <div>
            <label style={{fontSize:11,fontWeight:600,color:C.oliva,textTransform:"uppercase",letterSpacing:"0.8px",display:"block",marginBottom:6}}>Cliente *</label>
            <select value={form.clientId} onChange={e=>{const c=clients.find(x=>x.id===e.target.value);setForm(f=>({...f,clientId:e.target.value,clienteNome:c?.name||"",clienteCpfCnpj:c?.cpfCnpj||""}));}} style={{width:"100%",padding:"9px 13px",border:`1.5px solid ${C.areia}`,borderRadius:3,fontSize:13,color:C.cafe,background:C.branco}}>
              <option value="">Selecione um cliente...</option>
              {clients.map(c=><option key={c.id} value={c.id}>{c.name}{c.empresa?` (${c.empresa})`:""}</option>)}
            </select>
          </div>
          <Inp label="Empresa atendida (terceirizada)" value={form.empresaTerceira} onChange={v=>setForm(f=>({...f,empresaTerceira:v}))} placeholder="Ex: Next Contabilidade"/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <Sel label="Serviço" value={form.servico} onChange={v=>setForm(f=>({...f,servico:v}))} options={SERVICOS_CONSUL}/>
            <Sel label="Modalidade" value={form.tipo} onChange={v=>setForm(f=>({...f,tipo:v}))} options={TIPOS_PEDIDO_CONSUL}/>
            <Sel label="Tipo de cobrança" value={form.tipoCobranca} onChange={v=>setForm(f=>({...f,tipoCobranca:v}))} options={TIPO_COBRANCA}/>
            <Sel label="Forma de pagamento" value={form.formaPag} onChange={v=>setForm(f=>({...f,formaPag:v}))} options={["PIX","Boleto","Transferência","Dinheiro","Cartão"]}/>
            {(form.tipoCobranca==="Por hora"||["Por medição","Pacote de horas"].includes(form.tipo))&&<Inp label="Valor por hora (R$)" type="number" value={form.valorHora} onChange={v=>setForm(f=>({...f,valorHora:v}))}/>}
            {!["Por medição","Pacote de horas"].includes(form.tipo)&&<Inp label="Valor (R$)" type="number" value={form.valor} onChange={v=>setForm(f=>({...f,valor:v}))}/>}
            {["Pacote de horas","Por medição"].includes(form.tipoCobranca)||form.tipoCobranca==="Pacote"?<Inp label="Horas contratadas" type="number" value={form.horasContratadas} onChange={v=>setForm(f=>({...f,horasContratadas:v}))}/>:null}
            <Inp label="Data de início" type="date" value={form.dataInicio} onChange={v=>setForm(f=>({...f,dataInicio:v}))}/>
            <Inp label="Data de término (vazio = indeterminado)" type="date" value={form.dataFim} onChange={v=>setForm(f=>({...f,dataFim:v}))}/>
            {!["Por medição","Pacote de horas","Fixo mensal"].includes(form.tipo)&&<Inp label="Data de vencimento" type="date" value={form.dataVencimento} onChange={v=>setForm(f=>({...f,dataVencimento:v}))}/>}
            {!form.id&&!form.orcamento&&["Esporádico","Projeto"].includes(form.tipo)&&Number(form.valor)>0&&<label style={{gridColumn:"1 / -1",display:"flex",gap:8,alignItems:"center",cursor:"pointer",fontSize:13,fontWeight:600,color:C.cafe,background:C.linho,borderRadius:6,padding:"8px 12px"}}><input type="checkbox" checked={!!form.lancarFinanceiro} onChange={e=>setForm(f=>({...f,lancarFinanceiro:e.target.checked}))}/> 💰 Lançar no financeiro agora <span style={{fontWeight:400,fontSize:11}}>(sem marcar, fica só no pedido)</span></label>}
            {form.tipo==="Fixo mensal"&&<Inp label="Dia de emissão mensal" type="number" value={form.diaEmissao} onChange={v=>setForm(f=>({...f,diaEmissao:v}))}/>}
            <Sel label="Status" value={form.status} onChange={v=>setForm(f=>({...f,status:v}))} options={STATUS_PEDIDO_CONSUL}/>
          </div>
          <Inp label="Observações / Escopo" value={form.obs} onChange={v=>setForm(f=>({...f,obs:v}))} rows={2}/>
        </div>
        <div style={{display:"flex",gap:8,marginTop:14,justifyContent:"flex-end"}}>
          <Btn v="ghost" onClick={()=>setModal(null)}>Cancelar</Btn>
          <Btn v="ghost" onClick={()=>{savePedido();setTimeout(()=>sel&&gerarContrato(sel),300);}}>Salvar + Imprimir</Btn>
          <Btn onClick={savePedido}>{form.orcamento?"Salvar orçamento":"Salvar pedido"}</Btn>
        </div>
      </Modal>}

      {/* MODAL ATENDIMENTO */}
      {modal==="atend"&&sel&&<Modal title={atendForm.id?"✎ Editar Atendimento":"+ Registrar Atendimento"} onClose={()=>setModal(null)} wide>
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <Inp label="Data" type="date" value={atendForm.data} onChange={v=>setAtendForm(f=>({...f,data:v}))}/>
            <Sel label="Tipo" value={atendForm.tipo} onChange={v=>setAtendForm(f=>({...f,tipo:v}))} options={TIPOS_ATEND_C}/>
            <Inp label="Hora início" value={atendForm.horaInicio} onChange={v=>{const d=calcDuracao(v,atendForm.horaFim);setAtendForm(f=>({...f,horaInicio:v,duracao:d>0?d:f.duracao}));}} placeholder="09:00"/>
            <Inp label="Hora fim" value={atendForm.horaFim} onChange={v=>{const d=calcDuracao(atendForm.horaInicio,v);setAtendForm(f=>({...f,horaFim:v,duracao:d>0?d:f.duracao}));}} placeholder="10:30"/>
          </div>
          {(()=>{
            const durAt=calcDuracao(atendForm.horaInicio,atendForm.horaFim)||Number(atendForm.duracao)||0;
            const cobra=sel.tipoCobranca==="Por hora"||["Por medição","Pacote de horas"].includes(sel.tipo);
            const semTaxa=taxaHora(sel)<=0;
            const rateAt=semTaxa?num(atHora):taxaHora(sel);
            const manual=Number(atendForm.valor)>0;
            const vAt=manual?Number(atendForm.valor):Math.round(rateAt*durAt*100)/100;
            return<>
              {durAt>0&&<div style={{background:C.linho,borderRadius:4,padding:"7px 12px",fontSize:12,display:"flex",gap:12,flexWrap:"wrap"}}>
                <span style={{color:C.cafe,fontWeight:700}}>⏱ {fmtHoras(durAt)}</span>
                {vAt>0&&<span style={{color:C.verde,fontWeight:700}}>💰 {fmtBRL(vAt)} {manual?"(valor informado)":`(automático · ${fmtBRL(rateAt)}/h)`}</span>}
                {vAt<=0&&cobra&&<span style={{color:C.vermelho,fontWeight:700}}>⚠ Sem valor — informe o valor da hora abaixo</span>}
              </div>}
              {cobra&&semTaxa&&<Inp label="Valor da hora deste pedido (R$) — será salvo no pedido" type="number" value={atHora} onChange={setAtHora} placeholder="Ex: 200"/>}
            </>;
          })()}
          <Inp label="O que foi feito *" value={atendForm.assunto} onChange={v=>setAtendForm(f=>({...f,assunto:v}))} rows={3} placeholder="Descreva as atividades realizadas..."/>
          <Inp label="Próximos passos" value={atendForm.proximosPassos} onChange={v=>setAtendForm(f=>({...f,proximosPassos:v}))} placeholder="Ações para o próximo atendimento..."/>
          <Inp label="Valor (R$) — 0 = automático" type="number" value={atendForm.valor} onChange={v=>setAtendForm(f=>({...f,valor:v}))}/>
          <div style={{background:C.linho,borderRadius:6,padding:"10px 12px"}}>
            {(atendForm.financeiroId&&finance.some(f=>f.id===atendForm.financeiroId))&&<div style={{fontSize:13,fontWeight:700,color:C.verde}}>✓ Já lançado no financeiro</div>}
            <label style={{display:(atendForm.financeiroId&&finance.some(f=>f.id===atendForm.financeiroId))?"none":"flex",gap:8,alignItems:"center",cursor:"pointer",fontSize:13,fontWeight:600,color:C.cafe,marginBottom:atendForm.lancarFinanceiro?8:0}}>
              <input type="checkbox" checked={atendForm.lancarFinanceiro||false} onChange={e=>setAtendForm(f=>({...f,lancarFinanceiro:e.target.checked}))}/>
              💰 Lançar no financeiro agora
            </label>
            {atendForm.lancarFinanceiro&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginTop:4}}>
              <Inp label="Data de vencimento" type="date" value={atendForm.dataVencFin||""} onChange={v=>setAtendForm(f=>({...f,dataVencFin:v}))}/>
              <Sel label="Forma de pagamento" value={atendForm.formaPagFin||"PIX"} onChange={v=>setAtendForm(f=>({...f,formaPagFin:v}))} options={["PIX","Boleto","Transferência","Dinheiro","Cartão"]}/>
            </div>}
          </div>
          <div style={{background:C.linho,borderRadius:6,padding:"10px 12px"}}>
            <div style={{fontSize:11,fontWeight:700,color:C.cafe,marginBottom:6}}>📅 Agendar próximo atendimento</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              <Inp label="Data" type="date" value={atendForm.proximaData||""} onChange={v=>setAtendForm(f=>({...f,proximaData:v}))}/>
              <Inp label="Horário" value={atendForm.proximaHora||""} onChange={v=>setAtendForm(f=>({...f,proximaHora:v}))} placeholder="09:00"/>
            </div>
          </div>
        </div>
        <div style={{display:"flex",gap:8,marginTop:14,justifyContent:"flex-end"}}>
          <Btn v="ghost" onClick={()=>{setAtendForm(EFA);setModal(null);}}>Cancelar</Btn>
          <Btn onClick={saveAtend}>{atendForm.id?"Salvar edição":"Salvar atendimento"}</Btn>
        </div>
      </Modal>}

      {modal==="comp"&&compForm&&<Modal title="📅 Adicionar à Agenda" onClose={()=>setModal(null)}>
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <Inp label="Descrição" value={compForm.desc} onChange={v=>setCompForm(f=>({...f,desc:v}))}/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <Inp label="Data" type="date" value={compForm.data} onChange={v=>setCompForm(f=>({...f,data:v}))}/>
            <Inp label="Horário" type="time" value={compForm.hora} onChange={v=>setCompForm(f=>({...f,hora:v}))}/>
          </div>
          <Sel label="Prioridade" value={compForm.prioridade} onChange={v=>setCompForm(f=>({...f,prioridade:v}))} options={["Alta","Normal","Baixa"]}/>
        </div>
        <div style={{fontSize:11,color:C.oliva,marginTop:10}}>Isso só adiciona um lembrete na Agenda, sem registrar atendimento nem mexer no financeiro.</div>
        <div style={{display:"flex",gap:8,marginTop:14,justifyContent:"flex-end"}}>
          <Btn v="ghost" onClick={()=>setModal(null)}>Cancelar</Btn>
          <Btn onClick={salvarComp}>💾 Adicionar</Btn>
        </div>
      </Modal>}

      {/* MODAL WHATSAPP: escolher formato e o que enviar */}
      {modal==="wpp"&&sel&&(()=>{
        const ms=(sel.medicoes||[]).map((m,i)=>({m,n:i+1})).filter(x=>x.m.status!=="Cancelado");
        const fechar=()=>{setModal(null);setWppView("menu");};
        const escolher=(k)=>{
          if(wppBusy)return;
          if(k==="medicao"){
            if(ms.length===0){alert("Este pedido ainda não tem medição fechada.");return;}
            if(ms.length===1){enviarDoc("medicao",{med:ms[0].m});return;}
            setWppView("med");return;
          }
          if(k==="mes"){setWppView("mes");return;}
          enviarDoc(k);
        };
        const fmtBtn=([k,l])=>(
          <button key={k} onClick={()=>setWppFmt(k)} style={{flex:1,padding:"8px 4px",borderRadius:6,cursor:"pointer",fontSize:12,fontWeight:700,fontFamily:"inherit",border:`1.5px solid ${wppFmt===k?C.cafe:"#DDD3EA"}`,background:wppFmt===k?C.linho:"#fff",color:wppFmt===k?C.cafe:C.oliva}}>{l}</button>
        );
        const dm=(wppView==="mes"&&/^\d{4}-\d{2}$/.test(wppMes))?dadosMes(sel,wppMes,wppDia):null;
        return<Modal title="💬 Enviar por WhatsApp" onClose={fechar}>
          {wppView==="menu"&&<>
            <div style={{fontSize:11,fontWeight:700,color:C.oliva,letterSpacing:1,textTransform:"uppercase",marginBottom:6}}>Formato</div>
            <div style={{display:"flex",gap:6,marginBottom:14}}>{[["pdf","📄 PDF"],["img","🖼 Imagem"],["texto","💬 Só texto"]].map(fmtBtn)}</div>
            <div style={{fontSize:12,color:C.oliva,marginBottom:8}}>O que você quer enviar para {sel.clienteNome}?</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              {[["pedido","📄 Pedido"],["orcamento","📋 Orçamento"],["contrato","📑 Contrato"],["medicao","📏 Medição"]].map(([k,l])=>(
                <Btn key={k} v="ghost" disabled={wppBusy} onClick={()=>escolher(k)}>{l}</Btn>
              ))}
              {sel.tipo==="Fixo mensal"&&<Btn v="oliva" disabled={wppBusy} style={{gridColumn:"1 / span 2"}} onClick={()=>escolher("mes")}>📆 Lançamento do mês</Btn>}
            </div>
          </>}
          {wppView==="med"&&<>
            <div style={{fontSize:12,color:C.oliva,marginBottom:8}}>Qual medição enviar?</div>
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              {[...ms].reverse().map(({m,n})=>(
                <Btn key={m.id} v="ghost" disabled={wppBusy} onClick={()=>enviarDoc("medicao",{med:m})}>📏 Medição {n} — {fmtDate(m.dataFim)} · {fmtHoras(m.horas)}{m.valor>0?` · ${fmtBRL(m.valor)}`:""}</Btn>
              ))}
            </div>
          </>}
          {wppView==="mes"&&<>
            <div style={{fontSize:12,color:C.oliva,marginBottom:8}}>Confirma o serviço do mês para o cliente fazer o pagamento.</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              <Inp label="Mês de referência" type="month" value={wppMes} onChange={setWppMes}/>
              <Inp label="Dia de vencimento" type="number" value={wppDia} onChange={setWppDia}/>
            </div>
            {dm&&<div style={{background:C.linho,borderRadius:6,padding:"8px 12px",fontSize:12,marginTop:10}}>
              <b style={{color:C.cafe}}>{dm.nomeMes}</b> · {fmtBRL(dm.valor)} · venc. {fmtDate(dm.venc)}{dm.lanc?(dm.lanc.pago?" · ✓ já pago":" · já lançado no financeiro"):" · ainda não lançado no financeiro"}
            </div>}
            <Btn full style={{marginTop:12}} disabled={wppBusy} onClick={()=>enviarDoc("mes",{mes:wppMes,dia:wppDia})}>📆 Gerar e enviar ({wppFmt==="pdf"?"PDF":wppFmt==="img"?"imagem":"texto"})</Btn>

const Reports = ({orders,products,finance,clients}) => {

  const recTotal=finance.filter(f=>f.type==="receita"&&f.pago).reduce((a,f)=>a+f.value,0);
  const recPend=finance.filter(f=>f.type==="receita"&&!f.pago).reduce((a,f)=>a+f.value,0);
  const avgTicket=ordAtivos.length>0?fatTotal/ordAtivos.length:0;

  const invTotal=finance.filter(f=>f.centrocusto==="Investimentos").reduce((a,f)=>a+f.value,0);
  const lucro=recTotal-despTotal;
  const origens=clients.reduce((acc,c)=>{if(c.origem)acc[c.origem]=(acc[c.origem]||0)+1;return acc;},{});
  // Produtos mais vendidos
  const prodVendas=orders.filter(o=>o.status!=="Cancelado").reduce((acc,o)=>{

    acc[nome].total+=(o.precoFinal||o.price||0);

  const topProd=Object.values(prodVendas).sort((a,b)=>b.total-a.total).slice(0,5);

      <div style={{display:"flex",gap:14,flexWrap:"wrap",marginBottom:14}}>
        <Card style={{flex:1,minWidth:200}}>
          <h3 style={{fontSize:14,marginBottom:12}}>Resumo financeiro</h3>
          {[["Faturamento total",fmtBRL(fatTotal)],["Já recebido",fmtBRL(recTotal)],["A receber",fmtBRL(recPend)],["Total despesas",fmtBRL(despTotal)],["Lucro líquido",fmtBRL(lucro)],["Investimentos",fmtBRL(invTotal)]].map(([l,v])=>(

// ─── MONITOR DE ARMAZENAMENTO ─────────────────────────────────────────────────
const StorageMonitor = () => {
  const [info, setInfo] = useState(null);
  useEffect(() => {
    try {
      let total = 0;
      const keys = [];
      for (let k in localStorage) {
        if (!localStorage.hasOwnProperty(k)) continue;
        const size = (localStorage[k].length * 2) / 1024;
        if (k.startsWith("atelie_") && !k.endsWith("_bk")) {
          keys.push({k: k.replace("atelie_",""), size: size.toFixed(1)});
          total += size;
        }
      }
      setInfo({total: total.toFixed(0), keys, limite: 5120, pct: Math.round((total/5120)*100)});
    } catch { setInfo(null); }
  }, []);

  if (!info) return null;
  const cor = info.pct > 80 ? C.vermelho : info.pct > 50 ? C.dourado : C.verde;
  return (
    <div style={{background:C.branco,borderRadius:6,padding:"10px 12px",marginBottom:4}}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
        <span style={{fontSize:12,fontWeight:700,color:C.cafe}}>Espaço utilizado</span>
        <span style={{fontSize:12,fontWeight:700,color:cor}}>{info.total} KB de 5.120 KB ({info.pct}%)</span>
      </div>
      <PBar pct={info.pct} color={cor} h={6}/>
      {info.pct > 70 && <div style={{fontSize:11,color:C.vermelho,marginTop:6,fontWeight:600}}>⚠ Espaço quase cheio! Faça backup e evite adicionar muitas fotos em alta resolução.</div>}
      {info.pct <= 70 && <div style={{fontSize:11,color:C.oliva,marginTop:6}}>✓ Espaço disponível para seus dados.</div>}
    </div>
  );
};

// ─── RASTREAR PEDIDO (modal público) ─────────────────────────────────────────
const RastrearModal = ({onClose}) => {
  const [q,setQ]=useState("");
  const [result,setResult]=useState(null);
  const buscar=()=>{
    try{
      const all=JSON.parse(localStorage.getItem("atelie_orders")||"[]");
      const found=all.find(o=>o.id?.toLowerCase()===q.toLowerCase()||o.client?.toLowerCase().includes(q.toLowerCase()));
      setResult(found||"none");
    }catch{setResult("none");}
  };
  return(
    <Modal title="Acompanhar Meu Pedido" onClose={onClose} wide>
      <p style={{fontFamily:"'Cormorant Garamond',serif",fontSize:14,fontStyle:"italic",color:C.oliva,marginBottom:12}}>Digite o número do pedido (ex: EN-001) ou seu nome.</p>
      <div style={{display:"flex",gap:8,marginBottom:12}}>
        <div style={{flex:1}}><Inp value={q} onChange={setQ} placeholder="EN-001 ou seu nome..."/></div>
        <Btn onClick={buscar}>Buscar</Btn>
      </div>
      {result==="none"&&<div style={{textAlign:"center",padding:"14px",color:C.oliva,fontStyle:"italic"}}>Pedido não encontrado. Verifique o número ou fale pelo WhatsApp.</div>}
      {result&&result!=="none"&&(
        <div style={{background:C.linho,borderRadius:8,padding:"16px"}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}>
            <div><div style={{fontSize:9,color:C.oliva,textTransform:"uppercase",letterSpacing:"1px",marginBottom:1}}>Pedido</div><div style={{fontSize:22,fontFamily:"'Playfair Display',serif",fontWeight:700}}>{result.id}</div></div>
            <Badge label={result.status}/>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
            {[["Produto",result.product],["Cor",result.color||"—"],["Tamanho",result.size||"—"],["Posição na fila",`${result.position}ª`],["Previsão de entrega",fmtDate(result.delivery)],["Valor total",fmtBRL(result.precoFinal||result.price)],["Já pago",fmtBRL(result.valorPago||0)],["Saldo restante",fmtBRL(Math.max(0,(result.precoFinal||result.price||0)-(result.valorPago||0)))]].map(([l,v])=>(
              <div key={l}><div style={{fontSize:9,color:C.oliva,textTransform:"uppercase",fontWeight:600,letterSpacing:"1px",marginBottom:1}}>{l}</div><div style={{fontSize:13,fontWeight:600}}>{v}</div></div>
            ))}
          </div>
          {result.tracking&&<div style={{marginTop:10,fontSize:12,fontWeight:700}}>Rastreio: {result.tracking}</div>}
        </div>
      )}
    </Modal>
  );
};

// ─── FICHA DO PEDIDO ──────────────────────────────────────────────────────────
const FichaPedido = ({order,products,onClose,config}) => {
  const pF=order?.precoFinal||order?.price||0;
  const saldo=Math.max(0,pF-(order?.valorPago||0));
  const itens=order?.itens?.length>0?order.itens:[{product:order?.product,color:order?.color,size:order?.size,qty:1,price:pF}];
  if(!order)return null;

  const shareWA=()=>{
    const itensStr=itens.map(i=>`  • ${i.product}${i.color&&i.color!=="—"?` · ${i.color}`:""}${i.size&&i.size!=="—"?` · ${i.size}`:""}${i.qty>1?` (${i.qty}x)`:""} — ${fmtBRL(Number(i.price)*Number(i.qty||1))}`).join("\n");
    const msg=`🤎 *Ficha do Pedido ${order.id}*\n\nCliente: ${order.client}\n\n*Produtos:*\n${itensStr}\n\nValor total: ${fmtBRL(pF)}${order.desconto>0?`\nDesconto: -${order.tipoDesc==="pct"?order.desconto+"%":fmtBRL(order.desconto)}`:""}${order.taxaEnvio>0?`\nFrete: ${fmtBRL(order.taxaEnvio)}`:""}${order.condicao==="Com entrada"?`\nEntrada: ${fmtBRL(order.entrada)} em ${fmtDate(order.dataEntradaPag)}\nSaldo: ${fmtBRL(saldo)}`:""}${order.condicao==="Parcelado"&&order.parcelas?.length?`\nParcelas:\n${order.parcelas.map(x=>`  ${x.n}ª: ${fmtBRL(x.valor)} em ${fmtDate(x.data)}`).join("\n")}`:""}\nMedidas: ${order.measures||"—"}\nEntrega: ${fmtDate(order.delivery)}\nFila: ${order.position}ª\n\n${BRAND}`;
    window.open(`https://wa.me/${order.phone?.replace(/\D/g,"")}?text=${waMsg(msg)}`);
  };

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(35,53,90,0.55)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:300,padding:16,overflowY:"auto"}}>
      <div style={{background:"#FDFAFF",borderRadius:10,width:"100%",maxWidth:440,maxHeight:"95vh",overflowY:"auto"}}>
        <div style={{padding:"18px 20px"}}>

          {/* CABEÇALHO */}
          <div style={{background:`linear-gradient(135deg,#23355A,#2D1B69)`,borderRadius:8,padding:"14px 18px",marginBottom:16,textAlign:"center"}}>
            <div style={{fontSize:8,color:"#D8B4CE",letterSpacing:"4px",textTransform:"uppercase",fontWeight:700,marginBottom:2}}>Ateliê Digital</div>
            <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:17,color:"#FDFAFF",fontStyle:"italic"}}>{BRAND_SHORT}</div>
            <div style={{fontSize:8,color:"rgba(216,180,206,0.7)",letterSpacing:"2px",marginTop:1}}>TRICOT, AMOR & ARTE</div>
          </div>

          {/* PEDIDO + STATUS */}
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14}}>
            <div>
              <div style={{fontSize:9,color:C.oliva,textTransform:"uppercase",letterSpacing:"1px"}}>Pedido</div>
              <div style={{fontSize:24,fontFamily:"'Playfair Display',serif",fontWeight:700,color:C.oliva}}>{order.id}</div>
            </div>
            <div style={{textAlign:"right"}}>
              <Badge label={order.status}/>
              <div style={{fontSize:10,color:C.oliva,marginTop:3}}>Fila: {order.position}ª</div>
            </div>
          </div>

          {/* CLIENTE */}
          <div style={{borderBottom:`1px solid ${C.areia}`,paddingBottom:8,marginBottom:12}}>
            <div style={{fontSize:8,color:C.oliva,fontWeight:700,letterSpacing:"1.5px",textTransform:"uppercase",marginBottom:2}}>Cliente</div>
            <div style={{fontSize:14,fontWeight:700,color:C.oliva}}>{order.client}</div>
            {order.phone&&<div style={{fontSize:11,color:C.oliva,opacity:0.7}}>{order.phone}</div>}
          </div>

          {/* PRODUTOS — cada item detalhado */}
          <div style={{marginBottom:12}}>
            <div style={{fontSize:8,color:C.oliva,fontWeight:700,letterSpacing:"1.5px",textTransform:"uppercase",marginBottom:6}}>Produtos do pedido</div>
            {itens.map((item,i)=>(
              <div key={i} style={{background:i%2===0?C.linho:"#fff",borderRadius:6,padding:"8px 10px",marginBottom:5,border:`1px solid ${C.areia}`}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
                  <div style={{flex:1}}>
                    <div style={{fontSize:12,fontWeight:700,color:C.oliva,lineHeight:1.3}}>{item.product||"—"}</div>
                    <div style={{display:"flex",gap:8,marginTop:3,flexWrap:"wrap"}}>
                      {item.color&&item.color!=="—"&&<span style={{fontSize:10,color:C.oliva}}>Cor: <b>{item.color}</b></span>}
                      {item.size&&item.size!=="—"&&<span style={{fontSize:10,color:C.oliva}}>Tam: <b>{item.size}</b></span>}
                      {item.qty>1&&<span style={{fontSize:10,color:C.oliva}}>Qtd: <b>{item.qty}</b></span>}
                    </div>
                  </div>
                  <div style={{fontSize:13,fontWeight:700,color:C.oliva,whiteSpace:"nowrap"}}>{fmtBRL(Number(item.price||0)*Number(item.qty||1))}</div>
                </div>
              </div>
            ))}
          </div>

          {/* MEDIDAS */}
          {order.measures&&<div style={{fontSize:10,color:C.oliva,marginBottom:10,padding:"5px 8px",background:C.linho,borderRadius:4}}><b>Medidas:</b> {order.measures}</div>}

          {/* PAGAMENTO */}
          <div style={{background:C.linho,borderRadius:6,padding:"10px 12px",marginBottom:10}}>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:4}}>
              <span style={{color:C.oliva}}>Forma</span>
              <span style={{fontWeight:600}}>{order.condicao||order.payment}</span>
            </div>
            {order.taxaEnvio>0&&<div style={{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:3}}>
              <span style={{color:C.oliva}}>Frete</span><span>{fmtBRL(order.taxaEnvio)}</span>
            </div>}
            {order.desconto>0&&<div style={{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:3}}>
              <span style={{color:C.oliva}}>Desconto</span><span>-{order.tipoDesc==="pct"?order.desconto+"%":fmtBRL(order.desconto)}</span>
            </div>}
            <div style={{display:"flex",justifyContent:"space-between",fontSize:13,fontWeight:700,paddingTop:5,borderTop:`1px solid ${C.areia}`}}>
              <span>Valor total</span><span>{fmtBRL(pF)}</span>
            </div>

            {/* PARCELAS */}
            {order.condicao==="Parcelado"&&order.parcelas?.length>0&&<>
              <div style={{fontSize:9,color:C.oliva,letterSpacing:"1.5px",textTransform:"uppercase",marginTop:8,marginBottom:4,fontWeight:700}}>Parcelas</div>
              {order.parcelas.map((x,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:2}}>
                <span style={{color:C.oliva}}>{x.n}ª — {fmtDate(x.data)}</span>
                <span style={{fontWeight:600}}>{fmtBRL(x.valor)}</span>
              </div>)}
            </>}

            {/* COM ENTRADA */}
            {order.condicao==="Com entrada"&&<>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:11,marginTop:5}}>
                <span style={{color:C.oliva}}>Entrada ({fmtDate(order.dataEntradaPag)})</span>
                <span style={{fontWeight:600}}>{fmtBRL(order.entrada||0)}</span>
              </div>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:C.vermelho}}>
                <span>Saldo até {fmtDate(order.dataSaldo||order.delivery)}</span>
                <span style={{fontWeight:700}}>{fmtBRL(saldo)}</span>
              </div>
            </>}

            <div style={{borderTop:`1px dashed ${C.areia}`,marginTop:6,paddingTop:6}}>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:11}}>
                <span style={{fontWeight:700}}>Já pago</span>
                <span style={{fontWeight:700,color:C.oliva}}>{fmtBRL(order.valorPago||0)}</span>
              </div>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:12}}>
                <span style={{fontWeight:700}}>Saldo em aberto</span>
                <span style={{fontWeight:700,color:saldo<=0?C.oliva:C.vermelho}}>{fmtBRL(saldo)}</span>
              </div>
            </div>
          </div>

          {/* ENTREGA */}
          <div style={{textAlign:"center",padding:"8px",background:"rgba(165,99,162,0.08)",borderRadius:6,marginBottom:8,border:`1px solid rgba(165,99,162,0.2)`}}>
            <div style={{fontSize:8,color:C.oliva,textTransform:"uppercase",letterSpacing:"1.5px",marginBottom:2}}>Previsão de entrega</div>
            <div style={{fontSize:18,fontFamily:"'Playfair Display',serif",fontWeight:700,color:C.oliva}}>{fmtDate(order.delivery)}</div>
          </div>

          {order.note&&<div style={{fontSize:10,color:C.oliva,fontStyle:"italic",marginBottom:8}}>Obs: {order.note}</div>}
          <div style={{textAlign:"center",paddingTop:8,borderTop:`1px solid ${C.areia}`,fontSize:8,color:C.oliva,letterSpacing:"1.5px"}}>Feito com amor · {BRAND}</div>
        </div>

        <div style={{padding:"10px 20px",borderTop:`1px solid ${C.areia}`,display:"flex",gap:8,flexWrap:"wrap",background:C.linho}}>
          <Btn v="oliva" onClick={shareWA}>💬 WhatsApp</Btn>
          <Btn v="ghost" onClick={()=>window.print()}>🖨 Imprimir</Btn>
          <Btn v="ghost" onClick={onClose} style={{marginLeft:"auto"}}>Fechar</Btn>
        </div>
      </div>
    </div>
  );
};

// ─── SITE PÚBLICO (catálogo para clientes) ────────────────────────────────────
const SitePublico = ({products=[],banners=[],depoimentos=[],categories=[],config={},orders=[],setOrders,clients=[],setClients}) => {
  const [secao,setSecao]=useState("inicio");
  const [compraModal,setCompraModal]=useState(null);
  const [rastrear,setRastrear]=useState(false);
  const [destIdx,setDestIdx]=useState(0);
  const [filtCat,setFiltCat]=useState("Todos");

  // Paleta do logo
  const P={roxo:"#A563A2",marinho:"#23355A",lilas:"#D8B4CE",branco:"#FDFAFF",lilasClaro:"#F3EAF5",texto:"#1A1A2E"};

  // Separa produtos por visibilidade
  const pubProd=products.filter(p=>p.nocatalogo!==false);
  const destaques=pubProd.filter(p=>p.destaque).slice(0,6);
  const prontas=pubProd.filter(p=>p.type==="pronta"&&p.stock>0);
  const encomendas=pubProd.filter(p=>p.type==="encomenda");

  const preco=p=>p.valorPorTamanho?.length>0?`A partir de ${fmtBRL(Math.min(...p.valorPorTamanho.map(v=>v.preco)))}`:fmtBRL(p.price);

  // Carrossel destaques
  const VISIBLE=3;
  const maxIdx=Math.max(0,destaques.length-VISIBLE);
  const prevDest=()=>setDestIdx(i=>Math.max(0,i-1));
  const nextDest=()=>setDestIdx(i=>Math.min(maxIdx,i+1));

  const ProdCard=({p,grande=false})=>(
    <div onClick={()=>setCompraModal(p)} style={{cursor:"pointer",background:"#fff",borderRadius:8,overflow:"hidden",boxShadow:"0 2px 12px rgba(35,53,90,0.06)",transition:"transform 0.25s,box-shadow 0.25s",flex:grande?"0 0 280px":"1 1 180px"}}
      onMouseEnter={e=>{e.currentTarget.style.transform="translateY(-3px)";e.currentTarget.style.boxShadow="0 8px 24px rgba(35,53,90,0.13)";}}

        <div style={{position:"absolute",top:8,left:8}}>
          {p.type==="pronta"&&p.stock<=2&&p.stock>0&&<span style={{background:"#FF6B6B",color:"#fff",fontSize:8,fontWeight:700,padding:"3px 8px",borderRadius:20,letterSpacing:"1px"}}>ÚLTIMA{p.stock>1?"S":""} {p.stock}</span>}
          {p.type==="pronta"&&p.stock>2&&<span style={{background:P.marinho,color:"#fff",fontSize:8,fontWeight:700,padding:"3px 8px",borderRadius:20,letterSpacing:"1px"}}>PRONTA ENTREGA</span>}
        </div>
      </div>
      <div style={{padding:"12px 14px 16px"}}>
        <div style={{fontSize:9,color:P.roxo,letterSpacing:"2px",textTransform:"uppercase",marginBottom:4,fontWeight:600}}>{p.subcategory||p.category}</div>
        <div style={{fontSize:14,fontWeight:600,color:P.marinho,marginBottom:8,lineHeight:1.3}}>{p.name}</div>
        {p.cores?.length>0&&<div style={{display:"flex",gap:3,marginBottom:8}}>{p.cores.slice(0,5).map(c=><div key={c.id} title={c.nome} style={{width:10,height:10,borderRadius:"50%",overflow:"hidden",border:`1.5px solid ${P.lilas}`,background:P.lilas}}>{c.foto&&<img src={c.foto} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>}</div>)}</div>}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:15,fontFamily:"'Cormorant Garamond',serif",color:P.marinho,fontWeight:700}}>{preco(p)}</span>
          <button onClick={e=>{e.stopPropagation();setCompraModal(p);}} style={{background:P.roxo,color:"#fff",border:"none",borderRadius:20,padding:"5px 14px",fontSize:10,fontWeight:600,cursor:"pointer",letterSpacing:"1px"}}>Ver</button>
        </div>
      </div>
    </div>
  );

  return(
    <div style={{minHeight:"100vh",background:P.branco,fontFamily:"'Poppins',sans-serif",color:P.marinho}}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&display=swap');
        .nav-link{background:none;border:none;font-family:'Poppins',sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;padding:4px 0;color:#23355A;font-weight:500;}
        .nav-link:hover{color:#A563A2;}
        .cg-mobile{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
        @media(min-width:640px){.cg-mobile{grid-template-columns:repeat(3,1fr);gap:16px;}}
        @media(min-width:900px){.cg-mobile{grid-template-columns:repeat(4,1fr);gap:20px;}}

        @media(max-width:640px){.carousel-track{overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding-bottom:8px;}}

        .dest-card{flex:0 0 calc(33% - 11px);}
        @media(max-width:640px){.dest-card{flex:0 0 75vw;}}

      {/* NAVEGAÇÃO */}
      <nav style={{position:"sticky",top:0,zIndex:100,background:"rgba(253,250,255,0.95)",backdropFilter:"blur(12px)",borderBottom:`1px solid ${P.lilas}`,padding:"14px 24px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{display:"flex",flexDirection:"column"}}>
          <span style={{fontSize:14,fontFamily:"'Cormorant Garamond',serif",fontWeight:600,color:P.marinho,letterSpacing:"1px"}}>Ateliê Simara Lobui</span>
          <span style={{fontSize:9,color:P.roxo,letterSpacing:"3px",textTransform:"uppercase"}}>Tricot · Crochê · Arte</span>
        </div>
        <div style={{display:"flex",gap:20,flexWrap:"wrap"}}>
          {[["inicio","Início"],["destaques","Destaques"],["pronta","Pronta Entrega"],["encomenda","Sob Encomenda"]].map(([k,l])=>(
            <button key={k} className="nav-link" onClick={()=>{setSecao(k);document.getElementById(`sec-${k}`)?.scrollIntoView({behavior:"smooth"});}} style={{color:secao===k?P.roxo:P.marinho,fontWeight:secao===k?600:400,borderBottom:secao===k?`2px solid ${P.roxo}`:"none",paddingBottom:2}}>{l}</button>
          ))}
        </div>
        <button onClick={()=>window.open(`https://wa.me/${config.whatsapp}`)} style={{background:P.roxo,color:"#fff",border:"none",borderRadius:24,padding:"8px 18px",fontSize:10,fontWeight:600,cursor:"pointer",letterSpacing:"1.5px",textTransform:"uppercase"}}>💬 Falar comigo</button>
      </nav>

      {/* HERO */}
      <div id="sec-inicio" style={{background:`linear-gradient(135deg,${P.marinho} 0%,#0E0F40 60%,${P.marinho} 100%)`,minHeight:"85vh",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",textAlign:"center",padding:"60px 24px",position:"relative",overflow:"hidden"}}>
        {/* Ornamentos */}
        <div style={{position:"absolute",top:"10%",left:"5%",width:200,height:200,borderRadius:"50%",background:`radial-gradient(circle,${P.roxo}22,transparent)`,pointerEvents:"none"}}/>
        <div style={{position:"absolute",bottom:"15%",right:"8%",width:280,height:280,borderRadius:"50%",background:`radial-gradient(circle,${P.lilas}18,transparent)`,pointerEvents:"none"}}/>
        <div style={{position:"relative",zIndex:1,maxWidth:600}}>
          <div style={{fontSize:9,color:P.lilas,letterSpacing:"6px",textTransform:"uppercase",marginBottom:20,opacity:0.8}}>Bem-vinda ao meu ateliê</div>
          <h1 style={{fontFamily:"'Cormorant Garamond',serif",fontSize:"clamp(36px,6vw,64px)",fontWeight:300,color:"#FDFAFF",lineHeight:1.15,marginBottom:8}}>Feito à mão,</h1>
          <h1 style={{fontFamily:"'Cormorant Garamond',serif",fontSize:"clamp(36px,6vw,64px)",fontWeight:400,color:P.lilas,fontStyle:"italic",lineHeight:1.15,marginBottom:24}}>com amor e propósito.</h1>
          <div style={{width:40,height:1,background:P.roxo,margin:"0 auto 24px"}}/>
          <p style={{fontFamily:"'Cormorant Garamond',serif",fontSize:16,color:`${P.lilas}cc`,fontStyle:"italic",lineHeight:1.7,marginBottom:36}}>Peças autorais que carregam histórias,<br/>acolhem e transformam momentos.</p>
          <div style={{display:"flex",gap:12,justifyContent:"center",flexWrap:"wrap"}}>
            <button onClick={()=>document.getElementById("sec-destaques")?.scrollIntoView({behavior:"smooth"})} style={{background:P.roxo,color:"#fff",border:"none",borderRadius:30,padding:"14px 32px",fontSize:11,fontWeight:600,cursor:"pointer",letterSpacing:"2px",textTransform:"uppercase",boxShadow:`0 4px 20px ${P.roxo}55`}}>Conhecer o ateliê ›</button>
            <button onClick={()=>window.open(`https://wa.me/${config.whatsapp}`)} style={{background:"transparent",color:"#FDFAFF",border:`1.5px solid rgba(253,250,255,0.35)`,borderRadius:30,padding:"14px 32px",fontSize:11,fontWeight:400,cursor:"pointer",letterSpacing:"2px",textTransform:"uppercase"}}>Fazer encomenda</button>
          </div>
        </div>
        {/* Indicador scroll */}
        <div style={{position:"absolute",bottom:30,left:"50%",transform:"translateX(-50%)",display:"flex",flexDirection:"column",alignItems:"center",gap:6,opacity:0.4}}>
          <div style={{width:1,height:30,background:P.lilas}}/>
          <div style={{fontSize:8,color:P.lilas,letterSpacing:"3px",textTransform:"uppercase"}}>scroll</div>
        </div>
      </div>

      {/* DESTAQUES DO ATELIÊ */}
      <div id="sec-destaques" style={{background:P.branco,padding:"60px 24px"}}>
        <div style={{textAlign:"center",marginBottom:40}}>
          <div style={{fontSize:9,color:P.roxo,letterSpacing:"5px",textTransform:"uppercase",marginBottom:12,fontWeight:500}}>O que está em destaque ♡</div>
          <h2 style={{fontFamily:"'Cormorant Garamond',serif",fontSize:"clamp(28px,4vw,42px)",fontWeight:400,color:P.marinho,marginBottom:16}}>Destaques do Ateliê</h2>
          <div style={{width:32,height:1,background:P.roxo,margin:"0 auto"}}/>
        </div>
        {destaques.length===0&&<div style={{textAlign:"center",padding:"30px",color:P.roxo,fontFamily:"'Cormorant Garamond',serif",fontStyle:"italic",fontSize:15}}>Em breve, nossas peças em destaque ✦</div>}

          {/* Desktop: carrossel com setas */}

            <div className="carousel-track" style={{paddingLeft:4}}>
              {destaques.map((p,i)=>(
                <div key={p.id} className="dest-card" style={{opacity:1,transition:"all 0.3s",transform:i===Math.floor(VISIBLE/2+destIdx)?"scale(1.02)":"scale(1)"}}>

          {destaques.length>VISIBLE&&<div style={{display:"flex",gap:6,justifyContent:"center",marginTop:20}}>

      {/* PRONTA ENTREGA */}
      {prontas.length>0&&<div id="sec-pronta" style={{background:P.lilasClaro,padding:"60px 24px"}}>
        <div style={{maxWidth:1100,margin:"0 auto",display:"flex",gap:40,alignItems:"flex-start",flexWrap:"wrap"}}>
          <div style={{minWidth:160,flex:"0 0 180px"}}>
            <div style={{fontSize:9,color:P.roxo,letterSpacing:"4px",textTransform:"uppercase",marginBottom:10,fontWeight:500}}>Disponível agora ♡</div>
            <h2 style={{fontFamily:"'Cormorant Garamond',serif",fontSize:32,fontWeight:400,color:P.marinho,lineHeight:1.2,marginBottom:14}}>Pronta<br/>entrega</h2>
            <p style={{fontSize:12,color:P.marinho,opacity:0.7,lineHeight:1.7,marginBottom:24}}>Peças únicas,<br/>prontas para<br/>chegar até você.</p>
            <button onClick={()=>{setFiltCat("Todos");document.getElementById("sec-galeria")?.scrollIntoView({behavior:"smooth"});}} style={{background:P.roxo,color:"#fff",border:"none",borderRadius:24,padding:"10px 22px",fontSize:10,fontWeight:600,cursor:"pointer",letterSpacing:"1.5px",textTransform:"uppercase"}}>Ver todas</button>
          </div>
          <div style={{flex:1,minWidth:260}}>
            <div className="cg-mobile" style={{gridTemplateColumns:"repeat(2,1fr)"}}>
              {prontas.slice(0,4).map(p=><ProdCard key={p.id} p={p}/>)}
            </div>
          </div>
        </div>
      </div>}

      {/* SOB ENCOMENDA */}
      {encomendas.length>0&&<div id="sec-encomenda" style={{background:P.branco,padding:"60px 24px"}}>
        <div style={{maxWidth:1100,margin:"0 auto",display:"flex",gap:40,alignItems:"flex-start",flexWrap:"wrap",flexDirection:"row-reverse"}}>
          <div style={{minWidth:160,flex:"0 0 180px",textAlign:"right"}}>
            <div style={{fontSize:9,color:P.roxo,letterSpacing:"4px",textTransform:"uppercase",marginBottom:10,fontWeight:500}}>Feito especialmente ♡</div>
            <h2 style={{fontFamily:"'Cormorant Garamond',serif",fontSize:32,fontWeight:400,color:P.marinho,lineHeight:1.2,marginBottom:14}}>Sob<br/>encomenda</h2>
            <p style={{fontSize:12,color:P.marinho,opacity:0.7,lineHeight:1.7,marginBottom:24}}>Peças feitas com calma,<br/>do seu jeitinho.</p>
            <button onClick={()=>window.open(`https://wa.me/${config.whatsapp}`)} style={{background:P.marinho,color:"#fff",border:"none",borderRadius:24,padding:"10px 22px",fontSize:10,fontWeight:600,cursor:"pointer",letterSpacing:"1.5px",textTransform:"uppercase"}}>Fazer encomenda</button>

              {encomendas.slice(0,4).map(p=><ProdCard key={p.id} p={p}/>)}

          <h2 style={{fontFamily:"'Cormorant Garamond',serif",fontSize:"clamp(24px,3vw,36px)",fontWeight:400,color:P.marinho}}>Todas as peças</h2>

        <div style={{display:"flex",gap:8,flexWrap:"wrap",justifyContent:"center",marginBottom:28}}>

        </div>
        <div style={{maxWidth:1100,margin:"0 auto"}}>
          <div className="cg-mobile">
            {pubProd.filter(p=>filtCat==="Todos"||p.category===filtCat).map(p=><ProdCard key={p.id} p={p}/>)}
          </div>
          {pubProd.filter(p=>filtCat==="Todos"||p.category===filtCat).length===0&&<div style={{textAlign:"center",padding:"40px",color:P.roxo,fontFamily:"'Cormorant Garamond',serif",fontStyle:"italic",fontSize:15}}>Nenhuma peça nesta categoria no momento ✦</div>}
        </div>
      </div>

      {/* POLÍTICA DE ENCOMENDAS */}
      {(config.politicaPrazo||config.politicaFila||config.politicaPagamento||config.politicaEntrega)&&<div style={{background:P.branco,padding:"50px 24px"}}>
        <div style={{textAlign:"center",marginBottom:32}}>
          <div style={{fontSize:9,color:P.roxo,letterSpacing:"5px",textTransform:"uppercase",marginBottom:12,fontWeight:500}}>Transparência ✦</div>
          <h2 style={{fontFamily:"'Cormorant Garamond',serif",fontSize:"clamp(24px,3vw,36px)",fontWeight:400,color:P.marinho}}>Política de Encomendas</h2>
        </div>

// ─── COMPRA PELO CATÁLOGO ─────────────────────────────────────────────────────
const CompraModal = ({produto,orders=[],setOrders,clients=[],setClients,config={},onClose}) => {
  const [step,setStep]=useState("opcoes");
  const [sel,setSel]=useState({tamanho:"",cor:""});
  const [dados,setDados]=useState({nome:"",phone:"",endereco:"",cep:"",nascimento:"",origem:"Instagram"});
  const [pag,setPag]=useState({tipo:"PIX",parcelas:1});
  const [entrega,setEntrega]=useState({tipo:"Correios",frete:0,prazo:""});
  const [cepLoad,setCepLoad]=useState(false);
  const [done,setDone]=useState(null);

  const preco=(()=>{
    if(produto.valorPorTamanho?.length>0&&sel.tamanho){const vt=produto.valorPorTamanho.find(v=>v.tamanho===sel.tamanho);if(vt)return vt.preco;}
    return produto.price||0;
  })();
  const taxa=0.0499;
  const totalSemTaxa=preco+(entrega.frete||0);
  const totalComTaxa=pag.tipo==="Cartao"?totalSemTaxa*(1+taxa):totalSemTaxa;
  const total=totalComTaxa;

  const buscarCEP=async cep=>{
    const c=cep.replace(/\D/g,"");
    if(c.length!==8)return;
    setCepLoad(true);
    try{
      const r=await fetch(`https://viacep.com.br/ws/${c}/json/`);
      const d=await r.json();
      if(!d.erro)setDados(p=>({...p,endereco:`${d.logradouro}, ${d.bairro}, ${d.localidade} - ${d.uf}`}));
      // Calcula frete por região
      const prefix=c.slice(0,5);
      let fr=22; let prazo="7 a 15 dias úteis (Correios)";
      if(["13464","13465","13466","13467","13468","13469","13470","13471","13472","13473","13474","13475"].some(p=>c.startsWith(p))){fr=15;prazo="Entrega em Americana";}
      else if(c.startsWith("13")){fr=12;prazo="3 a 5 dias úteis (Correios)";}
      else if(c.startsWith("01")||c.startsWith("02")||c.startsWith("03")||c.startsWith("04")||c.startsWith("05")||c.startsWith("08")||c.startsWith("09")){fr=18;prazo="2 a 4 dias úteis (Correios)";}
      else if(c.startsWith("0")||c.startsWith("1")){fr=20;prazo="3 a 7 dias úteis (Correios)";}
      else if(c.startsWith("2")){fr=28;prazo="5 a 10 dias úteis (Correios)";}
      else if(c.startsWith("3")){fr=25;prazo="4 a 8 dias úteis (Correios)";}
      else if(c.startsWith("4")){fr=28;prazo="5 a 10 dias úteis (Correios)";}
      else if(c.startsWith("5")){fr=25;prazo="4 a 8 dias úteis (Correios)";}
      else if(c.startsWith("6")){fr=32;prazo="7 a 12 dias úteis (Correios)";}
      else if(c.startsWith("7")){fr=35;prazo="8 a 15 dias úteis (Correios)";}
      else if(c.startsWith("8")){fr=28;prazo="5 a 10 dias úteis (Correios)";}
      else if(c.startsWith("9")){fr=38;prazo="10 a 20 dias úteis (Correios)";}
      setEntrega(e=>({...e,frete:fr,prazo}));
    }catch(err){console.warn("CEP error:",err);}
    setCepLoad(false);
  };

  const finalizar=()=>{
    const pos=(orders||[]).filter(o=>!["Concluído","Cancelado","Enviado"].includes(o.status)).length+1;
    const id=`EN-${String((orders||[]).length+1).padStart(3,"0")}`;
    const dias=calcDays(produto.hours||7)+(produto.buffer||2)+1;
    const del=addDays(today,dias);
    const novo={id,client:dados.nome,phone:dados.phone,origem:dados.origem||"Instagram",product:produto.name,color:sel.cor||"—",size:sel.tamanho||"—",measures:"",price:total,precoFinal:total,desconto:0,dataCompra:today,delivery:del,status:"Pedido recebido",valorPago:0,note:`Frete: ${fmtBRL(entrega.frete)} · ${entrega.prazo}`,tracking:"",payment:pag.tipo==="PIX"?"PIX":pag.tipo==="Cartao"?`Cartão ${pag.parcelas}x`:"Boleto",condicao:"À vista",entrada:0,parcelas:[],position:pos,read:false,endereco:dados.endereco,cep:dados.cep,nascimento:dados.nascimento,historicoPagamentos:[]};
    if(setOrders)setOrders(prev=>reorderQ([...(prev||[]),novo]));
    if(dados.nome&&setClients&&!(clients||[]).find(c=>c.name===dados.nome)){
      setClients(prev=>[...(prev||[]),{id:uid(),name:dados.nome,phone:dados.phone,email:"",city:"",orders:1,total,vip:false,joined:today,origem:"Divulgação"}]);
    }
    const msg=`🤎 *Novo pedido pelo catálogo!*\n\nPedido: ${id}\nCliente: ${dados.nome}\nWhatsApp: ${dados.phone}\nProduto: ${produto.name}\nCor: ${sel.cor||"—"} · Tamanho: ${sel.tamanho||"—"}\nEndereço: ${dados.endereco}\nPagamento: ${novo.payment}\nProduto: ${fmtBRL(preco)}\nFrete: ${fmtBRL(entrega.frete)}\nTotal: ${fmtBRL(total)}\nEntrega: ${entrega.prazo}\nFila: ${pos}ª · Previsão: ${fmtDate(del)}\n\n${BRAND}`;
    window.open(`https://wa.me/${config.whatsapp}?text=${waMsg(msg)}`);
    setDone(novo);setStep("done");
  };

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(92,64,51,0.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:300,padding:16,overflowY:"auto"}}>

          <button onClick={onClose} style={{background:"none",border:"none",color:"#FAF8F5",fontSize:20,cursor:"pointer"}}>✕</button>
        </div>
        <div style={{padding:"18px"}}>
          {step==="opcoes"&&<>
            {produto.photos?.[0]&&<div style={{height:130,borderRadius:6,overflow:"hidden",marginBottom:14}}><img src={produto.photos[0]} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/></div>}
            <div style={{fontSize:18,fontFamily:"'Playfair Display',serif",color:C.dourado,fontWeight:700,marginBottom:12}}>{fmtBRL(preco)}</div>
            {produto.tamanhos?.length>0&&<><Divider label="Tamanho"/>
              <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}>
                {produto.tamanhos.map(t=>{const vt=produto.valorPorTamanho?.find(v=>v.tamanho===t);return(
                  <button key={t} onClick={()=>setSel(s=>({...s,tamanho:t}))} style={{padding:"8px 14px",borderRadius:4,border:`2px solid ${sel.tamanho===t?C.cafe:C.areia}`,background:sel.tamanho===t?C.cafe:"transparent",color:sel.tamanho===t?"#fff":C.cafe,fontSize:13,fontWeight:700,cursor:"pointer"}}>{t}{vt?` — ${fmtBRL(vt.preco)}`:""}</button>
                );})}
              </div>
            </>}
            {produto.cores?.length>0&&<><Divider label="Cor"/>
              <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:14}}>
                {produto.cores.map(c=><div key={c.id} onClick={()=>setSel(s=>({...s,cor:c.nome}))} style={{display:"flex",alignItems:"center",gap:7,padding:"6px 12px",borderRadius:6,border:`2px solid ${sel.cor===c.nome?C.cafe:C.areia}`,background:sel.cor===c.nome?C.linho:"transparent",cursor:"pointer"}}>
                  {c.foto&&<div style={{width:26,height:26,borderRadius:"50%",overflow:"hidden",flexShrink:0}}><img src={c.foto} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/></div>}
                  <span style={{fontSize:12,fontWeight:sel.cor===c.nome?700:400,color:C.cafe}}>{c.nome}</span>

              <div style={{display:"flex",gap:8}}>
                <div style={{flex:1}}><Inp label="CEP" value={dados.cep} onChange={v=>{setDados(d=>({...d,cep:v}));if(v.replace(/\D/g,"").length===8)buscarCEP(v);}}/></div>

              <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:3}}><span style={{color:C.oliva}}>Produto</span><span>{fmtBRL(preco)}</span></div>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:3}}><span style={{color:C.oliva}}>Frete</span><span>{fmtBRL(entrega.frete||0)}</span></div>
              {pag.tipo==="Cartao"&&<div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:3}}><span style={{color:C.oliva}}>Taxa cartão (4,99%)</span><span>{fmtBRL(totalSemTaxa*taxa)}</span></div>}
              <div style={{display:"flex",justifyContent:"space-between",fontSize:15,fontWeight:700,paddingTop:6,borderTop:`1px solid ${C.areia}`}}><span>Total</span><span style={{color:C.dourado}}>{fmtBRL(total)}</span></div>
              {pag.tipo==="Cartao"&&pag.parcelas>1&&<div style={{fontSize:12,color:C.oliva,marginTop:4,textAlign:"right"}}>{pag.parcelas}x de {fmtBRL(total/pag.parcelas)}</div>}
            </div>
            <div style={{display:"flex",gap:8}}>
              <Btn v="ghost" onClick={()=>setStep("pag")}>← Voltar</Btn>
              <Btn full v="gold" onClick={finalizar}>🤎 Confirmar pedido</Btn>
            </div>
          </>}

          {step==="done"&&done&&<div style={{textAlign:"center"}}>
            <div style={{fontSize:44,marginBottom:10}}>🤎</div>
            <h3 style={{fontSize:18,marginBottom:7}}>Pedido confirmado!</h3>
            <p style={{fontFamily:"'Cormorant Garamond',serif",fontSize:15,fontStyle:"italic",color:C.oliva,lineHeight:1.6,marginBottom:14}}>Obrigada por escolher uma peça feita à mão com amor e significado.</p>
            <div style={{background:C.linho,borderRadius:8,padding:"14px",textAlign:"left",marginBottom:14}}>
              {[["Pedido",done.id],["Produto",done.product],["Cor",done.color],["Tamanho",done.size],["Posição na fila",`${done.position}ª`],["Previsão",fmtDate(done.delivery)],["Total",fmtBRL(done.price)]].map(([l,v])=>(
                <div key={l} style={{display:"flex",justifyContent:"space-between",padding:"4px 0",borderBottom:`1px solid ${C.areia}`}}><span style={{fontSize:12,color:C.oliva}}>{l}</span><span style={{fontSize:13,fontWeight:700}}>{v}</span></div>
              ))}
            </div>
            <Btn full onClick={onClose}>Fechar</Btn>
          </div>}
        </div>
      </div>
    </div>
  );
};

// ─── APP ROOT ─────────────────────────────────────────────────────────────────
function App() {
  const isLoja = typeof window!=="undefined" && new URLSearchParams(window.location.search).get("loja")==="1";
  const [view,setView]=useState("dashboard");
  const [menuOpen,setMenuOpen]=useState(false);
  const [fichaModal,setFichaModal]=useState(null);
  const [savedMsg,setSavedMsg]=useState("");

  // Registra o setter global para o indicador de salvo
  useEffect(()=>{ _setSavedGlobal=(msg)=>{setSavedMsg(msg);setTimeout(()=>setSavedMsg(""),2500);}; },[]);

  // Todos os dados — Firebase é a fonte principal
  const [products,  setProducts  ]=useStorage("products",   INIT.products);
  const [orders,    setOrders    ]=useStorage("orders",      INIT.orders);
  const [clients,   setClients   ]=useStorage("clients",     INIT.clients);
  const [stockSup,  setStockSup  ]=useStorage("stockSup",    INIT.stockSup);
  const [finance,   setFinance   ]=useStorage("finance",     INIT.finance);
  const [contas,    setContas    ]=useStorage("contas",      INIT.contas);
  const [frases,    setFrases    ]=useStorage("frases",      INIT.frases);
  const [banners,   setBanners   ]=useStorage("banners",     INIT.banners);
  const [depoimentos,setDepoimentos]=useStorage("depoimentos",INIT.depoimentos);
  const [categories,setCategories]=useStorage("categories",  INIT.categories);
  const [projects,  setProjects  ]=useStorage("projects",    INIT.projects);
  const [metas,     setMetas     ]=useStorage("metas",       INIT.metas);
  const [config,    setConfig    ]=useStorage("config",      INIT.config);
  const [compromissos,setCompromissos]=useStorage("compromissos",[]);
  const [publicacoes, setPublicacoes ]=useStorage("publicacoes", []);
  const [ideias,      setIdeias     ]=useStorage("ideias",      []);
  const [cartas,      setCartas     ]=useStorage("cartas",      []);
  const [volumes,     setVolumes    ]=useStorage("volumes",     []);
  const [consultoria, setConsultoria]=useStorage("consultoria", []);
  const [projetosContinua, setProjetosContinua]=useStorage("projetosContinua", []);
  const [prospeccao, setProspeccao]=useStorage("prospeccao", []);
  const [implantacoes, setImplantacoes]=useStorage("implantacoes", []);
  // setters já vêm direto do useStorage acima

  const allData={products,orders,clients,stockSup,finance,contas,frases,banners,depoimentos,categories,projects,metas,config};

  const copyLink=()=>{
    const link=`${window.location.origin}/?loja=1`;
    navigator.clipboard.writeText(link).then(()=>alert(`Link copiado!\n${link}\n\nEnvie esse link para suas clientes.`));
  };

  const TITLES={
    dashboard:["Bem-vinda ✦",new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"})],
    site:["Catálogo",""],
    products:["Produtos","Catálogo e precificação"],
    orders:["Encomendas","Gestão de pedidos"],
    production:["Produção","Fila e capacidade"],
    stock:["Estoque","Materiais e peças prontas"],
    finance:["Financeiro","Receitas, despesas e fluxo de caixa"],
    metas:["Gestão de Metas","Acompanhe seu progresso"],
    clients:["Clientes","Relacionamento e histórico"],
    projects:["Projetos & Sonhos","Planos e inspirações"],
    reports:["Relatórios","Análises e insights"],
    config:["Configurações","Personalização do sistema"],
  };
  const [title,subtitle]=TITLES[view]||["",""];

  // Modo loja: só mostra o catálogo público
  if(isLoja){
    return <div><GS/><SitePublico products={products} banners={banners} depoimentos={depoimentos} categories={categories} config={config} contas={contas} orders={orders} setOrders={setOrders} clients={clients} setClients={setClients}/></div>;
  }

  return (
    <div style={{display:"flex",minHeight:"100vh",background:C.linho}}>
      <GS/>
      {/* SIDEBAR DESKTOP */}
      <div className="hide-desk" style={{display:"block"}}>
        <style>{`.hide-desk{display:block!important;}@media(max-width:768px){.hide-desk{display:none!important;}}`}</style>
        <Sidebar active={view} setActive={setView} orders={orders}/>
      </div>
      {/* SIDEBAR MOBILE */}
      {menuOpen&&<div style={{position:"fixed",inset:0,zIndex:99}}>
        <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,0.4)"}} onClick={()=>setMenuOpen(false)}/>
        <div style={{position:"relative",width:240,height:"100%"}}>
          <Sidebar active={view} setActive={setView} orders={orders} mobile onClose={()=>setMenuOpen(false)}/>
        </div>
      </div>}
      <div style={{flex:1,display:"flex",flexDirection:"column",minHeight:"100vh",minWidth:0}}>
        {/* TOPBAR */}
        <div style={{background:"#fff",borderBottom:"2px solid #D8B4CE",padding:"11px 18px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,flexShrink:0,boxShadow:"0 1px 8px rgba(35,53,90,0.06)"}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <button onClick={()=>setMenuOpen(true)} style={{display:"none",background:"none",border:"none",fontSize:20,color:"#23355A",cursor:"pointer"}} className="mob-menu">☰</button>
            <style>{`@media(max-width:768px){.mob-menu{display:flex!important;}}`}</style>
            <div>
              <h2 style={{fontSize:16,fontWeight:700,color:"#23355A",lineHeight:1.2}}>{title}</h2>
              {subtitle&&<div style={{fontSize:11,color:"#A563A2",fontFamily:"'Cormorant Garamond',serif",fontStyle:"italic"}}>{subtitle}</div>}
            </div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            {savedMsg&&<span style={{fontSize:11,color:"#23355A",fontWeight:700,background:"#D8B4CE",padding:"3px 10px",borderRadius:20}}>✓ {savedMsg}</span>}
            <Btn sm v="ghost" onClick={copyLink} style={{fontSize:11}}>🔗 Link da loja</Btn>
            <div style={{width:30,height:30,borderRadius:"50%",background:"linear-gradient(135deg,#A563A2,#23355A)",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:12,fontWeight:700,flexShrink:0}}>S</div>
          </div>
        </div>
        {/* CONTEÚDO */}
        <div style={{flex:1,overflowY:"auto"}}>
          {view==="dashboard"   &&<Dashboard orders={orders} finance={finance} stockSup={stockSup} frases={frases} clients={clients} config={config} compromissos={compromissos} publicacoes={publicacoes} cartas={cartas} volumes={volumes} setCartas={setCartas} setFrases={setFrases} setView={setView}/>}
          {view==="site"        &&<SitePublico products={products} banners={banners} depoimentos={depoimentos} categories={categories} config={config} contas={contas} orders={orders} setOrders={setOrders} clients={clients} setClients={setClients}/>}
          {view==="products"    &&<Products products={products} setProducts={setProducts} categories={categories} config={config} stockSup={stockSup}/>}
          {view==="orders"      &&<Orders orders={orders} setOrders={setOrders} products={products} config={config} onFicha={o=>setFichaModal(o)} clients={clients} setClients={setClients} finance={finance} setFinance={setFinance} contas={contas} setContas={setContas}/>}
          {view==="production"  &&<Production orders={orders} products={products}/>}
          {view==="stock"       &&<Stock stockSup={stockSup} setStockSup={setStockSup} products={products} setProducts={setProducts}/>}
          {view==="finance"     &&<Finance finance={finance} setFinance={setFinance} orders={orders} contas={contas} setContas={setContas} clients={clients}/>}
          {view==="metas"       &&<Metas finance={finance} orders={orders} metas={metas} setMetas={setMetas}/>}
          {view==="clients"     &&<Clients clients={clients} setClients={setClients} orders={orders} config={config}/>}
          {view==="consultoria"  &&<Consultoria implantacoes={implantacoes} setImplantacoes={setImplantacoes} prospeccao={prospeccao} setProspeccao={setProspeccao} projetosContinua={projetosContinua} setProjetosContinua={setProjetosContinua} consultoria={consultoria} setConsultoria={setConsultoria} finance={finance} setFinance={setFinance} compromissos={compromissos} setCompromissos={setCompromissos} clients={clients} setClients={setClients} config={config}/>}
          {view==="agenda"       &&<Agenda orders={orders} compromissos={compromissos} setCompromissos={setCompromissos} publicacoes={publicacoes} setPublicacoes={setPublicacoes} ideias={ideias} setIdeias={setIdeias}/>}
          {view==="diario"       &&<Diario cartas={cartas} setCartas={setCartas} volumes={volumes} setVolumes={setVolumes}/>}
          {view==="orcamento"   &&<Orcamento config={config} stockSup={stockSup}/>}
          {view==="projects"    &&<Projects projects={projects} setProjects={setProjects}/>}
          {view==="reports"     &&<Reports orders={orders} products={products} finance={finance} clients={clients}/>}
          {view==="config"      &&<Config config={config} setConfig={setConfig} frases={frases} setFrases={setFrases} banners={banners} setBanners={setBanners} depoimentos={depoimentos} setDepoimentos={setDepoimentos} categories={categories} setCategories={setCategories} allData={allData}/>}
        </div>
      </div>
      {fichaModal&&<FichaPedido order={fichaModal} products={products} config={config} onClose={()=>setFichaModal(null)}/>}
    </div>
  );
}
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
    document.getElementById('loading').style.display='none';
  </script>
</body>
</html>
